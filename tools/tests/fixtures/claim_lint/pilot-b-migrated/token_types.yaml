  issuer: gateway（入口）
  aud:
  - orders
  - invoices
  holder: gateway
  format: jwt
  subject_type: public
  typ: internal+jwt
  alg_allowlist:
  - ES256
  issuers:
  - iss: https://gw.corp.example.com
