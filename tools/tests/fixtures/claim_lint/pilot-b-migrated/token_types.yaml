- id: INTERNAL_TOKEN
  kind: internal_token
  decision: 採用
  rationale: 入口が IdP の AT を検証・正規化してから作る、組織の内部トークン。宛先は 1 つのサービス、寿命 30 秒。サービスはこれだけを受け、ヘッダー（X-User-Role など）を一切信じない（B4〜B7）
  assumption: 内部トークンの署名鍵は入口だけが持つ。サービスはネットワークで入口からの接続だけを受ける（入口を通らない経路が残っても、内部トークンが無ければ拒む）
