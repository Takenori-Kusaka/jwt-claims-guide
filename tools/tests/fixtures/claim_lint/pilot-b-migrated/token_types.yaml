    used: false
  log_policy: jti だけ記録
  size:
    signing:
      alg: RS256
      key_bits: 2048
    header:
      params:
      - name: alg
        type: string
        max_bytes: 5
      - name: typ
        type: string
        max_bytes: 6
      - name: kid
        type: string
        max_bytes: 32
    path:
    - id: gw-nginx-32k
      applies_to: header_field
      bytes: 32768
      basis: 入口の nginx の large_client_header_buffers を 4 32k にする（この設計で決める値）
      verified_on: '2026-11-24'
      review_by: '2027-02-22'
- id: GRAPH_AT
  kind: access_token
  decision: 採用
  rationale: 入口が Entra のグループの超過（_claim_names・_claim_sources）を解決するために、Microsoft Graph を自分の権限（client credentials、アプリの権限 GroupMember.Read.All）で呼ぶ AT。利用者の権限を借りない
  assumption: Graph の呼び出しは、超過した AT を受けたときだけ。結果は利用者ごとに AT の残りの寿命まで入口のメモリに置く
  revisit_trigger: Graph の応答の遅れ・障害で正規の要求（B9）が落ちるとき（アプリロールに切り替える）
  refs:
  - kind: guide-slide
    id: p03-entra-scp-roles-groups
  - kind: spec
    id: RFC 6749 §4.4
  purpose: 入口が Microsoft Graph でグループの所属を引くための、入口自身の AT
  issuer: Entra ID（自社のテナント）
  aud:
  - https://graph.microsoft.com
  holder: gateway
  format: jwt
  subject_type: public
  typ: JWT
  kind_discriminator:
  - claim: aud
  alg_allowlist:
  - RS256
  issuers:
  - iss: https://login.microsoftonline.com/11111111-2222-3333-4444-555555555555/v2.0
    jwks_uri: https://login.microsoftonline.com/11111111-2222-3333-4444-555555555555/discovery/v2.0/keys
  key_source:
    from: configured_jwks_uri
    header_key_params: reject
  max_clock_skew: 30
  max_lifetime: 3600
  lifetime_refs:
  - kind: spec
    id: Microsoft identity platform access tokens
    url: https://learn.microsoft.com/en-us/entra/identity-platform/access-tokens
    verified_on: '2026-11-24'
  lifetime_set_by:
  - platform
  refresh: RT は無い。期限の前に client credentials で取り直す
  sender_constraint: none
  revocation:
  - method: exp_only
    delay_seconds: 3600
    note: 入口の資格情報（証明書）を無効にしても、発行済みの AT は exp まで Graph に通る
  key_rotation:
    period_days: null
    publish_before_use_seconds: 0
    retire_after_seconds: 0
    note: Microsoft が管理する。入口はこのトークンを検証しない
  unknown_kid:
    refetch_min_interval_seconds: 60
    negative_cache_seconds: 60
    on_fetch_failure: use_last_known
  jwks_cache_ttl: 3600
  signing_key_scope: shared
  stored_at: service_memory
  transport: authorization_bearer
  visible_to:
  - gateway
  jwe:
    used: false
  log_policy: 記録しない
  size:
    signing:
      alg: RS256
      key_bits: 2048
    header:
      params:
      - name: alg
        type: string
        max_bytes: 5
      - name: typ
        type: string
        max_bytes: 3
      - name: kid
        type: string
        max_bytes: 40
    path:
    - id: graph-header-16k
      applies_to: header_field
      bytes: 16384
      basis: Graph の要求ヘッダーの上限は公開されていないため、入口の送信側で 16 KiB を超えたら送らない（この設計の値）
      verified_on: '2026-11-24'
      review_by: '2027-02-22'
- id: ID_TOKEN
  kind: id_token
  decision: 採用
  rationale: ポータルの BFF がログインの応答で検証し、BFF のセッションを作るためだけに使う。API には送らない。入口は ID トークンを拒む（B2・B17）
