  - portal
  - client-app
  holder: portal-bff
  format: jwt
  subject_type: public
  typ: JWT
  kind_discriminator:
  - claim: aud
    note: ポータルのクライアントの ID。API の宛先ではない
  alg_allowlist:
  - RS256
  issuers:
  - iss: https://kc.corp.example.com/realms/corp
    jwks_uri: https://kc.corp.example.com/realms/corp/protocol/openid-connect/certs
  - iss: https://login.microsoftonline.com/11111111-2222-3333-4444-555555555555/v2.0
    jwks_uri: https://login.microsoftonline.com/11111111-2222-3333-4444-555555555555/discovery/v2.0/keys
  - iss: https://corp.okta.example.com/oauth2/default
    jwks_uri: https://corp.okta.example.com/oauth2/default/v1/keys
  - iss: https://cognito-idp.ap-northeast-1.amazonaws.com/ap-northeast-1_EXAMPLE
    jwks_uri: https://cognito-idp.ap-northeast-1.amazonaws.com/ap-northeast-1_EXAMPLE/.well-known/jwks.json
  - iss: https://corp.auth0.example.com/
    jwks_uri: https://corp.auth0.example.com/.well-known/jwks.json
  required_claims:
  - iss
  - sub
  - aud
  - exp
  - iat
  - nonce
  key_source:
    from: issuer_metadata_jwks_uri
    header_key_params: reject
  max_clock_skew: 30
  max_lifetime: 300
  lifetime_refs:
  - kind: guidance
    id: NIST IR 8587 §5.3.1.1
  lifetime_set_by:
  - platform
  refresh: 使わない（ログインのときに 1 回だけ検証する）
  sender_constraint: none
  revocation:
  - method: exp_only
