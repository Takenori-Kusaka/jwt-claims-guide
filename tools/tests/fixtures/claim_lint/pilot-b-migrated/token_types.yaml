# template_version: 0.3.0
# yaml-language-server: $schema=../../../../../templates/registry/token_types.schema.json
# トークン目録と発行方式。パイロット #9 のシナリオ B を #58 の列で書き直した fixture。migrate.py が作る（手で直さない）
issuance_profile:
  client_type:
    value: confidential
    rationale: 社員用のポータルはサーバー側の BFF とし、AT・RT・ID トークンをサーバーに留める。ブラウザには BFF のセッションの Cookie だけを渡す。5 つの IdP のどれでも、ポータルは機密クライアントとして登録する
    refs:
    - kind: guide-slide
      id: p06-grant-types
    - kind: spec
      id: RFC 9700 §2.1.1
  client_auth:
    value: private_key_jwt
    rationale: 共有の秘密をポータルと入口のサーバーに置かないため、鍵で認証する。Keycloak・Entra（証明書の資格情報）・Okta・Auth0 は private_key_jwt を受ける。Cognito のアプリクライアントはクライアントシークレットだけなので、Cognito に限り client_secret_basic を使い、シークレットは秘密の保管庫に置く（3. の逸脱に書く）
    refs:
    - kind: spec
      id: OpenID Connect Core 1.0 §9
    - kind: guide-slide
      id: p01-client-made-jwts
    exceptions:
    - idp: cognito
      value: client_secret_basic
      rationale: Cognito のトークンエンドポイントが対応するクライアント認証は client_secret_basic と client_secret_post（private_key_jwt は挙がっていない）ので、クライアントの秘密で認証する
      refs:
      - kind: spec
        id: Amazon Cognito Developer Guide「The token endpoint」
        url: https://docs.aws.amazon.com/cognito/latest/developerguide/token-endpoint.html
        verified_on: '2026-11-25'
  grants:
    value:
    - authorization_code_pkce
    - refresh_token
    - client_credentials
    rationale: 社員のログインは認可コード＋PKCE、AT の取り直しは RT。client_credentials は、入口が Entra のグループの超過を Microsoft Graph で解決するためだけに使う（入口自身のトークン。利用者のクレームを載せない）。トークン交換は使わない（入口は IdP と交換せず、自分で内部トークンを作り直す）
    refs:
    - kind: guide-slide
      id: p06-grant-types
    - kind: spec
      id: RFC 6749 §4.4
  sender_constraint:
    value: none
    rationale: 社内業務システムの重点は入口での正規化・ヘッダーの除去・鮮度の確認・groups の超過の解決で、送信者制約は見送りの候補（ガイドの重点と見送り）。トークンは BFF と入口のサーバーの中に留まり、ブラウザに出ない。B23（漏れたトークンの別の端末からの再送）は防がない。見直しの条件は 3.1 と ACCESS 系の行の revisit_trigger に書いた
    refs:
    - kind: guide-slide
      id: p12-priorities-deferrals
    - kind: spec
      id: RFC 9449 §1
  at_format:
    value: jwt
    rationale: 5 つの IdP の AT はどれも JWT で、入口が手元で検証する（不透明な AT を出す phantom token の型ではない）。内側のサービスは IdP のトークンを受けない。入口が IdP ごとの規則で検証・正規化し、組織の内部トークン（INTERNAL_TOKEN）に作り直して渡す（hops の H7・H8、kind は reissue）。サービスは内部トークンの署名・宛先・期限だけを共通の部品で確かめる（7. の曖昧な点 1 の決定）
    refs:
    - kind: guide-slide
      id: p06-edge-exchange
    - kind: guide-slide
      id: p03-absorb-idp-differences
  rt_strategy:
    value: rotation
    rationale: RT は BFF のサーバーにだけ置く機密クライアントの RT。ローテーションは各 IdP の設定で有効にするが、再利用の検知を全 IdP で確かめていないので rotation とした（検知は unverified）
    refs:
    - kind: spec
      id: RFC 9700 §4.14.2
    - kind: guide-slide
      id: p08-rotation
  request_protection:
    value: []
    rationale: 社内の機密クライアントで、認可要求に機微な値を入れない。PAR・JAR は 5 つの IdP のすべてが対応しているかを確かめておらず、使わない。resource indicators も Entra・Cognito で使えないため、宛先は IdP ごとの scope と aud の設定で絞る
    refs:
    - kind: spec
      id: RFC 9126 §1
    - kind: spec
      id: RFC 8707 §2
  conformance_profile:
    value: none
    rationale: 金融・医療などの規制の対象ではなく、FAPI に準拠する要求がない。給与明細は個人情報だが、規制の対象のプロファイルを要求する根拠は要求に無い
    refs:
    - kind: spec
      id: FAPI 2.0 Security Profile（Final）§5.3.2.1
token_types:
- id: KC_AT
  kind: access_token
  decision: 採用
  rationale: 社内の主な IdP（Keycloak 26.8、レルム corp）の AT。ポータルの BFF が入口に送り、入口が検証して内部トークンに作り直す。サービスには渡さない
  assumption: ポータルの BFF だけが AT を持ち、ブラウザに出さない。入口は Keycloak の AT の aud（orders・invoices）を経路ごとに照合する
  revisit_trigger: ブラウザ・モバイルが AT を直接持つ構成になったとき、漏れたトークンの悪用が観測されたとき（送信者制約を見直す）
  refs:
  - kind: spec
    id: RFC 9068 §2
  - kind: guide-slide
    id: p01-id-token-vs-access-token
  purpose: 社員がポータル経由で注文・請求書のサービスを呼ぶための AT（入口だけが読む）
  issuer: Keycloak 26.8（レルム corp）
  aud:
  - orders
  - invoices
  holder: portal-bff
  format: jwt
  subject_type: public
  typ: JWT
  kind_discriminator:
  - claim: typ
    value: Bearer
    note: ペイロードの typ。ID トークンは ID
  - claim: aud
  alg_allowlist:
  - RS256
  issuers:
  - iss: https://kc.corp.example.com/realms/corp
    jwks_uri: https://kc.corp.example.com/realms/corp/protocol/openid-connect/certs
  required_claims:
  - iss
  - sub
  - aud
  - exp
  - iat
  - jti
  - azp
  - typ
  key_source:
    from: issuer_metadata_jwks_uri
    header_key_params: reject
  max_clock_skew: 30
  max_lifetime: 300
  lifetime_refs:
  - kind: guidance
    id: NIST IR 8587 §5.3.1.1
  - kind: guide-slide
    id: p08-choosing-lifetime
  lifetime_set_by:
  - platform
  refresh: BFF が RT で取り直す（U04）。Keycloak はリフレッシュでロール・属性を計算し直す
  rt_rotation:
    rotation: true
    reuse_detection: unverified
  sender_constraint: none
  jti_policy:
    unique_scope: per_issuer
    replay_check: false
  revocation:
  - method: exp_only
    delay_seconds: 330
    note: 一般の操作は exp まで受け入れる
  - method: db_lookup
    delay_seconds: 0
    note: 入口が要求ごとに社員台帳のログアウトの時刻と在籍の状態を引き、AT の iat がその時刻より前なら拒む
  long_running: 非同期の処理は無い。長い操作でも AT は入口で 1 回だけ使い、サービスは内部トークンの期限で止まる
  key_rotation:
    period_days: 90
    publish_before_use_seconds: 86400
    retire_after_seconds: 86400
    note: Keycloak のレルムの鍵の追加と無効化で行う。公開してから使い始め、AT の寿命より長く旧鍵を残す
  unknown_kid:
    refetch_min_interval_seconds: 60
    negative_cache_seconds: 60
    on_fetch_failure: use_last_known
  jwks_cache_ttl: 600
  signing_key_scope: shared
  stored_at: bff_server
  transport: authorization_bearer
  visible_to:
  - bff
  - gateway
  jwe:
    used: false
  log_policy: jti だけ記録
  size:
    signing:
      alg: RS256
      key_bits: 2048
    header:
      params:
      - name: alg
        type: string
        max_bytes: 5
      - name: typ
        type: string
        max_bytes: 3
      - name: kid
        type: string
        max_bytes: 43
      serializer_extra_bytes: 4
      serializer_extra_basis: Keycloak 26.8.0 の書き出しの空白（templates/README.md の R8 の計算に記載の値。この設計では実測していない）
    path:
    - id: gw-nginx-32k
      applies_to: header_field
      bytes: 32768
      basis: 入口の nginx の large_client_header_buffers を 4 32k にする（この設計で決める値。Entra の groups の最大 200 件を入れるため）
      verified_on: '2026-11-24'
      review_by: '2027-02-22'
- id: ENTRA_AT
  kind: access_token
  decision: 採用
  rationale: Entra ID（マルチテナント型のアプリ登録）で認証した社員の AT。入口が自社のテナントの発行者だけを受け、oid＋tid で利用者を決め、groups（超過なら Graph で解決）からロールを作る
  assumption: アプリ登録はマルチテナント型だが、受け入れる発行者は自社のテナント（tid を固定）の 1 つだけ。ポータルは CAE に対応すると宣言しない（xms_cc を送らない）ので、AT の寿命は延びない
  revisit_trigger: 別のテナントの社員を受け入れる必要が出たとき（M_multitenancy を使い Full のテナントの束縛にする）、CAE を使うことにしたとき
  refs:
  - kind: guide-slide
    id: p03-entra-oid-tid
  - kind: guide-slide
    id: p03-entra-scp-roles-groups
  purpose: Entra ID で認証した社員がポータル経由でサービスを呼ぶための AT（入口だけが読む）
  issuer: Entra ID（自社のテナント）
  aud:
  - api://orders
  - api://invoices
  holder: portal-bff
  format: jwt
  subject_type: pairwise
  typ: JWT
  kind_discriminator:
  - claim: aud
    note: API の Application ID URI。ID トークンの aud はクライアントの ID
  alg_allowlist:
  - RS256
  issuers:
  - iss: https://login.microsoftonline.com/11111111-2222-3333-4444-555555555555/v2.0
    jwks_uri: https://login.microsoftonline.com/11111111-2222-3333-4444-555555555555/discovery/v2.0/keys
  required_claims:
  - iss
  - aud
  - exp
  - iat
  - tid
  - oid
  - scp
  key_source:
    from: configured_jwks_uri
    header_key_params: reject
  max_clock_skew: 30
  max_lifetime: 600
  lifetime_refs:
  - kind: guidance
    id: NIST IR 8587 §5.3.1.1
  - kind: spec
    id: Microsoft identity platform - Configurable token lifetimes
    url: https://learn.microsoft.com/en-us/entra/identity-platform/configurable-token-lifetimes
    verified_on: '2026-11-24'
  lifetime_set_by:
  - platform
  refresh: BFF が RT で取り直す。Entra はグループの所属を取り直しで計算し直す（確かめていない。12. に書いた）
  rt_rotation:
    rotation: true
    reuse_detection: unverified
  sender_constraint: none
  revocation:
  - method: exp_only
    delay_seconds: 630
    note: 一般の操作は exp まで受け入れる（トークンの寿命のポリシーで 10 分にする前提）
  - method: db_lookup
    delay_seconds: 0
    note: 入口が要求ごとに社員台帳のログアウトの時刻と在籍の状態を引く
  long_running: 非同期の処理は無い
  key_rotation:
    period_days: null
    publish_before_use_seconds: 0
    retire_after_seconds: 0
    note: 鍵のローテーションは Microsoft が行う。入口は JWKS を取り直すだけ（周期は Microsoft が公開していない）
  unknown_kid:
    refetch_min_interval_seconds: 60
    negative_cache_seconds: 60
    on_fetch_failure: use_last_known
  jwks_cache_ttl: 3600
  signing_key_scope: shared
  stored_at: bff_server
  transport: authorization_bearer
  visible_to:
  - bff
  - gateway
  jwe:
    used: false
  log_policy: jti だけ記録
  size:
    signing:
      alg: RS256
      key_bits: 2048
    header:
      params:
      - name: alg
        type: string
        max_bytes: 5
      - name: typ
        type: string
        max_bytes: 3
      - name: kid
        type: string
        max_bytes: 40
      - name: x5t
        type: string
        max_bytes: 40
    path:
    - id: gw-nginx-32k
      applies_to: header_field
      bytes: 32768
      basis: 入口の nginx の large_client_header_buffers を 4 32k にする（この設計で決める値。Entra の groups の最大 200 件を入れるため）
      verified_on: '2026-11-24'
      review_by: '2027-02-22'
- id: OKTA_AT
  kind: access_token
  decision: 採用
  rationale: Okta（カスタム認可サーバー default）の AT。入口は sub（再利用されうるログイン名）ではなく uid で利用者を決める。部署はインラインフックの値を使わず社員台帳から引く
  assumption: Okta の default 認可サーバーの aud は api://default で、注文と請求書のサービスで同じ。宛先の区別は scope（orders.*・invoices.*）で行う
  revisit_trigger: Okta でサービスごとに認可サーバーを分けたとき（aud で区別できるようにする）、uid が AT に入らなくなったとき
  refs:
  - kind: guide-slide
    id: p03-confusing-differences
  - kind: guide-slide
    id: p02-user-identifier
  purpose: Okta で認証した社員がポータル経由でサービスを呼ぶための AT（入口だけが読む）
  issuer: Okta（カスタム認可サーバー default）
  aud:
  - api://default
  holder: portal-bff
  format: jwt
  subject_type: public
  typ: (absent)
  kind_discriminator:
  - claim: aud
  - claim: cid
    value: portal
  alg_allowlist:
  - RS256
  issuers:
  - iss: https://corp.okta.example.com/oauth2/default
    jwks_uri: https://corp.okta.example.com/oauth2/default/v1/keys
  required_claims:
  - iss
  - aud
  - exp
  - iat
  - jti
  - uid
  - cid
  - scp
  key_source:
    from: issuer_metadata_jwks_uri
    header_key_params: reject
  max_clock_skew: 30
  max_lifetime: 300
  lifetime_refs:
  - kind: guidance
    id: NIST IR 8587 §5.3.1.1
  lifetime_set_by:
  - platform
  refresh: BFF が RT で取り直す。フックはリフレッシュでも呼ばれるが、部署は使わない
  rt_rotation:
    rotation: true
    reuse_detection: unverified
  sender_constraint: none
  revocation:
  - method: exp_only
    delay_seconds: 330
    note: 一般の操作は exp まで受け入れる
  - method: db_lookup
    delay_seconds: 0
    note: 入口が要求ごとに社員台帳のログアウトの時刻と在籍の状態を引く
  long_running: 非同期の処理は無い
  key_rotation:
    period_days: null
    publish_before_use_seconds: 0
    retire_after_seconds: 0
    note: Okta が鍵を自動でローテーションする。入口は JWKS を取り直すだけ
  unknown_kid:
    refetch_min_interval_seconds: 60
    negative_cache_seconds: 60
    on_fetch_failure: use_last_known
  jwks_cache_ttl: 3600
  signing_key_scope: shared
  stored_at: bff_server
  transport: authorization_bearer
  visible_to:
  - bff
  - gateway
  jwe:
    used: false
  log_policy: jti だけ記録
  size:
    signing:
      alg: RS256
      key_bits: 2048
    header:
      params:
      - name: alg
        type: string
        max_bytes: 5
      - name: kid
        type: string
        max_bytes: 43
    path:
    - id: gw-nginx-32k
      applies_to: header_field
      bytes: 32768
      basis: 入口の nginx の large_client_header_buffers を 4 32k にする（この設計で決める値）
      verified_on: '2026-11-24'
      review_by: '2027-02-22'
- id: COGNITO_AT
  kind: access_token
  decision: 採用
  rationale: Cognito の AT。aud が無いので、入口は client_id をポータルのアプリクライアントの ID と照合し、token_use=access を必須にする（B16 を受け、B17 を拒む）。custom:* の属性は本人が書き換えられるので認可に使わない
  assumption: Cognito のユーザープールは自社の 1 つ。ポータルのアプリクライアントは 1 つで、その client_id を入口の設定に固定する
  revisit_trigger: Cognito が AT に aud を入れるようになったとき（aud の照合に切り替える）、アプリクライアントを増やしたとき
  refs:
  - kind: guide-slide
    id: p03-cognito-token-use
  - kind: guide-slide
    id: p04-reject-missing-required
  purpose: Cognito で認証した社員がポータル経由でサービスを呼ぶための AT（入口だけが読む）
  issuer: Amazon Cognito（自社のユーザープール）
  aud:
  - portal のアプリクライアント（client_id で照合）
  audience_claim: client_id
  holder: portal-bff
  format: jwt
  subject_type: public
  typ: (absent)
  kind_discriminator:
  - claim: token_use
    value: access
  - claim: aud
    absent: true
  alg_allowlist:
  - RS256
  issuers:
  - iss: https://cognito-idp.ap-northeast-1.amazonaws.com/ap-northeast-1_EXAMPLE
    jwks_uri: https://cognito-idp.ap-northeast-1.amazonaws.com/ap-northeast-1_EXAMPLE/.well-known/jwks.json
  required_claims:
  - iss
  - sub
  - exp
  - iat
  - jti
  - client_id
  - scope
  - token_use
  key_source:
    from: configured_jwks_uri
    header_key_params: reject
  max_clock_skew: 30
  max_lifetime: 300
  lifetime_refs:
  - kind: guidance
    id: NIST IR 8587 §5.3.1.1
  lifetime_set_by:
  - platform
  refresh: BFF が RT で取り直す。発行前のフックは取り直しでも動く
  rt_rotation:
    rotation: true
    reuse_detection: unverified
  sender_constraint: none
  revocation:
  - method: exp_only
    delay_seconds: 330
    note: 一般の操作は exp まで受け入れる
  - method: db_lookup
    delay_seconds: 0
    note: 入口が要求ごとに社員台帳のログアウトの時刻と在籍の状態を引く
  long_running: 非同期の処理は無い
  key_rotation:
    period_days: null
    publish_before_use_seconds: 0
    retire_after_seconds: 0
    note: Cognito の鍵は AWS が管理する。入口は JWKS を取り直すだけ
  unknown_kid:
    refetch_min_interval_seconds: 60
    negative_cache_seconds: 60
    on_fetch_failure: use_last_known
  jwks_cache_ttl: 3600
  signing_key_scope: shared
  stored_at: bff_server
  transport: authorization_bearer
  visible_to:
  - bff
  - gateway
  jwe:
    used: false
  log_policy: jti だけ記録
  size:
    signing:
      alg: RS256
      key_bits: 2048
    header:
      params:
      - name: alg
        type: string
        max_bytes: 5
      - name: kid
        type: string
        max_bytes: 44
    path:
    - id: gw-nginx-32k
      applies_to: header_field
      bytes: 32768
      basis: 入口の nginx の large_client_header_buffers を 4 32k にする（この設計で決める値）
      verified_on: '2026-11-24'
      review_by: '2027-02-22'
- id: AUTH0_AT
  kind: access_token
  decision: 採用
  rationale: Auth0（RFC 9068 プロファイル）の AT。ロールは Action で組織の名前空間つきの名前（C-auth0-roles）として足す。名前空間の無い roles は Auth0 が黙って外すので使わず、無ければ拒む（B20 で既定のロールを使わない）
  assumption: API の設定で RFC 9068 プロファイルを選び、typ が at+jwt になる
  revisit_trigger: Auth0 のプロファイルを Auth0 独自の形に戻したとき（typ が変わる）
  refs:
  - kind: guide-slide
    id: p03-auth0-namespace
  - kind: spec
    id: RFC 9068 §2.1
  purpose: Auth0 で認証した社員がポータル経由でサービスを呼ぶための AT（入口だけが読む）
  issuer: Auth0（自社のテナント）
  aud:
  - https://api.example.com
  holder: portal-bff
  format: jwt
  subject_type: public
  typ: at+jwt
  alg_allowlist:
  - RS256
  issuers:
  - iss: https://corp.auth0.example.com/
    jwks_uri: https://corp.auth0.example.com/.well-known/jwks.json
  required_claims:
  - iss
  - sub
  - aud
  - exp
  - iat
  - jti
  - client_id
  key_source:
    from: issuer_metadata_jwks_uri
    header_key_params: reject
  max_clock_skew: 30
  max_lifetime: 300
  lifetime_refs:
  - kind: guidance
    id: NIST IR 8587 §5.3.1.1
  lifetime_set_by:
  - platform
  refresh: BFF が RT で取り直す。Action は取り直しでも動く
  rt_rotation:
    rotation: true
    reuse_detection: unverified
  sender_constraint: none
  revocation:
  - method: exp_only
    delay_seconds: 330
    note: 一般の操作は exp まで受け入れる
  - method: db_lookup
    delay_seconds: 0
    note: 入口が要求ごとに社員台帳のログアウトの時刻と在籍の状態を引く
  long_running: 非同期の処理は無い
  key_rotation:
    period_days: null
    publish_before_use_seconds: 0
    retire_after_seconds: 0
