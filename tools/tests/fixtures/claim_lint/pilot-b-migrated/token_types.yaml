  kind: txn_token
  decision: 却下
  rationale: サービスからサービスへの呼び出しが無く、入口 → サービスの 1 段だけ。内部トークン（INTERNAL_TOKEN）で足り、TTS を置く費用に見合わない。できなくなること：複数のサービスにまたがる取引の識別子（txn）を改変されずに運ぶこと
  assumption: 注文と請求書のサービスは互いを呼ばない
  revisit_trigger: サービス間の呼び出しが生まれたとき
  refs:
  - kind: spec
    id: draft-ietf-oauth-transaction-tokens-11 §6
  format: jwt
- id: ID_JAG
  kind: id_jag
  decision: 却下
  rationale: 取引先・別のドメインのサービスを、SSO 済みの社員として呼ぶ経路が無い。できなくなること：ドメインをまたぐ認可グラント
  assumption: 社外の API を社員の代わりに呼ばない
  revisit_trigger: 社外の SaaS の API を社員として呼ぶ機能を足すとき
  format: jwt
- id: DPOP_PROOF
  kind: dpop_proof
  decision: 却下
  rationale: 送信者制約を見送る（issuance_profile.sender_constraint）。できなくなること：漏れた AT の別の端末からの再送を止めること（B23）
  assumption: AT は BFF と入口のサーバーの中に留まり、ブラウザ・端末に出ない
  revisit_trigger: B23 の型の悪用が観測されたとき、AT を端末に置く構成にしたとき
  refs:
  - kind: spec
    id: RFC 9449 §1
  format: jwt
- id: JAR_REQUEST_OBJECT
  kind: jar_request_object
  decision: 却下
  rationale: 認可要求に改ざんされて困る値（RAR など）を入れない。できなくなること：認可要求の改ざんの検出
  assumption: 認可要求のパラメータは scope・state・nonce・PKCE だけ
  revisit_trigger: 認可要求に承認の内容を入れるとき
  format: jwt
- id: JARM_RESPONSE
  kind: jarm_response
  decision: 却下
  rationale: 認可コード＋PKCE と state で足りる。できなくなること：認可応答の署名による改ざんの検出
  assumption: 5 つの IdP のすべてが JARM に対応しているとは確かめていない
  revisit_trigger: FAPI などの準拠が求められたとき
  format: jwt
- id: WORKLOAD_JWT
  kind: jwt
  decision: 却下
  rationale: 入口とサービスの間の通信相手は、メッシュの mTLS（ワークロードの証明書）で確かめ、ワークロードの ID のトークンは使わない。できなくなること：トークンの層でのワークロードの識別
  assumption: 入口とサービスは同じメッシュの中にあり、mTLS を強制できる
  revisit_trigger: メッシュの外のワークロードがサービスを呼ぶとき
  format: jwt
- id: SET
  kind: security_event_token
  decision: 却下
  rationale: 共有シグナル（SSF・CAEP）を受ける仕組みを作らない。ログアウト・異動の反映は社員台帳の問い合わせ（db_lookup）で行う。できなくなること：IdP 側の失効の即時の受信
  assumption: 社員台帳が異動・退職・ログアウトの時刻を即時に持つ
  revisit_trigger: IdP 側だけで起きるアカウントの停止を、台帳より先に反映する必要が出たとき
  format: jwt
- id: STATUS_LIST
  kind: status_list_token
  decision: 却下
  rationale: 内部トークンは 30 秒で、状態リストを置く必要が無い。できなくなること：個々のトークンの失効の配布
  assumption: 内部トークンの寿命を 30 秒より長くしない
  revisit_trigger: 内部トークンの寿命を延ばすとき
  format: jwt
- id: INTROSPECTION_JWT
  kind: introspection_response_jwt
  decision: 却下
  rationale: IdP のイントロスペクションを使わない（5 つの IdP で手段がそろわないため、社員台帳の問い合わせに寄せた）。できなくなること：IdP の側でのトークンの有効性の確認
  assumption: 社員台帳の問い合わせで、ログアウト・在籍・部署の鮮度を確かめられる
  revisit_trigger: 社員台帳で表せない失効（IdP の管理者による個々のトークンの失効）を反映する必要が出たとき
  format: jwt
