  signing_key_scope: shared
  stored_at: bff_server
  transport: token_response_body
  visible_to:
  - bff
  jwe:
    used: false
  log_policy: 記録しない
- id: REFRESH_TOKEN
  kind: refresh_token
  decision: 採用
  rationale: ポータルの BFF が AT を取り直すために使う。BFF のサーバーにだけ置き、ブラウザに出さない
  assumption: 各 IdP の RT の寿命を、BFF のセッションの最大（10 時間）以下に設定できる
  revisit_trigger: IdP の RT の寿命を BFF のセッションより短くできない IdP が出たとき
