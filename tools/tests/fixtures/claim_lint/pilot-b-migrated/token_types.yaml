  required_claims:
  - iss
  - sub
  - aud
  - exp
  - iat
  - jti
  - roles
  - https://claims.example.com/employee_id
  key_source:
    from: configured_jwks_uri
    header_key_params: reject
  max_clock_skew: 5
  max_lifetime: 30
  lifetime_refs:
  - kind: guide-slide
    id: p06-edge-exchange
  - kind: author-proposal
    id: 要求ごとに作り直す短命の内部トークン（30 秒）
    tracking: '#9'
  lifetime_set_by:
  - platform
  refresh: 無い。要求ごとに入口が作り直す
  sender_constraint: none
  jti_policy:
    unique_scope: per_issuer
    replay_check: true
    max_age_seconds: 35
  revocation:
  - method: exp_only
    delay_seconds: 35
    note: 要求ごとに作るので exp まで 30 秒＋ずれ 5 秒
  - method: db_lookup
    delay_seconds: 0
    note: 経理台帳では invoices が要求ごとに社員台帳の部署（C-department）を引き直す。ログアウトは入口が作る前に 社員台帳のログアウトの時刻で確かめる
  - method: one_time_use
    delay_seconds: 0
    note: 経理台帳（重要な操作）では invoices が jti を 1 回だけ受ける
  long_running: 非同期の処理は無い。内部トークンの期限の後にサービスが下流を呼ぶことはない
  key_rotation:
    period_days: 30
    publish_before_use_seconds: 3600
    retire_after_seconds: 3600
    note: 入口が新しい鍵を JWKS に載せてから 1 時間後に使い始め、旧鍵は 1 時間残す
  unknown_kid:
    refetch_min_interval_seconds: 30
    negative_cache_seconds: 30
    on_fetch_failure: reject
  jwks_cache_ttl: 300
  signing_key_scope: shared
  stored_at: service_memory
  transport: authorization_bearer
  visible_to:
  - gateway
  - api
  jwe:
    used: false
  log_policy: jti だけ記録
  size:
    signing:
      alg: ES256
    header:
      params:
      - name: alg
        type: string
        max_bytes: 5
      - name: typ
        type: string
        max_bytes: 12
      - name: kid
        type: string
        max_bytes: 36
    path:
    - nginx-large-client-header-buffers
- id: LOGOUT_TOKEN
