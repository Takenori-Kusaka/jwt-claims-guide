  catalog_refs_reason: ブラインド記入（#9 のパイロット）のため、ケーススタディの一覧表を参照していない
  registered_ref:
    kind: spec
    id: RFC 7519 §4.1.6
  type: integer
  shape: single
  description: トークンの発行時刻（NumericDate）
