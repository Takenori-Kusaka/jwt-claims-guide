# 台帳。パイロット #9 のシナリオ B（research/pilot/scenario-b）を、#58 の列で書き直した fixture。migrate.py が作る（手で直さない）
scenario: scenario-b-pilot-blind
namespaces:
- namespace: https://claims.example.com/
  style: flat_prefix
  owner: 情報システム部 ID 基盤チーム
  assignment: この台帳への登録（PR と追加前の 25 問）でだけ名前を割り当てる。入口（内部トークン）と Auth0 の Action だけがこの名前空間の名前を書く
data_category_vocabulary:
  name: fideslang
  version: 3.1.4
  url: https://github.com/ethyca/fideslang/blob/3.1.4/data_files/data_categories.csv
  license: CC-BY-4.0
  verified_on: '2026-11-24'
data_category_extensions:
- key: user.workplace.department
  parent: user.workplace
  description: 社員の所属部署のコード（社員台帳の値）
  owner: 人事部
claims:
- id: C-iss
  name: iss
  namespace: null
  catalog_refs: []
  catalog_refs_reason: ブラインド記入（#9 のパイロット）のため、ケーススタディの一覧表を参照していない
  registered_ref:
    kind: spec
    id: RFC 7519 §4.1.1
  type: string
  shape: single
  allowed_values:
    format: uri
  description: トークンの発行者
  not_meaning: 利用者がどの組織に属するかではない。内部トークンの iss は入口で、利用者を認証した IdP ではない
  decision: 採用
  rationale: 受け手は発行者ごとに検証の規則（鍵・宛先・種類の確かめ方）を切り替える。入口は 5 つの IdP の iss を完全一致で照合し、Entra は自社のテナントの iss だけを受ける（B10）。サービスは入口の iss だけを受ける（B7）
  assumption: 受け入れる発行者は、入口の設定に固定した 5 つの IdP と入口だけ
  revisit_trigger: IdP を足す・外すとき、Entra で別のテナントを受けるとき
  refs:
  - kind: spec
    id: RFC 7519 §4.1.1
  - kind: guide-slide
    id: p03-entra-oid-tid
  usage: protocol
  issuers:
  - https://kc.corp.example.com/realms/corp
  - https://login.microsoftonline.com/11111111-2222-3333-4444-555555555555/v2.0
  - https://corp.okta.example.com/oauth2/default
  - https://cognito-idp.ap-northeast-1.amazonaws.com/ap-northeast-1_EXAMPLE
  - https://corp.auth0.example.com/
  - https://gw.corp.example.com
  authoritative_writer:
  - stage: ②
    writer: 各 IdP（AT・ID トークン・ログアウトトークンの発行時）
    configurable_by:
    - platform
  - stage: ③
    writer: 入口（内部トークンの作り直し）
    configurable_by:
    - platform
  provenance: 発行者が確かめた値
  issue_events:
  - I01
  - I02
  - I09
  - I21
  source_system: 各 IdP と入口の設定
  volatility: never
  recompute_trigger:
  - never
  propagation_delay: 0
  on_revoke: 発行者を外すときは入口・BFF・サービスの設定から外し、再起動する
  carried_in:
  - KC_AT
  - ENTRA_AT
  - OKTA_AT
  - COGNITO_AT
  - AUTH0_AT
  - ID_TOKEN
  - LOGOUT_TOKEN
  - INTERNAL_TOKEN
  consumers:
  - gateway
  - portal-bff
  - orders
  - invoices
  consumer_access_path:
  - consumer: gateway
    via: token_library
  - consumer: portal-bff
    via: token_library
  - consumer: orders
    via: token_library
    note: 組織共通の検証部品
  - consumer: invoices
    via: token_library
    note: 組織共通の検証部品
  on_missing: 拒否
  absent_semantics:
    absent: 検証できないトークンとして拒む
  enforced_at:
  - service: gateway
    check: 5 つの IdP の iss のどれかと完全一致。Entra は自社の tid の iss だけ
    against:
    - api_config
  - service: portal-bff
    check: ログインを始めた IdP の iss と完全一致
    against:
    - api_config
  - service: orders
    check: 入口の iss と完全一致
    against:
    - api_config
  - service: invoices
    check: 入口の iss と完全一致
    against:
    - api_config
  max_bytes: 96
  overflow_strategy: 上限で固定（超えない値域）
  confidential_from: []
  pii_category: 該当なし
  data_category:
  - system.operations
  log_policy: 記録する
  status: active
  owner: 情報システム部 ID 基盤チーム
  change_controller: IETF（RFC 7519）
- id: C-sub
  name: sub
  namespace: null
  catalog_refs: []
  catalog_refs_reason: ブラインド記入（#9 のパイロット）のため、ケーススタディの一覧表を参照していない
  registered_ref:
    kind: spec
    id: RFC 7519 §4.1.2
  type: string
  shape: single
  description: 発行者の中で利用者を一意に表す識別子
  not_meaning: ログイン名・メールではない。内部トークンの sub は組織の利用者の ID（社員台帳の UUID）で、IdP の sub ではない
  decision: 採用
  rationale: 入口は Keycloak・Cognito・Auth0 では iss＋sub、Entra では tid＋oid、Okta では uid を、社員台帳の名寄せの表で組織の利用者の ID に写し、内部トークンの sub にする（Okta の sub は再利用されるので使わない。B13・B14）。サービスは内部トークンの sub で本人のデータを引く
  assumption: 社員台帳が、IdP ごとの不変のキーと組織の利用者の ID の対応（名寄せの表）を持つ。名寄せは人事の手続きでだけ変える
  revisit_trigger: IdP の不変のキーが変わったとき（Okta の uid が AT に入らない設定など）、名寄せの表を IdP の属性から自動で作ることにしたとき
  refs:
  - kind: guide-slide
    id: p02-user-identifier
  - kind: guide-slide
    id: p03-confusing-differences
  answers:
  - q-sub
  - q-user
  does_not_answer:
  - q-agent
  usage: identifier
  issuers:
  - https://kc.corp.example.com/realms/corp
  - https://cognito-idp.ap-northeast-1.amazonaws.com/ap-northeast-1_EXAMPLE
  - https://corp.auth0.example.com/
  - https://login.microsoftonline.com/11111111-2222-3333-4444-555555555555/v2.0
  - https://corp.okta.example.com/oauth2/default
  - https://gw.corp.example.com
  upstream_issuer:
    iss:
    - https://kc.corp.example.com/realms/corp
    - https://login.microsoftonline.com/11111111-2222-3333-4444-555555555555/v2.0
    - https://corp.okta.example.com/oauth2/default
    - https://cognito-idp.ap-northeast-1.amazonaws.com/ap-northeast-1_EXAMPLE
    - https://corp.auth0.example.com/
    source_attribute: Keycloak・Cognito・Auth0 は sub、Entra は tid と oid、Okta は uid（AT のクレーム）
    normalization: 入口が（iss, IdP の不変のキー）で社員台帳の名寄せの表を引き、組織の利用者の ID（UUID、小文字）に替える。表に無ければ拒む
  authoritative_writer:
  - stage: ②
    writer: 各 IdP（AT・ID トークンの発行時）
    configurable_by:
    - platform
  - stage: ③
    writer: 入口（社員台帳の名寄せの表で組織の利用者の ID に替える）
    configurable_by:
    - platform
  provenance: 発行者が確かめた値
  issue_events:
  - I01
  - I02
  - I21
  source_system: 各 IdP の利用者の ID と、社員台帳の名寄せの表
  verification_method: 名寄せの表は人事の入社の手続きで作り、IdP の属性（メール・ログイン名）から自動で作らない
  volatility: never
  recompute_trigger:
  - login
  - refresh
  - reissue
  propagation_delay: 0
  on_revoke: 退職・停止は社員台帳の在籍の状態で入口が要求ごとに拒む（db_lookup）
  carried_in:
  - KC_AT
  - COGNITO_AT
  - AUTH0_AT
  - ID_TOKEN
  - INTERNAL_TOKEN
  consumers:
  - gateway
  - portal-bff
  - orders
  - invoices
  consumer_access_path:
  - consumer: gateway
    via: token_library
  - consumer: portal-bff
    via: token_library
  - consumer: orders
    via: token_library
  - consumer: invoices
    via: token_library
  on_missing: 拒否
  absent_semantics:
    absent: 利用者を決められないので拒む
  enforced_at:
  - service: gateway
    check: （iss・不変のキー）が社員台帳の名寄せの表にあり、在籍していること
    against:
    - iss
    - data_layer
  - service: portal-bff
    check: ID トークンの（iss・sub）で BFF のセッションを作る
    against:
    - iss
  - service: orders
    check: 注文の持ち主が sub と一致する行だけを返す
    against:
    - data_layer
  - service: invoices
    check: 請求書・経理台帳の操作者を sub で記録し、給与明細は sub の社員番号と照合する
    against:
    - data_layer
  identifier_properties:
    stable: true
    reassignable: false
    pairwise: false
    id_scheme: opaque
  value_normalization:
    case: as_is
    unicode: none
    trim: false
    compare: exact
    normalized_by: 入口
  max_bytes: 64
  overflow_strategy: 上限で固定（超えない値域）
  confidential_from: []
  pii_category: 個人情報
  data_category:
  - user.unique_id
  log_policy: ハッシュ化して記録
  status: active
  owner: 情報システム部 ID 基盤チーム
  change_controller: IETF（RFC 7519）
- id: C-sub-unread
  name: sub
  namespace: null
  catalog_refs: []
  catalog_refs_reason: ブラインド記入（#9 のパイロット）のため、ケーススタディの一覧表を参照していない
  registered_ref:
    kind: spec
    id: RFC 7519 §4.1.2
  type: string
  shape: single
  description: 発行者の中で利用者を一意に表す識別子
  decision: 既定どおり
  rationale: Okta の AT の sub はログイン名（メール形式）で、退職の後に別の人へ再利用されうる。Entra の AT の sub はアプリごとの仮名。どちらも IdP が既定で出すが、入口は読まない（Okta は uid、Entra は tid＋oid を使う）
  refs:
  - kind: guide-slide
    id: p02-user-identifier
  issuers:
  - https://corp.okta.example.com/oauth2/default
  - https://login.microsoftonline.com/11111111-2222-3333-4444-555555555555/v2.0
  max_bytes: 256
  pii_category: 個人情報
  data_category:
  - user.unique_id
  confidential_from: []
  not_meaning: 入口はこの 2 つの IdP の sub を利用者のキーにしない（Okta は uid、Entra は tid＋oid を使う）
  usage: protocol
  authoritative_writer:
  - stage: ②
    writer: Okta・Entra ID
    configurable_by:
    - platform
  issue_events:
  - I01
  - I02
  on_missing: 無視
  overflow_strategy: 上限で固定（超えない値域）
  log_policy: 記録しない
  owner: 情報システム部 ID 基盤チーム
  source_system: Okta のログイン名・Entra のアプリごとの仮名
  volatility: never
  propagation_delay: 0
  status: active
  carried_in:
  - OKTA_AT
  - ENTRA_AT
  consumers: []
  note: Okta の sub は再利用されうる（reassignable）。識別子として読まないので usage は protocol とし、identifier_properties を書いていない
- id: C-aud
  name: aud
  namespace: null
  catalog_refs: []
  catalog_refs_reason: ブラインド記入（#9 のパイロット）のため、ケーススタディの一覧表を参照していない
  registered_ref:
    kind: spec
    id: RFC 7519 §4.1.3
  type: string
  shape: array
  description: トークンの宛先
  not_meaning: 利用者に許した操作ではない。Okta の api://default は認可サーバーの宛先で、サービスを区別しない
  decision: 採用
  rationale: 入口は経路（注文・請求書）ごとに、IdP ごとの宛先の値（Keycloak の orders・invoices、Entra の api://orders・api://invoices、Auth0 の https://api.example.com）を照合する。請求書宛ての AT を注文の経路で拒む（B3）。内部トークンの aud は 1 つのサービスで、サービスは自分の名前と照合する
  assumption: BFF はサービスごとに別の AT を取る（Keycloak はクライアントスコープの Audience マッパーで 1 つの宛先にする）
  revisit_trigger: 1 つの AT で複数のサービスを呼ぶ構成にしたとき
  refs:
  - kind: spec
    id: RFC 7519 §4.1.3
  - kind: guide-slide
    id: p06-narrow-downstream
  answers:
  - q-resource
  usage: authz
  issuers:
  - https://kc.corp.example.com/realms/corp
  - https://login.microsoftonline.com/11111111-2222-3333-4444-555555555555/v2.0
  - https://corp.okta.example.com/oauth2/default
  - https://corp.auth0.example.com/
  - https://cognito-idp.ap-northeast-1.amazonaws.com/ap-northeast-1_EXAMPLE
  - https://gw.corp.example.com
  authoritative_writer:
  - stage: ②
    writer: 各 IdP（要求された scope・クライアントの設定から）
    configurable_by:
    - platform
  - stage: ③
    writer: 入口（経路の 1 つのサービスにする）
    configurable_by:
    - platform
  provenance: 管理者が設定した値
  issue_events:
  - I01
  - I02
  - I09
  - I21
  source_system: 各 IdP の API・クライアントスコープの設定と、入口の経路の設定
  volatility: never
  recompute_trigger:
  - login
  - refresh
  - reissue
  propagation_delay: 0
  on_revoke: 宛先を変えるときは入口の経路の設定を変える
  carried_in:
  - KC_AT
  - ENTRA_AT
  - OKTA_AT
  - AUTH0_AT
  - ID_TOKEN
  - LOGOUT_TOKEN
  - INTERNAL_TOKEN
  consumers:
  - gateway
  - portal-bff
  - orders
  - invoices
  consumer_access_path:
  - consumer: gateway
    via: token_library
  - consumer: portal-bff
    via: token_library
  - consumer: orders
    via: token_library
  - consumer: invoices
    via: token_library
  on_missing: 拒否
  absent_semantics:
    absent: 宛先の無いトークンとして拒む（Cognito の AT は aud が無いので、aud の代わりに client_id を照合する別の規則で受ける）
  enforced_at:
  - service: gateway
    check: 経路のサービスに当たる IdP ごとの宛先の値を含む。Okta は aud が共通なので scope の orders・invoices も照合する。ID トークン（aud がポータルのクライアント）を拒む
    against:
    - api_config
  - service: portal-bff
    check: ID トークン・ログアウトトークンの aud が自分のクライアント ID
    against:
    - api_config
  - service: orders
    check: aud が orders だけ
    against:
    - api_config
  - service: invoices
    check: aud が invoices だけ
    against:
    - api_config
  max_bytes: 64
  max_items: 2
  typical_items: 1
  overflow_strategy: 発行を失敗させる
  confidential_from: []
  pii_category: 該当なし
  data_category:
  - system.operations
  log_policy: 記録する
  status: active
  owner: 情報システム部 ID 基盤チーム
  change_controller: IETF（RFC 7519）
- id: C-exp
  name: exp
  namespace: null
  catalog_refs: []
  catalog_refs_reason: ブラインド記入（#9 のパイロット）のため、ケーススタディの一覧表を参照していない
  registered_ref:
    kind: spec
    id: RFC 7519 §4.1.4
  type: integer
  shape: single
  description: トークンの有効期限（NumericDate）
