  alt:
  - C-roles
  rationale: Cognito の custom:* の属性は、書き込みを許すと利用者本人が書き換えられる。認可に使えば、本人が admins を書いて管理操作を呼べる（B18）。できなくなること：Cognito の属性でロールを渡すこと（cognito:groups を使う）
  assumption: Cognito のロールは管理者が設定するグループ（cognito:groups）だけで表す
  revisit_trigger: custom:* の属性の書き込みを全クライアントで禁じたと確かめたとき
