  - login
  - refresh
  - reissue
  propagation_delay: 0
  on_revoke: 寿命の設定を短くする
  carried_in:
  - KC_AT
  - ENTRA_AT
  - OKTA_AT
  - COGNITO_AT
  - AUTH0_AT
  - ID_TOKEN
  - LOGOUT_TOKEN
  - INTERNAL_TOKEN
  consumers:
  - gateway
  - portal-bff
  - orders
  - invoices
  on_missing: 拒否
  enforced_at:
  - service: gateway
    check: exp を過ぎていない。exp − iat が目録の max_lifetime 以下
    against:
    - api_config
  - service: portal-bff
    check: exp を過ぎていない
    against:
    - api_config
  - service: orders
    check: exp を過ぎていない。exp − iat が 30 秒以下
    against:
    - api_config
  - service: invoices
    check: exp を過ぎていない。exp − iat が 30 秒以下
    against:
    - api_config
  max_bytes: 10
  overflow_strategy: 上限で固定（超えない値域）
  confidential_from: []
