  refs:
  - kind: spec
    id: RFC 7519 §4.1.6
  - kind: guide-slide
    id: p08-logout
  usage: protocol
  issuers:
  - https://kc.corp.example.com/realms/corp
  - https://login.microsoftonline.com/11111111-2222-3333-4444-555555555555/v2.0
  - https://corp.okta.example.com/oauth2/default
  - https://cognito-idp.ap-northeast-1.amazonaws.com/ap-northeast-1_EXAMPLE
  - https://corp.auth0.example.com/
  - https://gw.corp.example.com
  authoritative_writer:
  - stage: ②
    writer: 各 IdP
    configurable_by:
    - platform
  - stage: ③
    writer: 入口
    configurable_by:
    - platform
  issue_events:
  - I01
  - I02
  - I09
  - I21
  source_system: 発行者の時計
  volatility: never
  recompute_trigger:
  - login
  - refresh
  - reissue
  propagation_delay: 0
  on_revoke: ログアウトの時刻を進めると、それより前の iat の AT を入口が拒む
  carried_in:
  - KC_AT
  - ENTRA_AT
  - OKTA_AT
  - COGNITO_AT
  - AUTH0_AT
  - ID_TOKEN
  - LOGOUT_TOKEN
  - INTERNAL_TOKEN
  consumers:
  - gateway
  - portal-bff
  - orders
  - invoices
  on_missing: 拒否
