  8707: Resource Indicators for OAuth 2.0
  8725: JSON Web Token Best Current Practices
  9068: JSON Web Token (JWT) Profile for OAuth 2.0 Access Tokens
  9110: HTTP Semantics
  9126: OAuth 2.0 Pushed Authorization Requests
