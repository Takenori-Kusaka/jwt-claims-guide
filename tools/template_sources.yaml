# Pinned lists for tools/template_check.py (#4): the RFCs and the tracking issues the templates may cite. An evidence
# element of the templates that names an RFC or a tracking issue outside these lists fails (T3). Adding a source is a
# deliberate change in a PR: open the RFC (or the issue) and add it here with its title.
# The RFC numbers were checked to exist by the independent check of PR #43 (2026-11-23, 63 of 63 sections found).
# Sections are NOT checked: whether "RFC 9449 §11.1" supports the item is the 10% sampled check of templates/CONTRIBUTING.md 2.
