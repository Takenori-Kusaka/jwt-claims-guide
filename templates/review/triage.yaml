# template_version: 0.4.0
# 観点書（perspectives.md）の 168 問の振り分け（#56）。
# 作成方法：本資料は生成AI（Claude）を使って作成し、筆者が確認して公開しています。人による点検は未実施。
# 区分・優先順・出す条件・1 回の量の目安は、どれも筆者の提案（追跡 #56。人による確かめは #20）。
# このファイルが正。次の 4 つは `python tools/review_triage.py --write` がここから作る（CI は --check で食い違いを見る）：
#   templates/review/perspectives.md の各問いの「- 区分：」の行
#   templates/review/short_list.md（人に渡す短い一覧）
#   .github/PULL_REQUEST_TEMPLATE/design_doc.md（書き手の提出前の自己点検）
#   docs/claims/data/review.js の triage・checklist（python tools/build_claims_viewer.py）
version: 1

classes:
  A: {name: 機械, means: "欄の有無・値の範囲・欄どうしの整合だけで Yes／No が決まる", goes_to: "claim_lint の規則。規則がまだ無い問い・規則が一部しか見ない問いは、規則ができるまで書き手の自己点検にも置く（interim: B）"}
  B: {name: 書き手の自己点検, means: "書き手なら機械的に埋められるが、機械には読めない（設計書の本文・モジュールの欄に書いてあるか）", goes_to: "提出前のチェックリスト（PR のテンプレート）"}
  C: {name: 人の判断, means: "要求・組織の事情・脅威の想定・取り引きの妥当さを判断する", goes_to: "レビュアーに渡す短い一覧（short_list.md）"}
  D: {name: 専門家, means: "暗号・IdP の実際の挙動・委任の深さなど、レビュアーに求められない", goes_to: "escalation.md の基準で専門家に回す"}

# 1 回のレビューの量の目安（筆者の提案。追跡 #56、人による確かめは #20）
budget:
  questions: [10, 17]
  minutes: [30, 60]
  default_priorities: [1]      # 既定で出すのは、条件に当たる優先 1 の問いだけ（再点検：優先 2 まで出すと、問いだけで 75〜110 分の見積もりになる）
  optional_priorities: [2]     # 「時間があれば」。別に数える。優先 3 は「詳しく見る」
  default_prompts: 3           # 開いた問いは、設計ごとに 3 つまでを既定で出す（性質に合うものを先に）。残りは「さらに」
  row_sample: 3                # 「行ごと」の問いは、認可・識別子に使う行から 3 行を抜き取って答える（種つき。全部の行ではない）
  note: "優先 1 を答え終えて時間が残れば、優先 2（時間があれば）を上から答える。答えなかった問いはレポートに書く"
  whole_procedure_minutes: [70, 110]   # 手順の段 0〜6 の目安の合計（10＋10＋5〜10＋20〜40＋10〜15＋10〜20＋5）。LLM の見積もりで、人では測っていない

priorities:
  1: "No なら偽造・なりすまし・他人のデータに届く、またはパイロット（#9）で Major の指摘が出た問い（既定で出す）"
  2: "No なら権限の誤り・剥奪の遅れになり、理由や取り引きの妥当さを読む問い（時間があれば）"
  3: "当たる設計が限られる、または優先 1・2 の問いを答える中で見える問い（既定では出さない）"

# 問い（ask）は 1 文で書き、見る場所と、あわせて確かめることは hint に書く（独立点検の指摘。1 問が 2〜3 文だと、問いの数より重くなる）。
# 問いを読む単位。短い一覧の章になる
units:
  row: クレームの行を読みながら（認可・識別子に使う行から、抜き取った 3 行について答える）
  hop: 経路を読みながら（ホップの 1 行ごと・範囲の図）
  design: 設計の全体を読んでから

# 出す条件（show_when）。台帳・目録・ホップ・カタログへの回答から読める性質だけを使う。
# 読み方の実装は tools/review_triage.py の traits() と docs/claims/review.js の designTraits()（同じ結果になることをテストで確かめる）。
# show_when に 2 つ以上あるときは、どれか 1 つに当たれば出す。
# 性質は、台帳が示すか、書き手が catalog_answers で宣言していれば当たる。読むためのファイル（hops.yaml・catalog_answers.yaml）が
# 無くて読めない性質は「読めない」として、その性質の問いを注記つきで出す（黙って一覧を短くしない）。
conditions:
  always: {label: どの設計でも, read: "条件なし"}
  org_claims: {label: 組織独自のクレームがある, read: "採用の行に、名前空間つきの行、または登録名でない（registered_ref が無い）認可・識別子の行がある"}
  pii: {label: 個人情報を載せる, read: "採用の行の pii_category に「該当なし」以外がある"}
  multi_idp: {label: 発行者（IdP）が複数ある, read: "採用の種別の issuers の iss のホストが 2 種類以上、または upstream_issuer のある採用の行がある（同じ IdP のレルム違いは数えない）"}
  exchange: {label: トークンの交換・作り直しがある, read: "ホップに kind が exchange・reissue の行がある、または catalog_answers の lite_criteria.delegation_or_exchange が Yes"}
  delegation: {label: 委任がある（代理で動く主体がいる）, read: "採用の行に act・may_act がある、採用の種別に max_delegation_depth がある、または catalog_answers の questions.q-actor が「要る」。どれも無いのに lite_criteria.delegation_or_exchange が Yes なら「読めない（要確認）」として問いを出す"}
  approval: {label: 操作ごとの承認がある, read: "採用の行かホップに authorization_details がある"}
  multitenant: {label: マルチテナント, read: "catalog_answers の lite_criteria.multitenant が Yes。この回答が無いときだけ、採用の種別の tenant_binding の有無で読む"}
  data_layer: {label: トークンの値を DB の層まで運ぶ, read: "ホップに kind が db_connection の行がある"}
  auth_context: {label: 認証の強さ・新しさで判断する, read: "採用の行に acr・amr・auth_time がある"}
  sender_constrained: {label: 送信者制約を選んだ, read: "採用の種別に sender_constraint が dpop・mtls の行がある、または catalog_answers の questions.q-holder が「要る」"}
  sender_declined: {label: 送信者制約を見送った, read: "採用のアクセストークン・内部トークンに、sender_constraint が none か未記入の行がある"}
  long_running: {label: 長時間・非同期の処理がある, read: "採用の種別に long_running がある、またはホップに kind が broker_connection の行がある"}

# 書き手の自己点検で、1 行にまとめる問い（group）。規則の案が同じ問いは、道具が自動で 1 行にまとめる
author_groups:
  pa-answers: "追加前の 25 問の回答（claim_request_*.md）は、どれも問いに答えていて、台帳の該当の行（namespace・shape・log_policy・pii_category・rationale）と同じことを言っているか（空欄でないことは lint の L72 が見る）"

# lint の規則の案（A に分けたが、答えを決める規則がまだ無い問いのため）。
# L<番号> は templates/trace/planned_items.yaml にある未実装の規則、N<番号> はこの振り分けとパイロット（#9）から出た新しい案。
# 実装はしない（#56 の範囲の外）。一覧は issue #68 にある。
proposed_rules_issue: "#68"
proposed_rules:
  N1: {rule: "R1 の必須の列に、組織独自のクレームの prior_art_search、認可・識別子の文字列のクレームの value_normalization、受け手ごとの consumer_access_path を足す", pilot: [B-R1 F07, B-R2 R2-14]}
  N2: {rule: "ホップの validates・行の upstream_issuer に出る IdP のクレームの名前に、台帳の行（identifier_properties・on_missing）を求める（L7 の逆向きの拡張）", pilot: [B-R1 F01, B-R2 R2-03]}
  N3: {rule: "種別の required_claims が、その種別を運ぶホップの custom_claims に含まれる（25 問の問 14 と目録の必須の食い違い）", pilot: [B-R1 F03, B-R2 R2-15]}
  N4: {rule: "個人情報の行で、carried_in の種別の holder・visible_to に、consumers に無い相手がいれば warn（L6・L65 の拡張）", pilot: [C-R1 F10]}
  N5: {rule: "認可に使うオブジェクト型のクレームに、内側の型（受け手のスキーマの properties）と比べ方を求める", pilot: [C-R1 F17, C-R2 F10]}
  N6: {rule: "on_missing が拒否なのに、carried_in の種別の一部の required_claims に無い行（無いのが正規のトークンがある）", pilot: [C-R2 F13]}
  N7: {rule: "台帳の consumers・enforced_at.service と、ホップの to の名前が結びつく（生成の矢印の表が空になる）", pilot: [C-R1 F14, C-R2 F22]}
  N8: {rule: "採用の Txn-Token の required_claims に、草案の必須（iat・aud・exp・txn・sub・scope・req_wl）がそろう", pilot: []}
  N9: {rule: "logout_token の種別に、nonce の拒否と、sub か sid の必須を求める", pilot: [B-R1 T10]}
  N10: {rule: "組織の外に届く種別（lite_criteria.crosses_boundary が Yes のときの外向きの aud）に subject_type を求める", pilot: []}
  N11: {rule: "25 問の回答（claim_request_*.md）が、ほかのクレームの回答と同じ文なら warn", pilot: []}
  N12: {rule: "render が作る表のクレームの名前（flat_prefix のつなぎ方）が、required_claims・生成のスキーマの名前と一致する（問いには当たらない。パイロットの指摘から）", pilot: [B-R1 T7, B-R2 R2-16]}
  N13: {rule: "assumption を書いた行に revisit_trigger を求める（問いには当たらない。理由の採点 RR2・RR3 から）", pilot: [C-R1 F18, C-R2 F26]}
  N14: {rule: "書き手がフック（authoritative_writer の writer にフック・hook・Lambda）の行で、pii_category が個人情報・要配慮個人情報なら warn", pilot: []}
  N15: {rule: "認可・識別子のクレームをヘッダー以外に写す（integrity_until の db_session・cache・queue_message・log）とき、その写し先を書けるのが入口・注入者だけという宣言を求める（L67 の残り）", pilot: []}
  N17: {rule: "status が deprecated の行に、sunset_on・alt・consumers_migration を求める（L18 は読む受け手がいることだけを知らせる）", pilot: []}
  N18: {rule: "内部・委任のトークン種別（internal_token・txn_token と、act を運ぶ種別）に log_policy を求める", pilot: []}
  N16: {rule: "iat・amr・sid の行の usage が authz、または enforced_at で認証の時刻・強さ・セッションの判断に使っていれば warn", pilot: []}

# 開いた問い：問いの一覧の内側では見つからなかった Major の指摘（パイロット #9 のテンプレート外・カタログ）から作った。
# 旧経路・テストの経路は q-outside-catalog に、同意と宛先の束縛は q-approval-from-as にまとめた（重なりを減らすため）。
# 要求と運用から辿って、気づいたことを指摘にする。出どころは「テンプレート外」。
# 並びが既定の順（パイロットの Major が多かった順）。設計ごとに、条件が性質に当たるもの（show_when が always 以外）→ prefer_when が当たるもの → 残り、
# の順に budget.default_prompts 個までを既定で出し、残りは「さらに」に置く。
open_prompts:
  - id: op-source-change
    show_when: [always]
    prefer_when: [multi_idp, org_claims]
    ask: "権限の元データが変わる出来事を 1 つ選び、受け手の判断が変わるまでを、IdP の手前から辿れるか"
    hint: "出来事の例：異動でロールが外れる・退職。source_system の欄から、元のデータ（人事の台帳・グループ・ロールの割り当て）を書き換えるのは誰で、どの経路かを辿る。図に無い書き込みの経路、誰も時間を約束していない区間を探す"
    from: [B-R2 R2-06, B-R1 T2, B-R2 R2-08]
  - id: op-one-time
    show_when: [always]
    prefer_when: [approval, delegation]
    ask: "1 回だけ使える値が、「確かめる」と「使用済みにする」の間にもう 1 回届いても、2 回通らないか"
    hint: "承認・認可コード・jti・ワンタイムの番号。並行の 2 件、通信が切れた後の再送、記録先の障害のそれぞれで辿る。正しい 1 回が失われることもないか"
    from: [C-R1 F08, C-R2 F03, B-R1 T6, B-R2 R2-10]
  - id: op-requirement-words
    show_when: [always]
    ask: "要求の言葉に入る人・場合を全部挙げたとき、それぞれを通す・止める値が設計にあるか"
    hint: "要求の文から言葉を 2〜3 個選ぶ（例：「利用者」「管理者」「承認」「取り消し」）。その言葉に入る人・場合を挙げる（例：正社員・契約社員・派遣・休職中・退職の手続き中）。要求にあるのに設計に無い区分、設計にあるのに要求に無い操作を探す"
    from: [B-R1 T4, B-R2 R2-19]
  - id: op-clock
    show_when: [always]
    prefer_when: [multi_idp, exchange]
    ask: "時刻を比べている箇所で、比べる 2 つの時刻は同じ時計が書いたものか"
    hint: "期限、発行時刻とログアウト・失効の時刻、台帳の更新時刻。max_clock_skew と、時刻を使う enforced_at を見る。別の発行者・別のサーバーの時計なら、ずれたときに通すのか止めるのか"
    from: [B-R1 T1]
  - id: op-key-custody
    show_when: [always]
    prefer_when: [exchange]
    ask: "署名の鍵ごとに、誰が持ち、漏れたとき誰が何分で何をするかを言えるか"
    hint: "種別の key_rotation・signing_key_scope・jwks_cache_ttl を見る。新しく置いた発行者（入口・STS）の鍵と、証明書を出す側の鍵も数える。受け手が古い鍵を使い続ける時間はどれだけか"
    from: [B-R1 T5, B-R2 R2-18, C-R2 F25]
  - id: op-proof-holder
    show_when: [sender_constrained]
    ask: "「鍵の持ち主を確かめる」箇所で、確かめる側が見ている鍵は、そのトークンを実際に持つ者の鍵か"
    hint: "cnf の行の enforced_at と、種別の holder・sender_constraint を見る。箇所ごとに「トークンを持つ者」と「鍵を持つ者」を並べる。証明書・鍵を更新したとき、束縛したトークンはどうなるか"
    from: [C-R1 F02, C-R2 F02, C-R2 F24]

questions:
  # ---- 1. 定義：1.1 設計のチェックリスト
  - {id: dc-01, class: A, lint: [L5], why: "usage と volatility と寿命の比較は、台帳と目録の値の計算で決まる"}
  - {id: dc-02, class: A, lint: [L1a], proposed: [N1], interim: B, why: "探した記録の列があるかは欄の有無。登録名の側は L1a が見る。独自クレームの prior_art_search の必須は案"}
  - {id: dc-03, class: A, lint: [L1b], proposed: [L34], interim: B, why: "名前空間の宣言と所属は L1b が見る。予約名との照合は未実装の L34"}
  - {id: dc-04, class: A, lint: [], proposed: [N1], interim: B, why: "受け手ごとの consumer_access_path があるかは欄の有無。実際に参照できるかは実行テスト"}
  - {id: dc-05, class: C, priority: 1, unit: row, show_when: [approval], until_rule: [L24, N5], ask: "認可に使うオブジェクトの値の、内側の型と比べ方が決まっているか", hint: "authorization_details などオブジェクト型の行の type・value_normalization と、受け手のスキーマを見る。金額・ID は文字列か", why: "機械で決まるが、規則（L24・N5）がまだ無い。パイロットの Major（C-R2 F10）で、試行でも見つからなかったので、規則ができるまで人に戻す"}
  - {id: dc-06, class: A, lint: [], proposed: [L36], interim: B, why: "shape の値（space_delimited でないか）で決まる"}
  - {id: dc-07, class: A, lint: [L37, L7], proposed: [N6], interim: B, why: "absent_semantics と on_missing の有無と整合で決まる"}
  - {id: dc-08, class: A, lint: [], proposed: [N1], interim: B, why: "value_normalization の欄の有無。受け手が完全一致で比べるかは実行テスト"}
  - {id: dc-09, class: A, lint: [L3], rest: q-value-vocabulary, why: "変わりうる名前・identifier_properties・paired_id の値で決まる。L3 はクレームの名前と性質を見て、値（グループ・ロールの値が名前か）は見ない。値は q-value-vocabulary で人が見る"}
  - {id: dc-10, class: A, lint: [L31, L4], why: "provenance と書き手の欄の値で決まる。書ける人の範囲が妥当かは ap-1-7 で人が見る"}
  - {id: dc-11, class: A, lint: [R8, R1], why: "max_bytes・max_items・overflow_strategy の有無と値で決まる"}
  - {id: dc-12, class: A, lint: [L7, L4], why: "on_missing と required_claims、段階ごとの書き手の数で決まる"}
  - {id: dc-gate, class: A, lint: [R1], why: "必須の列が空の採用の行は R1 が error にする"}
  # ---- 1.2 追加前の 25 問
  - {id: pa-01, class: C, priority: 2, unit: row, show_when: [org_claims], ask: "このクレームを読んで、どの受け手が何を決めるかを言えるか", hint: "25 問の問 1 の回答と usage を見る。使い道の無い値、表示用の値での認可が無いか", why: "使い道が実在するか、usage と合うかは、回答の文を読んで判断する"}
  - {id: pa-02, class: A, lint: [L5], why: "dc-01 と同じ計算。対策の欄の有無まで L5 が見る。対策が足りるかは q-freshness-mitigation で人が見る"}
  - {id: pa-03, class: B, group: pa-answers, why: "回答が空欄・未定でないことは L72 が見る。回答が問いに答えているか（探した順と、表せない理由）は書き手が確かめる"}
  - {id: pa-04, class: A, lint: [L1b], proposed: [L34], interim: B, why: "dc-03 と同じ"}
  - {id: pa-05, class: B, group: pa-answers, why: "回答が空欄でないことは L72。確かめた記録になっているかは書き手が確かめる"}
  - {id: pa-06, class: B, group: pa-answers, why: "25 問の回答の文と、台帳の namespace・shape が合うか（書き手が見比べる）"}
  - {id: pa-07, class: A, lint: [], proposed: [L36], interim: B, why: "dc-06 と同じ"}
  - {id: pa-08, class: A, lint: [], proposed: [L24, N5], interim: B, why: "dc-05 と同じ。規則ができるまで、人には dc-05 として出す（承認つきの設計）"}
  - {id: pa-09, class: A, lint: [L37, L7], proposed: [N6], interim: B, why: "dc-07 と同じ"}
  - {id: pa-10, class: B, group: pa-answers, why: "回答が空欄でないことは L72。比べ方が書けているかは書き手が確かめる。欄の必須は dc-08 の案"}
  - {id: pa-11, class: A, lint: [L31], why: "書き手と configurable_by、照合の宣言（enforced_at）の値で決まる。書ける人の範囲が妥当かは ap-1-7"}
  - {id: pa-12, class: A, lint: [L3], rest: q-value-vocabulary, why: "dc-09 と同じ"}
  - {id: pa-13, class: A, lint: [R8], why: "dc-11 と同じ。受け手が欠落を検知できるかは、overflow_strategy の値（切り詰めは書けない）で決まる"}
