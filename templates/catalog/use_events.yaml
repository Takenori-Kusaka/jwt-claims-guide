  - id: U15
    name: クライアント・運用者が失効のエンドポイント（RFC 7009）や管理の操作でトークン・セッションを失効させる
    actor: RP（BFF・クライアント）・運用者
    standard_refs:
      - {kind: spec, id: "RFC 7009 §2.1", url: "https://www.rfc-editor.org/rfc/rfc7009#section-2.1"}
    phase: 運用
    tokens_used: [refresh_token, access_token]
    claims_read: []
    lifetime_impact: {issued: [], recomputed: [], revoked: [refresh_token, session_idp], note: "RT を失効させる。自己完結型の AT は、失効させても受け手がローカルで検証する限り exp まで通る（RFC 7009 §3。slide:p08-choosing-lifetime）"}
    seeds: [iana-token-type-hint/access_token, iana-token-type-hint/refresh_token, keycloak-settings/revocation-not-before, prior-catalogue/U08]
    guide: {status: partial, slides: [p08-choosing-lifetime, p08-decision-table], note: "RFC 7009 は寿命の理由としてだけ出る。失効のエンドポイントと、管理の操作（セッションの削除・Not before）の効き方はない"}
    idp:
      keycloak:
        occurs: "yes"
        hook_invoked: "no"
        hook_note: /protocol/openid-connect/revoke は AT と RT を受け、RT を失効させると同意も失効する（文書）。Revocation（Not before）は指定の時刻より前に出たセッションとトークンを無効にし、押し出しは Keycloak の OIDC アダプターだけに届く（文書）。管理画面の Sign out all active sessions は 26.2 からオフラインのセッションも消すが、発行済みの AT は失効しない（文書）
        source_refs: [*kc_oidc_layers, *kc_revocation]
      auth0:
        occurs: "yes"
        hook_invoked: "no"
        hook_note: /oauth/revoke で失効できるのは RT だけ（文書）。Refresh Token Revocation Deletes Grant を有効にすると、同じ利用者・アプリ・audience のトークンをまとめて失効させる（文書）
        source_refs: [*a0_revoke, *a0_session_revoke]
    verified_on: 2026-11-22
    review_by: 2027-02-20
    owner: "#2"

