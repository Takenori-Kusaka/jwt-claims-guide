# template_version: 0.3.0
# 利用イベントのカタログ（#2）
#
# 種になる一覧との関係と、カタログの範囲（Keycloak 26.8 と Auth0）は issue_events.yaml の冒頭と同じ。
#
# 列は issue_events.yaml と同じ。ただし次の点が違う
#   actor          トークンを使う・受ける者（API、BFF、入口など）
#   phase          stage の代わりに、slide:p06-stage-map の上の帯の「伝搬・検証・認可・運用」のどれか。利用イベントは、段階 ①〜⑥
#                  （クレームが生まれる場所）には当てはまらないため
#   tokens_used    使う・受けるトークンの種類（token_kinds.yaml の id）とセッションの層
#   claims_read    このイベントで読む・確かめるクレーム。IANA JWT Claims の名前は seeds.yaml の項目にひもづく
#   asked_from     マイナーの版で末尾に足した行に付ける。値は、その行を足した台帳の版（templates/registry/*.schema.json の
#                  template_version。tools/new_design.py が新しい設計書に書く版。版はこの 1 つの軸だけを使う）。下の _added に
#                  その版で載る行だけが持てる（tools/catalog_check.py の ASKED）。claim_lint の R2 は、台帳の今のマイナーの版が
#                  asked_from と同じ間だけ、回答が無いことを warn にし、次のマイナーの版から error にする（猶予はマイナーの版 1 つ）。
#                  回答を問わないのは、tools/claim_lint/frozen_designs.yaml に載る凍結した記録だけ（設計書の版のコメントでは外せない）
#   idp.<IdP>      occurs は、この利用に IdP が関わるか（イントロスペクション・リフレッシュなど）。hook_invoked は、この利用で IdP の
#                  フックが呼ばれるか（受け手だけで完結する利用は no）
# 件数：利用イベント 30 件。「ガイドの空白」0 件（#10 で 4 件を埋めた）、一部だけ扱う 2 件（U29・U30。#63 で足した）
# 版の歴史（#63）：台帳の版ごとに、その版で末尾に足した行。ここに載る行だけが asked_from を持てる（tools/catalog_check.py の ASKED）
_added:
  "0.3.0": [U29, U30]
_refs:
  kc_introspect_aud: &kc_introspect_aud {kind: spec, id: "Keycloak Server Administration Guide（26.8.2）「Token introspection audience validation」", url: "https://www.keycloak.org/docs/26.8.2/server_admin/index.html", verified_on: 2026-11-22}
  kc_oidc_layers: &kc_oidc_layers {kind: spec, id: "Keycloak Securing Applications（26.8.2）「OpenID Connect」Introspection endpoint・Token Revocation endpoint", url: "https://www.keycloak.org/securing-apps/oidc-layers", verified_on: 2026-11-22}
  kc_lightweight: &kc_lightweight {kind: spec, id: "Keycloak Server Administration Guide（26.8.2）「Using lightweight access token」", url: "https://www.keycloak.org/docs/26.8.2/server_admin/#_using_lightweight_access_token", verified_on: 2026-11-22}
  kc_rp_logout: &kc_rp_logout {kind: spec, id: "Keycloak Server Administration Guide（26.8.2）「RP-Initiated Logout」", url: "https://www.keycloak.org/docs/26.8.2/server_admin/index.html", verified_on: 2026-11-22}
  kc_logout: &kc_logout {kind: spec, id: "Keycloak Server Administration Guide（26.8.2）「Logout settings」", url: "https://www.keycloak.org/docs/26.8.2/server_admin/index.html", verified_on: 2026-11-22}
  kc_revocation: &kc_revocation {kind: spec, id: "Keycloak Server Administration Guide（26.8.2）「Revoking active sessions」", url: "https://www.keycloak.org/docs/26.8.2/server_admin/index.html", verified_on: 2026-11-22}
  kc_exchange: &kc_exchange {kind: spec, id: "Keycloak Securing Applications（26.8.2）「Token exchange」", url: "https://www.keycloak.org/securing-apps/token-exchange", verified_on: 2026-11-22}
  kc_dpop: &kc_dpop {kind: spec, id: "Keycloak Securing Applications（26.8.2）「DPoP」「Configuring Keycloak」", url: "https://www.keycloak.org/securing-apps/dpop", verified_on: 2026-11-22}
  a0_login: &a0_login {kind: spec, id: "Auth0 Docs「Login Trigger」About the Post Login Trigger", url: "https://auth0.com/docs/customize/actions/explore-triggers/signup-and-login-triggers/login-trigger", verified_on: 2026-11-22}
  a0_logout: &a0_logout {kind: spec, id: "Auth0 Docs「Log Users Out of Auth0」", url: "https://auth0.com/docs/authenticate/login/logout/log-users-out-of-auth0", verified_on: 2026-11-22}
  a0_bcl: &a0_bcl {kind: spec, id: "Auth0 Docs「Configure OIDC Back-Channel Logout」", url: "https://auth0.com/docs/authenticate/login/logout/back-channel-logout/configure-back-channel-logout", verified_on: 2026-11-22}
  a0_revoke: &a0_revoke {kind: spec, id: "Auth0 Authentication API「Revoke Refresh Token」", url: "https://auth0.com/docs/api/authentication/revoke-refresh-token/revoke-refresh-token", verified_on: 2026-11-22}
  a0_session_revoke: &a0_session_revoke {kind: spec, id: "Auth0 Management API「Revoke a session」", url: "https://auth0.com/docs/api/management/v2/sessions/revoke-session", verified_on: 2026-11-22}
  a0_obo: &a0_obo {kind: spec, id: "Auth0 Docs「On-Behalf-Of Token Exchange」", url: "https://auth0.com/docs/secure/call-apis-on-users-behalf/on-behalf-of-token-exchange", verified_on: 2026-11-22}
  a0_sender: &a0_sender {kind: spec, id: "Auth0 Docs「Configure Sender Constraining」", url: "https://auth0.com/docs/secure/sender-constraining/configure-sender-constraining", verified_on: 2026-11-22}
events:
  - id: U01
    name: API が Authorization ヘッダーの Bearer で AT を受けて検証する
    actor: リソースサーバー（API）
    standard_refs:
      - {kind: spec, id: "RFC 6750 §2.1", url: "https://www.rfc-editor.org/rfc/rfc6750#section-2.1"}
      - {kind: spec, id: "RFC 9068 §4", url: "https://www.rfc-editor.org/rfc/rfc9068#section-4"}
    phase: 検証
    tokens_used: [access_token]
    claims_read: [iss, aud, exp, iat, sub, scope]
    lifetime_impact: {issued: [], recomputed: [], revoked: [], note: "なし（読むだけ）。AT は exp まで受理される"}
    seeds: [iana-access-token-type/Bearer, prior-catalogue/U01]
    guide: {status: covered, slides: [p06-validation-split, p01-validation-order]}
    idp:
      keycloak: {occurs: "no", hook_invoked: "no", hook_note: "受け手での検証なので IdP のフックは動かない"}
      auth0: {occurs: "no", hook_invoked: "no", hook_note: "受け手での検証なので IdP のフックは動かない"}
    evidence: ["jwt-claims-casestudy@080b8da:A13", "jwt-claims-casestudy@080b8da:A14"]
    verified_on: 2026-11-22
    review_by: 2027-02-20
    owner: "#2"

  - id: U02
    name: API がテナントを決め、DB の文脈（SET LOCAL など）を設定して行を絞る（RLS・接続プール）
    actor: リソースサーバー（API）と DB
    standard_refs_none: 標準の仕様はない（DB の製品の機能。slide:p07-row-level-security）
    standard_refs: []
    phase: 認可
    tokens_used: [access_token]
    claims_read: [iss, sub]
    lifetime_impact: {issued: [], recomputed: [], revoked: [], note: "なし。DB の接続の寿命はトークンの寿命と別（接続プール。slide:p07-lifetime-mismatch）"}
    seeds: [prior-catalogue/U05]
    guide: {status: covered, slides: [p07-row-level-security, p07-connection-pool, p05-multitenancy]}
    idp:
      keycloak: {occurs: "no", hook_invoked: "no", hook_note: "受け手での利用"}
      auth0: {occurs: "no", hook_invoked: "no", hook_note: "受け手での利用"}
    evidence: ["jwt-claims-casestudy@080b8da:A5", "jwt-claims-casestudy@080b8da:A7"]
    verified_on: 2026-11-22
    review_by: 2027-02-20
    owner: "#2"

  - id: U03
    name: RP（BFF・クライアント）がログインの応答で ID トークンを検証し、読む
    actor: RP（BFF・クライアント）
    standard_refs:
      - {kind: spec, id: "OpenID Connect Core 1.0 §3.1.3.7", url: "https://openid.net/specs/openid-connect-core-1_0.html#IDTokenValidation"}
    phase: 検証
    tokens_used: [id_token]
    claims_read: [iss, aud, azp, exp, iat, nonce, auth_time, acr]
    lifetime_impact: {issued: [session_rp], recomputed: [], revoked: [], note: "BFF のセッションを作る。ID トークンの値はこの時点の写しで、セッションの間は古くなりうる"}
    seeds: [prior-catalogue/U10]
    guide: {status: covered, slides: [p01-id-token-vs-access-token, p08-token-types-lifetimes]}
    idp:
      keycloak: {occurs: "no", hook_invoked: "no", hook_note: "受け手での検証"}
      auth0: {occurs: "no", hook_invoked: "no", hook_note: "受け手での検証"}
    evidence: ["jwt-claims-casestudy@080b8da:A13"]
    verified_on: 2026-11-22
    review_by: 2027-02-20
    owner: "#2"

  - id: U04
    name: BFF・クライアントがリフレッシュトークンを提示して AT を取り直す
    actor: RP（BFF・クライアント）
    standard_refs:
      - {kind: spec, id: "RFC 6749 §6", url: "https://www.rfc-editor.org/rfc/rfc6749#section-6"}
    phase: 運用
    tokens_used: [refresh_token]
    claims_read: []
    lifetime_impact: {issued: [access_token], recomputed: [access_token], revoked: [], note: "I02 を起こす（寿命への影響は I02）"}
    seeds: [prior-catalogue/U08]
    guide: {status: covered, slides: [p08-rotation, p08-refresh-reevaluation]}
    idp:
      keycloak: {occurs: "yes", hook_invoked: "yes", hook_note: "提示を受けた IdP が I02 を起こす（I02 の hook_note）"}
      auth0: {occurs: "yes", hook_invoked: "yes", hook_note: "提示を受けた IdP が I02 を起こす（I02 の hook_note）"}
    evidence: ["jwt-claims-casestudy@080b8da:keycloak.refresh_reevaluation"]
    verified_on: 2026-11-22
    review_by: 2027-02-20
    owner: "#2"

  - id: U05
    name: 受け手がトークンイントロスペクションで有効性とクレームを問い合わせる
    actor: リソースサーバー（API）
    standard_refs:
      - {kind: spec, id: "RFC 7662 §2.1", url: "https://www.rfc-editor.org/rfc/rfc7662#section-2.1"}
      - {kind: spec, id: "RFC 7662 §4", url: "https://www.rfc-editor.org/rfc/rfc7662#section-4"}
    phase: 検証
    tokens_used: [access_token, refresh_token]
    claims_read: [scope, client_id, sub, aud, exp, token_introspection]
    lifetime_impact: {issued: [], recomputed: [], revoked: [], note: "ログアウト後の初回の問い合わせで active=false になった（ケーススタディ）。JWT のローカル検証より剥奪が早く届く。キャッシュは応答の exp を超えない（§4）"}
    seeds: [keycloak-settings/introspection-audience, prior-catalogue/U07]
    guide: {status: covered, slides: [p08-revocation-propagation, p01-self-contained-vs-reference]}
    idp:
      keycloak:
        occurs: "yes"
        hook_invoked: conditional
        hook_note: 応答に載るクレームはマッパーの Add to token introspection に従う（文書）。呼び出し元が AT の aud に無いと active=false（Allow token introspection without audience check で変えられる。文書）。confidential のクライアントだけが呼べる（文書）
        source_refs: [*kc_lightweight, *kc_introspect_aud, *kc_oidc_layers]
      auth0:
        occurs: unknown
        hook_invoked: unknown
        hook_note: Auth0 の文書に、アクセストークンのイントロスペクションのエンドポイントの記載がない（ないとは明言していない。V34）
    evidence: ["jwt-claims-casestudy@080b8da:keycloak.logout_introspection"]
    verified_on: 2026-11-22
    review_by: 2027-02-20
    owner: "#2"

  - id: U06
    name: RP が利用者のログアウトを IdP に送る（RP-Initiated Logout）
    actor: RP（BFF・クライアント）
    standard_refs:
      - {kind: spec, id: "OpenID Connect RP-Initiated Logout 1.0 §2", url: "https://openid.net/specs/openid-connect-rpinitiated-1_0.html#RPLogout"}
    phase: 運用
    tokens_used: [id_token, session_idp, session_rp]
    claims_read: [sid]
    lifetime_impact: {issued: [], recomputed: [], revoked: [session_idp, session_rp, refresh_token], note: "SSO セッションと、そのセッションの RT を失効させる。発行済みの AT（JWT）は exp まで残る。IdP が I09 を起こすことがある"}
    seeds: [oidc-logout/rp-initiated, prior-catalogue/U09]
    guide: {status: covered, slides: [p08-logout, p08-revocation-propagation], note: "RP-Initiated Logout の id_token_hint・post_logout_redirect_uri の登録（#10 で追加。2026-11-22 に本文とノートを目で読んだ）"}
    idp:
      keycloak:
        occurs: "yes"
        hook_invoked: "no"
        hook_note: ログアウトの要求で、トークンの発行はない。id_token_hint・client_id・post_logout_redirect_uri を受ける（文書）。SSO のログアウトの後はリフレッシュが失敗する。オフラインのトークンは残る（文書）
        source_refs: [*kc_rp_logout]
      auth0:
        occurs: "yes"
        hook_invoked: "no"
        hook_note: /oidc/logout は id_token_hint・logout_hint・client_id・post_logout_redirect_uri などを受ける（文書）。/oidc/logout で RT が失効するかは記載がない（Management API のセッションの失効は、結びつく RT も失効させる。文書）
        source_refs: [*a0_logout, *a0_session_revoke]
    evidence: ["jwt-claims-casestudy@080b8da:keycloak.logout_introspection"]
    verified_on: 2026-11-22
    review_by: 2027-02-20
    owner: "#2"

  - id: U07
    name: RP が Back-Channel Logout のログアウトトークンを受けて検証する
    actor: RP（BFF）
    standard_refs:
      - {kind: spec, id: "OpenID Connect Back-Channel Logout 1.0 §2.6", url: "https://openid.net/specs/openid-connect-backchannel-1_0.html#Validation"}
    phase: 検証
    tokens_used: [logout_token]
    claims_read: [iss, aud, iat, exp, jti, events, sid, sub]
    lifetime_impact: {issued: [], recomputed: [], revoked: [session_rp], note: "RP（BFF）のセッションを消す。AT は exp まで残る"}
    seeds: [oidc-logout/back-channel, prior-catalogue/U09]
    guide: {status: covered, slides: [p08-logout], note: "Logout Token の検証の手順と応答（200・400）（#10 で追加。2026-11-22 に本文とノートを目で読んだ）"}
    idp:
      keycloak: {occurs: "no", hook_invoked: "no", hook_note: "受け手での検証"}
      auth0: {occurs: "no", hook_invoked: "no", hook_note: "受け手での検証"}
    verified_on: 2026-11-22
    review_by: 2027-02-20
    owner: "#2"

  - id: U08
    name: クライアントが AT で UserInfo を呼ぶ
    actor: RP（BFF・クライアント）
    standard_refs:
      - {kind: spec, id: "OpenID Connect Core 1.0 §5.3", url: "https://openid.net/specs/openid-connect-core-1_0.html#UserInfo"}
    phase: 伝搬
    tokens_used: [access_token]
    claims_read: [sub, name, email, email_verified]
    lifetime_impact: {issued: [], recomputed: [], revoked: [], note: "なし。応答はその時点の値（トークンに載せるより新しい）"}
    seeds: [prior-catalogue/U11, prior-catalogue/I23]
    guide: {status: covered, slides: [p04-carry-or-query, p09-do-not-carry]}
    idp:
      keycloak:
        occurs: "yes"
        hook_invoked: conditional
        hook_note: 応答に載るクレームはマッパーの Add to userinfo の設定に従う。UserInfo は既定で軽量のアクセストークンを拒む（文書）
        source_refs: [*kc_lightweight]
      auth0:
        occurs: "yes"
        hook_invoked: unknown
        hook_note: post-login で足したクレームが UserInfo の応答に出るかを確かめていない（V34）
    verified_on: 2026-11-22
    review_by: 2027-02-20
    owner: "#2"

  - id: U09
    name: 受け手が未知の kid を見て JWKS を取り直す（署名鍵のローテーションと JWKS のキャッシュ）
    actor: リソースサーバー（API）・RP
    standard_refs:
      - {kind: spec, id: "OpenID Connect Core 1.0 §10.1.1", url: "https://openid.net/specs/openid-connect-core-1_0.html#RotateSigKeys"}
    phase: 運用
    tokens_used: [access_token, id_token]
    claims_read: [iss]
    lifetime_impact: {issued: [], recomputed: [], revoked: [], note: "なし。古い鍵を JWKS から消すと、その鍵で署名された AT は exp の前でも検証できなくなる"}
    seeds: [prior-catalogue/I29]
    guide: {status: covered, slides: [p01-key-rotation-jwks], note: "鍵のローテーションの手順、JWKS のキャッシュ、知らない kid での取り直し（#10 で追加。2026-11-22 に本文とノートを目で読んだ）"}
    idp:
      keycloak: {occurs: "no", hook_invoked: "no", hook_note: "受け手での処理"}
      auth0: {occurs: "no", hook_invoked: "no", hook_note: "受け手での処理"}
    evidence: ["jwt-claims-casestudy@080b8da:A9"]
    verified_on: 2026-11-22
    review_by: 2027-02-20
    owner: "#2"

  - id: U10
    name: 受け手が AT をトークン交換の subject_token として提示する
    actor: リソースサーバー（API）・エージェント
    standard_refs:
      - {kind: spec, id: "RFC 8693 §2.1", url: "https://www.rfc-editor.org/rfc/rfc8693#section-2.1"}
    phase: 伝搬
    tokens_used: [access_token]
    claims_read: [aud, scope, may_act]
    lifetime_impact: {issued: [access_token], recomputed: [], revoked: [], note: "I06 を起こす（寿命への影響は I06）"}
    seeds: [iana-oauth-uri/token-type:access_token, prior-catalogue/U13]
    guide: {status: covered, slides: [p10-token-exchange-not-narrowing]}
    idp:
      keycloak: {occurs: conditional, hook_invoked: "yes", hook_note: "I06 を参照（要求元クライアントのスコープのマッパーが適用される。文書）", source_refs: [*kc_exchange]}
      auth0: {occurs: conditional, hook_invoked: "yes", hook_note: "I06 を参照（On-Behalf-Of の交換は post-login を起こす。文書）", source_refs: [*a0_obo]}
    evidence: ["jwt-claims-casestudy@080b8da:C.keycloak_exchange"]
    verified_on: 2026-11-22
    review_by: 2027-02-20
    owner: "#2"

  - id: U11
    name: 入口が外部のトークンを検証し、ヘッダーに転記して内側へ渡す
    actor: 入口（ゲートウェイ）
    standard_refs:
      - {kind: guidance, id: "NIST SP 800-228 §2.7"}
    phase: 伝搬
    tokens_used: [access_token, internal_token]
    claims_read: [iss, aud, exp, sub]
    lifetime_impact: {issued: [internal_token], recomputed: [], revoked: [], note: "I21 を起こすことがある。利用者が送った同名ヘッダーを消す（slide:p06-header-forwarding）"}
    seeds: [prior-catalogue/U02]
    guide: {status: covered, slides: [p06-edge-exchange, p06-header-forwarding]}
    idp:
      keycloak: {occurs: "no", hook_invoked: "no", hook_note: "入口での処理"}
      auth0: {occurs: "no", hook_invoked: "no", hook_note: "入口での処理"}
    verified_on: 2026-11-22
    review_by: 2027-02-20
    owner: "#2"

  - id: U12
    name: サービス間で文脈を伝搬する（Txn-Token・mTLS・SPIFFE）
    actor: 内部のサービス
    standard_refs:
      - {kind: spec, id: "draft-ietf-oauth-transaction-tokens-11 §9.1", url: "https://www.ietf.org/archive/id/draft-ietf-oauth-transaction-tokens-11.txt"}
    phase: 伝搬
    tokens_used: [txn_token, internal_token]
    claims_read: [txn, sub, aud]
    lifetime_impact: {issued: [], recomputed: [], revoked: [], note: "なし。Txn-Token は改変せずに転送する（slide:p06-flow-browser-to-db）"}
    seeds: [slide-stage-map/stage4-service, prior-catalogue/U03]
    guide: {status: covered, slides: [p06-transaction-tokens, p06-narrow-downstream, p06-validation-split]}
    idp:
      keycloak: {occurs: "no", hook_invoked: "no", hook_note: "サービス間の処理"}
      auth0: {occurs: "no", hook_invoked: "no", hook_note: "サービス間の処理"}
    verified_on: 2026-11-22
    review_by: 2027-02-20
    owner: "#2"

  - id: U13
    name: 非同期の処理（キュー・イベント・ワークフロー）で主体を引き継ぐ
    actor: 発行者・コンシューマーのサービス
    standard_refs_none: 標準の仕様はない（CloudEvents の Auth Context 拡張などの製品・団体の文書。slide:p08-async-processing）
    standard_refs: []
    phase: 伝搬
