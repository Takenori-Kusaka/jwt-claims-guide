# template_version: 0.1.0
# 発行イベントのカタログ（#2）
#
# 種になる一覧（seeds.yaml・sources.md）の全項目が、このカタログ（issue_events・use_events・token_kinds・subject_state_matrix.md）の
# どれかの行にひもづくか、「対象外」とされている（差集合 0 件。tools/catalog_check.py が確かめる）。一覧の外にある発行の場面は、
# このカタログでは見つからない。設計書では「この列挙の外に契機はないか」の問い（#17 の R9）で探す。
# カタログの IdP は Keycloak 26.8 と Auth0 の 2 つ（#2 の範囲）。Entra・Okta は契機の一覧を文書で確かめていない（sources.md の「文書で未確認」）。
# ほかの IdP は #21。カタログには候補と事実だけを載せ、採否の理由の模範文は載せない（#4 の方針、unverified.md の V17）。
#
# 列（v0 の列を引き継ぎ、IdP ごとの列を idp の下に移した。変更点は templates/CHANGELOG.md）
#   id              I01〜。v0 の I01〜I09 は同じ ID のまま
#   name            イベントの名前
#   issuer          発行者の種類：idp / gateway / tts / client / workload-platform / rp / resource-server / external-as
#   standard_refs   標準の根拠（版付き。#13 の根拠の書式）。標準のないものは standard_refs_none に理由
#   stage           段階（slide:p06-stage-map の ①〜⑥。クレームが生まれる場所）
#   claims_produced このイベントで生まれる・書き換わるクレーム。IANA JWT Claims の名前は、そのまま seeds.yaml の項目にひもづく
#   tokens_issued   出るトークンの種類（token_kinds.yaml の id）と、作られるセッションの層（session_idp・session_rp）
#   lifetime_impact このイベントで、どのトークン・セッションが issued（発行）・recomputed（中身を計算し直して出し直す）・revoked（失効）
#                   するか。IdP による違いは idp の lifetime_note
#   seeds           種になる一覧の項目（<一覧の id>/<項目の id>）
#   guide           ガイドでの扱い。covered（扱っている）／partial（一部だけ。note に扱っていない点）／gap（「ガイドの空白」。
#                   marker と、どう確かめたか checked）／out-of-scope（「ガイドの範囲外」。ガイドの対象の外なので、スライドを求めない。
#                   marker・assumption・breaks_when）。キーワード検索だけで gap にせず、ヒットしたスライドの本文とノートを目で読んだ
#   idp.<IdP>       keycloak（26.8）と auth0 のそれぞれについて
#     occurs          この IdP がこのイベントを起こすか：yes / no / conditional（設定・プランによる）。issuer が idp でない行では no
#                     （IdP は発行者でない）。確かめていなければ unknown
#     hook_name       独自クレームを足す仕組みの名前（Keycloak はプロトコルマッパー、Auth0 は Actions のトリガー）
#     hook_invoked    その仕組みがこの発行で呼ばれるか：yes / no / conditional。文書か実測で確かめたときだけ yes・no にする。
#                     推論しかなければ unknown（hook_note に理由）。hook_note に「推論」とある yes は catalog_check が error にする。
#                     no の発行で独自クレームを運ぶ設計は #17 の R3b で落ちる。一覧表の「フック・式で可」をここに写さない（#13 の 6.）
#     hook_note       条件と、確かめた方法（文書の記述か、推論か）
#     lite_inherit    true なら、Lite の設計書でこの IdP の既定の回答（対象外）を引き継げる（#4 の改訂、gate1.md の 10.：クライアントの
#                     スイッチ 1 つで止め、指摘が出ていないイベント。Keycloak の I03・I04・I05・I07）。無ければ引き継げない（#17 の R2）
#     stop_setting    このイベントを 1 つの設定で止められるとき、その設定（setting）・効く範囲（scope：client / realm / tenant / api /
#                     server）・既定（default）。#4 の「既定の回答を引き継げるのは、クライアントの設定のスイッチ 1 つで止めたイベント
#                     だけ」の判定に使う。null は 1 つの設定では止まらない
#     lifetime_note   この IdP での寿命への影響の違い
#     source_refs     IdP 側の出どころ（製品の文書は verified_on 必須）
#     evidence        ケーススタディの実測（根拠ではなく検証の記録。#13）
#   verified_on / review_by / owner   出どころを確かめた日、見直しの期限（90 日後。筆者の提案、tracking #17）、持ち主
#
# 文書に書かれていない既定値を、Keycloak 26.8.2 のソース（GitHub のタグ）の要約で補った箇所は「ソースの要約」と書いた。行は直接確かめて
# いない（research/template-design/unverified.md の V31）。
# 件数：発行イベント 34 件。「ガイドの空白」0 件（#10 で 10 件を埋めた）、一部だけ扱う 1 件（I20）、ガイドの範囲外 1 件（I34。#17 で足した OID4VCI）
# 対応表（templates/trace/）の要件への逆参照。catalog の部分を満たした要件だけを書く。要件の状態は、ほかの成果物
# （registry:claims#recompute_trigger は #3）が揃うまで「未着手」のまま
_trace:
  lifetime_impact: "req:p06-issuance-hook.R7 req:p08-refresh-reevaluation.R1（I02 の lifetime_impact と idp ごとの hook_note・lifetime_note）"
