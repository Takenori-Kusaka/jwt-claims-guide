events:
  - id: I01
    name: 認可コード＋PKCE での対話ログイン（AT・ID トークン・RT・認可コードの発行。PAR を含む）
    issuer: idp
    standard_refs:
      - {kind: spec, id: "RFC 6749 §4.1", url: "https://www.rfc-editor.org/rfc/rfc6749#section-4.1"}
      - {kind: spec, id: "RFC 7636 §4", url: "https://www.rfc-editor.org/rfc/rfc7636#section-4"}
      - {kind: spec, id: "RFC 9068 §2", url: "https://www.rfc-editor.org/rfc/rfc9068#section-2"}
      - {kind: spec, id: "RFC 9126 §2", url: "https://www.rfc-editor.org/rfc/rfc9126#section-2"}
      - {kind: spec, id: "OpenID Connect Core 1.0 §3.1.3.3", url: "https://openid.net/specs/openid-connect-core-1_0.html#TokenResponse"}
      - {kind: spec, id: "OpenID Connect Core 1.0 §5.1", url: "https://openid.net/specs/openid-connect-core-1_0.html#StandardClaims"}
    stage: "①②"
    claims_produced: [iss, sub, aud, exp, nbf, iat, jti, azp, nonce, auth_time, at_hash, c_hash, acr, amr, sid, scope, client_id, roles, groups, entitlements,
                      name, given_name, family_name, middle_name, nickname, preferred_username, profile, picture, website, email, email_verified,
                      gender, birthdate, zoneinfo, locale, phone_number, phone_number_verified, address, updated_at]
    tokens_issued: [access_token, id_token, refresh_token, authorization_code, session_idp, session_rp]
    lifetime_impact:
      issued: [access_token, id_token, refresh_token, authorization_code, session_idp, session_rp]
      recomputed: []
      revoked: []
      note: 新しいセッションとトークンを作る。② のフックの値はこの時点の利用者の属性・ロールで決まり、手元のトークンには exp まで残る（slide:p04-token-is-snapshot）
    seeds: [keycloak-grant-types/AuthorizationCodeGrantType, rfc6749-grant/authorization_code, iana-response-type/code, iana-oauth-uri/request_uri, auth0-protocol/oidc-basic-profile,
            auth0-trigger/post-login, auth0-grant/authorization_code, keycloak-settings/standard-flow, keycloak-settings/pkce-method,
            slide-stage-map/stage1-authentication, slide-stage-map/stage2-issuance-hook, prior-catalogue/I01, prior-catalogue/I23]
    guide: {status: covered, slides: [p06-stage-map, p06-issuance-hook, p06-flow-browser-to-db]}
    idp:
      keycloak:
        occurs: "yes"
        hook_name: プロトコルマッパー（クライアントとクライアントスコープ）
        hook_invoked: "yes"
        hook_note: OIDC では Default client scopes のマッパーは常に適用される（文書）。2026-11-22 に 26.8.0 で発行した AT に、マッパーで足した名前空間オブジェクトが載った（research/template-design/gate1.md の見本トークン）
        stop_setting: {setting: "Capability config > Standard Flow", scope: client, default: "文書に記載なし。管理画面の新規作成では ON（ソースの要約。V31）"}
        lifetime_note: AT の既定の寿命は文書に記載なし（ソースの要約では 300 秒。V31）。slide:p08-token-types-lifetimes は 5 分としている
        source_refs: [*kc_capability, *kc_scopes]
        evidence: ["jwt-claims-casestudy@080b8da:A1"]
      auth0:
        occurs: "yes"
        hook_name: post-login（Actions）
        hook_invoked: "yes"
        hook_note: event.transaction.protocol の oidc-basic-profile。post-login はトークンの発行の前に同期で動く（文書）
        stop_setting: {setting: "Application > Advanced Settings > Grant Types > Authorization Code", scope: client, default: "新しいアプリのすべての種類で有効（文書）"}
        source_refs: [*a0_login, *a0_event, *a0_grants]
    verified_on: 2026-11-22
    review_by: 2027-02-20
    owner: "#2"

  - id: I02
    name: リフレッシュトークンでの再発行（ローテーションを含む）
    issuer: idp
    standard_refs:
      - {kind: spec, id: "RFC 6749 §6", url: "https://www.rfc-editor.org/rfc/rfc6749#section-6"}
      - {kind: spec, id: "RFC 9700 §4.14.2", url: "https://www.rfc-editor.org/rfc/rfc9700#section-4.14.2"}
      - {kind: spec, id: "OpenID Connect Core 1.0 §12.2", url: "https://openid.net/specs/openid-connect-core-1_0.html#RefreshTokenResponse"}
    stage: "②"
    claims_produced: [exp, iat, jti, roles, groups, scope]
    tokens_issued: [access_token, id_token, refresh_token]
    lifetime_impact:
      issued: [access_token, id_token]
      recomputed: [access_token, id_token]
      revoked: [refresh_token]
      note: AT を出し直す。② のフックが再実行される IdP では値が計算し直される（slide:p08-refresh-reevaluation）。ローテーションする設定では古い RT が無効になり新しい RT が出る（revoked の refresh_token はその場合）
    seeds: [keycloak-grant-types/RefreshTokenGrantType, rfc6749-grant/refresh_token, auth0-protocol/oauth2-refresh-token, auth0-grant/refresh_token, prior-catalogue/I05]
    guide: {status: covered, slides: [p08-refresh-reevaluation, p08-rotation]}
    idp:
      keycloak:
        occurs: "yes"
        hook_name: プロトコルマッパー
        hook_invoked: "yes"
        hook_note: ケーススタディの実測（26.8.0）で、リフレッシュ後の AT に変更後の属性とロールが出た。文書には記述がない（ソースの要約では、クライアントのセッションから文脈を作り直してマッパーを再実行する。V31）
        stop_setting: null
        lifetime_note: Revoke Refresh Token の既定は文書に記載なし（slide:p08-rotation は無効とし、ソースの要約も false。V31）。有効にしたレルムでは RT が 1 回限りになる。SSO セッションの idle の期限が延びる
        source_refs: [*kc_scopes]
        evidence: ["jwt-claims-casestudy@080b8da:keycloak.refresh_reevaluation"]
      auth0:
        occurs: "yes"
        hook_name: post-login（Actions）
        hook_invoked: "yes"
        hook_note: post-login は RT の交換のときにも動く（文書）。api.redirect は使えない（文書）。リフレッシュで setCustomClaim が効くことの明文はない（V34）
        stop_setting: {setting: "Application > Advanced Settings > Grant Types > Refresh Token", scope: client, default: "新しいアプリのすべての種類で有効（文書）"}
        lifetime_note: ローテーションは Allow Refresh Token Rotation（SPA は既定でローテーション。ほかの種類の既定は文書に記載なし）。再利用を検知すると RT の系列全体を無効にする。Idle の既定は 30 日（文書）
        source_refs: [*a0_login, *a0_api, *a0_grants, *a0_rt_rotation, *a0_rt_expiration]
    verified_on: 2026-11-22
    review_by: 2027-02-20
    owner: "#2"

  - id: I03
    name: 軽量アクセストークン（Keycloak の lightweight access token）での発行
    issuer: idp
    standard_refs:
      - {kind: spec, id: "RFC 9068 §2.2", url: "https://www.rfc-editor.org/rfc/rfc9068#section-2.2"}
    stage: "②"
    claims_produced: [exp, iat, jti, iss, azp, sid, scope, cnf]
    tokens_issued: [access_token]
    lifetime_impact:
      issued: [access_token]
      recomputed: []
      revoked: []
      note: I01・I02 と同じ契機で AT を出すが、マッパーで足したクレームは既定では載らない。受け手は必要なクレームをイントロスペクション（U05）で取ることになり、鮮度の性質が変わる
    seeds: [keycloak-settings/lightweight-access-token]
    guide: {status: covered, slides: [p03-keycloak-aud-lightweight]}
    idp:
      keycloak:
        occurs: conditional
        hook_name: プロトコルマッパー
        hook_invoked: conditional
        hook_note: マッパーの設定 Add to lightweight access token（既定 OFF）を ON にしたクレームだけが載る。exp・iat・jti・iss・typ・azp・sid・scope・cnf は外せない（文書）
