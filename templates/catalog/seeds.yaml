# template_version: 0.1.0
# 種になる一覧（#2）。カタログの行（issue_events・use_events・token_kinds）と行列（subject_state_matrix.md）は、
# ここの項目に `<一覧の id>/<項目の id>` でひもづける（行の seeds、IANA JWT Claims は claims_produced・claims_read のクレーム名）。
# どの行にもひもづかない項目は out_of_scope（assumption：起きない前提、breaks_when：崩れる条件）を持つ。
# 差集合と件数は tools/catalog_check.py が計算し、sources.md の冒頭の件数と表の件数と照合する。expected は、出どころの一覧の
# 項目の数（確かめた日と数え方つき）。手元の items の数と合わなければ失敗する（写し漏れ・消しすぎを防ぐ）。
# 人が読む説明・URL・見直しの期限は sources.md にある。項目の値は事実の列挙で、各社・各団体の文書の文章は写していない。
seed_lists:
  - id: rfc6749-grant
    name: "RFC 6749 の grant type（§4.1〜§4.4・§6）"
    kind: spec
    version: "RFC 6749"
    url: "https://www.rfc-editor.org/rfc/rfc6749#section-4"
    verified_on: 2026-11-22
    review_by: 2027-02-20
    owner: "#2"
    expected: {count: 5, source: "RFC 6749 の §4.1〜§4.4 と §6 の grant type", verified_on: 2026-11-22}
    items:
      - {id: "authorization_code", value: "authorization_code", note: "RFC 6749 §4.1"}
      - {id: "implicit", value: "implicit（response_type=token）", note: "RFC 6749 §4.2"}
      - {id: "password", value: "password", note: "RFC 6749 §4.3"}
      - {id: "client_credentials", value: "client_credentials", note: "RFC 6749 §4.4"}
      - {id: "refresh_token", value: "refresh_token", note: "RFC 6749 §6"}
  - id: iana-oauth-uri
    name: "IANA「OAuth URI」の登録簿（grant type・token type・client assertion type ほか）"
    kind: spec
    registry_updated: "2026-11-10"
    url: "https://www.iana.org/assignments/oauth-parameters/oauth-parameters.xhtml#uri"
    verified_on: 2026-11-22
    review_by: 2027-02-20
    owner: "#2"
    expected: {count: 15, source: "2026-11-22 に取得した IANA の oauth-parameters.xml の uri の登録簿のレコード数", verified_on: 2026-11-22}
    items:
      - {id: "grant-type:jwt-bearer", value: "urn:ietf:params:oauth:grant-type:jwt-bearer", note: "RFC 7523、RFC 10070"}
      - {id: "grant-type:saml2-bearer", value: "urn:ietf:params:oauth:grant-type:saml2-bearer", note: "RFC 7522、RFC 10070", out_of_scope: {assumption: "SAML 2.0 のアサーションを OAuth の認可グラントに使わない。外部の SAML の IdP はブローカー（I17）でつなぐ", breaks_when: "SAML のアサーションを持つ既存のシステムが、トークンエンドポイントで直接 AT を得る必要があるとき"}}
      - {id: "client-assertion-type:jwt-bearer", value: "urn:ietf:params:oauth:client-assertion-type:jwt-bearer", note: "RFC 7523、RFC 10070"}
      - {id: "client-assertion-type:saml2-bearer", value: "urn:ietf:params:oauth:client-assertion-type:saml2-bearer", note: "RFC 7522、RFC 10070", out_of_scope: {assumption: "クライアントの認証に SAML のアサーションを使わない（private_key_jwt か mTLS を使う）", breaks_when: "SAML のアサーションでしかクライアントを認証できない連携先をつなぐとき"}}
      - {id: "token-type:jwt", value: "urn:ietf:params:oauth:token-type:jwt", note: "RFC 7519"}
      - {id: "grant-type:device_code", value: "urn:ietf:params:oauth:grant-type:device_code", note: "RFC 8628"}
      - {id: "grant-type:token-exchange", value: "urn:ietf:params:oauth:grant-type:token-exchange", note: "RFC 8693"}
      - {id: "token-type:access_token", value: "urn:ietf:params:oauth:token-type:access_token", note: "RFC 8693"}
      - {id: "token-type:refresh_token", value: "urn:ietf:params:oauth:token-type:refresh_token", note: "RFC 8693"}
      - {id: "token-type:id_token", value: "urn:ietf:params:oauth:token-type:id_token", note: "RFC 8693"}
      - {id: "token-type:saml1", value: "urn:ietf:params:oauth:token-type:saml1", note: "RFC 8693", out_of_scope: {assumption: "SAML 1.1 のアサーションを交換の対象にしない", breaks_when: "SAML 1.1 を使う旧いシステムのトークンを交換で受け入れるとき"}}
      - {id: "token-type:saml2", value: "urn:ietf:params:oauth:token-type:saml2", note: "RFC 8693", out_of_scope: {assumption: "SAML 2.0 のアサーションを交換の対象にしない", breaks_when: "SAML 2.0 のアサーションを交換の subject_token として受け入れるとき"}}
      - {id: "request_uri", value: "urn:ietf:params:oauth:request_uri", note: "RFC 9126（PAR）"}
      - {id: "jwk-thumbprint", value: "urn:ietf:params:oauth:jwk-thumbprint", note: "RFC 9278", out_of_scope: {assumption: "JWK の thumbprint を URI の形でクレームの値に使わない（DPoP の束縛は cnf.jkt に base64url で書く。RFC 9449 §6.1）", breaks_when: "鍵の thumbprint の URI を sub などの識別子に使う方式（自己発行の ID など）を受け入れるとき"}}
      - {id: "ckt", value: "urn:ietf:params:oauth:ckt", note: "RFC 9679", out_of_scope: {assumption: "COSE の鍵を扱わない（JOSE の JWT だけを扱う）", breaks_when: "CWT・COSE の鍵を使う機器のトークンを扱うとき"}}
