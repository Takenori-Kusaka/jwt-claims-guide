    items:
      - {id: "oidc-basic-profile"}
      - {id: "oidc-ciba"}
      - {id: "oidc-ciba-web-link"}
      - {id: "oidc-implicit-profile"}
      - {id: "oauth2-device-code"}
      - {id: "oauth2-resource-owner", note: "文書に値の説明はない。RO 系の grant（password・password-realm）の発行として I04 にひもづけた（推論。unverified.md の V35）"}
      - {id: "oauth2-resource-owner-jwt-bearer", note: "文書に値の説明はない", out_of_scope: {assumption: "Auth0 の旧来の grant（legacy の ro/jwt-bearer）を使わない。文書の Application Grant Types は legacy として扱っている", breaks_when: "旧来の Auth0 の SDK・grant を使うアプリを引き継ぐとき"}}
      - {id: "oauth2-password"}
      - {id: "oauth2-webauthn", note: "文書に値の説明はない", out_of_scope: {assumption: "post-login の中で、event.transaction.protocol がこの値のときはログインを拒む（どのフローかを確かめるまで許さない。V35）", breaks_when: "post-login のログにこの値が出たとき。そのときはフローを確かめて行を足す"}}
      - {id: "oauth2-access-token", note: "文書に値の説明はない", out_of_scope: {assumption: "post-login の中で、event.transaction.protocol がこの値のときはログインを拒む（legacy の access_token grant と推測するが、確かめるまで許さない。V35）", breaks_when: "post-login のログにこの値が出たとき。そのときはフローを確かめて行を足す"}}
      - {id: "oauth2-refresh-token"}
      - {id: "oauth2-token-exchange"}
      - {id: "oidc-hybrid-profile"}
      - {id: "samlp", out_of_scope: {assumption: "SAML・WS-Federation の応答は JWT のクレーム設計の対象にしない（属性の写し方は slide:p02-saml-attributes）", breaks_when: "Auth0 を SAML の IdP として使い、アプリに SAML の応答を返すとき"}}
      - {id: "wsfed", out_of_scope: {assumption: "WS-Federation を使わない", breaks_when: "WS-Federation の RP（旧い Microsoft の製品など）をつなぐとき"}}
      - {id: "wstrust-usernamemixed", out_of_scope: {assumption: "WS-Trust を使わない", breaks_when: "WS-Trust でしか認証できない旧いクライアントをつなぐとき"}}
