      - {id: "id_token-token", value: "id_token token"}
      - {id: "none", value: "none", out_of_scope: {assumption: "トークンも認可コードも返さない要求は、発行イベントにならない（OAuth 2.0 Multiple Response Type Encoding Practices の none）", breaks_when: "response_type=none で利用者の同意だけを記録する使い方を、発行の前提に組み込むとき"}}
