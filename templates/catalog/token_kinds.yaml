# template_version: 0.1.0
# トークンの種類のカタログ（#2）
#
# 設計書の「トークン目録」（#4）で、種類ごとに採否を答える行の元になる。台帳のトークン目録（templates/registry/token_types.schema.json）
# の kind は、すべてここの id にある（tools/catalog_check.py が確かめる）。
#
# 種にした一覧（seeds.yaml）：slide103-kinds（スライドの 6 種類）、iana-oauth-uri の token-type（IANA の OAuth URI）、guide-token-kinds
# （ガイドで扱うもの）。ほかに、カタログの発行イベントが出す種類（SET・状態リスト・JWT 形式のイントロスペクションの応答）を足した。
#
# 列
#   id / name        種類の ID と名前。id は台帳の kind と同じ綴り
#   format           jwt / opaque / jwt-or-opaque / not-a-token（セッションのように、トークンではないが寿命を決める対象）
#   typ              標準の typ（JOSE ヘッダー）。value が null なら、標準に typ の値の定めがない。basis に根拠（版付き）と規範の強さ
#   lifetime_hint    標準・指針の寿命の手がかり（slide:p08-token-types-lifetimes・slide:p08-choosing-lifetime）。数値の規範がないものはそう書く
#   refs             根拠（#13 の書式）
#   seeds            種になる一覧の項目（seeds.yaml）
#   issued_by        このカタログでこの種類を出す発行イベント
#   guide            ガイドでの扱い（covered / partial / gap と、スライド ID）
#   verified_on / review_by / owner
#
# 件数：トークンの種類 17 件
kinds:
  - id: access_token
    name: アクセストークン
    format: jwt-or-opaque
    typ: {value: at+jwt, basis: "RFC 9068 §2.1（JWT 形式のアクセストークンは MUST）。不透明な AT には typ がない"}
    lifetime_hint: "短命。1 時間以内とすべき（NIST IR 8587 §5.3.1.1、SHOULD。slide:p08-choosing-lifetime）。RFC に数値の規範はない"
    refs:
      - {kind: spec, id: "RFC 9068 §2.1", url: "https://www.rfc-editor.org/rfc/rfc9068#section-2.1"}
      - {kind: guidance, id: "NIST IR 8587 §5.3.1.1"}
      - {kind: guide-slide, id: p08-token-types-lifetimes}
    seeds: [slide103-kinds/access-token, iana-oauth-uri/token-type:access_token]
    issued_by: [I01, I02, I03, I04, I05, I06, I07, I10, I11, I12, I13, I14, I15, I16, I17, I18, I19, I24, I25, I26, I29]
    guide: {status: covered, slides: [p08-token-types-lifetimes, p01-id-token-vs-access-token, p01-self-contained-vs-reference]}
    verified_on: 2026-11-22
    review_by: 2027-02-20
    owner: "#2"

  - id: id_token
    name: ID トークン
    format: jwt
    typ: {value: null, basis: "OpenID Connect Core 1.0 は ID トークンの typ の値を定めていない（2026-11-22 に本文を確かめた）。受け手は aud・iss・nonce で取り違えを防ぐ"}
    lifetime_hint: "短命。セッションの長さと混同しない（NIST SP 800-63C-4。slide:p08-token-types-lifetimes）。1 時間以内とすべき（NIST IR 8587 §5.3.1.1）"
    refs:
      - {kind: spec, id: "OpenID Connect Core 1.0 §2", url: "https://openid.net/specs/openid-connect-core-1_0.html#IDToken"}
      - {kind: guidance, id: "NIST IR 8587 §5.3.1.1"}
      - {kind: guide-slide, id: p08-token-types-lifetimes}
    seeds: [slide103-kinds/id-token, iana-oauth-uri/token-type:id_token]
    issued_by: [I01, I02, I04, I07, I10, I11, I12, I13, I17, I18, I24, I25, I26]
    guide: {status: covered, slides: [p01-id-token-vs-access-token, p08-token-types-lifetimes]}
    verified_on: 2026-11-22
    review_by: 2027-02-20
    owner: "#2"

  - id: refresh_token
    name: リフレッシュトークン
    format: jwt-or-opaque
    typ: {value: null, basis: "RFC 6749 §1.5 は形式を定めない（認可サーバーだけが読む）"}
    lifetime_hint: "対話用は再認証の期間を超えない（NIST IR 8587。slide:p08-token-types-lifetimes）。公開クライアントは送信者制約かローテーション（RFC 9700 §2.2.2、MUST）"
    refs:
      - {kind: spec, id: "RFC 6749 §1.5", url: "https://www.rfc-editor.org/rfc/rfc6749#section-1.5"}
      - {kind: spec, id: "RFC 9700 §2.2.2", url: "https://www.rfc-editor.org/rfc/rfc9700#section-2.2.2"}
      - {kind: guide-slide, id: p08-rotation}
    seeds: [slide103-kinds/refresh-token, iana-oauth-uri/token-type:refresh_token]
    issued_by: [I01, I02, I04, I06, I07, I08, I13, I17, I24, I25, I26, I29]
    guide: {status: covered, slides: [p08-token-types-lifetimes, p08-rotation, p08-refresh-reevaluation]}
    verified_on: 2026-11-22
    review_by: 2027-02-20
    owner: "#2"

  - id: session
    name: セッション（IdP のセッション session_idp と、RP・BFF のセッション session_rp の 2 層）
    format: not-a-token
    typ: {value: null, basis: "トークンではない（Cookie などで持つ）。typ の定めはない"}
    lifetime_hint: "再認証までの期間。AAL2 は 24 時間・無操作 1 時間（NIST SP 800-63B-4 §2.2.3。slide:p08-token-types-lifetimes）"
    refs:
      - {kind: guidance, id: "NIST SP 800-63B-4 §2.2.3"}
      - {kind: guide-slide, id: p08-token-types-lifetimes}
    seeds: [slide103-kinds/session]
    issued_by: [I01, I01, I04, I07, I10, I11, I12, I17, I17, I18, I19, I24, I25, I25, I26]
    guide: {status: covered, slides: [p08-token-types-lifetimes, p02-auth-strength-session]}
    verified_on: 2026-11-22
    review_by: 2027-02-20
    owner: "#2"

  - id: authorization_code
    name: 認可コード
    format: opaque
    typ: {value: null, basis: "RFC 6749 §4.1.2 は形式を定めない"}
    lifetime_hint: "1 回限り。最大 10 分を推奨（RFC 6749 §4.1.2、RECOMMENDED）。アサーションの参照は 5 分以内（NIST SP 800-63C-4 §4.11.1）。FAPI は 60 秒（slide:p08-token-types-lifetimes）"
    refs:
      - {kind: spec, id: "RFC 6749 §4.1.2", url: "https://www.rfc-editor.org/rfc/rfc6749#section-4.1.2"}
      - {kind: guidance, id: "NIST SP 800-63C-4 §4.11.1"}
      - {kind: guide-slide, id: p08-choosing-lifetime}
    seeds: [slide103-kinds/authorization-code]
    issued_by: [I01, I10, I11]
    guide: {status: covered, slides: [p08-token-types-lifetimes, p08-choosing-lifetime]}
    verified_on: 2026-11-22
    review_by: 2027-02-20
    owner: "#2"

  - id: txn_token
    name: Transaction Token（Txn-Token）
    format: jwt
    typ: {value: txntoken+jwt, basis: "draft-ietf-oauth-transaction-tokens-11 §9.1（MUST）"}
    lifetime_hint: "分以下（draft-ietf-oauth-transaction-tokens-11 §6）。草案なので規範ではない"
    refs:
      - {kind: spec, id: "draft-ietf-oauth-transaction-tokens-11 §6", url: "https://www.ietf.org/archive/id/draft-ietf-oauth-transaction-tokens-11.txt"}
      - {kind: spec, id: "draft-ietf-oauth-transaction-tokens-11 §9.1", url: "https://www.ietf.org/archive/id/draft-ietf-oauth-transaction-tokens-11.txt"}
      - {kind: guide-slide, id: p06-transaction-tokens}
    seeds: [slide103-kinds/txn-token]
    issued_by: [I22]
    guide: {status: covered, slides: [p06-transaction-tokens, p08-token-types-lifetimes]}
    verified_on: 2026-11-22
    review_by: 2027-02-20
    owner: "#2"

  - id: logout_token
    name: ログアウトトークン（Back-Channel Logout の Logout Token）
    format: jwt
    typ: {value: logout+jwt, basis: "OpenID Connect Back-Channel Logout 1.0 §2.4（RECOMMENDED）"}
    lifetime_hint: "exp は短く、できれば 2 分以内（OpenID Connect Back-Channel Logout 1.0 §4。捕まえたトークンの再送を防ぐため）"
    refs:
      - {kind: spec, id: "OpenID Connect Back-Channel Logout 1.0 §2.4", url: "https://openid.net/specs/openid-connect-backchannel-1_0.html#LogoutToken"}
      - {kind: spec, id: "OpenID Connect Back-Channel Logout 1.0 §4", url: "https://openid.net/specs/openid-connect-backchannel-1_0.html#Security"}
    seeds: [guide-token-kinds/logout-token]
    issued_by: [I09]
    guide: {status: covered, slides: [p08-logout], note: "Logout Token の構造・検証・寿命の目安（#10 で追加。2026-11-22 に本文とノートを目で読んだ）"}
    verified_on: 2026-11-22
    review_by: 2027-02-20
    owner: "#2"

  - id: internal_token
    name: 内部トークン（入口で外部のトークンを検証し、作り直したもの）
    format: jwt-or-opaque
    typ: {value: null, basis: "標準の定めはない。組織が typ を決める（取り違えを防ぐため、外部の at+jwt と別の値にするのは筆者の推奨。slide:p06-edge-exchange）"}
    lifetime_hint: "標準の数値はない。外部のトークンの寿命を超えない（slide:p06-narrow-downstream の「下流は上流を超えない」）"
    refs:
      - {kind: guidance, id: "NIST SP 800-228 §2.7"}
      - {kind: guide-slide, id: p06-edge-exchange}
    seeds: [guide-token-kinds/internal-token]
    issued_by: [I21]
    guide: {status: covered, slides: [p06-edge-exchange, p06-stage-map]}
    verified_on: 2026-11-22
    review_by: 2027-02-20
    owner: "#2"

  - id: id_jag
    name: ID-JAG（Identity Assertion JWT Authorization Grant）
    format: jwt
    typ: {value: oauth-id-jag+jwt, basis: "draft-ietf-oauth-identity-assertion-authz-grant-06 §3.1（MUST）"}
    lifetime_hint: "草案は寿命を固定しない。例示は 300 秒で、RT を返すべきでない（slide:p10-per-tool-scopes）"
    refs:
      - {kind: spec, id: "draft-ietf-oauth-identity-assertion-authz-grant-06 §3.1", url: "https://www.ietf.org/archive/id/draft-ietf-oauth-identity-assertion-authz-grant-06.txt"}
      - {kind: guide-slide, id: p10-per-tool-scopes}
    seeds: [guide-token-kinds/id-jag]
    issued_by: [I16]
    guide: {status: covered, slides: [p10-mcp-authorization, p10-per-tool-scopes]}
    verified_on: 2026-11-22
    review_by: 2027-02-20
    owner: "#2"

  - id: dpop_proof
    name: DPoP の proof
    format: jwt
    typ: {value: dpop+jwt, basis: "RFC 9449 §4.2（MUST）"}
    lifetime_hint: "作成から短い間だけ受け入れる（RFC 9449 §11.1。数値は受け手が決める）。jti で再送を拒む"
    refs:
      - {kind: spec, id: "RFC 9449 §4.2", url: "https://www.rfc-editor.org/rfc/rfc9449#section-4.2"}
      - {kind: spec, id: "RFC 9449 §11.1", url: "https://www.rfc-editor.org/rfc/rfc9449#section-11.1"}
    seeds: [guide-token-kinds/dpop-proof, iana-access-token-type/DPoP]
    issued_by: [I30]
    guide: {status: covered, slides: [p01-client-made-jwts, p02-keys-events-identity-assurance], note: "proof のクレームと再送の拒否（#10 で追加。2026-11-22 に本文とノートを目で読んだ）"}
    verified_on: 2026-11-22
    review_by: 2027-02-20
    owner: "#2"

  - id: client_assertion
    name: クライアントの assertion（private_key_jwt・client_secret_jwt）
    format: jwt
    typ: {value: client-authentication+jwt, basis: "RFC 10070 §4（RFC 7523 §3.2 を改め、SHOULD）。サーバーが typ の無い JWT を拒むことは推奨しない"}
    lifetime_hint: "exp は必須（RFC 7523 §3）。数値の規範はない"
    refs:
      - {kind: spec, id: "RFC 7523 §3", url: "https://www.rfc-editor.org/rfc/rfc7523#section-3"}
      - {kind: spec, id: "RFC 10070 §4", url: "https://www.rfc-editor.org/rfc/rfc10070#section-4"}
    seeds: [guide-token-kinds/client-assertion, iana-oauth-uri/client-assertion-type:jwt-bearer]
    issued_by: [I28]
    guide: {status: covered, slides: [p01-client-made-jwts], note: "private_key_jwt のクレームと aud の規則（#10 で追加。2026-11-22 に本文とノートを目で読んだ）"}
    verified_on: 2026-11-22
    review_by: 2027-02-20
    owner: "#2"

  - id: jar_request_object
    name: 署名つきの認可要求（JAR の Request Object）
    format: jwt
    typ: {value: oauth-authz-req+jwt, basis: "RFC 9101 §10.8（新しい配備では明示の型が望ましい、と述べるにとどまる。MUST ではない）"}
    lifetime_hint: "RFC 9101 に数値の規範はない"
    refs:
      - {kind: spec, id: "RFC 9101 §10.8", url: "https://www.rfc-editor.org/rfc/rfc9101#section-10.8"}
    seeds: [guide-token-kinds/jar]
    issued_by: [I31]
    guide: {status: covered, slides: [p01-client-made-jwts], note: "Request Object の署名・iss・aud（#10 で追加。2026-11-22 に本文とノートを目で読んだ）"}
    verified_on: 2026-11-22
    review_by: 2027-02-20
    owner: "#2"

  - id: jarm_response
    name: 署名つきの認可応答（JARM）
    format: jwt
    typ: {value: null, basis: "JARM（Final、errata set 1）は typ の値を定めていない。iss・aud・exp は必須（§2.1）"}
    lifetime_hint: "最大 10 分を推奨（JARM §2.1、RECOMMENDED）"
    refs:
      - {kind: spec, id: "JWT Secured Authorization Response Mode for OAuth 2.0 (JARM) §2.1", url: "https://openid.net/specs/oauth-v2-jarm.html"}
      - {kind: guide-slide, id: p06-return-results}
    seeds: [guide-token-kinds/jarm]
    issued_by: [I32]
    guide: {status: covered, slides: [p06-return-results]}
    verified_on: 2026-11-22
    review_by: 2027-02-20
    owner: "#2"

  - id: jwt
    name: 汎用の JWT（ワークロードの ID のトークン・アサーショングラントに出す JWT など）
    format: jwt
    typ: {value: null, basis: "RFC 7519 §5.1 は typ を任意とする。種類ごとの typ は各仕様・製品による（例：SPIFFE の JWT-SVID）"}
    lifetime_hint: "汎用の数値はない。アサーショングラントの JWT は exp が必須（RFC 7523 §3）"
    refs:
      - {kind: spec, id: "RFC 7519 §5.1", url: "https://www.rfc-editor.org/rfc/rfc7519#section-5.1"}
      - {kind: spec, id: "RFC 7523 §3", url: "https://www.rfc-editor.org/rfc/rfc7523#section-3"}
    seeds: [iana-oauth-uri/token-type:jwt]
    issued_by: [I20]
    guide: {status: covered, slides: [p05-three-principals, p06-flow-partner-events]}
    verified_on: 2026-11-22
    review_by: 2027-02-20
    owner: "#2"

  - id: security_event_token
    name: Security Event Token（SET。SSF・CAEP の通知）
    format: jwt
    typ: {value: secevent+jwt, basis: "RFC 8417 §2.3（SHOULD）"}
    lifetime_hint: "RFC 8417 に寿命の規範はない（イベントの通知で、受け手が何度も提示するものではない）"
    refs:
      - {kind: spec, id: "RFC 8417 §2.3", url: "https://www.rfc-editor.org/rfc/rfc8417#section-2.3"}
      - {kind: guide-slide, id: p08-revocation-propagation}
    seeds: [iana-jwt-claims/events]
    issued_by: [I23]
    guide: {status: covered, slides: [p08-revocation-propagation, p06-return-results]}
    verified_on: 2026-11-22
    review_by: 2027-02-20
    owner: "#2"

  - id: status_list_token
    name: 状態リストのトークン（Token Status List）
    format: jwt
    typ: {value: statuslist+jwt, basis: "draft-ietf-oauth-status-list-21 §5.1（REQUIRED）"}
    lifetime_hint: "ttl クレームで取り直しの間隔を示す（draft-ietf-oauth-status-list-21 §5.1）。草案（RFC Editor 待ち）"
    refs:
      - {kind: spec, id: "draft-ietf-oauth-status-list-21 §5.1", url: "https://www.ietf.org/archive/id/draft-ietf-oauth-status-list-21.txt"}
      - {kind: guide-slide, id: p08-revocation-propagation}
    seeds: [iana-jwt-claims/status_list]
    issued_by: [I27]
    guide: {status: covered, slides: [p08-revocation-propagation]}
    verified_on: 2026-11-22
    review_by: 2027-02-20
    owner: "#2"

  - id: introspection_response_jwt
    name: JWT 形式のイントロスペクションの応答
    format: jwt
    typ: {value: token-introspection+jwt, basis: "RFC 9701 §5"}
    lifetime_hint: "RFC 9701 に寿命の規範はない。キャッシュは応答の exp を超えない（RFC 7662 §4。slide:p08-revocation-propagation）"
    refs:
      - {kind: spec, id: "RFC 9701 §5", url: "https://www.rfc-editor.org/rfc/rfc9701#section-5"}
      - {kind: spec, id: "RFC 7662 §4", url: "https://www.rfc-editor.org/rfc/rfc7662#section-4"}
    seeds: [iana-jwt-claims/token_introspection]
    issued_by: [I33]
    guide: {status: covered, slides: [p06-return-results, p01-self-contained-vs-reference]}
    verified_on: 2026-11-22
    review_by: 2027-02-20
    owner: "#2"
