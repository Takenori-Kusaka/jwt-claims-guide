  - {scenario: A, id: CLM-0303, kind: not_in_example, casestudy: 条件付き採用（入口の正規化でのみ読む）, reason: 入口が無い前提。scope は C-scope が参照している}
  - {scenario: A, id: CLM-0414, kind: not_in_example, casestudy: 条件付き採用（入口の正規化でのみ読む）, reason: 入口が無い前提。client_id は C-client-id（却下）が参照している}
  - {scenario: A, id: CLM-0439, kind: not_in_example, casestudy: 条件付き採用（入口の正規化でのみ読む）, reason: 入口が無い前提。送信者制約も付けない（token_types の DPOP は却下）}
  - {scenario: A, id: CLM-0143, kind: not_in_example, casestudy: 条件付き採用（外部のトークンに入っていれば入口で検証）, reason: 入口が無い前提。2026-11-22 の見本の Keycloak の AT に nbf は無かった（tools/tests/fixtures/claim_lint/golden/token.json）}
