# template_version: 0.2.0
# 記入例の採否が、ケーススタディ（jwt-claims-casestudy）の判定と意図して違う行の一覧（templates/casestudy-mapping.md の 7.）。
# ケーススタディの判定は変えない。ここにない食い違いは誤りとして扱う。照合は tools/casestudy_check.py（CI。#3）で、
# kind: carry の食い違いが過不足なくここに載っているか、kind: condition の行がケーススタディで条件付き採用か、
# ケーススタディがそのシナリオで「載せる」と判定した行が、記入例のどれかの行の catalog_refs にあるか、ここに kind: not_in_example で
# 理由とともに載っているか（記入例から行を消して食い違いを隠せないように。PR #37 の独立点検）を確かめる。
# 記入例の行はすべて catalog_refs を書く（一覧表に無い行は catalog_refs: [] と catalog_refs_reason）。同じ ID を 2 つの行から参照しない。
#
# 数え方（#16 の手作業。research/template-design/gate1.md に実行の記録）
#   - 記入例の行の catalog_refs ごとに、ケーススタディのシナリオの判定と比べる
#   - ケーススタディの「必須（共通基準）・採用・条件付き採用」を「載せる」、「不採用・*」を「載せない」とする（casestudy-mapping.md の 4.）
#   - 記入例の「採用・既定どおり」を「載せる」、「却下」を「載せない」とする
#   - 載せる／載せないが違えば kind: carry、同じでも条件付き採用の条件（入口の正規化でのみ等）と違う使い方をしていれば kind: condition
#   - kind: not_in_example は、ケーススタディが「載せる」と判定したのに、記入例のどの行も参照しない一覧表の行（reason が必須）
# シナリオ A：比べた参照 42 件（#16 の 32 件に、同じクレームの RFC 7519 などの行 9 件と、#30 の at_hash の 1 件を足した）、carry 9 件、condition 1 件、
# not_in_example 20 件（ケーススタディが載せるとした 54 件のうち、記入例が参照しないもの）（casestudy_commit: 080b8da）
# シナリオ B（B＋C の組み合わせ。scenario_premises の B）：carry 21 件、not_in_example 30 件（ケーススタディが B で載せるとした 109 件のうち、記入例が参照しないもの）。比べた参照の数は casestudy_check の refs
casestudy_commit: 080b8da
scenario_premises:
  - scenario: A
    casestudy: 外部の IdP のトークンは入口でだけ検証し、組織の内部トークンに交換する（DECISION_POLICY.md の共通の前提）
    example: 入口での交換をせず、API（saas-api）が Keycloak のテナントのレルムの AT を直接検証する（ケーススタディの cs/scen_a.py の実験の構成と同じ）
    reason: 縦の一本（#16）では、Keycloak が実際に発行する AT の長さを R8 と照合するため、実物のトークンがそのまま API に届く構成にした。入口と内部トークンは、シナリオ B の記入例（#3）で扱う
    effect: Keycloak が外せない、または既定で出すクレーム（auth_time・typ・sid・azp）が API に届く AT に残る。下の carry の 4 件はこの前提から生じた
  - scenario: B
    casestudy: シナリオ B（社内業務システム）。入口で外部の IdP のトークンを検証し、内部トークンに交換する。送信者制約（DPoP・mTLS）と JWE は見送り。委任（act）・承認（authorization_details）・Txn-Token は使わない
    example: シナリオ B に、シナリオ C（AI エージェントの委任。DPoP で束縛したタスク単位のトークン、act の連鎖、authorization_details の承認）と、P5 の Txn-Token（TTS がサービス間の取引の文脈を運ぶ）を足した組み合わせ（templates/examples/scenario-b/）
    reason: "#4 の Full の記入例は P1＋P4＋P5 の組み合わせを求める。シナリオ B だけでは P4（委任）が無く、ケーススタディの B・C はどちらも Txn-Token を使わない。casestudy_check は 1 つのシナリオで照合するので、claims.yaml の scenario は B とし、C と P5 から持ち込んだ行を kind: carry で載せた"
    effect: B の判定で「不採用・不要」の行のうち、委任（act・scope・task_id・approval_id・authorization_details）、DPoP（cnf と proof の iat・jti・nonce・htm・htu・ath）、Txn-Token（txn・req_wl・tctx）の 21 件が carry になった。外部の IdP の独自のクレームは、入口の正規化の入力として upstream_issuer に書き、台帳の行にしていない（not_in_example）
