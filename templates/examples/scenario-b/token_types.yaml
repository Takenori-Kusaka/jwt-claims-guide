    lifetime_set_by: [platform]
    refresh: なし。入口が要求ごとに作る（同じ KC_AT の間は aud ごとに 60 秒までキャッシュしてよい）
    revocation:
      - {method: exp_only, delay_seconds: 330, note: 受け手はローカルで検証する}
    sender_constraint: none
    jti_policy: {unique_scope: per_issuer, replay_check: false}
    subject_type: public
    long_running: 非同期の処理に渡さない。ledger が出す支払いのイベントには、主体の間接参照（ハッシュした user_id）と txn だけを入れる（H12）
    stored_at: service_memory
