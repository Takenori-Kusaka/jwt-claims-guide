          - {name: kid, type: string, max_bytes: 22}
      path: [nodejs-max-http-header-size]
      other_headers_bytes: 3072
    note: >-
      other_headers_bytes の 3072 は、要求行と Txn-Token ヘッダー（TXN、最悪 1 KB 程度）を含む見積もり（筆者の提案）。typ を KC_AT と分けた
