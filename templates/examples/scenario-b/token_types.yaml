    required_claims: [iss, sub, aud, exp, iat, jti, client_id, "https://claims.example.com/.tenant_id", "https://claims.example.com/.user_id", "https://claims.example.com/.roles", "https://claims.example.com/.idp", "https://claims.example.com/.v"]
    max_clock_skew: 30
    max_lifetime: 300
    lifetime_refs:
      - {kind: guide-slide, id: p06-edge-exchange}
