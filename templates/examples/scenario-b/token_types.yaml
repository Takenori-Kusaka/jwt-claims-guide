      - {kind: guide-slide, id: p06-transaction-tokens}
    lifetime_set_by: [platform]
    refresh: なし。入口が要求ごとに tts から取る
    revocation:
      - {method: exp_only, delay_seconds: 330, note: 呼び出しの連鎖の間だけ使う短命のトークン}
    sender_constraint: none
    jti_policy: {unique_scope: per_issuer, replay_check: false}
    subject_type: public
    long_running: 期限の後に下流を呼ぶ処理を持たない。非同期の処理には txn の値だけを写す（H12）
    stored_at: service_memory
    transport: txn_token_header
    visible_to: [api, gateway]
    jwe: {used: false, note: 個人情報を載せない}
    log_policy: jti だけ記録
    key_rotation: {period_days: 30, publish_before_use_seconds: 3900, retire_after_seconds: 330, note: tts の鍵。INT_AT と同じ周期}
    unknown_kid: {refetch_min_interval_seconds: 300, negative_cache_seconds: 300, on_fetch_failure: use_last_known}
    jwks_cache_ttl: 3600
    key_source: {from: configured_jwks_uri, header_key_params: reject}
    signing_key_scope: shared
    note: >-
      草案（draft-ietf-oauth-transaction-tokens-11）の種別。aud は信頼ドメイン（https://corp.example.com）で、リソースの宛先ではない。
      テナントは corp だけで、信頼ドメイン（aud）で決まる。草案が RFC になったら見直す（台帳の C-txn・C-req-wl・C-tctx の spec_version と revisit_trigger）

  # ---------------------------------------------------------------- AI エージェントの委任（P4）
  - id: AGENT_AT
    kind: access_token
    decision: 採用
    rationale: >-
      社員が承認したタスクの間だけ、エージェント agent:expense が社員の代わりにツール invoice-mcp を呼ぶ。sub は社員、act と client_id は
      エージェント（エージェント自身の ID で、社員のトークンを借りない。ケーススタディ C12）。宛先は invoice-mcp だけ（C13）
    purpose: エージェントからツールサーバーへの委任の呼び出し
    issuer: 組織のトークン発行サービス（sts）
    aud: [invoice-mcp]
    holder: エージェントの実行基盤（agent-runtime）
    format: jwt
    typ: at+jwt
    alg_allowlist: [ES256]
    issuers:
      - {iss: "https://sts.corp.example.com", jwks_uri: "https://sts.corp.example.com/jwks"}
    required_claims: [iss, sub, aud, exp, iat, jti, client_id, scope, act, cnf, "https://claims.example.com/.tenant_id", "https://claims.example.com/.user_id", "https://claims.example.com/.task_id", "https://claims.example.com/.v"]
    max_clock_skew: 30
    max_lifetime: 300
    lifetime_refs:
      - {kind: guide-slide, id: p10-delegation-chain-depth}
      - {kind: guide-slide, id: p10-per-tool-scopes}
    lifetime_set_by: [platform]
    refresh: なし（RT を出さない）。タスクが 300 秒を超えるなら、実行基盤が CIBA で取り直し、sts が委任の取り消しを確かめる
    revocation:
      - {method: exp_only, delay_seconds: 330, note: 委任の取り消しは、次の交換（TASK_AT）で sts が確かめて拒む（ケーススタディ C9）。手元の AGENT_AT は exp まで残る}
      - {method: db_lookup, delay_seconds: 0, note: invoice-mcp は交換のたびに sts が委任の記録（approval の取り消し）を引くので、取り消し後の上流の呼び出しは 0 秒で止まる}
    sender_constraint: dpop
    jti_policy: {unique_scope: per_issuer, replay_check: false}
    long_running: タスクの間だけ。300 秒を超える処理は CIBA で取り直す（エージェントが期限の後に上流を呼ぶ形を作らない）
    max_delegation_depth: 3
    subject_type: public
    stored_at: service_memory
    transport: authorization_dpop
    visible_to: [client, api]
    jwe: {used: false, note: 個人情報を載せない。エージェントの実行基盤（client）は中身を読めるが、載るのは ID と task_id だけ}
    log_policy: jti だけ記録
    key_rotation: {period_days: 30, publish_before_use_seconds: 3900, retire_after_seconds: 330, note: sts の鍵（INT_AT と同じ）}
    unknown_kid: {refetch_min_interval_seconds: 300, negative_cache_seconds: 300, on_fetch_failure: use_last_known}
    jwks_cache_ttl: 3600
    key_source: {from: configured_jwks_uri, header_key_params: reject}
    signing_key_scope: shared
    size:
      signing: {alg: ES256}
      header:
        params:
          - {name: alg, type: string, max_bytes: 5}
          - {name: typ, type: string, max_bytes: 6}
          - {name: kid, type: string, max_bytes: 22}
      path: [nodejs-max-http-header-size]
      other_headers_bytes: 3072
    note: >-
      max_delegation_depth の 3 はケーススタディ C の組織の規則（depth_rule。標準による深さの強制はない）。other_headers_bytes は同じ要求の
      DPoP ヘッダー（DPOP、最悪 1 KB 程度）を含む見積もり（筆者の提案）

  - id: TASK_AT
    kind: access_token
    decision: 採用
    rationale: >-
      invoice-mcp は受け取った AGENT_AT を上流に渡さず（ケーススタディ C2）、交換で invoices 宛ての 1 件のタスクだけのトークンを得る。
      act の最も外側が今の行為者（invoice-mcp）、その内側が agent:expense。支払いは承認の内容（authorization_details の金額・相手先・対象）と
      承認の ID で束縛する（C5〜C7）
    purpose: ツールサーバーから請求書の API への、タスク単位の呼び出し
    issuer: 組織のトークン発行サービス（sts）
    aud: [invoices]
    holder: ツールサーバー（invoice-mcp）
    format: jwt
    typ: at+jwt
    alg_allowlist: [ES256]
    issuers:
      - {iss: "https://sts.corp.example.com", jwks_uri: "https://sts.corp.example.com/jwks"}
    required_claims: [iss, sub, aud, exp, iat, jti, client_id, scope, act, cnf, authorization_details, "https://claims.example.com/.tenant_id", "https://claims.example.com/.user_id", "https://claims.example.com/.task_id", "https://claims.example.com/.approval_id", "https://claims.example.com/.v"]
    max_clock_skew: 30
    max_lifetime: 300
    lifetime_refs:
      - {kind: guide-slide, id: p10-per-tool-scopes}
    lifetime_set_by: [platform]
    refresh: なし。呼び出しごとに交換する
    revocation:
      - {method: exp_only, delay_seconds: 330, note: 300 秒のタスク単位。交換のときに sts が委任の取り消しを確かめる}
      - {method: db_lookup, delay_seconds: 0, note: "invoices が支払いの前に承認の DB で C-approval-id の記録の状態を引く（承認の取り消しは即時に効く）"}
    sender_constraint: dpop
    jti_policy: {unique_scope: per_issuer, replay_check: false}
    long_running: 1 回の呼び出しだけに使う
    max_delegation_depth: 3
    subject_type: public
    stored_at: service_memory
    transport: authorization_dpop
    visible_to: [api]
    jwe: {used: false, note: 承認の金額と相手先の口座を authorization_details に載せる。組織の網の中のツールサーバーと請求書の API だけが読む}
    log_policy: jti だけ記録
    key_rotation: {period_days: 30, publish_before_use_seconds: 3900, retire_after_seconds: 330, note: sts の鍵}
    unknown_kid: {refetch_min_interval_seconds: 300, negative_cache_seconds: 300, on_fetch_failure: use_last_known}
    jwks_cache_ttl: 3600
    key_source: {from: configured_jwks_uri, header_key_params: reject}
    signing_key_scope: shared
    size:
      signing: {alg: ES256}
      header:
        params:
          - {name: alg, type: string, max_bytes: 5}
          - {name: typ, type: string, max_bytes: 6}
          - {name: kid, type: string, max_bytes: 22}
      path: [nodejs-max-http-header-size]
      other_headers_bytes: 3072
    note: DPoP の鍵は invoice-mcp のもの（交換の要求に付けた proof の鍵で sts が束縛する）。AGENT_AT の cnf とは別の鍵

  - id: DPOP
    kind: dpop_proof
    decision: 採用
    rationale: AGENT_AT・TASK_AT を鍵に束縛し、要求ごとに鍵の所持を示す（issuance_profile.sender_constraint）
    purpose: 要求ごとの鍵の所持の証明（トークンの要求と、保護リソースへの要求）
    issuer: 鍵を持つクライアント（agent-runtime・invoice-mcp）
    aud: ["（aud は無い。htm・htu で要求に束縛する）"]
    holder: agent-runtime・invoice-mcp（要求ごとに作る）
    format: jwt
    typ: dpop+jwt
    alg_allowlist: [ES256]
    issuers:
      - {iss: agent-runtime, jwks_uri: "https://agent-runtime.corp.example.com/.well-known/jwks.json"}
      - {iss: invoice-mcp, jwks_uri: "https://invoice-mcp.corp.example.com/.well-known/jwks.json"}
    max_clock_skew: 30
    max_lifetime: 60
    lifetime_refs:
      - {kind: spec, id: "RFC 9449 §11.1", url: "https://www.rfc-editor.org/rfc/rfc9449#section-11.1"}
    lifetime_set_by: [platform]
    refresh: なし（要求ごとに作る）
    revocation:
      - {method: one_time_use, delay_seconds: 0, note: 受け手は jti を受け入れの期間（iat から 60 秒＋ずれ 30 秒）だけ覚え、同じ jti の proof を拒む}
    jti_policy: {unique_scope: per_issuer, replay_check: true, max_age_seconds: 90}
    stored_at: none
    transport: authorization_dpop
    visible_to: [client, api, idp]
    jwe: {used: false, note: proof は署名だけ。秘密を載せない}
    log_policy: jti だけ記録
    key_rotation: {period_days: null, publish_before_use_seconds: 0, retire_after_seconds: 0, note: 実行基盤とツールサーバーの鍵は、それぞれの起動ごとに作り直す（短命の鍵）。sts は登録した jwks_uri の鍵でだけ束縛する（筆者の提案）}
    unknown_kid: {refetch_min_interval_seconds: 300, negative_cache_seconds: 300, on_fetch_failure: reject}
    jwks_cache_ttl: 300
    key_source: {from: configured_jwks_uri, header_key_params: reject}
    signing_key_scope: per_client
    size:
      signing: {alg: ES256}
      header:
        params:
          - {name: alg, type: string, max_bytes: 5}
          - {name: typ, type: string, max_bytes: 8}
          - {name: jwk, type: string, max_bytes: 180}
      path: [nodejs-max-http-header-size]
      other_headers_bytes: 2048
    note: >-
      DPoP の proof は、ヘッダーの jwk の公開鍵で署名を確かめ、その拇印を AT の cnf.jkt と照合する（RFC 9449 §4.3）。スキーマは
      header_key_params を reject に固定しているので、この行では「jwk を信頼の根拠にしない（cnf.jkt と、登録した jwks_uri の鍵との一致でだけ受け入れる）」
      の意味で reject と書いた。proof には iss が無いが、R1 は JWT の行に issuers を求めるので、鍵を登録するクライアントの jwks_uri を書いた
      （どちらもスキーマの限界。#3 への指摘。design.md の 12.）。transport の列挙に DPoP ヘッダーが無いので、同じ要求の Authorization: DPoP と
      一緒に運ぶことを authorization_dpop で表した。proof には exp・aud・iss が無い（RFC 9449 §4.2）ので、required_claims は目録に書かず（書くと L27 が exp・aud・iss を求める）、
      受け手が確かめる htm・htu・iat・jti（保護リソースでは ath も）は台帳の C-dpop-* と C-cnf の enforced_at に書いた。aud の列にも値が無いことを書いた。
      issuers の iss は proof の発行者を表す名前（クライアント ID）で、proof の中の iss ではない。max_lifetime の 60 秒は受け手が iat から受け入れる期間
      （RFC 9449 §11.1 は数値を定めない。筆者の提案）。サーバーが nonce を返した後は、proof の nonce も照合する（C-nonce）

  - id: CLIENTASSERTION
    kind: client_assertion
    decision: 採用
    rationale: portal・agent-runtime・invoice-mcp のクライアント認証を private_key_jwt にした（issuance_profile.client_auth）
    purpose: Keycloak・sts のトークンの端点でのクライアント認証
    issuer: portal・agent-runtime・invoice-mcp（クライアント自身）
    aud: ["https://idp.example.com/realms/corp", "https://sts.corp.example.com"]
    holder: 各クライアント（要求ごとに作る）
    format: jwt
    typ: client-authentication+jwt
    alg_allowlist: [ES256]
    issuers:
      - {iss: portal, jwks_uri: "https://portal.corp.example.com/.well-known/jwks.json"}
      - {iss: agent-runtime, jwks_uri: "https://agent-runtime.corp.example.com/.well-known/jwks.json"}
      - {iss: invoice-mcp, jwks_uri: "https://invoice-mcp.corp.example.com/.well-known/jwks.json"}
    max_clock_skew: 30
    max_lifetime: 60
    lifetime_refs:
      - {kind: spec, id: "RFC 7523 §3", url: "https://www.rfc-editor.org/rfc/rfc7523#section-3"}
    lifetime_set_by: [platform]
    refresh: なし（要求ごとに作る）
    revocation:
      - {method: one_time_use, delay_seconds: 0, note: Keycloak・sts は jti を exp まで覚え、同じ assertion を拒む}
    jti_policy: {unique_scope: per_issuer, replay_check: true, max_age_seconds: 90}
    stored_at: none
    transport: form_post_body
    visible_to: [client, idp]
    jwe: {used: false, note: 秘密を載せない}
    log_policy: jti だけ記録
    key_rotation: {period_days: 90, publish_before_use_seconds: 3900, retire_after_seconds: 90, note: クライアントの鍵は jwks_uri で公開し、新しい鍵を先に載せてから使う（筆者の提案）}
    unknown_kid: {refetch_min_interval_seconds: 300, negative_cache_seconds: 300, on_fetch_failure: reject}
    jwks_cache_ttl: 3600
    key_source: {from: configured_jwks_uri, header_key_params: reject}
    signing_key_scope: per_client
    note: >-
      typ の client-authentication+jwt は、client assertion を別の種類の JWT と取り違えないための組織の値（RFC 7523 は typ を定めない。筆者の提案）。
      クライアントの assertion にクレームの台帳の行は置かない（iss・sub はクライアント ID で、受け手は Keycloak・sts だけ）。そのため required_claims も目録に書かず、RFC 7523 §3 の iss・sub・aud・exp・jti の確認は Keycloak・sts の設定に任せる

  # ---------------------------------------------------------------- 却下の行（カタログの全種類に採否を付ける）
  # 前提と崩れる条件は、catalog_answers.yaml の、その種類を出す発行イベントへの回答と同じ
  - id: IDJAG
    kind: id_jag
    decision: 却下
    rationale: ドメインをまたぐ SSO 済みの利用者のトークンを受けない。グループ会社の IdP は、入口が EXT_AT を検証して作り直す
    assumption: グループ会社の IdP から ID-JAG で組織の API を呼ぶ連携がない（I16 の回答）
    revisit_trigger: グループ会社や SaaS から ID-JAG で組織の API・エージェントを呼ぶ連携を受け入れるとき
    format: jwt

  - id: JAR
    kind: jar_request_object
    decision: 却下
    rationale: 認可要求は PAR で送る。要求の完全性は PAR の端点でのクライアント認証で守り、Request Object に署名しない
    assumption: 認可要求の否認防止を求める規則（FAPI 2.0 の Message Signing など）の対象ではない（I31 の回答）
    revisit_trigger: 認可要求の署名を求める規則の対象になったとき
    format: jwt

  - id: JARM
    kind: jarm_response
    decision: 却下
    rationale: 認可応答を JWT にしない。応答は portal のサーバーが PKCE と state で確かめる
    assumption: 認可応答の改ざんを防ぐ規則の対象ではない（I32 の回答）
    revisit_trigger: 認可応答の改ざんを防ぐ必要が出たとき（FAPI 2.0 の Message Signing など）
    format: jwt

  - id: WORKLOADJWT
    kind: jwt
    decision: 却下
    rationale: サービス・ワーカーの通信相手は mTLS（SPIFFE の X.509-SVID）で確かめ、ワークロードの ID のトークン（JWT-SVID）やアサーショングラントの JWT を使わない
    assumption: 入口の内側はすべて mTLS で、TLS を途中で終端する部品が無い（I20 の回答）
    revisit_trigger: TLS を終端する部品（L7 のプロキシ・メッシュの外のキュー）を通す経路ができ、通信相手をトークンで示す必要が出たとき
    format: jwt

  - id: SET
    kind: security_event_token
    decision: 却下
    rationale: SSF・CAEP の SET を受けない。IdP のセッションの終了は Back-Channel Logout（LOGOUT）で受け、重要な操作は ledger が都度引き直す
    assumption: 剥奪を受け手に届ける手段が、Back-Channel Logout と重要な操作の引き直しで足りる（I23・U17 の回答）
    revisit_trigger: グループ会社の IdP（Entra ID など）でのリスクの検知やセッションの剥奪を、入口と内側の API に届ける必要が出たとき
    format: jwt

  - id: STATUSLIST
    kind: status_list_token
    decision: 却下
    rationale: 状態リストを出さない。トークンの寿命は 300 秒で、即時の剥奪が要る操作は引き直す
    assumption: 受け手に失効を届ける仕組みが、短い寿命と重要な操作の引き直しで足りる（I27・U16 の回答）
    revisit_trigger: 寿命の長いトークン（エージェントの長時間のタスクなど）を出し、受け手に失効を届ける仕組みが要るようになったとき
    format: jwt

  - id: INTROSPECTIONJWT
    kind: introspection_response_jwt
    decision: 却下
    rationale: イントロスペクションを使わない（at_format は jwt）。重要な操作の鮮度は Keycloak の管理 API でセッションと部署を引き直す
    assumption: AS の判断を否認できない形で残す必要がない（I33 の回答）
    revisit_trigger: イントロスペクションを使い、AS の判断を否認できない形で残す必要が出たとき
    format: jwt
