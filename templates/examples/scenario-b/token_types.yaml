  - id: TXN
    kind: txn_token
    decision: 採用
    rationale: orders が ledger を社員の文脈で呼ぶとき、呼び出しの連鎖全体で同じ取引の文脈（txn・誰の権限で・どのワークロードが求めたか）を改変せずに運ぶ。内部の AT を下流へ渡さない
    refs:
      - {kind: spec, id: "draft-ietf-oauth-transaction-tokens-11 §6", url: "https://datatracker.ietf.org/doc/html/draft-ietf-oauth-transaction-tokens-11"}
      - {kind: guide-slide, id: p06-transaction-tokens}
    revisit_trigger: draft-ietf-oauth-transaction-tokens が RFC になったとき、または版が上がってクレーム（txn・req_wl・tctx・rctx）の定義が変わったとき
    purpose: サービス間の呼び出しの取引の文脈
    issuer: 内部の Txn-Token のサービス（tts）
    aud: ["https://corp.example.com"]
    holder: 呼び出しの連鎖の各サービス（orders・ledger）
    format: jwt
    typ: txntoken+jwt
    alg_allowlist: [ES256]
    issuers:
      - {iss: "https://tts.corp.example.com", jwks_uri: "https://tts.corp.example.com/jwks"}
    required_claims: [iss, iat, aud, exp, txn, sub, req_wl]
    max_clock_skew: 30
    max_lifetime: 300
    lifetime_refs:
