    rationale: orders 宛て。KC_AT（H4）とグループ会社の EXT_AT（H8）の両方から作る。入口で外部のトークン（KC_AT・EXT_AT）を検証し、API ごとに宛先を 1 つに絞った内部トークンに作り直す。内側のサービスは IdP の違いを知らずに、組織の形だけを読む
    purpose: orders の認可（社員とグループ会社の社員）
    issuer: 入口（gateway）のトークン発行サービス（sts）
    aud: [orders]
    holder: 入口（gateway）。受け手の API は検証だけ
    format: jwt
    typ: corp-internal+jwt
    alg_allowlist: [ES256]
    issuers:
