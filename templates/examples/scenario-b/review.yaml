        answer: "no"
        memo: "グループ会社の社員の停止は EXT_AT の exp（5430 秒）まで届かず、利用者単位の止め方が無い（F08）"
      q-four-lifetimes-written:
        answer: "yes"
        memo: "9.1・9.2・9.3 と生成の表の 4 層が別の欄にある"
      q-freshness-mitigation:
        answer: "no"
        memo: "C-department・C-roles の受け入れの最大と許容の比較が、1 時間ごとの同期と KC_AT→INT_AT の連鎖を含まない（F03）"
      q-gateway-bypass-path:
        answer: "yes"
        memo: "入口を通らない経路（H10・H14・H15・H11〜H13）を図に書き、それぞれで検証・mTLS を確かめる"
      q-hook-adds-raw-pii:
        answer: "yes"
        memo: "マッパーが足すのは部門コード・社員番号・組織 ID で、生年月日などは無い"
      q-hook-failure:
        answer: "no"
        memo: "受け手の拒否はある（required_claims）が、I12・I25・I26 でマッパーが呼ばれるかが unknown のまま（R3b warn。F18）"
      q-hop-lifetime:
        answer: "yes"
        memo: "全ホップ 300 秒以下。INT_AT を KC_AT の残りの寿命以下にする記述は H4 だけで H5〜H7 に無い（鮮度の計算は F03）"
      q-hop-narrowing:
        answer: "yes"
        memo: "交換は sts が担い、scope は要求と subject_token の積（C-scope の assumption）。Keycloak の交換は OFF"
      q-identifier-choice:
        answer: "yes"
        memo: "利用者のキーは IdP ごとの不変の ID から引く user_id。テナントは固定値 corp"
      q-idp-capability-verified:
        answer: "no"
        memo: "CIBA の流れ・名前空間を出すマッパー・Keycloak の属性の編集権限に、版の公式文書か実測の出どころが無い（12. に未確認と書いたものを含む。F10・F07）"
      q-idp-diff-absorbed:
        answer: "yes"
        memo: "内側のサービスは sts の組織の名前空間だけを読む。IdP の独自クレームは upstream_issuer にだけ書いた"
      q-internal-delegation-token:
        answer: "yes"
        memo: "目録に署名・寿命 300 秒・失効・ログの列がある（tenant_binding の列は無く tenant_id の照合で代替）"
      q-key-rotation:
        answer: "yes"
        memo: "JWKS から取り、未知の kid は 300 秒に 1 回・負のキャッシュ 300 秒、公開 3900 秒前・廃止 330 秒後"
      q-lifetime-rationale:
        answer: "no"
        memo: "5.1 は上限の数値だけで、300 秒を剥奪の速さから導いた理由と代償（リフレッシュの負荷・IdP の停止）の比較が無い（F17）"
      q-limit-consistency:
        answer: "no"
        memo: "同じ事実の記述の食い違いが複数（JWE の注記・3. の設定の一覧・9.1 の部署の出どころ・DPoP の jti の保持など。F14・F15）"
      q-lint-workaround:
        answer: "yes"
        memo: "upstream の無い H3・H8・H9・H14 に理由がある。req_wl・tctx は #6 の規則の変更として渡した（12.）"
      q-long-running:
        answer: "no"
        memo: "payment-worker について、H12・H13 は「トークンを持たない」、C-exp は「TXN の寿命を超えたら TTS から取り直す」と食い違う（F04）"
      q-minimal-per-recipient:
        answer: "yes"
        memo: "独自クレームは consumers の受け手宛てのトークンにだけ載る（H4〜H7 で絞る）"
      q-nested-jwt-both-layers:
        answer: "na"
        memo: "JWE を使わない（全行 jwe used false）"
      q-no-passthrough:
        answer: "yes"
        memo: "代替：P4 の delegation-policy の欄は無いが、hops の exchanger と C-may-act の理由に交換を許す相手・宛先・範囲がある"
      q-no-secret-or-raw-pii:
        answer: "yes"
        memo: "秘密は無い。authorization_details の creditorAccount（user.financial）は承認の束縛に要る値で、invoice-mcp・invoices だけに届く"
      q-no-unverified-passthrough-mode:
        answer: "yes"
        memo: "代替：library-config の欄は無いが、全 claim_request の問 18 に検証の無効化・既定値で続行のモードが無いとある"
      q-object-level-authz:
        answer: "no"
        memo: "orders・invoices が sub と user_id の両方で持ち主を照合し、キーが 1 つに決まっていない。M_authz_pdp#object-level も無い（F05）"
      q-operational-metrics:
        answer: "no"
        memo: "付録 A に共通の検証ライブラリの採用率と版が無い（F21）"
      q-operator-act:
        answer: "na"
        memo: "運用者の操作は範囲外（2.2。I19 の Impersonate を使わない）"
      q-original-principal:
        answer: "yes"
        memo: "orders→ledger は TXN の sub（社員）で判断し、orders の権限で依頼しない"
      q-outside-catalog:
        answer: "no"
        memo: "outside_enumeration は具体的だが、ledger・orders が Keycloak の管理 API を引くサービスアカウントの資格情報と、入口のディレクトリ参照の資格情報が目録・カタログに無く、I05 の回答と矛盾（F06）。TXN の読み取りの経路の DB の文脈も無い（F23）"
      q-pairwise-external:
        answer: "na"
        memo: "組織の外の受け手にトークンを出さない（2. の範囲の外：P6）"
      q-pairwise-unguessable:
        answer: "na"
        memo: "ペアワイズの sub を組織が作らない（外部の受け手が無い）"
      q-payload-readable:
        answer: "yes"
        memo: "confidential_from（browser・logs）の相手が、載るトークンの visible_to に無い"
      q-rar-per-audience:
        answer: "yes"
        memo: "H14・H15 の authorization_details は payment の type だけ"
      q-refresh-reevaluated:
        answer: "yes"
        memo: "Keycloak のリフレッシュでのマッパーの再実行は実測（keycloak.refresh_reevaluation）。外部の IdP は毎回読み直す（9.2）"
      q-registered-synonym:
        answer: "no"
        memo: "STS のトークンの sub と user_id は同じ値（C-sub の description）で、orders・invoices が両方で持ち主を照合する（F05）"
      q-relies-on-at-expiry:
        answer: "yes"
        memo: "重要な操作は sid と部署の引き直し、セッションは Back-Channel Logout。INT_AT のキャッシュは固定の 60 秒"
      q-required-rejected:
        answer: "yes"
        memo: "必須の欠落は拒否。groups の超過は入口がディレクトリで埋めてから当てる（3.2）"
      q-reuse-standard-structure:
        answer: "yes"
        memo: "task_id（相関）は txn との単位の違い、approval_id は authorization_details との違いを問 3 に書いた。cnf・authorization_details・act は既存の構造を使う"
      q-revocation-delivery:
        answer: "yes"
        memo: "種別ごとの手段と最悪の秒数が 9.1 にある。即時が要る操作は db_lookup"
      q-role-explosion:
        answer: "yes"
        memo: "roles は 4 語の粗いロール。文書・注文ごとの権限は持たない（not_meaning）"
      q-rt-policy-by-client:
        answer: "no"
        memo: "機密の BFF の RT の方式の根拠に公開クライアント向けの RFC 9700 §4.14.2 を引く。再利用の検知も未確認（F16）"
      q-scope-and-role:
        answer: "yes"
        memo: "orders は scope orders.read と roles、ledger は scope と acr、docs は scope と部門"
      q-scope-elevation-logged:
        answer: "no"
        memo: "U27 に CIBA で昇格とあるが、相関 ID つきの記録が無い（P4#tool-scopes が無い。F01）"
      q-scope-semantics:
        answer: "yes"
        memo: "C-scope の not_meaning に「利用者のロールではない」「金額の承認は authorization_details」。宛先ごとに意味のあるスコープ"
      q-session-rt-bounds:
        answer: "yes"
        memo: "BFFSESSION・SSO・RT に idle 1800 と最大 36000（24 時間以下）"
      q-shared-validator:
        answer: "no"
        memo: "M_token_validation の欄が無い。payroll は共通部品を使えない（employee_id の問 16）（F01・F12）"
      q-single-aud-resource:
        answer: "yes"
        memo: "AGENT_AT は invoice-mcp、TASK_AT は invoices の 1 つ。KC_AT の 4 つは Keycloak が resource に対応しない理由と入口での絞り込みがある"
      q-single-issuer:
        answer: "yes"
        memo: "段階ごとに 1 つの書き手。サービスは追記せず、作り直しは sts だけ"
      q-size-limit:
        answer: "yes"
        memo: "R8 で全種別の最悪のサイズとヘッダーの行を計算（最大 29%）"
      q-sql-tenant-predicate:
        answer: "na"
        memo: "テナントは 1 つでテナントの条件を要しない。部署の分離は RLS（FORCE）で行う"
      q-step-up-by-rs:
        answer: "yes"
        memo: "ledger が acr・auth_time を見て insufficient_user_authentication を返す（付録 B・H5）"
      q-step-up-path-coverage:
        answer: "no"
        memo: "高リスクの支払い（invoices.pay）を CIBA の承認で許すが、承認の時の認証の強さ・新しさ（acr・auth_time）を求めず、AGENT_AT にも載らない（F07）"
      q-system-actor-no-fake-sub:
        answer: "no"
        memo: "payment-worker が自分の ID で TTS から取り直す TXN の sub が何か書いてない。C-sub は「TXN の sub を処理の主体として記録」（F04）"
      q-tenant-data-match:
        answer: "na"
        memo: "テナントは corp 1 つ（lite_criteria の multitenant false）。データはテナントで分けない"
      q-token-logging:
        answer: "no"
        memo: "記録する HTTP ヘッダーの許可リスト・HAR からトークンを除く手順が無い（M_privacy_minimization#audit-log が無い。F01）"
      q-token-not-in-url:
        answer: "yes"
        memo: "transport に URL・クエリの種別は CODE だけ。PAR で request_uri。長い接続は使わない（U23）"
      q-trace-id-trust:
        answer: "no"
        memo: "監査は txn を使うが、traceparent の扱いが書いてない（P5#txn-token の欄が無い。F01）"
      q-txn-required-claims:
        answer: "yes"
        memo: "TXN の required_claims に iat・aud・exp・txn・sub・scope・req_wl があり、台帳の各行の carried_in に TXN がある"
      q-txn-scope-fixed:
        answer: "yes"
        memo: "TXN の scope は H9 以下、ledger が tctx の operation と scope を照合、改変せずに渡す（H10）"
      q-typ-distinguishes:
        answer: "yes"
        memo: "typ が at+jwt・corp-internal+jwt・txntoken+jwt・logout+jwt・dpop+jwt で分かれ、AGENT_AT と TASK_AT は aud で分かれる"
      q-unverified-claim-extraction:
        answer: "yes"
        memo: "全ホップ mode local で署名を検証してから読む。未検証の取り出しは無い"
      q-unwrapped-value-authz:
        answer: "yes"
        memo: "代替：integrity_until の列は無いが、H11 に app.department を設定するのは ledger だけとある。ヘッダーへの写しは無い"
      q-validate-before-read:
        answer: "yes"
        memo: "代替：M_token_validation#validation-order は無いが、user_id の問 18 に検証前に読むのを禁じるとある"
      q-validity-not-authz:
        answer: "yes"
        memo: "scope・roles・持ち主・承認の内容を照合し、有効性だけで許さない"
      q-value-vocabulary:
        answer: "yes"
        memo: "C-roles の value_vocabulary と upstream_issuer に IdP ごとの出どころと写し方（対応表にない値は捨てる）がある"
      q-variant-comparison:
        answer: "yes"
        memo: "3.3 に B23 の型の攻撃が開くことと、DPoP ヘッダーを含む要求の全体のサイズの差がある"
      q-writer-distinguished:
        answer: "yes"
        memo: "本人が書ける custom:role・upn を却下し、管理側の値だけで認可"
