  - id: C-kc-client-id
    name: client_id
    catalog_refs: []
    catalog_refs_reason: "Keycloak の AT の client_id の行（CLM-0414）は、組織のトークンの client_id と同じ C-client-id の行が参照している。この行は KC_AT に client_id が無いことの記録"
    decision: 却下
    rejection_kind: IdP が出さない
    alt: [C-azp]
    rationale: Keycloak 26.8 の AT（認可コードの発行）は client_id を出さず azp を出す。KC_AT はヘッダーで at+jwt を名乗るのに RFC 9068 §2.2 の REQUIRED の client_id を欠く。KC_AT を読むのは入口だけで、入口は azp を読む
    refs:
      - {kind: spec, id: "RFC 9068 §2.2", url: "https://www.rfc-editor.org/rfc/rfc9068#section-2.2"}
    assumption: シナリオ A の 2026-11-22 の見本の AT（Keycloak 26.8.0）に client_id が無かった。シナリオ B のレルム corp でも同じ挙動とみなす（確かめていない）
    revisit_trigger: KC_AT を入口以外の受け手が読むとき
    type: string

