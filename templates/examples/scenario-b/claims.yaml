# template_version: 0.3.0
# yaml-language-server: $schema=../../registry/claims.schema.json
# 記入例（シナリオ B＋C：社内業務システムと AI エージェントの委任。Full。P1＋P4＋P5）。推奨ではない。この前提での一例で、自組織の判断の代わりにしない。
# 台帳 v1（templates/registry/claims.schema.json、template_version 0.2.0）で書いた。Full なので、行に当てはまる Full の列（answers・does_not_answer・
# absent_semantics・value_normalization・provenance・verification_method・source_max_length・consumer_access_path・evidence など）も書いた。
# 題材：ケーススタディ（jwt-claims-casestudy@080b8da）のシナリオ B（Keycloak 26.8.0 のレルム corp が実物、Entra ID・Okta・Cognito・Auth0 は模擬。
# 入口で内部トークンに交換する）に、シナリオ C（エージェントがツールサーバー invoice-mcp を経て請求書の API invoices を呼ぶ）を足した。
# #4 が求める P1＋P4＋P5 の Full のうち、B だけでは P4（委任）が無いため。scenario は B（casestudy_check は 1 つのシナリオで照合する）。
# C から持ち込んだ行と、P5 の Txn-Token の行で B の判定と違うものは templates/casestudy-deviations.yaml に kind: carry で載せた。
# 外部の IdP（模擬の Entra・Okta・Cognito・Auth0）の独自のクレーム（oid・tid・uid・groups の超過・cognito:groups・token_use・cid など）は、
# 入口（gateway）が正規化の入力として読むだけで、組織のトークンには載せない。台帳の行にはせず、正規化した行（C-user-id・C-roles・C-acr）の
# upstream_issuer.source_attribute に書いた（ケーススタディの「入口の正規化でのみ読む」の行は casestudy-deviations.yaml の not_in_example）。
# 定義の寿命の層の見本として、廃止予定（deprecated）の行を 1 つ置いた（C-employee-id。sunset_on 2027-03-31。#3 から回したもの）。
# 行の数：46（採用 34・既定どおり 4・却下 8）。載せる 38 行のうち status deprecated 1、ほかは active
scenario: B
casestudy_commit: 080b8da
namespaces:
  - namespace: "https://claims.example.com/"
    style: object
    owner: 社内 ID 基盤チーム（台帳の持ち主。templates/registry/README.md の「組織の名前空間の持ち主」）
    namespace_version: C-v
    assignment: 名前空間の下の名前は、この台帳への登録（PR と追加前の 25 問）でだけ割り当てる
data_category_vocabulary:
  name: fideslang
  version: "3.1.4"
  url: "https://github.com/ethyca/fideslang/blob/3.1.4/data_files/data_categories.csv"
  license: CC-BY-4.0
  verified_on: "2026-11-22"
data_category_extensions:
  - key: system.operations.transaction
    parent: system.operations
    description: 呼び出し全体の取引の識別子と文脈（Txn-Token の txn・tctx。fideslang 3.1.4 に専用のキーがない）
    owner: 社内 ID 基盤チーム
  - key: user.authorization.delegation
    parent: user.authorization
    description: 委任の記録（今の代理者・委任の連鎖・承認の記録の ID）
    owner: 社内 ID 基盤チーム
claims:
  # ------------------------------------------------------------ 登録されたクレーム（採用）
  - id: C-iss
    name: iss
    namespace: null
    catalog_refs: ["jwt-claims-casestudy@080b8da:CLM-0091", "jwt-claims-casestudy@080b8da:CLM-0092", "jwt-claims-casestudy@080b8da:CLM-0093", "jwt-claims-casestudy@080b8da:CLM-0098", "jwt-claims-casestudy@080b8da:CLM-0099", "jwt-claims-casestudy@080b8da:CLM-0100", "jwt-claims-casestudy@080b8da:CLM-0101"]
    registered_ref: {kind: spec, id: "RFC 7519 §4.1.1", url: "https://www.rfc-editor.org/rfc/rfc7519#section-4.1.1"}
    type: string
    shape: single
    description: トークンの発行者。Keycloak のレルム corp、入口のトークン発行サービス（STS）、Txn-Token のサービス（TTS）、外部の IdP（模擬）のどれか
    not_meaning: トークンを今送ってきた相手ではない。外部の IdP の iss は組織の発行者ではなく、内側のサービスは受け入れない
    decision: 採用
    rationale: 受け手ごとに受け入れる iss を 1 つに固定する。内側のサービスは STS の iss だけ、入口は Keycloak と外部の IdP の iss だけを受ける。iss と鍵の組で検証し、別の発行者の鍵で署名した偽の iss を拒否する
    refs:
      - {kind: spec, id: "RFC 9068 §4", url: "https://www.rfc-editor.org/rfc/rfc9068#section-4"}
      - {kind: guide-slide, id: p00-incident-signature-valid}
      - {kind: guide-slide, id: p03-absorb-idp-differences}
    assumption: 外部の IdP の発行者は、入口の許可リストにある 4 つ（Entra は 1 つの顧客テナントに固定）だけ
    revisit_trigger: 新しい IdP か、Entra の別のテナントを受け入れるとき
    spec_version: [draft-ietf-oauth-transaction-tokens-11]
    usage: authz
    answers: [q-user]
    issuers: ["https://idp.example.com/realms/corp", "https://sts.corp.example.com", "https://tts.corp.example.com", "https://login.microsoftonline.com/11111111-aaaa-4bbb-8ccc-000000000001/v2.0", "https://corp.okta.example.com/oauth2/default", "https://cognito-idp.ap-northeast-1.amazonaws.com/ap-northeast-1_EXAMPLE", "https://corp.auth0.example.com/"]
    authoritative_writer:
      - {stage: "②", writer: Keycloak（レルム corp）と外部の IdP, configurable_by: [platform]}
      - {stage: "③", writer: 入口の STS（gateway）, configurable_by: [platform]}
      - {stage: "④", writer: TTS, configurable_by: [platform]}
    issue_events: [I01, I02, I06, I09, I13, I21, I22]
    source_system: 各発行者の設定（Keycloak のレルムの Frontend URL、STS・TTS の設定）
    volatility: never
    propagation_delay: 0
    recompute_trigger: [login, refresh, exchange, reissue]
    on_revoke: 値は変わらない。発行者をやめたら、受け手の許可リストから外す
    carried_in: [KC_AT, IDT, LOGOUT, EXT_AT, INT_AT, INT_AT_LEDGER, INT_AT_DOCS, INT_AT_PAYROLL, TXN, AGENT_AT, TASK_AT]
    consumers: [gateway, portal, orders, ledger, docs, payroll, invoice-mcp, invoices, payment-worker]
    consumer_access_path:
      - {consumer: gateway, via: token_library, note: 入口の検証の部品（IdP ごとの許可リストと JWKS）}
      - {consumer: orders, via: token_library, note: 組織共通の検証の部品（STS の iss だけ）}
    on_missing: 拒否
    absent_semantics: {absent: 拒否, empty_string: 拒否}
    value_normalization: {case: as_is, compare: exact, normalized_by: 発行者が設定した文字列のまま。受け手は完全一致で比べる}
    enforced_at:
      - {service: gateway, check: KC_AT・EXT_AT の iss を入口の許可リスト（5 つ）と完全一致で比べ、鍵はその iss のメタデータの jwks_uri からだけ取る。Entra の iss はテンプレート形式を受けず、固定のテナント ID の値だけ}
      - {service: orders, check: INT_AT の iss が STS と完全一致。外部の IdP・Keycloak の iss のトークンは受けない（ケーススタディ B7）}
      - {service: ledger, check: INT_AT の iss が STS と完全一致。TXN の iss が TTS と完全一致}
      - {service: docs, check: INT_AT の iss が STS と完全一致}
      - {service: payroll, check: INT_AT の iss が STS と完全一致}
      - {service: invoice-mcp, check: AGENT_AT の iss が STS と完全一致}
      - {service: invoices, check: TASK_AT の iss が STS と完全一致}
      - {service: portal, check: IDT・LOGOUT の iss が Keycloak のレルム corp と完全一致}
      - {service: payment-worker, check: メッセージに付いた TXN の iss が TTS と完全一致}
    max_bytes: 96
    overflow_strategy: 上限で固定（超えない値域）
    pii_category: 該当なし
    log_policy: 記録する
    data_category: [system.operations]
    identifier_properties: {stable: true, reassignable: false, pairwise: false, id_scheme: url}
    confidential_from: []
    status: active
    owner: 社内 ID 基盤チーム
    change_controller: IETF（RFC 7519）
    evidence: ["jwt-claims-casestudy@080b8da:B7", "jwt-claims-casestudy@080b8da:B10", "jwt-claims-casestudy@080b8da:G9", "jwt-claims-casestudy@080b8da:G10"]
    asvs_ids: ["v5.0.0-9.2.4"]
    note: max_bytes は最も長い Cognito の iss（87 バイト）に余裕を足した値

  - id: C-sub
    name: sub
    namespace: null
    catalog_refs: ["jwt-claims-casestudy@080b8da:CLM-0029", "jwt-claims-casestudy@080b8da:CLM-0030", "jwt-claims-casestudy@080b8da:CLM-0033", "jwt-claims-casestudy@080b8da:CLM-0047", "jwt-claims-casestudy@080b8da:CLM-0048", "jwt-claims-casestudy@080b8da:CLM-0050"]
    registered_ref: {kind: spec, id: "RFC 7519 §4.1.2", url: "https://www.rfc-editor.org/rfc/rfc7519#section-4.1.2"}
    type: string
    shape: single
    description: 「誰の権限で」の主体。Keycloak・外部の IdP のトークンでは、その発行者の中の利用者の ID。STS・TTS のトークンでは、入口が正規化した組織の利用者 ID（C-user-id と同じ値）
    not_meaning: 実行しているエージェントやツールではない（それは act）。IdP をまたいで同じ人を指すのは、STS が書いた sub だけ
    decision: 採用
    rationale: 委任のトークン（AGENT_AT・TASK_AT）でも sub は利用者のまま保ち、エージェントは act に書く。受け手は sub で請求書の持ち主と照合し、交換で sub を差し替えたトークンを拒否する（ケーススタディ C15）
    refs:
      - {kind: spec, id: "RFC 8693 §4.1", url: "https://www.rfc-editor.org/rfc/rfc8693#section-4.1"}
      - {kind: guide-slide, id: p05-one-request-carries}
      - {kind: guide-slide, id: p04-immutable-identifiers}
    assumption: 入口が IdP ごとの不変の ID（Keycloak の sub、Entra の tid と oid、Okta の uid、Cognito・Auth0 の sub）から組織の利用者 ID を引く対応表を持つ
    revisit_trigger: 同じ人が 2 つの IdP で別の利用者として現れ、名寄せの規則が要るとき
    spec_version: [draft-ietf-oauth-transaction-tokens-11]
    usage: identifier
    answers: [q-sub]
    does_not_answer: [q-actor, q-agent]
    issuers: ["https://idp.example.com/realms/corp", "https://sts.corp.example.com", "https://tts.corp.example.com", "https://login.microsoftonline.com/11111111-aaaa-4bbb-8ccc-000000000001/v2.0", "https://corp.okta.example.com/oauth2/default", "https://cognito-idp.ap-northeast-1.amazonaws.com/ap-northeast-1_EXAMPLE", "https://corp.auth0.example.com/"]
    authoritative_writer:
      - {stage: "②", writer: Keycloak（basic スコープの sub マッパー）と外部の IdP, configurable_by: [platform]}
      - {stage: "③", writer: 入口の STS（対応表で組織の利用者 ID に置き換える）, configurable_by: [platform]}
    provenance: 発行者が確かめた値
    verification_method: 入口が IdP のトークンを検証したうえで、IdP ごとの不変の ID から対応表で引く。メール・ログイン名からは引かない
    issue_events: [I01, I02, I06, I13, I21, I22]
    source_system: Keycloak のユーザー（レルム corp）と、入口の利用者の対応表（人事の社員の台帳から作る）
    volatility: never
    propagation_delay: 0
    recompute_trigger: [login, refresh, exchange, reissue]
    on_revoke: 利用者を無効にしたら、新しい発行は止まる。発行済みのトークンは寿命まで残る（ライフサイクル表）
    carried_in: [KC_AT, IDT, EXT_AT, INT_AT, INT_AT_LEDGER, INT_AT_DOCS, INT_AT_PAYROLL, TXN, AGENT_AT, TASK_AT]
    consumers: [gateway, portal, orders, ledger, docs, invoice-mcp, invoices, payment-worker]
    on_missing: 拒否
    absent_semantics: {absent: 拒否, "null": 拒否, empty_string: 拒否}
    value_normalization: {case: as_is, compare: exact, normalized_by: 入口の STS が対応表の値をそのまま書く}
    enforced_at:
      - {service: gateway, check: 文字列であること。IdP ごとの不変の ID（Entra は tid と oid、Okta は uid）で対応表を引き、ログイン名・メールは使わない（ケーススタディ B13）}
      - {service: orders, check: 文字列であること。注文の持ち主の列と照合する（BOLA）}
      - {service: invoices, check: "TASK_AT の sub が請求書の持ち主と一致し、承認の記録の持ち主とも一致する（ケーススタディ C3・C15）"}
      - {service: invoice-mcp, check: AGENT_AT の sub を交換の subject に使い、交換の前後で sub が変わっていないこと}
      - {service: ledger, check: 文字列であること。TXN の sub と INT_AT の sub が一致すること}
      - {service: docs, check: 文字列であること}
      - {service: portal, check: IDT の sub が文字列であること}
      - {service: payment-worker, check: TXN の sub を処理の主体として記録する（値はハッシュで残す）}
    max_bytes: 36
    overflow_strategy: 上限で固定（超えない値域）
    pii_category: 個人情報
    log_policy: ハッシュ化して記録
    data_category: [user.unique_id]
    identifier_properties: {stable: true, reassignable: false, pairwise: false, id_scheme: uuid}
    confidential_from: []
    recipients_external: []
    cross_border: {transfers: false}
    status: active
    owner: 社内 ID 基盤チーム
    change_controller: IETF（RFC 7519）
    evidence: ["jwt-claims-casestudy@080b8da:B13", "jwt-claims-casestudy@080b8da:B14", "jwt-claims-casestudy@080b8da:C3", "jwt-claims-casestudy@080b8da:C15"]
    asvs_ids: ["v5.0.0-10.3.2"]

  - id: C-aud
    name: aud
    namespace: null
    catalog_refs: ["jwt-claims-casestudy@080b8da:CLM-0070", "jwt-claims-casestudy@080b8da:CLM-0071", "jwt-claims-casestudy@080b8da:CLM-0073", "jwt-claims-casestudy@080b8da:CLM-0077", "jwt-claims-casestudy@080b8da:CLM-0078", "jwt-claims-casestudy@080b8da:CLM-0079", "jwt-claims-casestudy@080b8da:CLM-0080", "jwt-claims-casestudy@080b8da:CLM-0081"]
    registered_ref: {kind: spec, id: "RFC 7519 §4.1.3", url: "https://www.rfc-editor.org/rfc/rfc7519#section-4.1.3"}
    type: string
    shape: array
    max_items: 4
    typical_items: 1
    description: トークンの宛先。INT_AT・AGENT_AT・TASK_AT は宛先を 1 つに絞る。KC_AT は入口が交換する 4 つのサービス、TXN は信頼ドメイン
    not_meaning: 呼び出し元ではない。複数の宛先を持つトークンは、どれか 1 つの宛先への許可ではない
    decision: 採用
    rationale: ホップごとに宛先を 1 つに絞り、受け取ったトークンを別の宛先へ転送させない（ケーススタディ B3・C2・C13）。外部の IdP の宛先の表し方の違い（Cognito は aud がない）は入口で吸収する
    refs:
      - {kind: spec, id: "RFC 8707 §2", url: "https://www.rfc-editor.org/rfc/rfc8707#section-2"}
      - {kind: guide-slide, id: p06-narrow-downstream}
      - {kind: guide-slide, id: p10-mcp-authorization}
    assumption: STS は resource indicator の値を 1 つだけ受け、その値を aud に書く
    revisit_trigger: 1 つのトークンで 2 つ以上のサービスを呼ぶ設計にするとき
    spec_version: [draft-ietf-oauth-transaction-tokens-11]
    usage: authz
    answers: [q-resource]
    issuers: ["https://idp.example.com/realms/corp", "https://sts.corp.example.com", "https://tts.corp.example.com", "https://login.microsoftonline.com/11111111-aaaa-4bbb-8ccc-000000000001/v2.0", "https://corp.okta.example.com/oauth2/default", "https://cognito-idp.ap-northeast-1.amazonaws.com/ap-northeast-1_EXAMPLE", "https://corp.auth0.example.com/"]
    authoritative_writer:
      - {stage: "②", writer: Keycloak（Audience マッパー）と外部の IdP, configurable_by: [platform]}
      - {stage: "③", writer: 入口の STS（resource indicator の値）, configurable_by: [platform]}
      - {stage: "④", writer: TTS（信頼ドメイン）, configurable_by: [platform]}
    issue_events: [I01, I02, I06, I09, I13, I21, I22]
    source_system: Keycloak のクライアントのマッパーの設定、STS の宛先の表
    volatility: never
    propagation_delay: 0
    recompute_trigger: [login, refresh, exchange, reissue]
    on_revoke: 値は変わらない
    carried_in: [KC_AT, IDT, LOGOUT, EXT_AT, INT_AT, INT_AT_LEDGER, INT_AT_DOCS, INT_AT_PAYROLL, TXN, AGENT_AT, TASK_AT]
    consumers: [gateway, portal, orders, ledger, docs, payroll, invoice-mcp, invoices, payment-worker]
    on_missing: 拒否
    absent_semantics: {absent: 拒否, empty_array: 拒否}
    enforced_at:
      - {service: gateway, check: "KC_AT・EXT_AT の aud に入口の宛先が含まれる。Cognito の AT は aud がないので client_id を許可リストと照合する（ケーススタディ B16）"}
      - {service: orders, check: INT_AT の aud が orders だけ（文字列と配列の両方の形を受け、要素が 1 つで orders であること）}
      - {service: ledger, check: INT_AT の aud が ledger だけ。TXN の aud が信頼ドメイン}
      - {service: docs, check: INT_AT の aud が docs だけ}
      - {service: payroll, check: INT_AT の aud が payroll だけ}
      - {service: invoice-mcp, check: "AGENT_AT の aud が invoice-mcp だけ。自分宛てでないトークンは受けず、受けたトークンを上流に渡さない（ケーススタディ C2・C13）"}
      - {service: invoices, check: TASK_AT の aud が invoices だけ（2 つ以上なら拒否）}
      - {service: portal, check: IDT・LOGOUT の aud が portal}
      - {service: payment-worker, check: TXN の aud が信頼ドメイン}
    max_bytes: 26
    overflow_strategy: 上限で固定（超えない値域）
    pii_category: 該当なし
    log_policy: 記録する
    data_category: [system.operations]
    confidential_from: []
    status: active
    owner: 社内 ID 基盤チーム
    change_controller: IETF（RFC 7519）
    evidence: ["jwt-claims-casestudy@080b8da:B3", "jwt-claims-casestudy@080b8da:B16", "jwt-claims-casestudy@080b8da:C2", "jwt-claims-casestudy@080b8da:C13"]
    asvs_ids: ["v5.0.0-10.3.1"]
    note: 形は配列（KC_AT が宛先を 4 つ持つ）。INT_AT・AGENT_AT・TASK_AT は要素 1 つ。max_bytes は最も長い宛先 https://corp.example.com（24 バイト）に余裕を足した値

  - id: C-exp
    name: exp
    namespace: null
    catalog_refs: ["jwt-claims-casestudy@080b8da:CLM-0122", "jwt-claims-casestudy@080b8da:CLM-0123", "jwt-claims-casestudy@080b8da:CLM-0124", "jwt-claims-casestudy@080b8da:CLM-0129", "jwt-claims-casestudy@080b8da:CLM-0130", "jwt-claims-casestudy@080b8da:CLM-0131"]
    registered_ref: {kind: spec, id: "RFC 7519 §4.1.4", url: "https://www.rfc-editor.org/rfc/rfc7519#section-4.1.4"}
    type: integer
    shape: single
    description: 有効期限（UNIX 時刻の秒）
    not_meaning: セッションや委任の終わりではない
    decision: 採用
    rationale: 種別ごとの寿命（どれも 300 秒以下）を強制する。剥奪が反映されるまでの上限がこの値で決まる
    refs:
      - {kind: spec, id: "RFC 9068 §2.2", url: "https://www.rfc-editor.org/rfc/rfc9068#section-2.2"}
      - {kind: guide-slide, id: p08-token-types-lifetimes}
    assumption: 受け手の時計は NTP で合わせ、ずれは 30 秒まで
    revisit_trigger: 種別の寿命を変えるとき
    spec_version: [draft-ietf-oauth-transaction-tokens-11]
    usage: protocol
    issuers: ["https://idp.example.com/realms/corp", "https://sts.corp.example.com", "https://tts.corp.example.com", "https://login.microsoftonline.com/11111111-aaaa-4bbb-8ccc-000000000001/v2.0", "https://corp.okta.example.com/oauth2/default", "https://cognito-idp.ap-northeast-1.amazonaws.com/ap-northeast-1_EXAMPLE", "https://corp.auth0.example.com/"]
