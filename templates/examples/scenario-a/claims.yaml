template_version: 0.1.0
# 縮小 Lite の案（関門 1、research/template-design/gate1.md）：中身は消していない。縮小 Lite では
#   - 載せて受け手が読む行：issue_events・recompute_trigger・propagation_delay・change_controller・status・issuers は
#     IdP モジュールと token_types から生成し、手で書かない。単一値の overflow_strategy は既定（上限で固定）
#   - 既定どおりで consumers: [] の行（auth_time・typ・sid・scope）：name・namespace・type・shape・decision・rationale・refs・
#     max_bytes・pii_category・carried_in だけを書く（R8 の計算に要るもの）。ほかの列は Full だけ
#   - 却下の行：今と同じ
#   - 組織の名前空間の共有クレーム（tenant_id・user_id・roles・v）は、追加前の 25 問を手で書く（claim_request_tenant_id.md）
# 記入例（シナリオ A：マルチテナント SaaS、Keycloak 26.8）。推奨ではない。この前提での一例で、自組織の判断の代わりにしない。
# 台帳のスキーマ v0（templates/registry/claims.schema.json）で書いた。列の過不足は research/template-design/v0-columns.md。
# クレームの名前と型の正はケーススタディ（catalog_refs のコミット）。判定が違う行は templates/casestudy-deviations.yaml に載せた。
# 行の数：25（採用 14・既定どおり 5・却下 6）
scenario: A
casestudy_commit: 080b8da
claims:
  # ------------------------------------------------------------ 標準のクレーム（採用）
  - id: C-iss
    name: iss
    namespace: null
    catalog_refs: ["jwt-claims-casestudy@080b8da:CLM-0092", "jwt-claims-casestudy@080b8da:CLM-0093"]
    registered_ref: {kind: spec, id: "RFC 7519 §4.1.1", url: "https://www.rfc-editor.org/rfc/rfc7519#section-4.1.1"}
    type: string
    shape: single
    description: トークンを発行したテナントのレルム（発行者）の URL。テナントごとに 1 つ
    not_meaning: 利用者の所属テナントそのものではない。テナントの判定は iss と tenant_id の対応で行う
    decision: 採用
    rationale: レルムがテナントごとに分かれているので、iss がテナントの境界になる。テナントを決めるのは iss（許可リストとレルムごとの鍵）で、API は iss から対応表でテナントを引く。tenant_id は照合に使い、他テナントの管理者のマッパーで書かれた tenant_id を拒否する
    refs:
      - {kind: spec, id: "RFC 9068 §2.2", url: "https://www.rfc-editor.org/rfc/rfc9068#section-2.2"}
      - {kind: guide-slide, id: p05-multitenancy}
    assumption: テナントとレルムが 1 対 1 で、レルムの名前はテナント ID と同じ
    revisit_trigger: 1 つのレルムに複数のテナントを入れる（Keycloak の Organizations など）とき
    usage: authz
    issuers: ["https://idp.example.com/realms/{tenant}"]
    authoritative_writer: {stage: "②", writer: Keycloak（テナントのレルム）}
    issue_events: [I01, I02]
    source_system: Keycloak のレルムの設定（Frontend URL とレルム名）
    volatility: 0
    propagation_delay: 0
    recompute_trigger: [login, refresh]
    on_revoke: 値は変わらない。レルムを廃止したら、API の許可リストから外す
    carried_in: [AT, IDT]
    consumers: [saas-api, saas-web]
    on_missing: 拒否
    enforced_at:
      - {service: saas-api, check: 許可リストと完全一致。鍵はその iss の JWKS だけから取る}
      - {service: saas-api, check: iss から対応表（許可リスト）でテナント ID を引き、app.tenant にはこの値を使う}
      - {service: saas-api, check: iss のレルム名と tenant_id が一致するか}
    max_bytes: 63
    overflow_strategy: 上限で固定（超えない値域）
    pii_category: 該当なし
    log_policy: 記録する
    status: active
    owner: SaaS 基盤チーム
    change_controller: IETF（RFC 7519）
    evidence: ["jwt-claims-casestudy@080b8da:A8", "jwt-claims-casestudy@080b8da:A9", "jwt-claims-casestudy@080b8da:A10"]
    note: max_bytes は「https://idp.example.com/realms/」（31 バイト）＋レルム名 32 バイト

  - id: C-sub
    name: sub
    namespace: null
    catalog_refs: ["jwt-claims-casestudy@080b8da:CLM-0030", "jwt-claims-casestudy@080b8da:CLM-0033"]
    registered_ref: {kind: spec, id: "RFC 7519 §4.1.2", url: "https://www.rfc-editor.org/rfc/rfc7519#section-4.1.2"}
    type: string
    shape: single
    description: レルムの中の利用者の ID（Keycloak のユーザー ID、UUID）
    not_meaning: テナントをまたいで同じ人を指す ID ではない。ログイン名やメールではない
    decision: 採用
    rationale: BOLA の照合（請求書の持ち主との一致）の鍵は sub だけにする。請求書の持ち主の列（owner_sub）に sub を入れ、iss から引いたテナントと組で照合する。変わらない ID なので、名前の再利用で別人に一致しない
    refs:
      - {kind: spec, id: "RFC 9068 §2.2", url: "https://www.rfc-editor.org/rfc/rfc9068#section-2.2"}
      - {kind: guide-slide, id: p04-immutable-identifiers}
    assumption: 利用者はレルムの中で作り直さない（作り直すと別の sub になる）。テナントの管理者は自分のレルムで利用者を作り直せるが、これはテナントの中の権限として受け入れる（他テナントには効かない）
    revisit_trigger: 利用者を別のレルムへ移す運用を始めるとき
    usage: identifier
    issuers: ["https://idp.example.com/realms/{tenant}"]
    authoritative_writer: {stage: "②", writer: Keycloak（basic スコープの sub マッパー）}
    issue_events: [I01, I02]
    source_system: Keycloak のユーザー（レルムの DB）
    volatility: 0
    propagation_delay: 0
    recompute_trigger: [login, refresh]
    on_revoke: 利用者を無効にしたら、新しい発行は止まる。発行済みの AT は exp まで残る（ライフサイクル表）
    carried_in: [AT, IDT]
    consumers: [saas-api, saas-web]
    on_missing: 拒否
    enforced_at:
      - {service: saas-api, check: 文字列であること}
      - {service: saas-api, check: "BOLA：請求書の owner_sub = sub、かつ請求書の tenant_id = iss から引いたテナント"}
    max_bytes: 36
    overflow_strategy: 上限で固定（超えない値域）
    pii_category: 個人情報
    log_policy: ハッシュ化して記録
    status: active
    owner: SaaS 基盤チーム
    change_controller: IETF（RFC 7519）
    evidence: ["jwt-claims-casestudy@080b8da:A3", "jwt-claims-casestudy@080b8da:A6"]

  - id: C-aud
    name: aud
    namespace: null
    catalog_refs: ["jwt-claims-casestudy@080b8da:CLM-0071", "jwt-claims-casestudy@080b8da:CLM-0073"]
    registered_ref: {kind: spec, id: "RFC 7519 §4.1.3", url: "https://www.rfc-editor.org/rfc/rfc7519#section-4.1.3"}
    type: string
    shape: single
    description: AT では宛先の API（saas-api）。ID トークンではクライアント（saas-web）
    not_meaning: 呼び出し元ではない
    decision: 採用
    rationale: ID トークンを API に送る誤りと、別の API 宛てのトークンの流用を拒否する
    refs:
      - {kind: spec, id: "RFC 9068 §4", url: "https://www.rfc-editor.org/rfc/rfc9068#section-4"}
      - {kind: guide-slide, id: p06-validation-split}
    assumption: AT の宛先は saas-api の 1 つだけ（Keycloak は宛先が 1 つなら文字列で出す）
    revisit_trigger: AT を 2 つ以上の API に送る構成にするとき（配列になる）
    usage: authz
    issuers: ["https://idp.example.com/realms/{tenant}"]
    authoritative_writer: {stage: "②", writer: Keycloak（Audience マッパー aud-saas-api）}
    issue_events: [I01, I02]
    source_system: Keycloak のクライアントのマッパーの設定
    volatility: 0
    propagation_delay: 0
    recompute_trigger: [login, refresh]
    on_revoke: 値は変わらない
    carried_in: [AT, IDT]
    consumers: [saas-api, saas-web]
    on_missing: 拒否
    enforced_at:
      - {service: saas-api, check: aud が saas-api と一致}
      - {service: saas-web, check: ID トークンの aud が saas-web と一致}
    max_bytes: 8
    overflow_strategy: 上限で固定（超えない値域）
    pii_category: 該当なし
    log_policy: 記録する
    status: active
    owner: SaaS 基盤チーム
    change_controller: IETF（RFC 7519）
    evidence: ["jwt-claims-casestudy@080b8da:A13"]

  - id: C-exp
    name: exp
    namespace: null
    catalog_refs: ["jwt-claims-casestudy@080b8da:CLM-0123", "jwt-claims-casestudy@080b8da:CLM-0124"]
    registered_ref: {kind: spec, id: "RFC 7519 §4.1.4", url: "https://www.rfc-editor.org/rfc/rfc7519#section-4.1.4"}
    type: integer
    shape: single
    description: 有効期限（UNIX 時刻の秒）
    not_meaning: セッションの終わりではない
    decision: 採用
    rationale: 寿命 300 秒を強制する。剥奪が反映されるまでの上限がこの値で決まる
    refs:
      - {kind: spec, id: "RFC 9068 §2.2", url: "https://www.rfc-editor.org/rfc/rfc9068#section-2.2"}
      - {kind: guide-slide, id: p08-token-types-lifetimes}
    assumption: API の時計は NTP で合わせ、ずれは 30 秒まで
    revisit_trigger: AT の寿命を変えるとき
    usage: protocol
    issuers: ["https://idp.example.com/realms/{tenant}"]
    authoritative_writer: {stage: "②", writer: Keycloak（レルムの accessTokenLifespan）}
    issue_events: [I01, I02]
    source_system: Keycloak のレルムの設定
    volatility: 0
    propagation_delay: 0
    recompute_trigger: [login, refresh]
    on_revoke: 該当なし
    carried_in: [AT, IDT]
    consumers: [saas-api, saas-web]
    on_missing: 拒否
    enforced_at:
      - {service: saas-api, check: 必須。exp を過ぎたら拒否（受け手の時計のずれは 30 秒まで。受け入れの最大は発行から 330 秒）}
      - {service: saas-api, check: "exp − iat が max_lifetime（300 秒）を超えたら拒否（exp と iat はどちらも発行者が書く値なので、時計のずれは足さない）。寿命はテナントの管理者がレルムで変えられるので、上限は API が強制する"}
    max_bytes: 10
    overflow_strategy: 上限で固定（超えない値域）
    pii_category: 該当なし
    log_policy: 記録する
    status: active
    owner: SaaS 基盤チーム
    change_controller: IETF（RFC 7519）
    evidence: ["jwt-claims-casestudy@080b8da:A14"]
    note: 10 桁は 2286 年まで

  - id: C-iat
    name: iat
    namespace: null
    catalog_refs: ["jwt-claims-casestudy@080b8da:CLM-0134", "jwt-claims-casestudy@080b8da:CLM-0136"]
    registered_ref: {kind: spec, id: "RFC 7519 §4.1.6", url: "https://www.rfc-editor.org/rfc/rfc7519#section-4.1.6"}
    type: integer
    shape: single
    description: 発行の時刻（UNIX 時刻の秒）
    not_meaning: 認証の時刻ではない（auth_time）
    decision: 採用
    rationale: 監査で、どの時点の属性で発行されたかを追う
    refs:
      - {kind: spec, id: "RFC 9068 §2.2", url: "https://www.rfc-editor.org/rfc/rfc9068#section-2.2"}
    assumption: 監査ログに iat を残す
    usage: protocol
    issuers: ["https://idp.example.com/realms/{tenant}"]
    authoritative_writer: {stage: "②", writer: Keycloak}
    issue_events: [I01, I02]
    source_system: Keycloak の時計
    volatility: 0
    propagation_delay: 0
    recompute_trigger: [login, refresh]
    on_revoke: 該当なし
    carried_in: [AT, IDT]
    consumers: [saas-api]
    on_missing: 拒否
    enforced_at:
      - {service: saas-api, check: 必須。未来の時刻（30 秒を超える）は拒否}
      - {service: saas-api, check: exp − iat の検査に使う（C-exp）}
    max_bytes: 10
    overflow_strategy: 上限で固定（超えない値域）
    pii_category: 該当なし
    log_policy: 記録する
    status: active
    owner: SaaS 基盤チーム
    change_controller: IETF（RFC 7519）
    evidence: []

  - id: C-jti
    name: jti
    namespace: null
    catalog_refs: ["jwt-claims-casestudy@080b8da:CLM-0180"]
    registered_ref: {kind: spec, id: "RFC 7519 §4.1.7", url: "https://www.rfc-editor.org/rfc/rfc7519#section-4.1.7"}
    type: string
    shape: single
    description: トークンの ID。Keycloak 26.8 では、発行の種類を表す接頭辞と UUID（見本では onrtac:＋UUID）
    not_meaning: セッションの ID ではない（sid）
    decision: 採用
    rationale: 監査ログでトークンを特定する。RFC 9068 が AT に必須としている
    refs:
      - {kind: spec, id: "RFC 9068 §2.2", url: "https://www.rfc-editor.org/rfc/rfc9068#section-2.2"}
    assumption: 接頭辞は 6 文字（見本の onrtac）。リフレッシュなど別の発行で長さが変わるかは確かめていない
    revisit_trigger: Keycloak の版を上げるとき（jti の形式が変わる）
    usage: protocol
    issuers: ["https://idp.example.com/realms/{tenant}"]
    authoritative_writer: {stage: "②", writer: Keycloak}
    issue_events: [I01, I02]
    source_system: Keycloak
    volatility: 0
    propagation_delay: 0
    recompute_trigger: [login, refresh]
    on_revoke: 該当なし
    carried_in: [AT]
    consumers: [saas-api]
    on_missing: 拒否
    enforced_at:
      - {service: saas-api, check: 必須。監査ログに書く（再送の検知には使わない）}
    max_bytes: 43
    overflow_strategy: 上限で固定（超えない値域）
    pii_category: 該当なし
    log_policy: 記録する
    status: active
    owner: SaaS 基盤チーム
    change_controller: IETF（RFC 7519）
    evidence: []

  # ------------------------------------------------------------ Keycloak が既定で出すクレーム（既定どおり）
  - id: C-auth-time
    name: auth_time
    namespace: null
    catalog_refs: ["jwt-claims-casestudy@080b8da:CLM-0228", "jwt-claims-casestudy@080b8da:CLM-0229"]
    registered_ref: {kind: spec, id: "OpenID Connect Core 1.0 §2", url: "https://openid.net/specs/openid-connect-core-1_0.html#IDToken"}
    type: integer
    shape: single
    description: 利用者が認証した時刻
    not_meaning: 発行の時刻ではない
    decision: 既定どおり
    rationale: Keycloak の basic スコープが sub と一緒に出す。外すには sub だけの独自のスコープを作る必要があり、JSON で 23 バイト（"auth_time":と 10 桁とカンマ）のために設定の差分を増やさない。API は読まない
    refs:
      - {kind: guide-slide, id: p06-stage-map}
    usage: protocol
    issuers: ["https://idp.example.com/realms/{tenant}"]
    authoritative_writer: {stage: "①", writer: Keycloak（basic スコープの auth_time マッパー）}
    issue_events: [I01, I02]
    source_system: Keycloak のセッション
    volatility: 0
    propagation_delay: 0
    recompute_trigger: [login]
    on_revoke: 該当なし
    carried_in: [AT, IDT]
    consumers: []
    on_missing: 無視
    enforced_at: []
    max_bytes: 10
    overflow_strategy: 上限で固定（超えない値域）
    pii_category: 該当なし
    log_policy: 記録しない
    status: active
    owner: SaaS 基盤チーム
    change_controller: OpenID Foundation
    evidence: []
    note: consumers が空でも既定どおりの行として残す（R5 の「読まれないクレーム」の候補。R5 は #17）

  - id: C-typ-claim
    name: typ
    namespace: null
    catalog_refs: ["jwt-claims-casestudy@080b8da:CLM-0198"]
    type: string
    shape: single
    description: Keycloak 独自のペイロードの typ（AT では Bearer、ID トークンでは ID）。ヘッダーの typ（at+jwt）とは別
    not_meaning: トークンの種類の判定には使わない（ヘッダーの typ を使う）
    decision: 既定どおり
    rationale: 公式文書（26.8.2「Using lightweight access token」）は、軽量アクセストークンから外せない情報としてこれを挙げている。通常の AT について同じことは書いていないが、軽量にしても残るものは通常の AT でもマッパーで外せないと推論した（推論。2026-11-22 の見本の通常の AT にも出た）
    refs:
      - kind: spec
        id: "Keycloak Server Administration Guide（26.8.2）「Using lightweight access token」"
        url: "https://www.keycloak.org/docs/26.8.2/server_admin/#_using_lightweight_access_token"
        verified_on: 2026-11-22
    usage: protocol
    issuers: ["https://idp.example.com/realms/{tenant}"]
    authoritative_writer: {stage: "②", writer: Keycloak}
    issue_events: [I01, I02]
    source_system: Keycloak
    volatility: 0
    propagation_delay: 0
    recompute_trigger: [login, refresh]
    on_revoke: 該当なし
    carried_in: [AT, IDT]
    consumers: []
    on_missing: 無視
    enforced_at: []
    max_bytes: 6
    overflow_strategy: 上限で固定（超えない値域）
    pii_category: 該当なし
    log_policy: 記録しない
    status: active
    owner: SaaS 基盤チーム
    change_controller: Keycloak プロジェクト
    evidence: []

  - id: C-azp
    name: azp
    namespace: null
    catalog_refs: ["jwt-claims-casestudy@080b8da:CLM-0410", "jwt-claims-casestudy@080b8da:CLM-0406"]
    registered_ref: {kind: spec, id: "OpenID Connect Core 1.0 §2", url: "https://openid.net/specs/openid-connect-core-1_0.html#IDToken"}
    type: string
    shape: single
    description: トークンを受け取ったクライアントの ID（saas-web）
    not_meaning: 利用者ではない
    decision: 既定どおり
    rationale: 公式文書（26.8.2「Using lightweight access token」）は、軽量アクセストークンから外せない情報としてこれを挙げている。通常の AT について同じことは書いていないが、軽量にしても残るものは通常の AT でもマッパーで外せないと推論した（推論。2026-11-22 の見本の通常の AT にも出た）。Keycloak の AT には client_id が無いので、API が呼び出し元のクライアントを知る手段はこれだけになる
    refs:
      - kind: spec
        id: "Keycloak Server Administration Guide（26.8.2）「Using lightweight access token」"
        url: "https://www.keycloak.org/docs/26.8.2/server_admin/#_using_lightweight_access_token"
        verified_on: 2026-11-22
    usage: identifier
    issuers: ["https://idp.example.com/realms/{tenant}"]
    authoritative_writer: {stage: "②", writer: Keycloak}
    issue_events: [I01, I02]
    source_system: Keycloak のクライアントの設定
    volatility: 0
    propagation_delay: 0
    recompute_trigger: [login, refresh]
    on_revoke: クライアントを無効にしたら新しい発行が止まる
    carried_in: [AT, IDT]
    consumers: [saas-api]
    on_missing: 拒否
    enforced_at:
      - {service: saas-api, check: 許可したクライアント（saas-web）の一覧にあるか}
    max_bytes: 32
    overflow_strategy: 上限で固定（超えない値域）
    pii_category: 該当なし
    log_policy: 記録する
    status: active
    owner: SaaS 基盤チーム
    change_controller: OpenID Foundation
    evidence: []

  - id: C-sid
    name: sid
    namespace: null
    catalog_refs: ["jwt-claims-casestudy@080b8da:CLM-0243"]
    type: string
    shape: single
    description: Keycloak の SSO セッションの ID
    not_meaning: BFF のセッションの ID ではない
    decision: 既定どおり
    rationale: 公式文書（26.8.2「Using lightweight access token」）は、軽量アクセストークンから外せない情報としてこれを挙げている。通常の AT について同じことは書いていないが、軽量にしても残るものは通常の AT でもマッパーで外せないと推論した（推論。2026-11-22 の見本の通常の AT にも出た）。API は読まない
    refs:
      - kind: spec
        id: "Keycloak Server Administration Guide（26.8.2）「Using lightweight access token」"
        url: "https://www.keycloak.org/docs/26.8.2/server_admin/#_using_lightweight_access_token"
        verified_on: 2026-11-22
    usage: protocol
    issuers: ["https://idp.example.com/realms/{tenant}"]
    authoritative_writer: {stage: "①", writer: Keycloak}
    issue_events: [I01, I02]
    source_system: Keycloak のセッション
    volatility: 0
