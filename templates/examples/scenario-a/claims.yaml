  # ------------------------------------------------------------ 組織のクレーム（名前空間 https://claims.example.com/）
  - id: C-tenant-id
    name: tenant_id
    namespace: "https://claims.example.com/"
    catalog_refs: ["jwt-claims-casestudy@080b8da:ORG-01"]
    type: string
    shape: single
    description: 利用者が今回の操作で属するテナントの ID（不変）
    not_meaning: 請求書などのオブジェクトの持ち主の確認ではない（BOLA は sub とデータ側で確かめる）
    decision: 採用
    rationale: テナントを決めるのは iss で、tenant_id は照合用の写し。API は iss から引いたテナントと tenant_id とパスのテナントがすべて一致するときだけ受け入れ、iss から引いた値を DB の文脈（app.tenant）に入れる。パスやヘッダーのテナントでは決めない。ケーススタディの共通の基準（必須）に合わせて載せ、下流（ログ・将来の内部トークン）にテナントを明示する
    refs:
      - {kind: guide-slide, id: p05-multitenancy}
      - {kind: guide-slide, id: p07-row-level-security}
    assumption: テナントの管理者は自分のレルムの中では全権を持つ（マッパー・ロールの割り当て・AT の寿命を変えられる）。そのため API は、テナントの外に効くもの（どのテナントか、寿命の上限、ロールの語彙と件数、利用者の識別子）を iss と API 側の設定で強制し、トークンの値だけに頼らない
    revisit_trigger: 1 人の利用者が複数のテナントに属する（テナントの切り替え）要件が出たとき
    usage: authz
    issuers: ["https://idp.example.com/realms/{tenant}"]
    authoritative_writer: {stage: "②", writer: Keycloak（クライアント saas-web の Hardcoded claim マッパー。レルムごとに固定値）}
    issue_events: [I01, I02]
    source_system: SaaS のテナントの台帳（レルムの作成時にマッパーへ書く）
    volatility: 0
    propagation_delay: 0
    recompute_trigger: [login, refresh]
    on_revoke: テナントを停止したら、SaaS のテナントの台帳（Postgres の tenants.status）を停止にし、レルムも無効にして新しい発行を止める。API はすべての要求で、同じトランザクションの中で tenants.status を引き、停止なら拒否する（反映まで 0 秒。AT の exp を待たない）
    carried_in: [AT]
    consumers: [saas-api]
    on_missing: 拒否
    enforced_at:
      - {service: saas-api, check: 文字列であること（配列は拒否）}
      - {service: saas-api, check: iss のレルム名と一致するか}
      - {service: saas-api, check: パスのテナントと一致するか}
      - {service: saas-api, check: "トランザクションごとに set_config('app.tenant', $1, true) をパラメータで呼ぶ（SET LOCAL は値をバインドできないので使わない）。すべての SQL にもテナントの条件を付け、RLS と併用する"}
      - {service: postgres, check: "アプリのロール app_rls は、テーブルの所有者ではなく NOSUPERUSER・NOBYPASSRLS。テーブルは ENABLE と FORCE ROW LEVEL SECURITY。所有者はマイグレーションのロールで、アプリからは使わない。ビューは作らないか、security_invoker で作る。所有者の権限で動く SECURITY DEFINER の関数は作らない（作るなら所有者を RLS の対象のロールにする）"}
      - {service: postgres, check: "app.tenant が未設定（NULL・空文字）のとき、ポリシー tenant_id = current_setting('app.tenant', true) に一致する行はなく、全件を拒否する（tenant_id は NOT NULL、空文字は CHECK で禁止）"}
    integrity_until: ["Postgres のセッション変数 app.tenant（set_config の第 3 引数 true。U02）。ここから先は JWS で守られず、トランザクションの境界と、RLS をすり抜けないアプリのロールで守る"]
    max_bytes: 32
    overflow_strategy: 上限で固定（超えない値域）
    pii_category: 該当なし
    log_policy: 記録する
    status: active
    owner: SaaS 基盤チーム
    change_controller: SaaS 基盤チーム
    evidence: ["jwt-claims-casestudy@080b8da:A5", "jwt-claims-casestudy@080b8da:A7", "jwt-claims-casestudy@080b8da:A8", "jwt-claims-casestudy@080b8da:A11", "jwt-claims-casestudy@080b8da:A12"]

