# template_version: 0.1.0
# 縮小 Lite の案（関門 1）：「該当」は手で書く。「対象外」は、クライアントの設定のスイッチ 1 つで止めたイベントで指摘が出ていないもの
# （この例では I03・I04・I05・I07）だけ IdP モジュール（#4 の M_idp_keycloak）の既定の回答を引き継ぎ、「その設定を確かめた」の 1 欄を書く。
# 指摘が出た行・レルムやクライアントの既定に依存する行・利用イベント（I06・I08・I09・U05・U07・U08・U10）は assumption と breaks_when を
# 手で書く（tools/count_lite_fields.py の STRUCTURAL）
# 記入例（シナリオ A：マルチテナント SaaS、Keycloak 26.8）。推奨ではない。この前提での一例。
# カタログ（templates/catalog/issue_events.yaml・use_events.yaml。#2 で全体に広げた）の全イベントへの回答。
# 対象外 50 件／全 62 件（81%。I34 は PR #33 の独立点検で足した Keycloak の grant の一覧から）。v0 の 19 件（関門 1 の記入時間の数え方の対象）は、対象外 11 件／19 件（58%）
# #17（網羅の規則）で足した節：idp（R3・R3b）、subject_states（R4）、pairwise（R6）、outside_enumeration（R9）。
# どれも claim_lint の新しい規則が求める欄で、それまでの回答（answers）は変えていない。足した中身は design.md の 11. と 13.
idp:
  name: keycloak
  version: "26.8"
# ---------------------------------------------------------------- Lite の判定の 5 問（#4。claim_lint の L73、#6 で足した）
# 1 つでも Yes なら Full。この例はマルチテナントなので Full に当たるが、関門 1 の測定のために Lite の欄で書いた（design.md の冒頭）。
# そのため --profile lite では L73 の warn が出る（正しい指摘。research/template-design/gate1.md の 5. の A17）
lite_criteria:
  crosses_boundary: {answer: false, reason: トークンは組織の中（BFF・nginx・saas-api）だけを通り、外部の組織のサービスに渡さない}
  multitenant: {answer: true, reason: テナントごとにレルムを分けたマルチテナントの SaaS}
  delegation_or_exchange: {answer: false, reason: 代理・委任もトークン交換も置かない（TXN・INTERNAL は却下）}
  new_issuer: {answer: false, reason: 発行者は既存の Keycloak のレルムだけで、新しい発行者を作らない}
  regulated: {answer: false, reason: FAPI などの規制の対象ではない（issuance_profile.conformance_profile は none）}
# ---------------------------------------------------------------- 主体の状態 × トークン・セッション（R4）
# 行と列は templates/catalog/subject_state_matrix.md。結果は「発行・再計算・失効・影響なし」。カタログの結果は対策を入れる前の姿で、
# ここはこの設計での姿。「影響なし」「再計算」には、許す遅れか対策を basis に書く
subject_states:
  unused_layers:
    内部トークン: 入口での交換を置かない（design.md の 2.）。token_types に internal_token の行がなく、API は外部の AT をそのまま検証する
    Logout Token: LOGOUT は却下（token_types）。IdP 側のセッションの終了は、BFF のリフレッシュの失敗で知る（最大 330 秒の遅れを許す）
  states:
    subject-states/invited:
      AT: {result: 影響なし, basis: 利用者はテナントの管理者がレルムに作る。招待ではトークンを出さず、手元の AT も変わらない}
      RT: {result: 影響なし, basis: 招待では RT を出さない。既存の RT は既存のセッションに結びついたまま}
      ID: {result: 影響なし, basis: 招待では出さない。ID トークンは BFF がログインの時だけ使い、保存しない}
      IdP のセッション: {result: 影響なし, basis: 招待はセッションを作らない。最初のログイン（I25）で作る}
      RP・BFF のセッション: {result: 影響なし, basis: BFF は招待を知らない。最初のログインの後にセッションを作る}
    subject-states/active:
      AT: {result: 発行, basis: 最初のログイン（I25）で I01 と同じ発行。ロールを付ける前なら roles は空で出て、API は空のロールで何も許さない}
      RT: {result: 発行, basis: 認可コードの応答で BFF に出る（I01）。ローテーションあり}
      ID: {result: 発行, basis: ログインの応答で出る。BFF が検証して nonce を照合する（U03）}
      IdP のセッション: {result: 発行, basis: ログインで Keycloak の SSO セッションを作る（idle 1800 秒、最大 36000 秒）}
      RP・BFF のセッション: {result: 発行, basis: ID トークンの検証の後に BFF のセッションを作る（U03）}
    subject-states/suspended:
      AT: {result: 影響なし, basis: 手元の AT は exp まで API が受け入れる。最大 330 秒の遅れを許す（ライフサイクル表）。テナントの停止は DB で要求ごとに止める}
      RT: {result: 失効, basis: 無効化した利用者のリフレッシュを Keycloak が拒む（カタログのソースの要約。V31）。RT そのものは残るが、使えないので実質の失効として扱う。実物では確かめていない}
      ID: {result: 影響なし, basis: ID トークンはログインの時だけ使い、保存しない。停止の後に読まれることはない}
      IdP のセッション: {result: 影響なし, basis: 無効化でセッションを消すかは確かめていない（カタログ。V31）。ログインとリフレッシュは拒まれるので、残っても使えない前提}
      RP・BFF のセッション: {result: 失効, basis: 次のリフレッシュの失敗で BFF がセッションを終える。それまで最大 330 秒の遅れを許す}
    subject-states/deleted:
      AT: {result: 影響なし, basis: 手元の AT は exp まで受け入れる（最大 330 秒）。API は sub で DB の行を引くので、消した利用者の行が残っていれば読める}
      RT: {result: 失効, basis: 主体が無いので RT から AT を作れないと見込む（カタログでも推論。V36）。実物では確かめていない}
      ID: {result: 影響なし, basis: ID トークンはログインの時だけ使い、保存しない}
      IdP のセッション: {result: 失効, basis: 主体が無いセッションは使えないと見込む（カタログでも推論。V36）}
      RP・BFF のセッション: {result: 失効, basis: 次のリフレッシュの失敗で BFF がセッションを終える。それまで最大 330 秒の遅れを許す}
    subject-states/tenant-switch:
      AT: {result: 発行, basis: テナントはレルムごとに分かれ、切替は別のレルムへのログイン（I01）。前のテナントの AT は exp まで残るが、iss が違うので API は前のテナントとして扱う}
      RT: {result: 発行, basis: 新しいレルムのログインで出る。前のレルムの RT は、BFF がセッションごと捨てる}
      ID: {result: 発行, basis: 新しいレルムのログインの応答で出る。BFF は iss と nonce を照合する（U03）}
      IdP のセッション: {result: 発行, basis: レルムが違うので、新しいレルムの SSO セッションを作る。前のレルムのセッションは残る}
      RP・BFF のセッション: {result: 再計算, basis: BFF はセッションのテナントの文脈を、新しいレルムのトークンで置き換える。レルムごとに redirect_uri を分けて取り違えを防ぐ（12.）}
    subject-states/role-change:
      AT: {result: 再計算, basis: 次のリフレッシュ（I02）でマッパーが再実行され、新しいロールが出る（ケーススタディの実測 keycloak.refresh_reevaluation）。剥奪の反映は最大 330 秒を許す}
      RT: {result: 影響なし, basis: RT にロールは載らない。ローテーションで次のリフレッシュのときに替わる}
      ID: {result: 再計算, basis: リフレッシュの応答にも出るが、BFF は認可に使わない。ロールは AT だけで運ぶ}
      IdP のセッション: {result: 影響なし, basis: ロールの変更はセッションを終えない。次の発行で新しいロールが出る}
      RP・BFF のセッション: {result: 影響なし, basis: BFF はロールをセッションに写さない。ロールは API が AT から読む}
    subject-states/credential-change:
      AT: {result: 影響なし, basis: 手元の AT は exp まで受け入れる（最大 330 秒）。資格情報の変更で AT を止める仕組みは置かない}
      RT: {result: 影響なし, basis: Keycloak 26.3 からの既定では、ほかの端末の RT は残る（Sign out from other devices が未チェック）。残りを許すかは書き手が自信のない点（I26）}
      ID: {result: 影響なし, basis: ID トークンはログインの時だけ使い、保存しない。amr は使わない}
      IdP のセッション: {result: 影響なし, basis: 既定ではほかの端末のセッションも残る（Keycloak の文書。カタログの行列）。I26 の回答と同じ扱い}
      RP・BFF のセッション: {result: 影響なし, basis: BFF は資格情報の変更を知らない。IdP のセッションが残るので、リフレッシュも通る}
# ---------------------------------------------------------------- 主体の種類 × 発行イベント × 段階（R6、warn だけ）
# 主体の種類は slide:p05-three-principals の 3 つ。発行イベントは「該当」の発行（I01・I02・I25・I26）、段階はカタログの stage
pairwise:
  subject_kinds:
    利用者: {answer: 該当}
    ワークロード: {answer: 対象外, reason: サービス間の呼び出しも client credentials もない（I05 は対象外）。BFF は利用者の AT だけを API に送る}
    システム: {answer: 対象外, reason: 運用者の横断作業とバッチはこの例の範囲外（design.md の 6.）。代理操作（I19）も対象外}
  combinations:
    - {subject: 利用者, event: I01, stage: ①, note: 認可コード＋PKCE のログイン。acr・amr は使わず、auth_time は載るが読まない}
    - {subject: 利用者, event: I01, stage: ②, note: マッパーが tenant_id・user_id・roles・v を AT に足す（R3b：hook_invoked yes）}
    - {subject: 利用者, event: I02, stage: ②, note: リフレッシュでもマッパーが再実行される。ロールの変更は次のリフレッシュで反映される}
    - {subject: 利用者, event: I25, stage: ①, note: 初回ログインも I01 と同じ認証。必須のアクション（メールの確認など）は使わない}
    - {subject: 利用者, event: I25, stage: ②, note: ロールを付ける前なら roles は空で出る。マッパーが呼ばれるかはカタログで unknown（R3b の warn）}
    - {subject: 利用者, event: I26, stage: ①, note: パスワードの変更の後のログインは I01 と同じ認証。ほかの端末のセッションは既定で残る}
    - {subject: 利用者, event: I26, stage: ②, note: 変更の後の発行は I01 と同じ中身を見込む。マッパーが呼ばれるかはカタログで unknown（R3b の warn）}
# ---------------------------------------------------------------- この列挙の外に契機はないか（R9）
outside_enumeration:
  answer: カタログ（発行 33・利用 28）と keycloak-settings の外の契機を、境界の図・シーケンス図と Keycloak の文書で探した。新しい発行の契機は見つからなかったが、発行の中身が変わる場面を 1 つ見つけ、下の found に書いた
  respondent: 記入例の書き手（作成者）
  date: "2026-11-22"
  searched:
    - design.md の 2. 範囲と信頼の境界の図と 9. ライフサイクル表（矢印と層ごとに、カタログのどのイベントかを確かめた。7. シーケンス図は Full だけの節なので使っていない）
    - Keycloak 26.8.2 の javadoc「OAuth2GrantType」の実装クラスの一覧（https://www.keycloak.org/docs-api/latest/javadocs/org/keycloak/protocol/oidc/grants/OAuth2GrantType.html。カタログの keycloak-grant-types）
    - Keycloak Server Administration Guide 26.8.2 のクライアント・レルムの設定（Capability config、Client scopes、Sessions、Required actions、Impersonation）
    - Keycloak の管理 REST API（master レルムの admin-cli の発行。saas-api を aud に持つ AT を出さないことを確かめた）
    - research/template-design/notes/coverage_lifecycle.md の先行の一覧（I01〜I30・U01〜U21）
  found:
    - name: テナントの管理者が自分のレルムのマッパー・AT の寿命・ロールの割り当てを変えた後の発行
      handled_as: 新しいイベントではなく I01・I02 の中身の変化として扱った。テナントの外に効く値は API が iss と設定で強制する（design.md の 2. の境界の要点）
answers:
  # ---------------------------------------------------------------- 発行イベント（v0 の I01〜I09）
  - event: I01
    answer: 該当
    token_types: [AT, IDT, RT, CODE]
    note: 利用者のログイン。マッパーで tenant_id・user_id・roles・v を AT に足す
  - event: I02
    answer: 該当
    token_types: [AT, IDT, RT]
    note: BFF の AT の取り直し。マッパーが再実行されるので、ロールの変更はリフレッシュで反映される
  - event: I03
    answer: 対象外
    assumption: クライアントに軽量アクセストークンの executor を適用しない。API は AT の中の tenant_id を必須にしており、軽量にすると tenant_id が落ちる（ケーススタディ A11）
    breaks_when: AT の大きさを減らすため、または PII を AT から外すために軽量アクセストークンを使うとき。その場合は tenant_id などのマッパーで Add to lightweight access token を ON にし、R8 を計算し直す
  - event: I04
    answer: 対象外
    assumption: クライアントの Direct Access Grants を OFF にする。RFC 9700 §2.4 が ROPC を使わないよう求めている
    breaks_when: ROPC でしかログインできない旧いクライアントをつなぐとき
  - event: I05
    answer: 対象外
    assumption: テナントの連携先（社外の API クライアント）に AT を発行しない。この例の利用者は人だけ
    breaks_when: 連携先の API 利用を受け入れるとき（ケーススタディでは DPoP で束縛する条件付き採用の行がある）
  - event: I06
    answer: 対象外
    assumption: API は AT を交換しない。後ろに別のサービスを呼ばない
    breaks_when: API が別のサービスを利用者の権限で呼ぶようになったとき（slide:p10-token-exchange-not-narrowing の実測のとおり、交換で絞られるとは限らない）
  - event: I07
    answer: 対象外
    assumption: ブラウザの無い端末からのログインがない
    breaks_when: テレビ・CLI など、入力の限られた端末のクライアントを足すとき
  - event: I08
    answer: 対象外
    assumption: offline_access のスコープをクライアントに付けない。BFF は SSO セッションの間だけ動く
    breaks_when: 利用者がログインしていない間に、BFF が利用者の権限でバッチを動かす要件が出たとき
  - event: I09
    answer: 対象外
    assumption: IdP 側のセッションの終了は、BFF のリフレッシュの失敗で検知して BFF のセッションを終える（最大 330 秒の遅れを許す）。Back-Channel Logout の受け口を作らない（トークン目録の LOGOUT は却下）
    breaks_when: IdP 側のセッションの終了（管理者による削除・利用者の無効化）を、330 秒より早く BFF のセッションに反映する必要が出たとき
  # ---------------------------------------------------------------- 発行イベント（#2 で足した I10〜I33）
  - event: I10
    answer: 対象外
    assumption: クライアントの Implicit Flow を OFF のままにし、BFF が認可コード（I01）でトークンを受ける（RFC 9700 §2.1.2）
    breaks_when: BFF を通さずに、ブラウザだけで動くクライアントをつなぐとき
  - event: I11
    answer: 対象外
    assumption: BFF は prompt=none でトークンを取り直さない。AT の取り直しは RT（I02）だけで行う
    breaks_when: BFF のセッションが切れた後に、利用者の操作なしに SSO で再ログインさせる要件が出たとき
  - event: I12
    answer: 対象外
    assumption: 認証の強さで操作を分けない。acr を API の判断に使わない
    breaks_when: 請求書の承認など、より強い・より新しい認証を求める操作を足すとき
  - event: I13
    answer: 対象外
    assumption: 別の端末での承認（CIBA）を使わない。利用者はいつもブラウザの前にいる
    breaks_when: 利用者がその場にいない操作の承認（エージェントの操作など）を足すとき
  - event: I14
    answer: 対象外
    assumption: 取引ごとの承認の内容（authorization_details）をトークンに載せない
    breaks_when: 承認の内容（金額・相手先）を、トークンで API に運ぶ必要が出たとき
  - event: I15
    answer: 対象外
    assumption: 外部の JWT を AT に交換しない。連携先・ワークロードの JWT を受けない（JWT Authorization Grant を OFF のままにする）
    breaks_when: 取引先や社内のワークロードが、JWT のアサーションで AT を得るようになったとき
  - event: I16
    answer: 対象外
    assumption: ドメインをまたぐ SSO 済みの利用者のトークン（ID-JAG）を受けない
    breaks_when: テナントの IdP から ID-JAG で saas-api を呼ぶ連携を受け入れるとき
  - event: I17
    answer: 対象外
    assumption: テナントのレルムに外部の IdP をつながない。利用者はレルムに直接いる
    breaks_when: テナントが自社の IdP でのログインを求めたとき。属性の取り込みの方式（import・force）で鮮度が変わる
  - event: I18
    answer: 対象外
    assumption: 外部の IdP をつながないので、アカウントのリンクが起きない（I17 と同じ前提）
    breaks_when: I17 を該当にしたとき
  - event: I19
    answer: 対象外
    assumption: 運用者がテナントの利用者として操作しない。impersonation のロールを運用者に与えない
    breaks_when: サポートの担当者が利用者として操作する要件が出たとき。act が残らないので、監査で本人と区別する方法を先に決める
  - event: I20
    answer: 対象外
    assumption: ワークロードの ID のトークンを使わない。saas-api は DB にサービスの資格情報で接続する
    breaks_when: saas-api の後ろに別のサービスを置き、ワークロードの ID で呼ぶとき
  - event: I21
    answer: 対象外
    assumption: 入口（nginx）はトークンを作り直さず、そのまま saas-api に渡す。AT は saas-api が検証する
    breaks_when: 入口で外部の AT を検証し、内部トークンに作り替える構成にするとき
  - event: I22
    answer: 対象外
    assumption: saas-api の後ろに内部のサービスがなく、呼び出しの連鎖がない
    breaks_when: saas-api が別の内部サービスを利用者の文脈で呼ぶようになったとき
  - event: I23
    answer: 対象外
    assumption: Keycloak から SET を受けない。剥奪と利用者の無効化は 330 秒の遅れを許す（U05 と同じ前提）
    breaks_when: 剥奪や無効化を 330 秒より早く saas-api と BFF に届ける必要が出たとき
  - event: I24
    answer: 対象外
    assumption: 利用者は 1 つのテナント（レルム）だけに属する。テナントごとに発行者が違うので、テナントの切り替えは起きない
    breaks_when: 1 人の利用者が複数のテナントを使う要件が出たとき。そのときは BFF のセッションのテナントの文脈の置き換えを決める（subject_state_matrix.md の「テナント切替」）
  - event: I25
    answer: 該当
    token_types: [AT, IDT, RT, SSO, BFFSESSION]
    note: 利用者の初回ログインは I01 と同じ発行。tenant_id はレルムで決まるので未確定にならない。ロールを付ける前なら roles は空で出る
  - event: I26
    answer: 該当
    token_types: [AT, RT, SSO]
    note: パスワードの変更の後のログインは I01 と同じ発行。Keycloak 26.3 からの既定では、ほかの端末のセッションと RT は残る（Sign out from other devices が未チェック）。残りを許すかは書き手が自信のない点
  - event: I27
    answer: 対象外
    assumption: 状態リスト（Token Status List）を出さない。失効は AT の短い寿命と DB の確認で扱う
    breaks_when: AT を長くし、受け手に失効を届ける仕組みが要るようになったとき
  - event: I28
    answer: 対象外
    assumption: BFF のクライアント認証は client secret のまま（ケーススタディのクライアント認証をそのまま使う。トークン目録の発行方式）で、assertion を作らない
    breaks_when: private_key_jwt に切り替えるとき（aud は AS の issuer だけ。RFC 10070 §4）
  - event: I29
    answer: 対象外
    assumption: BFF の構成では AT に送信者制約を付けない（トークン目録の DPOP は却下）
    breaks_when: AT をブラウザや第三者のクライアントに渡すようになったとき
  - event: I30
    answer: 対象外
    assumption: DPoP を使わない（I29 と同じ前提）
    breaks_when: I29 を該当にしたとき
  - event: I31
    answer: 対象外
    assumption: 認可要求に署名しない（JAR を使わない）
    breaks_when: FAPI 2.0 など、認可要求の完全性を求める規則の対象になったとき
  - event: I32
    answer: 対象外
    assumption: 認可応答を JWT にしない（JARM を使わない）。応答は BFF のサーバーが受ける
    breaks_when: 認可応答の改ざんを防ぐ必要が出たとき（FAPI 2.0 など）
  - event: I33
    answer: 対象外
    assumption: イントロスペクションを使わない（U05 と同じ前提）ので、JWT 形式の応答も受けない
    breaks_when: U05 を該当にし、AS の判断を否認できない形で残す必要が出たとき
  # ---------------------------------------------------------------- 発行イベント（#17 で足した I34）
  - event: I34
    answer: 対象外
    assumption: Keycloak の機能 oid4vc-vci（Preview、既定は無効）を有効にしない。利用者に検証可能な資格情報を発行しない
    breaks_when: 利用者やテナントにデジタルの資格情報（SD-JWT VC など）を発行する機能を足すとき
  # ---------------------------------------------------------------- 利用イベント（v0 の U01〜U10）
  - event: U01
    answer: 該当
    token_types: [AT]
    note: saas-api が alg・iss・aud・exp・typ・必須クレームを検証する
  - event: U02
    answer: 該当
    token_types: [AT]
    note: iss から引いたテナントと tenant_id を照合した後で、トランザクションごとに set_config('app.tenant', $1, true) をパラメータで設定し、RLS とテナントの条件で絞る
  - event: U03
    answer: 該当
    token_types: [IDT]
    note: BFF がログインの応答で ID トークンを検証し、nonce を照合する
  - event: U04
    answer: 該当
    token_types: [RT]
    note: BFF が AT の期限の前に取り直す
  - event: U05
    answer: 対象外
    assumption: API は AT をローカルで検証する。テナントの停止は DB の tenants.status で要求ごとに拒否するので、イントロスペクションは要らない。ロールの剥奪と利用者の無効化は、AT の受け入れの上限（330 秒）まで待つことを許す
    breaks_when: ロールの剥奪や利用者の無効化を 330 秒より早く反映する必要が出たとき。または軽量アクセストークンを使うとき
  - event: U06
    answer: 該当
    token_types: [IDT, RT, SSO, BFFSESSION]
    note: BFF のログアウトで、BFF のセッションを消してから RP-Initiated Logout を送る
  - event: U07
    answer: 対象外
    assumption: Back-Channel Logout を使わない。IdP 側のセッションの終了は、BFF のリフレッシュの失敗で検知する（I09 と同じ前提）
    breaks_when: IdP 側のセッションの終了を 330 秒より早く反映する必要が出たとき（I09 と同じ）
  - event: U08
    answer: 対象外
    assumption: 画面の表示名とメールは ID トークンから得るので、UserInfo を呼ばない
    breaks_when: 表示に使う属性が増え、ID トークンに載せたくないとき
  - event: U09
    answer: 該当
    token_types: [AT, IDT]
    note: 未知の kid を見たら、その iss の JWKS を取り直す。取り直しは iss ごとに最短 300 秒に 1 回まで、取り直しても無い kid は 300 秒の負のキャッシュ、キャッシュの TTL は 3600 秒。新しい鍵は署名に使う前に 3900 秒より長く公開しておく（token_types の AT の key_rotation）
  - event: U10
    answer: 対象外
    assumption: API は AT を交換しない（I06 と同じ前提）
    breaks_when: API が受け取った AT を subject_token にして、別のサービス宛てのトークンを得るようになったとき
  # ---------------------------------------------------------------- 利用イベント（#2 で足した U11〜U28）
  - event: U11
    answer: 対象外
    assumption: 入口（nginx）はトークンを検証せず、クレームをヘッダーに転記しない（I21 と同じ前提）
    breaks_when: 入口で検証してヘッダーに転記する構成にするとき。利用者が送った同名ヘッダーを消す
  - event: U12
    answer: 対象外
    assumption: saas-api の後ろに内部のサービスがない（I22 と同じ前提）
    breaks_when: saas-api が別の内部サービスを呼ぶようになったとき
  - event: U13
    answer: 対象外
    assumption: 非同期の処理がない。ある場合も AT を渡さない（ライフサイクル表の AT の行）
    breaks_when: 請求書の一括処理などを、キューやジョブで動かすとき
  - event: U14
    answer: 該当
    token_types: [AT]
    note: saas-api のログに AT そのものを残さない。残すクレーム（sub・テナント）はこの記入例では決めていない
  - event: U15
    answer: 対象外
    assumption: BFF は失効のエンドポイントを呼ばない。ログアウトは RP-Initiated Logout（U06）で、SSO セッションと RT を失効させる
    breaks_when: ログアウトせずに RT だけを失効させる操作（端末の紛失など）が要るとき
  - event: U16
    answer: 対象外
    assumption: 状態リストを使わない（I27 と同じ前提）
    breaks_when: I27 を該当にしたとき
  - event: U17
    answer: 対象外
    assumption: SET を受けない（I23 と同じ前提）
    breaks_when: I23 を該当にしたとき
  - event: U18
    answer: 対象外
    assumption: クライアントの Front channel logout を OFF にする（管理画面の新規作成では ON になるとソースの要約にある。unverified.md の V31）。IdP 側の終了は BFF のリフレッシュの失敗で知る（I09 と同じ前提）
    breaks_when: IdP 側のセッションの終了を、330 秒より早く BFF のセッションに反映する必要が出たとき
  - event: U19
    answer: 対象外
    assumption: 応答・Webhook に署名しない。saas-api は BFF にだけ応答する
    breaks_when: テナントに Webhook で通知するとき
  - event: U20
    answer: 対象外
    assumption: 取引先の API を呼ばない
    breaks_when: saas-api が取引先の API を利用者の権限で呼ぶようになったとき
  - event: U21
    answer: 対象外
    assumption: 認可の判断をキャッシュしない。テナントの停止は要求ごとに DB で確かめる
    breaks_when: DB の負荷を減らすため、tenants.status や判断の結果をキャッシュするとき。キャッシュの寿命が停止の反映の遅れに足される
  - event: U22
    answer: 対象外
    assumption: トークンは BFF のサーバーだけが持ち、ブラウザには BFF のセッションの Cookie だけを渡す（slide:p09-url-browser）
    breaks_when: SPA がトークンを持つ構成に変えるとき
  - event: U23
    answer: 対象外
    assumption: 長時間の接続（WebSocket・SSE）を使わない。要求ごとに AT を検証する
    breaks_when: 画面への通知などで、長時間の接続を開くとき
  - event: U24
    answer: 対象外
    assumption: クラウドの STS に JWT を提示しない
    breaks_when: saas-api がクラウドの資源を、利用者やテナントの JWT で使うとき
  - event: U25
    answer: 対象外
    assumption: エージェント・MCP のサーバーから呼ばれない
    breaks_when: テナントの利用者が、エージェントに saas-api を操作させるとき
  - event: U26
    answer: 対象外
    assumption: 送信者制約を使わない（I29 と同じ前提）
    breaks_when: I29 を該当にしたとき
  - event: U27
    answer: 該当
    token_types: [AT]
    note: saas-api は検証に失敗したら 401 と WWW-Authenticate を返し、BFF が RT で取り直す（U04）。追加認証の要求（insufficient_user_authentication）は使わない（I12 は対象外）
  - event: U28
    answer: 対象外
    assumption: 分析基盤にクレームを複製しない
    breaks_when: 利用の分析のために、sub やテナントを含むログ・データを分析基盤に送るとき
