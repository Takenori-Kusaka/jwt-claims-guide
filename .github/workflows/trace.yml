# Slide IDs (#15) and the slide-to-artifact trace table (#22).
# Node and Playwright are not installed here, so the tests in tools/tests that need them
# (the deck build in test_slide_ids.py, test_viewer.py, test_claims_editor_ui.py of #36 and #49) are skipped in CI; run them locally.
name: trace

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # the whole tools/tests suite takes 6-10 minutes on the runner (#50 added the review tests)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install dependencies (pinned by hash)
        run: python -m pip install --require-hashes --no-deps -r tools/requirements-ci.txt
      - name: Slide IDs and slide:<id> references
        run: python tools/check_slide_refs.py templates
      - name: Design-doc templates (#4) - item IDs, evidence forms, blank fill-in columns
        run: python tools/template_check.py
      - name: Review materials (#5) - question IDs, fields, evidence, links, trace markers
        run: python tools/review_check.py
      - name: Trace table
        run: python tools/trace_check.py
      - name: Trace table, core tier counts
        run: python tools/trace_check.py --tier core
      # #12: the calibration set (seeded designs and their clean twins). Each design is staged at designs/target with its
      # markers removed, linted (counts against expected_lint.yaml), render-checked, its traits compared with its twin, the
      # answer key's locations resolved, and the sha256 recorded before measuring compared (research/template-design/calibration/)
      - name: Calibration set (#12) - markers, lint and render of the four designs, twins' traits, answer key, commitments
        run: python tools/calibration_check.py check
      - name: Tests (node / playwright tests are skipped here)
        run: python -m pytest -q -rs tools/tests
