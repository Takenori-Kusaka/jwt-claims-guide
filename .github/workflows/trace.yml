# Slide IDs (#15) and the slide-to-artifact trace table (#22).
name: trace

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pyyaml==6.0.2 pytest==8.3.4
      - name: Slide IDs and slide:<id> references
        run: python tools/check_slide_refs.py templates
      - name: Trace table
        run: python tools/trace_check.py
      - name: Tests for trace_check
        run: python -m pytest -q tools/tests
