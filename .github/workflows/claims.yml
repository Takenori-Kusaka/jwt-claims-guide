# Registry schemas, claim_lint on the worked example, and the secret scan (#16).
# Actions are pinned by commit SHA (checked with `gh api repos/<owner>/<repo>/git/ref/tags/<tag>`); the gitleaks
# binary is pinned by version and sha256 (from gitleaks_8.30.1_checksums.txt of the release, equal to the asset digest).
name: claims

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  claim-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # claim_lint diff (L10) reads the base version with git show
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install dependencies (pinned by hash)
        run: python -m pip install --require-hashes --no-deps -r tools/requirements-ci.txt
      - name: Registry schemas are valid JSON Schema 2020-12
        run: |
          python - <<'EOF'
          import json, jsonschema
          for p in ('templates/registry/claims.schema.json', 'templates/registry/token_types.schema.json',
                    'templates/registry/hops.schema.json', 'templates/registry/issuance_effects.schema.json'):
              jsonschema.Draft202012Validator.check_schema(json.load(open(p, encoding='utf-8')))
              print('valid schema:', p)
          EOF
      - name: claim_lint on the scenario A worked example (schema validation, R1-R10, slide references)
        run: python tools/claim_lint templates/examples/scenario-a --also-scan templates/examples/scenario-a/design.md
      - name: claim_lint tests (R1 / R2 / R8 pass and fail cases, R8 golden token)
        run: python -m pytest -q -rs tools/tests/test_claim_lint.py
      - name: claim_lint coverage rule tests (R2 / R3 / R3b / R4 / R6 / R9 / R10, lite vs full severities)
        run: python -m pytest -q -rs tools/tests/test_claim_lint_coverage.py
      - name: claim_lint on scenario A with --profile lite
        run: python tools/claim_lint templates/examples/scenario-a --profile lite
      - name: claim_lint semantic rule tests (L1a-L73 of #6, pass and fail cases, scenario A false positives)
        run: python -m pytest -q -rs tools/tests/test_claim_lint_semantic.py
      - name: claim_lint purpose rule tests (L11-L14 of #18, declaration consistency)
        run: python -m pytest -q -rs tools/tests/test_claim_lint_purpose.py
      - name: claim_lint diff tests (L10, breaking changes against a git ref)
        run: python -m pytest -q -rs tools/tests/test_claim_lint_diff.py
      - name: claim_lint diff on scenario A against main (L10)
        run: python tools/claim_lint diff --base origin/main templates/examples/scenario-a
      - name: render --check (generated regions of design.md and payload schemas match the registry, #19)
        run: python tools/claim_lint render templates/examples/scenario-a --check
      - name: Keycloak-issued golden AT conforms to the issuer-conformance payload schema (additionalProperties false)
        run: python tools/claim_lint render templates/examples/scenario-a --validate tools/tests/fixtures/claim_lint/golden/token.json --token-type AT --schema-kind issuer
      - name: render tests (one-line change, drift detection, schema generation, an unknown claim fails the issuer schema)
        run: python -m pytest -q -rs tools/tests/test_claim_lint_render.py
      - name: import keycloak - the stored normalized realm of scenario A is what the stored export gives (#30)
        run: |
          python -m tools.claim_lint import keycloak tools/tests/fixtures/claim_lint/keycloak/scenario-a-t1.export.json -o "$RUNNER_TEMP/observed.yaml"
          diff -u tools/tests/fixtures/claim_lint/keycloak/scenario-a-t1.observed.yaml "$RUNNER_TEMP/observed.yaml"
      - name: drift - scenario A Keycloak 26.8.0 realm and issued tokens (AT, ID token, refreshed AT) against the registry (#30)
        run: |
          k=tools/tests/fixtures/claim_lint/keycloak
          python -m tools.claim_lint drift templates/examples/scenario-a $k/scenario-a-t1.observed.yaml \
            --token AT=$k/scenario-a-t1.at.json --token IDT=$k/scenario-a-t1.idt.json --token AT=$k/scenario-a-t1.at-refresh.json
      - name: drift tests (normalization, static view vs issued tokens, deliberately shifted configurations, #30)
        run: python -m pytest -q -rs tools/tests/test_claim_lint_drift.py
      - name: Registry v1 tests (schemas, questions wording, issuance effects, README columns, REF, casestudy_check)
        run: python -m pytest -q -rs tools/tests/test_registry_v1.py
      - name: Casestudy check (ORG names and types, carry decisions vs templates/casestudy-deviations.yaml; pinned commit and sha256)
        run: python tools/casestudy_check.py templates/examples/scenario-a
      - name: claim_lint on the scenario B worked example (Full, P1+P4+P5, #4)
        run: python tools/claim_lint templates/examples/scenario-b --also-scan templates/examples/scenario-b/design.md
      - name: render --check on scenario B (generated regions and payload schemas)
        run: python tools/claim_lint render templates/examples/scenario-b --check
      - name: Scenario B sender-constraint comparison (DPoP vs none) matches design.md 3.3
        run: python tools/variant_compare.py templates/examples/scenario-b templates/examples/scenario-b/variants/sender-none.yaml --check templates/examples/scenario-b/design.md
      - name: Casestudy check on scenario B
        run: python tools/casestudy_check.py templates/examples/scenario-b
      - name: Event catalogue (#2) - columns, seed-list closure, subject-state matrix, sources.md counts
        run: python tools/catalog_check.py
      - name: catalog_check tests (pass and fail cases)
        run: python -m pytest -q -rs tools/tests/test_catalog_check.py
      # #8: crafted tokens (test keys made in memory) against the reference receivers written to scenarios A and B.
      # The Keycloak 26.8 / Postgres 16 cases (--env live) run locally; their logs are in research/runtime/.
      - name: Runtime tests, offline (#8) - negative tests, exchange narrowing, consumer contract
        run: python tools/runtime_tests/run.py --env offline --log "$RUNNER_TEMP/runtime-offline.json"
      - name: Runtime test docs and logs (#8) - anchors, req markers, lint rules, no raw token in the logs
        run: python -m pytest -q -rs tools/tests/test_runtime.py
      - name: Editor data (docs/claims/data/, claim_lint.zip) and vendor/MANIFEST.json match the sources (#36, #49; fix with python tools/build_claims_viewer.py)
        run: python tools/build_claims_viewer.py --check
      - name: Editor build tests (drift detection, column headings, CSP, vendored sha256 and licenses, claim_lint.zip + the worker's driver give the CLI result)
        run: python -m pytest -q -rs tools/tests/test_build_claims_viewer.py
      # #50: the review mode of the editor. data/review.js (the 168 questions of perspectives.md) is checked by the
      # build --check above; the recorded review of scenario B (review.yaml) and its report are checked here.
      - name: Review records (#50) - review.yaml of scenario B against review.schema.json, questions, sampling seed; row approvals vs the current rows (tools/row_hash.py)
        run: |
          python - <<'EOF'
          import json, jsonschema
          jsonschema.Draft202012Validator.check_schema(json.load(open('templates/review/review.schema.json', encoding='utf-8')))
          print('valid schema: templates/review/review.schema.json')
          EOF
          # stale approvals (a row changed after it was approved) are listed as "stale"; add --fail-on-stale to stop on them
          python tools/review_record.py check templates/examples/scenario-b/review.yaml --design templates/examples/scenario-b
      - name: Review report of scenario B is what review.yaml generates (fix with python tools/review_record.py report ... -o ...) and follows report_template.md
        run: |
          python tools/review_record.py report templates/examples/scenario-b/review.yaml --design templates/examples/scenario-b --check templates/examples/scenario-b/review-report-2026-11-23.md
          python tools/review_check.py --report templates/examples/scenario-b/review-report-2026-11-23.md
      - name: review_record tests (schema, stale approvals after an edit, merge, sampling, report form RP1-RP10)
        run: python -m pytest -q -rs tools/tests/test_review_record.py tools/tests/test_row_hash.py
      # The browser tests of the editor (tools/tests/test_claims_editor_ui.py: empty start, the six entry points,
      # diagnostics, claim_lint in Pyodide vs the CLI for scenarios A and B (full and lite), export round trip, network
      # log) and of its review mode (tools/tests/test_claims_review_ui.py, #50) need Playwright and Chromium, which this job
      # does not install; they are skipped here and run locally (README.md, 設計書のエディター).

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks (pinned version and sha256)
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
      - name: Self-test of .gitleaks.toml (random keys are still found; trace requirement IDs, also in the editor data, and the viewer's source hashes are not)
        run: |
          d="$RUNNER_TEMP/gitleaks-selftest"; mkdir -p "$d"
          # the keys are made at run time so that no secret-looking literal is committed
          key=$(head -c 64 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 32)
          printf 'api_key = "%s"\n' "$key" > "$d/leak.env"
          mkdir -p "$d/templates/registry"   # the allowlist is restricted by path to the files that hold reverse references
          printf '{"$comment": "Trace: req:p06-transaction-tokens.R8 req:p08-revocation-propagation.R6 req:p10-vendor-features.R2"}\n' > "$d/templates/registry/trace.schema.json"
          # viewer data (#36): the sha256 of a source file is allowed, a 64-hex value under another key is not
          mkdir -p "$d/docs/claims/data"
          h1=$(head -c 32 /dev/urandom | sha256sum | cut -c1-64); h2=$(head -c 32 /dev/urandom | sha256sum | cut -c1-64)
          printf 'x={"sources":{"token_types.yaml":"%s"}};\n' "$h1" > "$d/docs/claims/data/scenario-x.js"
          printf 'y={"api_token":"%s"};\n' "$h2" > "$d/docs/claims/data/leak-x.js"
          # editor data (#49): the registry schemas copied into docs/claims/data/schemas.js carry requirement IDs
          printf 'z={"$comment":"Trace: req:p06-transaction-tokens.R8 req:p08-revocation-propagation.R6 req:p10-vendor-features.R2"};\n' > "$d/docs/claims/data/schemas-x.js"
          ./gitleaks dir --no-banner --redact --config .gitleaks.toml --report-format json --report-path "$d/report.json" "$d" || true
          jq -c '[.[] | {RuleID, File}]' "$d/report.json"
          jq -e 'length == 2 and ([.[].File | split("/") | last] | sort == ["leak-x.js", "leak.env"])' "$d/report.json"
      - name: Scan the git history reachable from HEAD (fails on any finding; exclusions are in .gitleaks.toml with reasons)
        # --log-opts HEAD: only the commits of this checkout (for a pull request, the merge of the PR and its base), not the
        # other branches that fetch-depth 0 also fetches (their findings belong to their own PRs)
        run: ./gitleaks git --no-banner --redact --verbose --config .gitleaks.toml --log-opts="HEAD" .
