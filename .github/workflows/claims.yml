# Registry schemas, claim_lint on the worked example, and the secret scan (#16).
# Actions are pinned by commit SHA (checked with `gh api repos/<owner>/<repo>/git/ref/tags/<tag>`); the gitleaks
# binary is pinned by version and sha256 (from gitleaks_8.30.1_checksums.txt of the release, equal to the asset digest).
name: claims

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  claim-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # claim_lint diff (L10) reads the base version with git show
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install dependencies (pinned by hash)
        run: python -m pip install --require-hashes --no-deps -r tools/requirements-ci.txt
      - name: Registry schemas are valid JSON Schema 2020-12
        run: |
          python - <<'EOF'
          import json, jsonschema
          for p in ('templates/registry/claims.schema.json', 'templates/registry/token_types.schema.json',
                    'templates/registry/hops.schema.json', 'templates/registry/issuance_effects.schema.json'):
              jsonschema.Draft202012Validator.check_schema(json.load(open(p, encoding='utf-8')))
              print('valid schema:', p)
          EOF
      - name: claim_lint on the scenario A worked example (schema validation, R1-R10, slide references)
        run: python tools/claim_lint templates/examples/scenario-a --also-scan templates/examples/scenario-a/design.md
      - name: claim_lint tests (R1 / R2 / R8 pass and fail cases, R8 golden token)
        run: python -m pytest -q -rs tools/tests/test_claim_lint.py
      - name: claim_lint coverage rule tests (R2 / R3 / R3b / R4 / R6 / R9 / R10, lite vs full severities)
        run: python -m pytest -q -rs tools/tests/test_claim_lint_coverage.py
      - name: claim_lint on scenario A with --profile lite
        run: python tools/claim_lint templates/examples/scenario-a --profile lite
      - name: claim_lint semantic rule tests (L1a-L74 of #6, pass and fail cases, scenario A false positives)
        run: python -m pytest -q -rs tools/tests/test_claim_lint_semantic.py
      - name: claim_lint diff tests (L10, breaking changes against a git ref)
        run: python -m pytest -q -rs tools/tests/test_claim_lint_diff.py
      - name: claim_lint diff on scenario A against main (L10)
        run: python tools/claim_lint diff --base origin/main templates/examples/scenario-a
      - name: Registry v1 tests (schemas, questions wording, issuance effects, README columns, REF, casestudy_check)
        run: python -m pytest -q -rs tools/tests/test_registry_v1.py
      - name: Casestudy check (ORG names and types, carry decisions vs templates/casestudy-deviations.yaml; pinned commit and sha256)
        run: python tools/casestudy_check.py templates/examples/scenario-a
      - name: Event catalogue (#2) - columns, seed-list closure, subject-state matrix, sources.md counts
        run: python tools/catalog_check.py
      - name: catalog_check tests (pass and fail cases)
        run: python -m pytest -q -rs tools/tests/test_catalog_check.py

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks (pinned version and sha256)
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
      - name: Scan the git history (fails on any finding; exclusions are in .gitleaks.toml with reasons)
        run: ./gitleaks git --no-banner --redact --verbose --config .gitleaks.toml .
