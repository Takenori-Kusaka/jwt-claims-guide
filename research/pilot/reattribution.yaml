# パイロット #9：指摘の出どころの付け直し（レビュアーとは別のセッション）
label: "LLM による付け直し。人による検証ではない"
date: 2026-11-25
input: "review-{B-R1,B-R2,C-R1,C-R2}/review.yaml の各指摘の location・content・severity だけ。レビュアーの origin・questions・notes・review-report.md は読んでいない"
materials: "E:/Github/jwt-claims-guide（main）の templates/review/perspectives.md（9. の較正は読まない）・procedure.md・report_template.md、templates/catalog/、templates/registry/questions.yaml、templates/00_core.md・profiles・modules・claim_request.md、tools/claim_lint/RULES.md"
rules:
  categories:
    観点: "perspectives.md の問い ID がその指摘に直接当たる"
    テンプレート項目: "観点書に当たる問いが無く、設計書のテンプレートの欄の「検討の問い」が当たる"
    カタログ: "カタログのイベントの行（issue_events・use_events・subject_state_matrix）への回答から見つかる"
    カタログ外の質問: "q-outside-catalog（カタログの外の場面：移行期間の旧経路・テストの経路など）から見つかる"
    lint: "claim_lint の規則（既存）か render の出力が直接示す。または規則が拾うべき機械の不整合が本体"
    理由の採点: "procedure.md の段 4 の 2.（rationale_rubric の RR）だけが当たる。report_template の 5 種には無い区分（付け足し）"
    テンプレート外: "どの欄・問い・イベントにも当たらない"
  priority: "観点 > テンプレート項目 > カタログ > カタログ外の質問 > lint > 理由の採点 > テンプレート外。ただし既存の lint の出力そのものが指摘の起点のときは lint"
  triage: "A 機械（欄の有無・値・整合で決まる。拾う規則／拾うべき規則を書く）／B 書き手の自己点検（自由記述の有無で決まる）／C 人の判断／D 専門家（IdP の実挙動・仕様の解釈・委任の深さ）。#56 用"
