    comments:
      - id: "R2-01"
        location: "template:00_core#principals（ポータルの BFF の行）、hops:H3 の validates、claims:C-azp の carried_in"
        anchors: ["hops:H3", "claims:C-azp", "token_types:ENTRA_AT"]
        questions: ["q-limit-consistency", "q-typ-distinguishes"]
        content: "2.1 は「Okta の cid・Entra の azp（入口の設定で照合）」と書くが、H3 の validates に azp（または appid）の照合が無く、C-azp の carried_in は KC_AT だけ。自社のテナントの別のアプリ（同意の釣りで社員の同意を得た攻撃者のアプリを含む）が api://orders・api://invoices 宛てに取った AT を、入口がポータルの AT と区別せずに受ける。ほかの 4 つの IdP はクライアントを照合している（azp・cid・client_id）。対策：H3 に「azp がポータルのクライアント ID」を足し、台帳に Entra の azp の行（または C-azp の carried_in に ENTRA_AT）を足す。テナントの利用者の同意の設定も前提に書く"
        severity: "Major"
        origin: "観点"
        kind: "実装とのずれ"
        verdict: "採用"
        verdict_reason: "2.1 と H3 の 2 つの欄が食い違い、攻撃の経路（同意の釣り）が具体的"
        response:
          owner: "設計の書き手"
          state: "未着手"
        state: "unresolved"
        at: "2026-11-24T07:40:00+09:00"
      - id: "R2-02"
        location: "hops:H2〜H6 の validates、template:00_core#priorities-deferrals（送信者制約の見送り）、template:00_core#scope-boundary（ポータル → 入口の行）"
        anchors: ["hops:H2", "hops:H3", "hops:H4", "hops:H5", "hops:H6", "claims:C-cnf"]
        questions: ["q-variant-comparison", "q-authorize-service-and-user"]
        content: "入口は BFF からの要求を直接の相手として確かめない（H2〜H6 に mTLS・接続元の条件が無い）。入口 → サービスはメッシュの mTLS で確かめるのと非対称。B23 の見送りの理由は「AT は BFF と入口のサーバーにしかない」だが、漏れた AT（ログ・メモリのダンプ・BFF の不具合）はどこからでも入口に送れる。入口が BFF の証明書の接続だけを受ければ、DPoP・mTLS の AT の束縛より安く、B23 の大半（別の端末からの再送）を止められるのに、見送りの比較（3.1・issuance_profile.sender_constraint）に候補として出ていない"
        severity: "Major"
        origin: "観点"
        kind: "候補の漏れ"
        verdict: "採用"
        verdict_reason: "B23 は要求の脅威で、安価な代替が比べられていない"
        response:
          owner: "設計の書き手"
          state: "未着手"
        state: "unresolved"
        at: "2026-11-24T07:40:00+09:00"
      - id: "R2-03"
        location: "claims（行が無い）、token_types:ENTRA_AT・OKTA_AT・COGNITO_AT の required_claims、schemas/ENTRA_AT・OKTA_AT・COGNITO_AT.consumer.schema.json"
        anchors: ["token_types:ENTRA_AT", "token_types:OKTA_AT", "token_types:COGNITO_AT", "claims:C-sub", "claims:C-scope"]
        questions: ["q-required-rejected", "q-idp-diff-absorbed", "dc-12"]
        content: "入口が利用者の決定・宛先・種類の判断に読む IdP 固有のクレームが台帳の行に無い：Entra の oid・tid・scp・azp・_claim_names・_claim_sources、Okta の uid・cid・scp、Keycloak の realm_access.roles、Cognito の cognito:groups・token_use。これらは hops の validates の文と C-sub・C-roles の upstream_issuer の文の中にだけある。結果：(1) required_claims と受け手のスキーマ（ENTRA_AT は iss・aud・exp・iat だけ、COGNITO_AT は空）が欠落を拒否しない、(2) B13（Okta の uid）・B10・B3（Okta は aud が共通で scp だけが守り）の守りが identifier_properties（stable・reassignable）と on_missing を持たず、lint・スキーマ・R8 が確かめない、(3) Okta の sub だけが reassignable と書かれ、代わりの uid の不変性が宣言されない"
        severity: "Major"
        origin: "観点"
        kind: "候補の漏れ"
        verdict: "採用"
        verdict_reason: "B10・B13・B3 の守りの根になるクレームが未登録"
        response:
          owner: "設計の書き手"
          state: "未着手"
        state: "unresolved"
        at: "2026-11-24T07:40:00+09:00"
      - id: "R2-04"
        location: "claims:C-roles の assumption・upstream_issuer、claims:C-groups の provenance、template:00_core#system-privileges、catalog_answers の I19・I26"
