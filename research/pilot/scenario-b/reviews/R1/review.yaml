    findings:
      - id: "F01"
        location: "claims.yaml（行が無い）、C-sub.upstream_issuer、hops H3〜H5 の validates、design.md 付録 D.6 の 5."
        anchors: ["claims:C-sub", "hops:H3", "hops:H4", "hops:H5"]
        questions: ["q-identifier-choice", "dc-09", "q-typ-distinguishes"]
        content: "入口が照合・判定に使う IdP のクレームに台帳の行が無い：Entra の tid・oid（利用者のキー、B10）、Okta の uid（B13・B14）と cid、Entra・Okta の scp、Cognito の token_use（B17）と cognito:groups、Keycloak の realm_access.roles、Entra の _claim_names・_claim_sources（B8・B9）、ver。どれも identifier_properties・on_missing・enforced_at・受け手のスキーマが無く、L3・L7 などの検査も当たらない。C-sub の upstream_issuer の文と hops の validates に出るだけ。行を足す（usage と、無いときに拒否すること）"
        severity: "Major"
        origin: "観点"
        kind: "候補の漏れ"
        verdict: "採用"
        response:
          state: "未着手"
        at: "2026-11-24T07:18:00+09:00"
      - id: "F02"
        location: "token_types.KC_AT.aud・assumption、claims C-aud.assumption・rationale・enforced_at、hops H2・H6"
        anchors: ["claims:C-aud", "token_types:KC_AT", "hops:H2", "hops:H6"]
        questions: ["q-single-aud-resource", "q-limit-consistency"]
        content: "宛先の扱いが食い違う。KC_AT の aud は [orders, invoices] で assumption も「aud（orders・invoices）を経路ごとに照合」とあるが、C-aud の assumption は「BFF はサービスごとに別の AT を取る（宛先 1 つ）」。入口の照合は「経路のサービスを含む」なので、両方の宛先を持つ Keycloak の AT は両方の経路で通り、B3 は BFF の取り方という宣言されていない前提に頼る。また C-aud の rationale は Auth0 の https://api.example.com を経路ごとの宛先の値として挙げるが、注文・請求書で同じ値で区別できない（Okta・Auth0・Cognito の B3 は scope と client_id に頼っている）。目録の aud を 1 つにし、入口の照合を「aud が経路の宛先と一致し、ほかの宛先を含まない」にするか、scope で宛先を区別する前提を C-scope・目録に書く"
        severity: "Major"
        origin: "観点"
        kind: "実装とのずれ"
        verdict: "採用"
        response:
          state: "未着手"
        at: "2026-11-24T07:18:00+09:00"
      - id: "F03"
        location: "token_types.INTERNAL_TOKEN.required_claims、hops H7.custom_claims、claim_request_employee_id.md の問 14"
        anchors: ["token_types:INTERNAL_TOKEN", "hops:H7"]
        questions: ["q-required-rejected", "q-minimal-per-recipient", "q-limit-consistency"]
        content: "INTERNAL_TOKEN の required_claims に https://claims.example.com/employee_id（と roles）があり、orders 宛て（H7）にも社員番号が要ることになる。claim_request の問 14 と H7 は orders に社員番号を載せないと書く。そのまま実装すると orders がすべての内部トークンを拒むか、入口が orders にも社員番号を載せて最小化が崩れる。宛先ごとの必須を目録で分けられないなら、required_claims から外して H8 の validates に書く"
        severity: "Minor"
        origin: "観点"
        kind: "実装とのずれ"
        verdict: "採用"
        response:
          state: "未着手"
        at: "2026-11-24T07:18:00+09:00"
      - id: "F04"
        location: "token_types.SET（却下）・INTROSPECTION_JWT（却下）、claims C-iat.revisit_trigger、design.md 12. の「IdP 側だけのログアウト」"
        anchors: ["token_types:SET", "claims:C-iat", "token_types:LOGOUT_TOKEN"]
        questions: ["q-revocation-delivery"]
        content: "B12（ログアウト・セッションの失効の後に残ったトークンで経理台帳を読む）で、Keycloak 以外の IdP の側で起きたセッションの失効（管理者による失効、IdP 側のログアウト）は社員台帳のログアウトの時刻を進めず、BFF のセッションと RT も残る。経理台帳でも最悪で AT の受け入れの上限（Entra 630 秒）まで通る。SET・イントロスペクションを却下した代わりの社員台帳の問い合わせは、ポータル経由のログアウトしか知らない。12. に書いたが、要求の「直後」に対する見送りとして 3.1 に書き、見直しの条件と、経理台帳だけでも IdP に問い合わせる案（Okta・Auth0 のイントロスペクション、Entra の CAE）を比べる"
        severity: "Major"
        origin: "観点"
        kind: "候補の漏れ"
        verdict: "採用"
        response:
          state: "未着手"
        at: "2026-11-24T07:18:00+09:00"
      - id: "F05"
        location: "design.md 12.、9.1 のライフサイクル表、claims C-groups・C-auth0-roles・C-roles の recompute_trigger、token_types KC_AT.refresh"
        anchors: ["claims:C-roles", "claims:C-groups", "token_types:REFRESH_TOKEN"]
        questions: ["q-refresh-reevaluated", "q-idp-capability-verified"]
        content: "ロール・グループの剥奪の遅れ（330〜665 秒）と B19・B20 の扱いは、5 つの IdP がリフレッシュでグループ・ロール・フックを再計算する前提に依存するが、どの IdP も確かめた記録が無い（Keycloak の KC_AT.refresh も前提）。12. には RT の再利用の検知・Entra の寿命・Okta の typ だけがある。再計算されない IdP では古さの上限が RT の寿命（36000 秒）になる。escalation の unverified-idp-behavior に回す"
