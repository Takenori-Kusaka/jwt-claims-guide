        memo: "sub は STS の不変の opaque な ID。テナントは無い（C-tenant 却下）"
      q-idp-capability-verified:
        answer: "no"
        memo: "STS は組織で作るもので、交換での深さ・取り消しの確認・resource の拒否・RT の再利用の検知を、どれも実測も文書も無い（12. が認める）。C9・C10・C13・C15 の判断が依存する（F20）"
      q-idp-diff-absorbed:
        answer: "na"
        memo: "発行者は 1 つで IdP の差が無い"
      q-internal-delegation-token:
        answer: "yes"
        memo: "TOOL_AT の目録の行に署名・期限・tenant_binding・revocation がある"
      q-key-rotation:
        answer: "yes"
        memo: "JWKS、未知の kid は最短 60 秒・負のキャッシュ 60 秒、使う 1 日前に公開・外して 1 日残す"
      q-lifetime-rationale:
        answer: "no"
        memo: "5.1（寿命の上限の方針）が空。数字の根拠はガイドと NIST の上限だけと 12. が書く（F13）"
      q-limit-consistency:
        answer: "no"
        memo: "U10 の「cnf が actor の証明書と同じ」は AGENT_AT の cnf（エージェントの証明書）と食い違う（F02）。取り消しの目標 120 秒・90 秒・scope の volatility 900 秒も食い違う（F06）"
      q-lint-workaround:
        answer: "yes"
        memo: "lint を通すための宣言の変更は無い"
      q-long-running:
        answer: "yes"
        memo: "エージェントは自分の証明書に束縛した RT を持ち、取り直しのたびに STS が委任を確かめる。利用者のトークンを保持しない"
      q-minimal-per-recipient:
        answer: "no"
        memo: "authorization_details の consumers は invoices-api と STS だけだが、H1 の AGENT_AT（宛先はツール）に載る（F10）"
      q-nested-jwt-both-layers:
        answer: "na"
        memo: "JWE を使わない"
      q-no-passthrough:
        answer: "no"
        memo: "交換を許す actor と、actor ごとに割り当てる宛先（どの actor がどの resource 向けを得られるか）、subject_token の宛先が actor 自身かの規則が台帳に無い（F03）"
      q-no-secret-or-raw-pii:
        answer: "no"
        memo: "authorization_details の creditorAccount（user.financial.bank_account）が平文で AGENT_AT に載り、読まない受け手（エージェント・ツール）に届く（F10）"
      q-no-unverified-passthrough-mode:
        answer: "no"
        memo: "M_token_validation#library-config の欄も claim_request の問 18 も無く判定できない（F13）"
      q-object-level-authz:
        answer: "yes"
        memo: "請求書の API が sub と請求書の持ち主（DB）を照合して 404（C3）"
      q-operational-metrics:
        answer: "no"
        memo: "付録 A（Full）が空（F13）"
      q-operator-act:
        answer: "na"
        memo: "運用者の代理操作を STS が実装しない（I19）。ただし 2.2（Full）が空（F13）"
      q-original-principal:
        answer: "yes"
        memo: "交換で sub を保ち、ツールの広い ID（client credentials）を作らない"
      q-outside-catalog:
        answer: "yes"
        memo: "outside_enumeration に探した範囲が具体的にある。ただしレビュアーの外の質問で F03・F07・F08・F09 を足した"
      q-pairwise-external:
        answer: "na"
        memo: "外部の受け手が無い（組織は 1 つ、全受け手が社内）"
      q-pairwise-unguessable:
        answer: "na"
        memo: "ペアワイズにしない（外部の受け手が無い）"
      q-payload-readable:
        answer: "yes"
        memo: "confidential_from は全行で空なので定義上 Yes。ただし振込先がエージェント・ツールに読める点は F10"
      q-rar-per-audience:
        answer: "no"
        memo: "H1（宛先 MCP のツール）にも type payment を載せる。ツールは読まない（F10）"
      q-refresh-reevaluated:
        answer: "no"
        memo: "「取り直しで scope を委任と方針から決め直す」は STS の挙動で、実測も文書も無い（F20）"
      q-registered-synonym:
        answer: "na"
        memo: "独自クレームの行が採用に無い。登録名だけを使う"
      q-relies-on-at-expiry:
        answer: "no"
        memo: "ツールは AGENT_AT を exp（最悪 330 秒）まで受け入れ、ツール側の結果のキャッシュを持たないことが書いていない（F15）"
      q-required-rejected:
        answer: "yes"
        memo: "必須の欠落は拒否"
      q-reuse-standard-structure:
        answer: "yes"
        memo: "鍵への束縛は cnf、承認は authorization_details、委任は act と、既存の構造を使う"
      q-revocation-delivery:
        answer: "no"
        memo: "交換での取り消しの確認（C9 の要）が、台帳の enforced_at に無い（STS が subject_token からどうやって委任の記録を引くかが jti の行の監査の記録だけ）（F03）"
      q-role-explosion:
        answer: "na"
        memo: "ロールを載せない"
      q-rt-policy-by-client:
        answer: "yes"
        memo: "機密クライアントで送信者制約（加えてローテーション）。RFC 9700 §4.14.2 を引く"
      q-scope-and-role:
        answer: "yes"
        memo: "scope と行為者の方針の表と、持ち主（利用者の権限）を照合。ただし H3 の validates に scope が無い（F14）"
      q-scope-elevation-logged:
        answer: "no"
        memo: "ツールごとの最小の scope（呼び出しの操作だけ）から始めず、C14 の引き上げの拒否を記録する規則も無い（F11）"
      q-scope-semantics:
        answer: "yes"
        memo: "scope はタスクの範囲（C-scope.not_meaning）。支払いは scope と authorization_details の両方、と UC2 と not_meaning に書いてある"
      q-session-rt-bounds:
        answer: "yes"
        memo: "RT は idle 1 時間・最大 8 時間、セッションは 30 分・8 時間"
      q-shared-validator:
        answer: "no"
        memo: "M_token_validation の欄が無く、共通の検証部品を使うか判定できない（F13）"
      q-single-aud-resource:
        answer: "yes"
        memo: "resource で 1 つ。2 つ以上の要求は拒否（MCP の表の 1）"
      q-single-issuer:
        answer: "yes"
        memo: "代替：issuers の列は空（Full の R1 error）だが、authoritative_writer はすべて STS の 1 つ。サービスが追記しない"
      q-size-limit:
        answer: "yes"
        memo: "R8 で最悪 1739／8192 バイト（21%）"
      q-sql-tenant-predicate:
        answer: "na"
        memo: "DB の文脈・RLS を使わない（U02 対象外）"
      q-step-up-by-rs:
        answer: "na"
        memo: "追加認証を使わず、支払いは人の承認の記録で確かめる（C-acr 却下・I12 対象外）"
      q-step-up-path-coverage:
        answer: "na"
        memo: "追加認証を使わない（承認の記録で確認。I12 対象外）"
      q-system-actor-no-fake-sub:
        answer: "yes"
        memo: "client credentials を作らず、利用者の sub を捏造しない"
      q-tenant-data-match:
        answer: "na"
        memo: "組織は 1 つでテナントが無い"
      q-token-logging:
        answer: "no"
        memo: "記録する HTTP ヘッダーの許可リスト・HAR の扱いの欄（M_privacy_minimization#audit-log）が無い（F13）"
      q-token-not-in-url:
        answer: "yes"
        memo: "AT は Authorization ヘッダー、クエリは拒否（MCP の表の 8）。SSE は U23"
      q-trace-id-trust:
        answer: "yes"
        memo: "traceparent を使わず、jti と STS の記録で相関"
      q-txn-required-claims:
        answer: "na"
        memo: "Txn-Token を使わない"
      q-txn-scope-fixed:
        answer: "na"
        memo: "Txn-Token を使わない"
      q-typ-distinguishes:
        answer: "yes"
        memo: "AT は at+jwt、種類は aud で分かれる。ID トークンを出さない"
      q-unverified-claim-extraction:
        answer: "yes"
        memo: "全ホップで local に検証してから読む"
      q-unwrapped-value-authz:
        answer: "yes"
        memo: "署名の外の値（ログ）を認可に使わない。integrity_until は監査ログだけ"
      q-validate-before-read:
        answer: "no"
        memo: "検証の順序（M_token_validation#validation-order）の欄が無く判定できない（F13）"
      q-validity-not-authz:
        answer: "yes"
        memo: "操作（scope と行為者の方針）・対象（持ち主）・承認の内容で判断"
      q-value-vocabulary:
        answer: "na"
        memo: "roles・groups を載せない（C-roles 却下）。authorization_details の type の語彙は value_vocabulary にある"
      q-variant-comparison:
        answer: "yes"
        memo: "mTLS と DPoP を攻撃の型（TLS の終端）で比べた。mTLS はトークンのサイズを増やさない"
      q-writer-distinguished:
        answer: "yes"
        memo: "本人・呼び出し側が書く値で認可しない（承認の ID は本文から読まない。C7）"
