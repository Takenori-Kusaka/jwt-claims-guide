        content: "U10 の回答は「STS は subject_token の cnf が actor（ツールサーバー）の証明書と同じことを確かめる」と書く。しかし AGENT_AT の cnf は要求したエージェントの証明書の拇印で（AGENT_AT の holder、H1 の checks）、ツールの証明書と一致することはない。書いたとおりに作ると正規の C1・C8・C11 の交換がすべて失敗し、運用で「cnf の確認を外す」直しが入りやすい。交換で確かめるべきは「subject_token の aud が actor の登録した resource と一致する」こと（と、必要なら subject_token の cnf が呼び出し元のエージェントの証明書だったこと）で、どの照合を STS が行うかを台帳の enforced_at（sts-token-exchange）に書く"
