        content: "同意（委任）が「どの MCP サーバー向けにトークンを得てよいか」を束縛していない。STS は resource が 1 つであることだけを確かめるので、エージェント（LLM。プロンプトインジェクションで誘導されうる）が悪意ある MCP サーバー B の resource で AGENT_AT を求めれば、B に sub・scope（読む・支払う）・authorization_details（振込先の口座・approval_id）が届く。cnf で B は使えないが、個人情報と承認の内容は漏れ、B が交換の行為者として登録されていれば交換も試せる。さらに、エージェントが読んだ u1 の請求書の内容をツールの引数で B に渡す漏えいはトークンでは止まらない。委任の記録に許す resource の一覧を持ち STS が照合すること、トークンをモデルの文脈に入れないこと、B への引数の流出を範囲の外と明記するか対策を書く"
        severity: "Major"
        origin: "テンプレート外"
        kind: "候補の漏れ"
        verdict: "採用"
