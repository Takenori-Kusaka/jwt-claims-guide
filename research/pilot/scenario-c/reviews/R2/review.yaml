      q-derived-value:
        answer: "no"
        memo: "受け手が要るのは「承認どおりの相手先か」の判定で、口座そのものではない。参照 ID か拇印で足りるかを比べていない。F15"
      q-evidence-attribution:
        answer: "yes"
        memo: "3 件を抜き取った：rt_strategy の RFC 9700 §4.14.2（公開クライアントへの要求で、この行の状況に合わない。F16）、C-authorization-details の RFC 9396 §9.1（JWT の AT に載せる節で合う）、AGENT_AT の NIST IR 8587 §5.3.1.1（1 時間以内で合う）。引用元は開いておらず、名前と主張の対応だけを見た"
      q-external-user-deprovision:
        answer: "na"
        memo: "外部の IdP・取引先の利用者がいない"
      q-four-lifetimes-written:
        answer: "na"
        memo: "独自クレームが無い。登録名の 4 層は 9. の生成の表にある"
      q-freshness-mitigation:
        answer: "yes"
        memo: "「超える」の authorization_details に、請求書の API の支払いのたびの DB の照合（担い手つき）"
      q-gateway-bypass-path:
        answer: "no"
        memo: "請求書の API を呼ぶ他の経路（console:admin、移行前のツールの広い ID の経路）が範囲の図に矢印として無い。F09・F06"
      q-hook-adds-raw-pii:
        answer: "na"
        memo: "発行時フックが無い"
      q-hook-failure:
        answer: "na"
        memo: "発行時フックを使わない（組織の STS が直接書く）"
      q-hop-lifetime:
        answer: "yes"
        memo: "TOOL_AT 60 秒 ≦ AGENT_AT 300 秒。exp は subject_token を超えない（C-exp の enforced_at）"
      q-hop-narrowing:
        answer: "yes"
        memo: "H2 は aud 1 つ、scope・authorization_details は subject_token の部分集合と書いてある（STS の実装で強制するかは F11）"
      q-identifier-choice:
        answer: "yes"
        memo: "利用者のキーは iss（1 つ）＋sub。テナントは持たない（C-tenant 却下、単一の組織）"
      q-idp-capability-verified:
        answer: "no"
        memo: "STS は組織がこれから作るもので、resource の拒否・交換での深さと取り消しの確認・RT の再利用の検知・取り直しでの再評価のどれも実測も仕様書も無い（12. に記載）。F11"
      q-idp-diff-absorbed:
        answer: "na"
        memo: "発行者は STS の 1 つで IdP の差が無い"
      q-internal-delegation-token:
        answer: "no"
        memo: "目録の log_policy（Full の列）が TOOL_AT・AGENT_AT に無く、ログの扱いは U14 の文だけ。F14"
      q-key-rotation:
        answer: "yes"
        memo: "JWKS から取り、未知の kid は 60 秒の最短間隔と負のキャッシュ、使う 1 日前に公開・1 日残す（通常のローテーション。緊急の失効は F25）"
      q-lifetime-rationale:
        answer: "no"
        memo: "5.1（Full）が空で、AGENT_AT 300・TOOL_AT 60・RT 8 時間は書き手の判断（12.）。取り消しの目標 120 秒から導く式と、交換の負荷の代償の比較が無い。F17"
      q-limit-consistency:
        answer: "no"
        memo: "U10 の「cnf が actor の証明書と同じ」が AGENT_AT の holder・H1 の checks（cnf はエージェントの証明書）と食い違う。log_policy と U14 も食い違う。F02・F14"
      q-lint-workaround:
        answer: "yes"
        memo: "lint を通すための宣言の変更は見当たらない（Lite で書いたのはパイロットの指示と 12. に書いてある）"
      q-long-running:
        answer: "yes"
        memo: "エージェントは自分の ID の委任の RT で取り直し、可否は取り直しのたびに STS が決める。ツールは交換で分単位のトークン"
      q-minimal-per-recipient:
        answer: "yes"
        memo: "authorization_details は支払いのときだけ AGENT_AT に載り、交換の STS と請求書の API が読む。PORTAL_AT には載せない"
      q-nested-jwt-both-layers:
        answer: "na"
        memo: "JWE を使わない"
      q-no-passthrough:
        answer: "no"
        memo: "交換を許す行為者・受け付ける subject_token の宛先・割り当てる宛先・範囲の規則の表が無い（P4 の delegation-policy が未記入）。U10 の「cnf が actor の証明書と同じ」は AGENT_AT の cnf（エージェントの証明書）と矛盾する。F05・F02"
      q-no-secret-or-raw-pii:
        answer: "no"
        memo: "authorization_details の creditorAccount（振込先の口座）が平文で AGENT_AT・TOOL_AT に載り、エージェント（LLM）・ツールが読める。口座の参照 ID だけにできるか未検討。F15"
      q-no-unverified-passthrough-mode:
        answer: "no"
        memo: "検証の無効化・デバッグのモードを持たないと書いていない。F18"
      q-object-level-authz:
        answer: "yes"
        memo: "請求書の API が sub と請求書の持ち主（DB）を照合し 404（C3・C15）。承認の持ち主も sub と照合"
      q-operational-metrics:
        answer: "no"
        memo: "付録 A が空。aud・cnf の不一致（C2・C13 の試み）、交換の拒否、深さ超過の件数を誰が測るかが無い。F20"
      q-operator-act:
        answer: "no"
        memo: "console:admin（読む・支払う・返金する）がどのトークンで請求書の API を呼ぶかが無い。2.2（Full）が空で、請求書の API は act の無いトークンを client_id と相手の一致だけで受ける。F09"
      q-original-principal:
        answer: "yes"
        memo: "ツールは交換で sub＝利用者のトークンを得る。client credentials の広い ID を作らない"
      q-outside-catalog:
        answer: "no"
        memo: "outside_enumeration に探した範囲と 3 件はある。しかしレビュアーが思いつく「移行期間の旧経路」（現状のツールの広い ID・本文の承認 ID）と「障害時の再送」（支払いの再試行）が範囲の中で答えられていない。F06・F03"
      q-pairwise-external:
        answer: "na"
        memo: "外部の受け手が無い（組織は 1 つ、crosses_boundary No）"
      q-pairwise-unguessable:
        answer: "na"
        memo: "ペアワイズの sub を使わない"
      q-payload-readable:
        answer: "yes"
        memo: "形式上は Yes（confidential_from が全行で空）。ただし振込先の口座が信頼しない MCP サーバーに届きうる点は F04・F15"
      q-rar-per-audience:
        answer: "yes"
        memo: "H1・H2 の authorization_details は payment の type だけ"
      q-refresh-reevaluated:
        answer: "no"
        memo: "取り直しで委任・方針・承認の状態を再評価する前提を、STS の実測も文書も無く置いている。F11"
      q-registered-synonym:
        answer: "yes"
        memo: "独自クレームが無い。azp は client_id と同じ意味として却下し、2 つ載せていない"
      q-relies-on-at-expiry:
        answer: "no"
        memo: "委任の取り消しの請求書への反映が TOOL_AT の exp（60＋30 秒）に依存する。支払いについて F07"
      q-required-rejected:
        answer: "yes"
        memo: "required_claims と on_missing 拒否"
      q-reuse-standard-structure:
        answer: "yes"
        memo: "鍵への結び付けは cnf、承認は authorization_details、行為者は act と既存の構造を使った"
      q-revocation-delivery:
        answer: "no"
        memo: "種別ごとの最悪の秒数はある。しかし支払いは「すぐ止めたい操作」なのに、請求書の API は承認の状態だけを引き、委任の状態を引かない。取り消しの後も最大 90 秒、手元の TOOL_AT で未使用の承認を支払える。F07"
      q-role-explosion:
        answer: "na"
        memo: "ロールを載せない"
      q-rt-policy-by-client:
        answer: "no"
        memo: "機密クライアントに対し、RFC 9700 §4.14.2（公開クライアントへの要求）を根拠に引き、送信者制約なのにローテーションも行い再利用の検知は unverified。E-rt-sender-constrained.1（ローテーション不要）とも食い違う。F16"
      q-scope-and-role:
        answer: "yes"
        memo: "role の代わりに、行為者の方針の表と持ち主の照合。scope と両方を確かめる"
      q-scope-elevation-logged:
        answer: "no"
        memo: "C14 のような範囲の引き上げの要求を STS が拒否すると書くが、その試みを相関 ID つきで記録・通知すると書いていない。F20"
      q-scope-semantics:
        answer: "yes"
        memo: "C-scope・C-authorization-details の not_meaning に分担（操作の範囲と、どの請求書・金額か）が書いてある"
      q-session-rt-bounds:
        answer: "yes"
        memo: "AGENT_RT idle 3600／最大 28800、SESSION 1800／28800。24 時間以下"
      q-shared-validator:
        answer: "no"
        memo: "受け手（ツール・請求書の API・STS の交換）が共通の検証部品を使うと書いていない（M_token_validation の欄が無い）。F18"
      q-single-aud-resource:
        answer: "yes"
        memo: "resource で 1 つに絞り、2 つ以上を拒否（MCP の必須チェック 1）"
      q-single-issuer:
        answer: "yes"
        memo: "発行者は STS の 1 つで、ツール・請求書の API はクレームを足さない"
      q-size-limit:
        answer: "yes"
        memo: "R8 で最悪 1739／8192 バイト"
      q-sql-tenant-predicate:
        answer: "no"
        memo: "サービスの ID で DB に接続し、持ち主の条件だけで利用者を分けるのに、全 SQL（一覧・検索・支払い・返金）に持ち主の条件を付ける規約と検査が無い。F19"
      q-step-up-by-rs:
        answer: "na"
        memo: "追加認証ではなく人の承認の記録で確かめる設計（C-acr の却下に理由と崩れる条件）"
      q-step-up-path-coverage:
        answer: "na"
        memo: "追加認証を使わず、支払いは承認の記録で確かめる（acr 却下）"
      q-system-actor-no-fake-sub:
        answer: "yes"
        memo: "client credentials を作らず、サービスの ID で利用者の sub を作らない"
      q-tenant-data-match:
        answer: "na"
        memo: "テナントを持たない（単一の組織）"
      q-token-logging:
        answer: "no"
        memo: "記録する HTTP ヘッダーの許可リストと、HAR・ログからトークンを除く手順が無い。F14"
      q-token-not-in-url:
        answer: "yes"
        memo: "AT は Authorization ヘッダーだけ、クエリの access_token を拒否（必須チェック 8）。SSE もヘッダー"
      q-trace-id-trust:
        answer: "yes"
        memo: "相関には署名されたトークンの jti を使い、traceparent を監査に使わない"
      q-txn-required-claims:
        answer: "na"
        memo: "Txn-Token を使わない"
      q-txn-scope-fixed:
        answer: "na"
        memo: "Txn-Token を使わない"
      q-typ-distinguishes:
        answer: "yes"
        memo: "ID トークンを出さず、AT は at+jwt。請求書の API は TOOL_AT と PORTAL_AT を act の有無と client_id で分ける（F05 で許可の一覧を求める）"
      q-unverified-claim-extraction:
        answer: "yes"
        memo: "どのホップも local で署名を検証する"
      q-unwrapped-value-authz:
        answer: "yes"
        memo: "署名の外に写した値（監査ログ）を認可に使わない（integrity_until は log だけ）"
      q-validate-before-read:
        answer: "yes"
        memo: "act・authorization_details の照合は受け入れの検証の後と hops の checks の順で読める"
      q-validity-not-authz:
        answer: "yes"
        memo: "操作（scope）・行為者の方針・持ち主・承認の内容を照合する"
      q-value-vocabulary:
        answer: "na"
        memo: "roles・groups を載せない（C-roles 却下）。authorization_details の type の語彙は value_vocabulary にある"
      q-variant-comparison:
        answer: "yes"
        memo: "3. と 4. で mTLS と DPoP、tls_client_auth と private_key_jwt を、開く攻撃（C2・C12・C13）とサイズ（R8・other_headers_bytes）で比べている"
      q-writer-distinguished:
        answer: "yes"
        memo: "値はすべて STS が書き、本人・呼び出し側の値（本文の承認 ID）を認可に使わない"
