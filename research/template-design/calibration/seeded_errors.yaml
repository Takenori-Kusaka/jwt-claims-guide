# 埋め込んだ誤りの一覧（正解）。#12 の測定の採点に使う。レビュアーに渡さない
# この一覧は、設計書の誤りを説明するもので、それ自体は設計に使う教材ではない（誤りを含む設計書は seeded-a/・seeded-b/）
#
# LLM による作成。人による検証ではない。初回の測定より前に固定した（protocol.md の冒頭、commitments.sha256）。
# 測定の後には直さない。誤りが見つかったら protocol.md の 7.「正解の訂正」として記録し、訂正の前と後の両方で採点する。
#
# 列の意味（protocol.md の 3.・4.・7.）：
#   locations          指摘の場所として認めるところ。file は materialize の後の名前（.broken を外したもの）。
#                      row は YAML の行の id（カタログの回答は event）、column は列、section は design.md の節、
#                      quote はその場所にある文の一部（tools/calibration_check.py の C4 が、row と quote の実在を確かめる）
#   wrong / clean      seeded の記述が何を誤っているか / 対照（control-*）の同じ場所が何と書いているか
#   kind               report_template.md の指摘の種別
#   confused_questions 取り違えた問い。この ID か also_accepted の ID を書いた指摘を得点 1 とする
#                      （観点書の問い ID・questions.yaml の問い ID・判断の木の節の ID・対比表の誤用 <ファイル>#m-<n>・開いた問いの ID）
#   perspectives_section  confused_questions が観点書のどの節にあるか（カバーの集計に使う）
#   contrasts          対応する対比表の誤用
#   evidence           根拠（templates/CONTRIBUTING.md の 1. の書式。版付き）
#   signpost / span    難しさの区分を決める 2 つの事実（protocol.md の 3.）。difficulty はその表から機械的に決めた
#   channel            見つけるはずの経路（lint / short_list / open_prompt / none）。channel_question はその問い
#   lint_note          lint が error・warn を出す書き方をしていればどの規則が出たか、どう避けたか
#
# 件数：seeded-a 19 件、seeded-b 16 件、計 35 件。#12 の本文の「埋め込む誤りの例」10 件は issue_example（1〜10。本文の順）
