    - {finding: F12, severity: Minor, verdict: 誤検出, reason: R4：書き手は 3.1 で見送りの理由（STAFF_AT の宛先は agent-sts だけで、交換に mTLS のクライアント認証が要るので STAFF_AT だけでは何も呼べない）を書いている。この理由は要求と矛盾せず、指摘は比べる案が足りないと言い切る形}
    - {finding: F13, severity: Minor, verdict: 真（基の設計の欠陥）, reason: （境界の判定）prior_art_search は IANA の登録簿を探したと書くが、nearest に挙げるのは Txn-Token の草案の txn だけで、IANA に登録された RFC 8417 §2.2 の txn（関係する複数の JWT の相関に使う）に触れていない。却下の理由は草案の意味にしか当たらない。弱い指摘で、案件に
