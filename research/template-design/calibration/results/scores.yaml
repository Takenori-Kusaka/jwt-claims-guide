    - {finding: F-12, severity: Minor, verdict: 真（基の設計の欠陥）, reason: C-iss は発行者 3 つ（SPIRE を含む）と言うが catalog_answers の idp は keycloak と agent-sts だけで、AGENT_SVID がどの idp にも属さない。M_token_validation 8. の SPIRE
