  D3-1:
    design: control-b
    model: Claude Opus 5.5
    findings:
    - {finding: F-01, severity: Major, verdict: 真（基の設計の欠陥）, reason: 'UC2 で q-peer を『要る』とし仕組みを TLS＋client_id（Bearer の中の値）にしている。catalog の q-peer は『mTLS。トークンの値では代えない』で食い違う。送信者制約の見送り（3.1, q-holder）とは別の問いなので
        R4 ではない'}
    - {finding: F-02, severity: Major, verdict: 真（基の設計の欠陥）, reason: TTS は AT の org_roles でロールを替える（H4）ので、ロール剥奪の最悪は 630＋330＝960 秒で volatility 900 を超える。9.2 は MSG_CTX しか扱わない。7. の『ロールを引く』と H4 の食い違いも実在}
    - {finding: F-03, severity: Major, verdict: 真（基の設計の欠陥）, reason: 3.1・SET は『次の Auth0 での取り直しまで』『RT の取り直し（最大 30 分）で届く』と書くが、9.2 自身が『RT での取り直しでは Entra に問い合わせない（最大 28800 秒）』と書く。見送りそのもの（R4 の例）ではなく、見送りの帰結の記述が設計の事実と矛盾している}
    - {finding: F-04, severity: Major, verdict: 真（基の設計の欠陥）, reason: source_system 自身が『荷主の管理者が画面で割り当て』『グループは荷主の Entra の管理者が持つ』と書くのに configurable_by は platform だけ。short_list ap-1-7 は元データを書ける者も数えるとする。運用者の
        Auth0 管理操作（U15）も宣言に無い}
    - {finding: F-05, severity: Major, verdict: 真（基の設計の欠陥）, reason: 申請・承認の記録の保存先・書き手・書く経路（web-bff で承認→記録）が図にもホップにも無い（TXN_OPS の assumption が『TTS の保存先にある』と言うだけ）。操作の中身に結びつかない点は設計の選択だが、核の『書く経路が無い』は実在}
    - {finding: F-06, severity: Major, verdict: 真（基の設計の欠陥）, reason: 付録 B は『承認の経路はこの 1 つだけ』とするが、承認の記録・ロール対応表を書く API が設計に無く、受け手側の確かめも無い。3 行目（対応表の変更）は受け手が存在しない}
    - {finding: F-07, severity: Major, verdict: 誤検出, reason: 書き手は PostgreSQL では止められないことを 12. に書き、ライブラリの API と CI の静的検査で守ると理由と確かめ方を付けている。integrity_until の『アプリのコードは SET を出せない』は 12. と矛盾しない（DB 権限でなくコードの規則で守る宣言）。SQL
        インジェクションは別の欠陥を前提にした指摘で、要求とも矛盾しない。B07（各サービスが SET・任意 SQL）と紛らわしい近い形}
    - {finding: F-08, severity: Major, verdict: 真（基の設計の欠陥）, reason: Auth0 管理 API を呼ぶ部品・運用者の Auth0 管理操作が図に無い。2. は『db-migrate だけが BYPASSRLS』、M_data_layer 4. は DB の管理者も挙げ、互いに食い違う}
    - {finding: F-09, severity: Major, verdict: 真（基の設計の欠陥）, reason: 'quantity は引き当ての上限、declared_value は請求と照合（M_authz_pdp 3./4.）に使うのに内側の型・正規化が無い。issuer のスキーマは type: object に文字列の enum で、どの tctx も通らない'}
    - {finding: F-10, severity: Minor, verdict: 真（基の設計の欠陥）, reason: 9.2 の唯一の対策『作り直しのたびに今のロールで絞り直す』に、ロールの出どころが無い（org_roles は AUTH0_AT にだけ載り、作り直しの時点で AT が無い）}
    - {finding: F-11, severity: Minor, verdict: 真（基の設計の欠陥）, reason: 6. は『利用者本人の操作』として act を不要とするが、ラベル作成は label-svc が最大 30 分後に行う非同期処理。templates/review/decision_tree.md keep-sub-exchange は非同期でもワーカーを act にする形を選ぶとし、理由の記載が無い}
    - {finding: F-12, severity: Minor, verdict: 真（基の設計の欠陥）, reason: 設計自身が C-aud に 2 つ目の aud を書きながら、目録と issuer のスキーマ（enum が API 1 つ）は 1 つとする。設計の中の食い違いとして確かめられる}
    - {finding: F-13, severity: Minor, verdict: 誤検出, reason: オブジェクト単位の認可はテナントを持ち主とする、と理由つきで決めている。一覧を sub で絞るのは表示の範囲で、利用者ごとの分離の要求は設計にも 16 行目の要求の出どころにも無い。要求の有無を尋ねる文面だが R4 の見送りではない}
    - {finding: F-14, severity: Minor, verdict: 真（基の設計の欠陥）, reason: TTS 自体の停止は 503 と決めているが、テナントの台帳・メンバーの表・申請の記録が 60 秒のキャッシュより長く止まったときの倒し方が無い。見直しの条件が参照する可用性の目標の数値も無い}
    - {finding: F-15, severity: Minor, verdict: 誤検出, reason: 二重作成の防止の原子性は実装の粒度。MSG_CTX を出せるのは label-svc だけ（assumption）で再配送のための再利用は設計どおり。Webhook は 300 秒の期限を求めており状態通知の再送は害が小さい。jti・RT の再利用は 12. に未確認として既に書いてある}
    - {finding: F-16, severity: Minor, verdict: 真（基の設計の欠陥）, reason: 記入欄が求める『時刻を比べる箇所と時計』に JWT しか挙がっていない。申請の期限と、組織をまたぐ Webhook の created の比べ方が抜けている}
