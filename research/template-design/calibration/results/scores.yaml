    - {finding: F-03, severity: Major, verdict: 真（基の設計の欠陥）, reason: 「決済代行への返金が失敗したら、承認を未使用に戻す」は結果不明（時間切れ）を区別せず、決済代行側の冪等キーも書かれていない。二重返金がありうる}
    - {finding: F-04, severity: Major, verdict: 真（基の設計の欠陥）, reason: 2.2 は「書けるのは hr-sync だけ」と言い、手段は「属性の編集の権限を admin だけにする」。Keycloak のユーザープロファイルの admin の編集権は manage-users を持つ管理者全員に効き、2.2 の基盤の操作の行自身がレルムの管理者の存在を書いている。手段が主張を満たさない}
    - {finding: F-05, severity: Major, verdict: 真（基の設計の欠陥）, reason: 付録 A は hr-sync の遅れ 10 分で警報、そのときは REQ-07 の 5 分を守れないと自分で書き、責任者の判断に任せる（自動で閉じない）。P4 9. は「REQ-07 の 5 分の内側」と言い切る。書かれた理由が要求と矛盾する（R4 の 3 つ目）。120
        秒は 12. で未計測}
    - {finding: F-06, severity: Major, verdict: 真（基の設計の欠陥）, reason: U29 は /v1/refund も TOOL_AT だけを受けるとするが、旧いマクロの道具は agent-sts のクライアント（assist-agent・refund-subagent・support-console）に無く、図・主体・ホップにも無い。act なしは
        support-console だけ許す規則とも両立する道が書かれていない}
    - {finding: F-07, severity: Minor, verdict: 真（基の設計の欠陥）, reason: UC3 は予約の返金を含むと見出しに書くのに q-actor を「代理する者がいない」で不要にしている。実行は refund-batch（P4 3. でシステム）で、2.2 は委任の記録に行為者の連鎖を持つと書く。6. の不要の理由が予約の部分と合わない}
    - {finding: F-08, severity: Major, verdict: 真（基の設計の欠陥）, reason: REQ-05・06 の「3 万円を超える返金」を 1 回の要求ごとにしか判定せず、同じ注文の分割や累計の扱いが無い（absent_semantics は 1 要求の金額だけ）。外部の入力を読むエージェントが分割すれば承認と追加の認証を通らない。要求の言葉の範囲を設計が決めていない}
    - {finding: F-09, severity: Minor, verdict: 真（基の設計の欠陥）, reason: issuance_profile.sender_constraint の理由は「どちらも support-console のサーバーの中にだけある」だが、STAFF_AT の holder と 5. と 3.1 は assist-agent のメモリにも置くと書く。理由の前提が台帳と食い違う}
    - {finding: F-10, severity: Minor, verdict: 真（基の設計の欠陥）, reason: C-authorization-details は pii_category 個人情報で log_policy 記録する。3.2 は「ログに…個人情報を残さない：満たす（sub・customer_ref は鍵つきのハッシュ）」で、この行に触れない。台帳と共通の基準の記述が矛盾する}
