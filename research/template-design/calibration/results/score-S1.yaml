key_issues:
  - id: K1
    error: A09
    note: "A09 locations lack claims.yaml C-aud. All three D2 sessions flag that C-aud (rationale/assumption: STAFF_AT aud is agent-sts only; tools reject STAFF_AT) contradicts the seeded STAFF_AT aud that contains order-tool/customer-tool (D2-1 F-11, D2-2 F-13, D2-3 F-11). This is the A09 seeding left inconsistent with C-aud; candidate to add {file: claims.yaml, row: C-aud} to A09 locations (or treat as 埋め込みの副作用). No score change (A09 already 1 in all D2 sessions)."
  - id: K2
    error: A17
    note: "All three D2 sessions (D2-1 F-01, D2-2 F-10, D2-3 F-05) report that the property table wrongly says long-running/async does not apply. The A17 seeding (no long_running on TOOL_AT, no refund-batch hop) causes this; the key's channel_note acknowledges it but no error row covers the property-table finding itself. Candidate: 埋め込みの副作用. (D4-1 F-01, D4-2 F1, D4-3 F1 report the same on control-a, so it may instead be a base-design defect - FP judge to decide.)"
  - id: K3
    error: B14
    note: "B14 core combines (i) TTS does not check tenant state at issuance and (ii) the carrier AT lives 24 h. In seeded-b the carrier PARTNER_AT goes straight to inner services without TTS (B02), so (i) does not apply to the carrier path and (ii) alone produces the worst-case 24 h. Also TXN_TOKEN db_lookup in seeded-b says TTS checks member state per issuance. Candidate correction: core = 'テナントを止めても、運送会社の 24 時間の AT がそのテナントに効き続け、15 分の要求を満たさない'. Before/after: D1-3 B14 = 1 under my lenient reading (= after); 0 under a strict two-part reading (before). D1-1/D1-2 B14 = 0 either way."
  - id: K4
    error: B02/B14
    note: "PARTNER_AT hop rows H3/H5/H21 keep max_lifetime 600 while token_types PARTNER_AT is 86400; all three D1 sessions flag it (D1-1 F13, D1-2 F-11, D1-3 F12). The B14 locations include PARTNER_AT max_lifetime but not hops H3/H5/H21 max_lifetime. Probably the B14 seeding left the hops unchanged - candidate 埋め込みの副作用 or a location addition. No score change."
  - id: K5
    error: A12
    note: "A12 core requires the absence of case ID and approval ID from tool token/log. Reviewers (D2-1 F-23, D2-2 F-23, D2-3 2. q-via) instead say tool logs keep only sub (hash) and some paths are not linkable. Not a key error, but a phrasing gap: if the core were 'ツールのログが sub だけで、1 つの操作を 1 本につなげられない', D2-1 and D2-2 A12 would become 1 (q-audit-correlation). Before: 0/0/0; after (if relaxed): 1/1/0."
  - id: K6
    error: seeded-a side effect (not an error row)
    note: "D2-1 F-21 and D2-2 F-21: M_idp_keycloak 11. says TOOL_AT 20% / ADMIN_API_AT 12% while the CI (R8) shows 49% / 14%. Likely the seeded claims (customer_contact etc.) changed token size without the hand-written text being updated - candidate 埋め込みの副作用 for the FP judge."
