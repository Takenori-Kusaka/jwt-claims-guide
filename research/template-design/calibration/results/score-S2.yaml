  - "Recurring findings across seeded sessions AND controls that are not seeded and probably reflect real defects of the base designs (key may be incomplete, FP judgement should check clean text): refund design - sender_constraint rationale 'STAFF_AT only in console server' vs holder includes assist-agent (D4-1 F-09, D4-2 F-16, D2-3 F21); 30k threshold per-request splitting (D4-1 F-08, D4-2 F2, D4-3 F6); reset-to-unused double refund (D4-1 F-03, D4-2 F4, D4-3 F5, D2-1 F-19, D2-2 F-03); HR sync 120s unmeasured/10 min alarm (many); SPIRE missing in idp (many); authorization_details inner types (D4-*). Shipping design - tctx schema 'type object + enum' (D3-1 F-09, D3-2 F02, D3-3 R-11, D1-3 F22); C-aud userinfo second aud (D3-1 F-12, D3-2 F14, D3-3 R-10, D1-3 F23); MSG_CTX role source (D3-1 F-10, D3-2 F05, D3-3 R-04); Entra 28800s tolerance (all); removed upstream bypassing L16 (D3-2 F08, D3-3 R-05, D1-* F12)."
