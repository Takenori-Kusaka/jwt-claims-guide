# template_version: 0.3.0
# 測定の対照に使う教材。設計に使わない
# yaml-language-server: $schema=../../../../templates/registry/claims.schema.json
# 台帳（templates/registry/README.md の 3.1）。みなと電機ストアのサポートセンター（担当者のコンソールと、案件を代わりに進めるエージェント）
# 発行者は 3 つ：Keycloak 26.8 のレルム support（担当者のログイン）、agent-sts（この設計で作る交換のサービス）、SPIRE（ワークロードの ID）
# 組織の名前空間の共有クレームは 3 つ（case_id・customer_ref・approval_id）。追加前の 25 問は claim_request_<名前>.md
scenario: minato-support-center
namespaces:
  - namespace: "https://minato-denki.example/claims/"
    style: flat_prefix
    owner: 認証基盤チーム（台帳の持ち主。templates/registry/README.md の 11.）
    assignment: 名前空間の下の名前は、この台帳への登録（PR と追加前の 25 問）でだけ割り当てる。agent-sts のほかの発行者は、この名前空間の名前を書かない
data_category_vocabulary:
  name: fideslang
  version: 3.1.4
  url: https://github.com/ethyca/fideslang/blob/3.1.4/data_files/data_categories.csv
  license: CC-BY-4.0
  verified_on: '2026-11-27'
claims:
# ---------------------------------------------------------------- 登録名：受け入れの検証に使うもの
- id: C-iss
  name: iss
  namespace: null
  registered_ref: {kind: spec, id: "RFC 7519 §4.1.1", url: "https://www.rfc-editor.org/rfc/rfc7519#section-4.1.1"}
  type: string
  shape: single
  description: トークンの発行者。Keycloak のレルム support、agent-sts、SPIRE の OIDC の発行者のどれか
  not_meaning: 担当者がどこでログインしたかではない。値が許可リストにあっても、その種別を出す発行者でなければ受け入れない
  usage: protocol
  decision: 採用
  rationale: >-
    受け手ごとに受け入れる発行者を 1 つに固定する。ツール（order-tool・refund-tool・customer-tool）は agent-sts だけ、agent-sts は subject_token に
    Keycloak のレルム support、actor_token に SPIRE だけ、support-console は Keycloak のレルム support だけを受ける。ツールが Keycloak のトークンを直接受けない
    ことで、担当者のトークンをエージェントがそのまま使う経路を閉じる
  refs:
    - {kind: spec, id: "RFC 8725 §3.8", url: "https://www.rfc-editor.org/rfc/rfc8725#section-3.8"}
    - {kind: guide-slide, id: p00-incident-signature-valid}
  assumption: 発行者は 3 つで、受け手ごとに受け入れる発行者を設定で固定する
  revisit_trigger: 別の発行者（取引先の AS、別のレルム）のトークンを受ける受け手が出たとき
  issuers:
    - "https://sso.minato-denki.example/realms/support"
    - "https://agent-sts.minato-denki.example"
    - "https://spire-oidc.minato-denki.example"
  authoritative_writer:
    - {stage: ②, writer: 各発行者（Keycloak・agent-sts・SPIRE）の設定, configurable_by: [platform]}
  issue_events: [I01, I02, I06, I09, I20]
  source_system: 各発行者の設定（認証基盤チームが持つ）
  volatility: never
  recompute_trigger: [never]
  propagation_delay: 0
  on_revoke: 変わらない値。発行者の切り替えは受け手の許可リストの変更で行う
  carried_in: [STAFF_AT, ID_TOKEN, LOGOUT_TOKEN, TOOL_AT, DELEG_AT, AGENT_SVID, ADMIN_API_AT]
  consumers: [support-console, agent-sts, order-tool, refund-tool, customer-tool]
  on_missing: 拒否
  enforced_at:
    - {service: support-console, check: ID トークン・ログアウトトークンの iss がレルム support と完全一致, against: [api_config]}
    - {service: agent-sts, check: subject_token の iss がレルム support、DELEG_AT なら自分、actor_token の iss が SPIRE と完全一致, against: [api_config]}
    - {service: order-tool, check: iss が agent-sts と完全一致。Keycloak のトークンは拒否, against: [api_config]}
    - {service: refund-tool, check: iss が agent-sts と完全一致。Keycloak のトークンは拒否, against: [api_config]}
    - {service: customer-tool, check: iss が agent-sts と完全一致。Keycloak のトークンは拒否, against: [api_config]}
  max_bytes: 48
  overflow_strategy: 上限で固定（超えない値域）
  pii_category: 該当なし
  data_category: [system.authentication]
  confidential_from: []
  log_policy: 記録する
  status: active
  owner: 認証基盤チーム
  change_controller: IETF（RFC 7519）
- id: C-sub
  name: sub
  namespace: null
  registered_ref: {kind: spec, id: "RFC 7519 §4.1.2", url: "https://www.rfc-editor.org/rfc/rfc7519#section-4.1.2"}
  type: string
  shape: single
  description: >-
    担当者のトークン・ツールのトークンでは、担当者の Keycloak の利用者 ID（UUID）。「誰の権限で」に答える。ワークロードの ID のトークン（AGENT_SVID）では、
    エージェントの SPIFFE ID
  not_meaning: 今その操作をしている行為者ではない（それは act の最も外側）。社員番号・ログイン名ではない（人事の台帳で変わりうる値を照合に使わない）
  usage: identifier
  identifier_properties: {stable: true, reassignable: false, pairwise: false, id_scheme: uuid}
  decision: 採用
  answers: [q-sub, q-user]
  does_not_answer: [q-actor]
  rationale: >-
    agent-sts は交換で sub を subject_token から写すだけで、要求の値で差し替えさせない。refund-tool は sub で PDP に担当者の状態とロールを問い合わせ、
    監査ログの「誰の権限で」に残す。同じ担当者を Keycloak の中で作り直したときは別の sub になり、古い sub の権限は引き継がれない
  refs:
    - {kind: spec, id: "RFC 8693 §4.1", url: "https://www.rfc-editor.org/rfc/rfc8693#section-4.1"}
    - {kind: guide-slide, id: p02-user-identifier}
  assumption: 担当者は Keycloak のレルム support のローカルの利用者で、外部の IdP から取り込まない
  revisit_trigger: 外部の IdP（グループ会社の IdP など）から担当者を取り込むことになったとき
  issuers:
    - "https://sso.minato-denki.example/realms/support"
    - "https://agent-sts.minato-denki.example"
    - "https://spire-oidc.minato-denki.example"
  authoritative_writer:
    - {stage: ①, writer: Keycloak（ローカルの利用者の ID）, configurable_by: [platform]}
    - {stage: ③, writer: agent-sts（subject_token から写すだけ）, configurable_by: [platform]}
  issue_events: [I01, I02, I06, I20]
  source_system: Keycloak のレルム support の利用者（人事の台帳から人事連携が作る。ID は Keycloak が割り当てる）
  verification_method: 人事連携が人事の台帳の在籍の記録から利用者を作る。メールのドメインでは作らない
  volatility: never
  recompute_trigger: [never]
  propagation_delay: 0
  on_revoke: 担当者の削除・無効化は、refund-tool の PDP への問い合わせ（返金）と agent-sts の交換の拒否（全ツール）で止める
  carried_in: [STAFF_AT, ID_TOKEN, LOGOUT_TOKEN, TOOL_AT, DELEG_AT, AGENT_SVID, ADMIN_API_AT]
  consumers: [support-console, agent-sts, order-tool, refund-tool, customer-tool]
  on_missing: 拒否
  enforced_at:
    - {service: support-console, check: ID トークンの sub を BFF のセッションに結ぶ。ログアウトトークンの sub と sid でセッションを探す, against: [format]}
    - {service: agent-sts, check: 出すトークンの sub は subject_token の sub と同じ。PDP で担当者が有効かを確かめる, against: [other_claim, data_layer], with: C-sub}
    - {service: order-tool, check: 監査ログに記録する。照合は案件の customer_ref で行う, against: [format]}
    - {service: refund-tool, check: PDP に sub を渡し、担当者の在籍・refund-operator のロール・返金の上限を問い合わせる, against: [data_layer]}
    - {service: customer-tool, check: 監査ログに記録する。照合は案件の customer_ref で行う, against: [format]}
  max_bytes: 120
  overflow_strategy: 上限で固定（超えない値域）
  pii_category: 個人情報
  data_category: [user.unique_id]
  confidential_from: []
  integrity_until:
    - {place: log, target: agent-sts と各ツールの監査ログ（鍵つきのハッシュ）, trust_boundary: 監査ログの基盤（閲覧は監査の担当とサポートの責任者だけ）}
  log_policy: ハッシュ化して記録
  status: active
  owner: 認証基盤チーム
  change_controller: IETF（RFC 7519）
  note: 監査ログには HMAC-SHA256（鍵は監査の担当が持つ）で記録する。監査の担当は担当者の sub から同じ値を作って検索する。読める者と保存期間は design.md の付録 D（M_privacy_minimization の 8.）
- id: C-aud
  name: aud
  namespace: null
  registered_ref: {kind: spec, id: "RFC 7519 §4.1.3", url: "https://www.rfc-editor.org/rfc/rfc7519#section-4.1.3"}
  type: string
  shape: single
  description: >-
    トークンの宛先 1 つ。STAFF_AT・DELEG_AT は agent-sts、TOOL_AT は 1 つのツールの MCP の URI、ID トークン・ログアウトトークンは support-console、
    AGENT_SVID は agent-sts
  not_meaning: してよい操作の範囲ではない（それは scope）。トークンを持つ者ではない（それは cnf）
  usage: protocol
  decision: 採用
  answers: [q-resource]
  rationale: >-
    1 つのトークンに 1 つの宛先だけを入れる。agent-sts は交換の要求の resource（RFC 8707）を 1 つだけ受け、ツールごとにトークンを分ける。
    STAFF_AT の宛先を agent-sts だけにするので、担当者のトークンをツールに直接出しても宛先の違いで拒否される
  refs:
    - {kind: spec, id: "RFC 8707 §2", url: "https://www.rfc-editor.org/rfc/rfc8707#section-2"}
    - {kind: spec, id: "MCP Authorization（2026-07-28）「Token Handling」", url: "https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization", verified_on: "2026-11-27"}
  assumption: agent-sts は resource が 2 つ以上の交換の要求を拒否する。Keycloak の Audience マッパーは agent-sts だけを入れる
  revisit_trigger: 1 回の手順で複数のツールを同じトークンで呼びたいという要望が出たとき（その場合もツールごとに交換する）
  issuers:
    - "https://sso.minato-denki.example/realms/support"
    - "https://agent-sts.minato-denki.example"
    - "https://spire-oidc.minato-denki.example"
  authoritative_writer:
    - {stage: ②, writer: Keycloak の Audience マッパー（STAFF_AT）、agent-sts（TOOL_AT・DELEG_AT）、SPIRE（AGENT_SVID）, configurable_by: [platform]}
  issue_events: [I01, I02, I06, I09, I20]
  source_system: Keycloak のクライアントスコープ agent-sts-audience と、agent-sts のリソースの登録
  volatility: never
  recompute_trigger: [never]
  propagation_delay: 0
  on_revoke: 変わらない値
  carried_in: [STAFF_AT, ID_TOKEN, LOGOUT_TOKEN, TOOL_AT, DELEG_AT, AGENT_SVID, ADMIN_API_AT]
  consumers: [support-console, agent-sts, order-tool, refund-tool, customer-tool]
  on_missing: 拒否
  enforced_at:
    - {service: support-console, check: ID トークン・ログアウトトークンの aud が support-console と一致, against: [aud]}
    - {service: agent-sts, check: subject_token・actor_token の aud が自分と一致。ほかの値が並ぶ配列も拒否, against: [aud]}
    - {service: order-tool, check: aud が自分の MCP の URI の 1 つだけ, against: [aud]}
    - {service: refund-tool, check: aud が自分の MCP の URI の 1 つだけ, against: [aud]}
    - {service: customer-tool, check: aud が自分の MCP の URI の 1 つだけ, against: [aud]}
  max_bytes: 48
  overflow_strategy: 上限で固定（超えない値域）
  pii_category: 該当なし
  data_category: [system.operations]
  confidential_from: []
  log_policy: 記録する
  status: active
  owner: 認証基盤チーム
  change_controller: IETF（RFC 7519）
- id: C-exp
  name: exp
  namespace: null
  registered_ref: {kind: spec, id: "RFC 7519 §4.1.4", url: "https://www.rfc-editor.org/rfc/rfc7519#section-4.1.4"}
  type: integer
  shape: single
  description: トークンの期限（UNIX 時刻）
  not_meaning: 案件の作業の期限・承認の期限ではない。承認の取り下げは exp を待たない
  usage: protocol
  decision: 採用
  rationale: >-
    受け手は exp と時計のずれ 30 秒で拒否する。agent-sts は出すトークンの exp を、subject_token の exp より後にしない（ツールのトークンは 300 秒か、
    subject_token の残りの短いほう）
  refs:
    - {kind: spec, id: "RFC 9068 §2.2", url: "https://www.rfc-editor.org/rfc/rfc9068#section-2.2"}
    - {kind: guide-slide, id: p06-narrow-downstream}
  assumption: 受け手の時計は NTP で 30 秒以内にそろっている
  revisit_trigger: 受け手を組織の網の外（時計を管理できない場所）に置くとき
  issuers:
    - "https://sso.minato-denki.example/realms/support"
    - "https://agent-sts.minato-denki.example"
    - "https://spire-oidc.minato-denki.example"
  authoritative_writer:
    - {stage: ②, writer: 各発行者（寿命の設定は認証基盤チームだけが変える）, configurable_by: [platform]}
  issue_events: [I01, I02, I06, I09, I20]
  source_system: 各発行者の時計とトークン目録の max_lifetime
  volatility: never
  recompute_trigger: [never]
  propagation_delay: 0
  on_revoke: トークンごとの値。止めるのは目録の revocation の手段
  carried_in: [STAFF_AT, ID_TOKEN, LOGOUT_TOKEN, TOOL_AT, DELEG_AT, AGENT_SVID, ADMIN_API_AT]
  consumers: [support-console, agent-sts, order-tool, refund-tool, customer-tool]
  on_missing: 拒否
  enforced_at:
    - {service: support-console, check: ID トークン・ログアウトトークンが期限内か（ずれ 30 秒）, against: [format]}
    - {service: agent-sts, check: subject_token・actor_token が期限内か。出すトークンの exp は subject_token の exp を超えない, against: [other_claim], with: C-exp}
    - {service: order-tool, check: 期限内か（ずれ 30 秒）と exp − iat が 300 秒以下, against: [other_claim], with: C-iat}
    - {service: refund-tool, check: 期限内か（ずれ 30 秒）と exp − iat が 300 秒以下, against: [other_claim], with: C-iat}
    - {service: customer-tool, check: 期限内か（ずれ 30 秒）と exp − iat が 300 秒以下, against: [other_claim], with: C-iat}
  max_bytes: 10
  overflow_strategy: 上限で固定（超えない値域）
  pii_category: 該当なし
  data_category: [system.operations]
  confidential_from: []
  log_policy: 記録する
  status: active
  owner: 認証基盤チーム
  change_controller: IETF（RFC 7519）
- id: C-iat
  name: iat
  namespace: null
  registered_ref: {kind: spec, id: "RFC 7519 §4.1.6", url: "https://www.rfc-editor.org/rfc/rfc7519#section-4.1.6"}
  type: integer
  shape: single
  description: トークンの発行の時刻（UNIX 時刻）
  not_meaning: 担当者がログインした時刻ではない（それは auth_time）。承認された時刻でもない
  usage: protocol
  decision: 採用
  rationale: 受け手は exp − iat で寿命の上限を確かめる。未来の iat（ずれ 30 秒を超える）は拒否する
  refs:
    - {kind: spec, id: "RFC 9068 §2.2", url: "https://www.rfc-editor.org/rfc/rfc9068#section-2.2"}
  assumption: 受け手の時計は 30 秒以内にそろっている
  revisit_trigger: 受け手を組織の網の外に置くとき
  issuers:
    - "https://sso.minato-denki.example/realms/support"
    - "https://agent-sts.minato-denki.example"
    - "https://spire-oidc.minato-denki.example"
  authoritative_writer:
    - {stage: ②, writer: 各発行者, configurable_by: [platform]}
  issue_events: [I01, I02, I06, I09, I20]
  source_system: 各発行者の時計
  volatility: never
  recompute_trigger: [never]
  propagation_delay: 0
  on_revoke: トークンごとの値
  carried_in: [STAFF_AT, ID_TOKEN, LOGOUT_TOKEN, TOOL_AT, DELEG_AT, AGENT_SVID, ADMIN_API_AT]
  consumers: [support-console, agent-sts, order-tool, refund-tool, customer-tool]
  on_missing: 拒否
  enforced_at:
    - {service: support-console, check: ログアウトトークンの iat が 120 秒より古ければ拒否, against: [format]}
    - {service: agent-sts, check: 未来の iat を拒否, against: [format]}
    - {service: order-tool, check: 未来の iat を拒否, against: [format]}
    - {service: refund-tool, check: 未来の iat を拒否, against: [format]}
    - {service: customer-tool, check: 未来の iat を拒否, against: [format]}
  max_bytes: 10
  overflow_strategy: 上限で固定（超えない値域）
  pii_category: 該当なし
  data_category: [system.operations]
  confidential_from: []
  log_policy: 記録する
  status: active
  owner: 認証基盤チーム
  change_controller: IETF（RFC 7519）
- id: C-jti
  name: jti
  namespace: null
  registered_ref: {kind: spec, id: "RFC 7519 §4.1.7", url: "https://www.rfc-editor.org/rfc/rfc7519#section-4.1.7"}
  type: string
  shape: single
  description: トークンごとの一意の ID（UUID）。agent-sts は出したトークンの jti と、交換の元の jti を監査ログで結ぶ
  not_meaning: 案件の ID・承認の ID ではない（それは case_id・approval_id）
  usage: protocol
  decision: 採用
  rationale: >-
    監査で、ツールの呼び出し（TOOL_AT の jti）から、交換の元（STAFF_AT・DELEG_AT の jti）と行為者までたどる。ログアウトトークンは jti で再送を拒否する
  refs:
    - {kind: spec, id: "RFC 9068 §2.2", url: "https://www.rfc-editor.org/rfc/rfc9068#section-2.2"}
    - {kind: guide-slide, id: p06-audit-trail}
  assumption: 各発行者は UUID の v4 で jti を作る
  revisit_trigger: 発行者が jti を出さない設定に変わったとき
  issuers:
    - "https://sso.minato-denki.example/realms/support"
    - "https://agent-sts.minato-denki.example"
  authoritative_writer:
    - {stage: ②, writer: 各発行者, configurable_by: [platform]}
  issue_events: [I01, I02, I06, I09]
  source_system: 各発行者の乱数
  volatility: never
  recompute_trigger: [never]
  propagation_delay: 0
  on_revoke: トークンごとの値
  carried_in: [STAFF_AT, ID_TOKEN, LOGOUT_TOKEN, TOOL_AT, DELEG_AT, ADMIN_API_AT]
  consumers: [support-console, agent-sts, order-tool, refund-tool, customer-tool]
  on_missing: 拒否
  enforced_at:
    - {service: support-console, check: ログアウトトークンの jti を 120 秒覚え、同じ値を拒否, against: [format]}
    - {service: agent-sts, check: 交換の元の jti を監査ログに記録する, against: [format]}
    - {service: order-tool, check: 監査ログに記録する, against: [format]}
    - {service: refund-tool, check: 監査ログに記録する。返金の要求の冪等キーとは別に扱う, against: [format]}
    - {service: customer-tool, check: 監査ログに記録する, against: [format]}
  max_bytes: 36
  overflow_strategy: 上限で固定（超えない値域）
  pii_category: 該当なし
  data_category: [system.operations]
  confidential_from: []
  log_policy: 記録する
  status: active
  owner: 認証基盤チーム
  change_controller: IETF（RFC 7519）
# ---------------------------------------------------------------- 登録名：クライアントと範囲
- id: C-azp
  name: azp
  namespace: null
  registered_ref: {kind: spec, id: "OpenID Connect Core 1.0 §2", url: "https://openid.net/specs/openid-connect-core-1_0.html#IDToken"}
  type: string
  shape: single
  description: Keycloak のトークンを求めたクライアント（support-console）
  not_meaning: エージェントではない。トークンを今持っている者でもない（STAFF_AT は support-console から assist-agent に渡る）
  usage: authz
  decision: 採用
  rationale: >-
    Keycloak 26.8 の AT は RFC 9068 の client_id を出さない（C-kc-client-id）。agent-sts は subject_token の azp が support-console であることを確かめ、
    ほかのクライアントが得た担当者のトークンを交換に使わせない
  refs:
    - {kind: spec, id: "OpenID Connect Core 1.0 §2", url: "https://openid.net/specs/openid-connect-core-1_0.html#IDToken"}
    - {kind: guide-slide, id: p02-delegation-client}
  assumption: レルム support で担当者がログインするクライアントは support-console と approval-console の 2 つで、approval-console のトークンは agent-sts を宛先にしない
  revisit_trigger: 担当者がログインするクライアントを足すとき
  issuers: ["https://sso.minato-denki.example/realms/support"]
  authoritative_writer:
