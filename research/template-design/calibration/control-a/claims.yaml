  refs:
    - {kind: spec, id: "RFC 8693 §4.3", url: "https://www.rfc-editor.org/rfc/rfc8693#section-4.3"}
    - {kind: spec, id: "RFC 9068 §2.2", url: "https://www.rfc-editor.org/rfc/rfc9068#section-2.2"}
  assumption: agent-sts のクライアントは、SPIFFE ID ごとに 1 つ登録し、共有しない
  revisit_trigger: エージェントの実行基盤を複数のエージェントで共有するとき
  issuers: ["https://agent-sts.minato-denki.example"]
  authoritative_writer:
    - {stage: ③, writer: agent-sts（mTLS で認証したクライアント）, configurable_by: [platform]}
  issue_events: [I06]
  source_system: agent-sts のクライアントの登録（SPIFFE ID と client_id の表）
  volatility: never
  recompute_trigger: [exchange]
  propagation_delay: 0
  on_revoke: 変わらない値。クライアントの登録を外すと、次の交換から出なくなる
  carried_in: [TOOL_AT, DELEG_AT]
  consumers: [agent-sts, order-tool, refund-tool, customer-tool]
  on_missing: 拒否
  enforced_at:
    - {service: agent-sts, check: DELEG_AT の client_id が assist-agent, against: [api_config]}
    - {service: order-tool, check: act が無ければ拒否（コンソールの経路は order-tool を呼ばない）。act があれば最も外側の act.sub の持ち主と一致, against: [other_claim], with: C-act}
    - {service: refund-tool, check: act が無ければ support-console だけ許す。act があれば最も外側の act.sub の持ち主と一致, against: [api_config, other_claim], with: C-act}
    - {service: customer-tool, check: act が無ければ拒否。act があれば最も外側の act.sub の持ち主と一致, against: [other_claim], with: C-act}
  max_bytes: 32
  overflow_strategy: 上限で固定（超えない値域）
  pii_category: 該当なし
  data_category: [system.operations]
  confidential_from: []
  log_policy: 記録する
  status: active
  owner: 認証基盤チーム
  change_controller: IETF（RFC 8693）
- id: C-scope
  name: scope
  namespace: null
  registered_ref: {kind: spec, id: "RFC 8693 §4.2", url: "https://www.rfc-editor.org/rfc/rfc8693#section-4.2"}
  type: string
  shape: space_delimited
  max_items: 6
  allowed_values: {enum: [openid, "orders:read", "customer.shipping:write", "refunds:quote", "refunds:issue"]}
  value_vocabulary:
    values: [openid, "orders:read", "customer.shipping:write", "refunds:quote", "refunds:issue"]
    owner: サポートセンターのシステム担当（ツールの持ち主）
  description: トークンで呼んでよいツールの操作。TOOL_AT はそのツールの操作だけに絞る
  not_meaning: 担当者のロールではない（ロールは PDP が持つ）。返金の金額の上限ではない
  usage: authz
  decision: 採用
  answers: [q-authorized]
  rationale: >-
    agent-sts は、交換の要求の scope、subject_token の scope、PDP が返す担当者のロールで許される操作、行為者の方針の積だけを出す。
    ツールは自分の操作の scope が無ければ 403（insufficient_scope）にする。ワイルドカードは作らない
  refs:
    - {kind: spec, id: "RFC 8693 §2.1", url: "https://www.rfc-editor.org/rfc/rfc8693#section-2.1"}
    - {kind: guide-slide, id: p10-per-tool-scopes}
  assumption: ツールごとの操作が 1〜2 個で、scope の語彙が増えない
  revisit_trigger: ツールの操作が増え、1 つのツールで 4 つを超える scope が要るとき
  issuers:
    - "https://sso.minato-denki.example/realms/support"
    - "https://agent-sts.minato-denki.example"
  authoritative_writer:
    - {stage: ②, writer: Keycloak（support-console の要求したクライアントスコープ）, configurable_by: [platform]}
    - {stage: ③, writer: agent-sts（積に絞る）, configurable_by: [platform]}
  issue_events: [I01, I02, I06]
  source_system: agent-sts の方針の表と PDP（担当者のロール。人事の台帳から人事連携で Keycloak に届く）
  volatility: 480
  recompute_trigger: [exchange]
  propagation_delay: 480
  on_revoke: ロールの剥奪は、次の交換で agent-sts が PDP を引いて scope から外す（最悪で人事連携 120 秒＋PDP のキャッシュ 30 秒＋TOOL_AT の 330 秒）
  carried_in: [STAFF_AT, TOOL_AT, DELEG_AT]
  consumers: [agent-sts, order-tool, refund-tool, customer-tool]
  on_missing: 拒否
  enforced_at:
    - {service: agent-sts, check: 出す scope は要求・subject_token・PDP のロール・行為者の方針の積, against: [other_claim, data_layer], with: C-scope}
    - {service: order-tool, check: "orders:read が無ければ 403", against: [api_config]}
    - {service: refund-tool, check: "見積もりは refunds:quote、返金は refunds:issue が無ければ 403", against: [api_config]}
    - {service: customer-tool, check: "customer.shipping:write が無ければ 403", against: [api_config]}
  max_bytes: 80
  overflow_strategy: 発行を失敗させる
  pii_category: 該当なし
  data_category: [system.operations]
  confidential_from: []
  log_policy: 記録する
  status: active
  owner: サポートセンターのシステム担当
  change_controller: 認証基盤チーム（台帳の持ち主）
# ---------------------------------------------------------------- 委任と送信者制約
- id: C-act
  name: act
  namespace: null
  registered_ref: {kind: spec, id: "RFC 8693 §4.1", url: "https://www.rfc-editor.org/rfc/rfc8693#section-4.1"}
  type: object
  shape: single
  description: >-
    担当者の代わりに今操作している行為者。最も外側の act.sub が今の行為者（assist-agent か refund-subagent の SPIFFE ID）。
    refund-subagent のトークンでは、その内側の act に、前の行為者の assist-agent が入る
  not_meaning: 誰の権限かではない（それは sub）。入れ子の act（act.act。内側）は今の行為者ではなく、前の行為者の記録で、許可リストと照合しない
  usage: authz
  decision: 採用
  answers: [q-actor, q-agent]
  does_not_answer: [q-sub]
  rationale: >-
    ツールは最も外側の act.sub だけで行為者を判断する（RFC 8693 §4.1）。refund-tool は、最も外側の act.sub を mTLS の相手の SPIFFE ID と照合し、
    操作ごとの行為者の許可リスト（返金は assist-agent だけ、見積もりは assist-agent と refund-subagent）と照合する。内側の act は監査ログに記録するだけ
  refs:
    - {kind: spec, id: "RFC 8693 §4.1", url: "https://www.rfc-editor.org/rfc/rfc8693#section-4.1"}
    - {kind: guide-slide, id: p10-four-questions}
    - {kind: guide-slide, id: p10-delegation-chain-depth}
  assumption: 委任の深さは 2 まで（assist-agent → refund-subagent）。agent-sts は 3 段目の交換を拒否する
  revisit_trigger: refund-subagent がさらに別のエージェントに任せる要望が出たとき
  issuers: ["https://agent-sts.minato-denki.example"]
  authoritative_writer:
    - {stage: ③, writer: agent-sts（actor_token と mTLS の相手から作る。要求の値は使わない）, configurable_by: [platform]}
  issue_events: [I06]
  source_system: agent-sts が認証した actor_token（AGENT_SVID）の sub と、mTLS の相手の SPIFFE ID
  volatility: never
  recompute_trigger: [exchange]
  propagation_delay: 0
  on_revoke: エージェントの登録の取り消しは、agent-sts の交換の拒否で止める（手元の TOOL_AT は最悪 330 秒）
  carried_in: [TOOL_AT, DELEG_AT]
  consumers: [agent-sts, order-tool, refund-tool, customer-tool]
  on_missing: 既定値
  absent_semantics: {absent: 担当者自身がコンソールから操作した（client_id が support-console のときだけ許す）。エージェントの経路では必ずある}
  enforced_at:
    - {service: agent-sts, check: DELEG_AT の最も外側の act.sub が assist-agent で、may_act の主体と actor_token・mTLS の相手が同じ。深さ 3 になる交換は拒否, against: [other_claim], with: C-may-act}
    - {service: order-tool, check: 最も外側の act.sub が mTLS の相手で、order-tool の行為者の許可リスト（assist-agent）にある, against: [api_config, other_claim], with: C-cnf}
    - {service: refund-tool, check: 最も外側の act.sub が mTLS の相手で、操作ごとの行為者の許可リスト（返金は assist-agent、見積もりは assist-agent・refund-subagent）にある。内側の act は記録だけ, against: [api_config, other_claim], with: C-cnf}
    - {service: customer-tool, check: 最も外側の act.sub が mTLS の相手で、customer-tool の行為者の許可リスト（assist-agent）にある, against: [api_config, other_claim], with: C-cnf}
  max_bytes: 160
  overflow_strategy: 発行を失敗させる
  pii_category: 該当なし
  data_category: [system.operations]
  confidential_from: []
  log_policy: 記録する
  status: active
  owner: 認証基盤チーム
  change_controller: IETF（RFC 8693）
  note: 入れ子の act の全体（連鎖）は各ツールが監査ログに記録する。内側の act は「どこを経由したか」の記録で、認可の判断に使わない
- id: C-may-act
  name: may_act
  namespace: null
  registered_ref: {kind: spec, id: "RFC 8693 §4.4", url: "https://www.rfc-editor.org/rfc/rfc8693#section-4.4"}
  type: object
  shape: single
  description: DELEG_AT を subject_token にして交換してよい行為者（refund-subagent の SPIFFE ID）
  not_meaning: すでに代理している者ではない（それは act）。refund-subagent が何をしてよいかではない（それは scope と行為者の許可リスト）
  usage: authz
  decision: 採用
  rationale: >-
    assist-agent が refund-subagent に見積もりを任せるとき、agent-sts は may_act に refund-subagent だけを入れた DELEG_AT を出す。
    agent-sts は DELEG_AT の交換で、actor_token と mTLS の相手が may_act の主体と同じことを確かめる。ほかのワークロードが DELEG_AT を手に入れても交換できない
  refs:
    - {kind: spec, id: "RFC 8693 §4.4", url: "https://www.rfc-editor.org/rfc/rfc8693#section-4.4"}
    - {kind: guide-slide, id: p02-delegation-client}
  assumption: assist-agent が任せてよい相手は agent-sts の委任の表（assist-agent → refund-subagent）で決まり、assist-agent の申告では決まらない
  revisit_trigger: 任せる相手のエージェントを足すとき
  issuers: ["https://agent-sts.minato-denki.example"]
  authoritative_writer:
    - {stage: ③, writer: agent-sts（委任の表から）, configurable_by: [platform]}
  issue_events: [I06]
  source_system: agent-sts の委任の表（認証基盤チームが持つ）
  volatility: never
  recompute_trigger: [exchange]
  propagation_delay: 0
  on_revoke: 委任の表から外すと、次の DELEG_AT から出なくなる。出した DELEG_AT は最悪 330 秒
  carried_in: [DELEG_AT]
  consumers: [agent-sts]
  on_missing: 拒否
  enforced_at:
    - {service: agent-sts, check: may_act.sub が actor_token の sub と mTLS の相手の SPIFFE ID に一致し、委任の表にある, against: [api_config, other_claim], with: C-act}
  max_bytes: 80
  overflow_strategy: 発行を失敗させる
  pii_category: 該当なし
  data_category: [system.operations]
  confidential_from: []
  log_policy: 記録する
  status: active
  owner: 認証基盤チーム
  change_controller: IETF（RFC 8693）
- id: C-cnf
  name: cnf
  namespace: null
  registered_ref: {kind: spec, id: "RFC 8705 §3.1", url: "https://www.rfc-editor.org/rfc/rfc8705#section-3.1"}
  type: object
  shape: single
  description: TOOL_AT を束縛したクライアント証明書の SHA-256 の拇印（x5t#S256）。エージェントの X.509-SVID か、support-console のクライアント証明書
  not_meaning: 行為者の名前ではない（それは act）。証明書の有効期限は表さない
  usage: authz
  decision: 採用
  answers: [q-holder]
  rationale: >-
    ツールは mTLS の相手の証明書の拇印と cnf の x5t#S256 を照合する。TOOL_AT が漏れても、持つべきワークロードの鍵が無ければ使えない
  refs:
    - {kind: spec, id: "RFC 8705 §3.1", url: "https://www.rfc-editor.org/rfc/rfc8705#section-3.1"}
    - {kind: guide-slide, id: p08-rotation}
  assumption: エージェントとツールの間は、組織の網の中で端から端まで mTLS を張り、途中で TLS を終端しない
  revisit_trigger: ツールの手前に TLS を終端する入口を置くとき
  issuers: ["https://agent-sts.minato-denki.example"]
  authoritative_writer:
    - {stage: ③, writer: agent-sts（交換を求めた mTLS の相手の証明書から）, configurable_by: [platform]}
  issue_events: [I06, I29]
  source_system: agent-sts への交換の要求の mTLS の相手の証明書
  volatility: never
  recompute_trigger: [exchange]
  propagation_delay: 0
  on_revoke: 証明書の失効は SPIRE の更新で起きる。TOOL_AT は 300 秒なので、証明書の更新（SVID の寿命 1 時間）の間に取り直す
  carried_in: [TOOL_AT]
  consumers: [order-tool, refund-tool, customer-tool]
  on_missing: 拒否
  enforced_at:
    - {service: order-tool, check: mTLS の相手の証明書の拇印と cnf の x5t#S256 が一致, against: [other_claim], with: C-cnf}
    - {service: refund-tool, check: mTLS の相手の証明書の拇印と cnf の x5t#S256 が一致, against: [other_claim], with: C-cnf}
    - {service: customer-tool, check: mTLS の相手の証明書の拇印と cnf の x5t#S256 が一致, against: [other_claim], with: C-cnf}
  max_bytes: 60
  overflow_strategy: 上限で固定（超えない値域）
  pii_category: 該当なし
  data_category: [system.authentication]
  confidential_from: []
  log_policy: 記録しない
  status: active
  owner: 認証基盤チーム
  change_controller: IETF（RFC 8705）
# ---------------------------------------------------------------- 認証の強さと新しさ
- id: C-acr
  name: acr
  namespace: null
  registered_ref: {kind: spec, id: "OpenID Connect Core 1.0 §2", url: "https://openid.net/specs/openid-connect-core-1_0.html#IDToken"}
  type: string
  shape: single
  allowed_values: {enum: ["pwd", "mfa"]}
  value_vocabulary:
    values: ["pwd", "mfa"]
    owner: 認証基盤チーム（Keycloak の ACR to LoA Mapping）
  description: 担当者のログインの認証の強さ。pwd はパスワードだけ、mfa はパスワードと TOTP
  not_meaning: いつ認証したかではない（それは auth_time）。承認者が承認したことではない
  usage: authz
  decision: 採用
  rationale: >-
    3 万円を超える返金では、refund-tool が acr が mfa であることを求める（RFC 9470）。agent-sts は subject_token の acr を TOOL_AT にそのまま写し、
    値を作らない。コンソールの経路でもエージェントの経路でも、判断するのは refund-tool
  refs:
    - {kind: spec, id: "RFC 9470 §3", url: "https://www.rfc-editor.org/rfc/rfc9470#section-3"}
    - {kind: spec, id: "Keycloak Server Administration Guide（26.8.2）「ACR to Level of Authentication (LoA) Mapping」", url: "https://www.keycloak.org/docs/26.8.2/server_admin/index.html", verified_on: "2026-11-27"}
    - {kind: guide-slide, id: p02-auth-strength-session}
  assumption: Keycloak のブラウザのフローは、acr_values=mfa の要求で TOTP を求める（LoA 2 の段）
  revisit_trigger: 担当者の認証にパスキーを入れるとき（acr の語彙を見直す）
  issuers:
    - "https://sso.minato-denki.example/realms/support"
    - "https://agent-sts.minato-denki.example"
  authoritative_writer:
    - {stage: ①, writer: Keycloak（認証のフローの段）, configurable_by: [platform]}
    - {stage: ③, writer: agent-sts（subject_token から写すだけ）, configurable_by: [platform]}
  issue_events: [I01, I06, I12]
  source_system: Keycloak の認証のフロー
  volatility: never
  recompute_trigger: [login]
  propagation_delay: 0
  on_revoke: ログインごとの値。リフレッシュでは変わらない
  carried_in: [STAFF_AT, ID_TOKEN, TOOL_AT]
  consumers: [support-console, agent-sts, refund-tool]
  on_missing: 既定値
  absent_semantics: {absent: pwd とみなす（3 万円を超える返金は追加の認証を求める）}
  enforced_at:
    - {service: support-console, check: 追加の認証の後の ID トークンの acr が mfa かを確かめてから画面に戻す, against: [api_config]}
    - {service: agent-sts, check: subject_token の acr を写すだけ（判断しない）, against: [format]}
    - {service: refund-tool, check: 3 万円を超える返金で acr が mfa でなければ 401 insufficient_user_authentication（acr_values=mfa・max_age=300）, against: [api_config]}
  max_bytes: 8
  overflow_strategy: 上限で固定（超えない値域）
  pii_category: 該当なし
