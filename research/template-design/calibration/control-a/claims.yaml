  carried_in: [STAFF_AT, ID_TOKEN, ADMIN_API_AT]
  consumers: [support-console, agent-sts]
  on_missing: 拒否
  enforced_at:
    - {service: support-console, check: ID トークンの azp が support-console, against: [api_config]}
    - {service: agent-sts, check: subject_token の azp が support-console（交換を許すクライアントの表）, against: [api_config]}
  max_bytes: 32
  overflow_strategy: 上限で固定（超えない値域）
  pii_category: 該当なし
