- id: C-groups
  name: groups
  namespace: null
  registered_ref: {kind: spec, id: "RFC 9068 §7.2.1", url: "https://www.rfc-editor.org/rfc/rfc9068#section-7.2.1"}
  type: string
  shape: array
  max_items: 20
  description: Keycloak のグループの名前（Group Membership マッパー）
  not_meaning: ロールではない
  decision: 却下
  rejection_kind: 代替あり
  alt: [C-scope]
  rationale: >-
    グループの表示名はチームのリーダーが付け替え・新設できる。返金の権限を表示名の文字列で決めると、名前を変えるだけで権限が動く。
    権限はクライアントのロール（refund-operator などの変わらない名前）で、PDP に問い合わせて決める
  refs:
    - {kind: guide-slide, id: p02-roles-groups-entitlements}
    - {kind: guide-slide, id: p04-split-by-writer}
  assumption: チームのリーダーは Keycloak のグループを管理できるが、クライアントのロールの割り当ては人事連携だけが行う
  revisit_trigger: ロールでなくグループで権限を配る運用に変えるとき
- id: C-roles
  name: roles
  namespace: null
  registered_ref: {kind: spec, id: "RFC 9068 §7.2.1", url: "https://www.rfc-editor.org/rfc/rfc9068#section-7.2.1"}
  type: string
  shape: array
  max_items: 10
  description: 担当者のクライアントのロール（support-agent・refund-operator）
  not_meaning: scope ではない
  decision: 却下
  rejection_kind: 代替あり
  alt: [C-scope]
  rationale: >-
    ロールの剥奪を 5 分以内に返金に届かせるため、ロールをトークンに載せず、refund-tool と agent-sts が PDP に問い合わせる。
    Keycloak のクライアントスコープ roles を support-console から外し、resource_access も出さない
  refs:
    - {kind: guide-slide, id: p04-carry-or-query}
    - {kind: guide-slide, id: p08-stale-claims}
  assumption: PDP は Keycloak のロールの割り当てを 30 秒以内の新しさで返す
  revisit_trigger: PDP の応答が遅く、ツールの呼び出しの遅れが問題になったとき
- id: C-customer-contact
  name: customer_contact
  namespace: "https://minato-denki.example/claims/"
  type: object
  shape: single
  description: 案件の顧客のメールアドレスと電話番号
  not_meaning: 担当者の連絡先ではない
  decision: 却下
  rejection_kind: 代替あり
  alt: [C-customer-ref]
  rationale: >-
    連絡先を使うのは配送先を変える customer-tool だけで、customer-tool は customer_ref で顧客の DB から引く。トークンに載せると、
    エージェントの実行基盤・全ツールの手元とログに顧客の連絡先が残る
  refs:
    - {kind: guide-slide, id: p09-do-not-carry}
    - {kind: guide-slide, id: p09-jws-is-readable}
  assumption: customer-tool は顧客の DB を引ける
  revisit_trigger: 顧客の DB を引けないツールが連絡先を必要とするとき
