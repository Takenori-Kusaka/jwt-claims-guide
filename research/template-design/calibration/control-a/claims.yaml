- id: C-kc-client-id
  name: client_id
  namespace: null
  registered_ref: {kind: spec, id: "RFC 9068 §2.2", url: "https://www.rfc-editor.org/rfc/rfc9068#section-2.2"}
  type: string
  shape: single
  description: STAFF_AT（Keycloak の AT）の client_id
  not_meaning: TOOL_AT の client_id（C-client-id）ではない
  usage: protocol
  decision: 却下
  rejection_kind: IdP が出さない
  alt: [C-azp]
  rationale: Keycloak 26.8 のレルム support の AT は client_id を出さない前提で、agent-sts は azp で求めたクライアントを確かめる。RFC 9068 §2.2 の必須からの逸脱
  refs:
    - {kind: spec, id: "RFC 9068 §2.2", url: "https://www.rfc-editor.org/rfc/rfc9068#section-2.2"}
  assumption: Keycloak の AT の中身は、レルム support のテスト用の利用者で発行したトークンで確かめる（design.md の 12.）
  revisit_trigger: Keycloak が AT に client_id を出すようになったとき（そのときは agent-sts の照合を client_id に移す）
- id: C-client-id
  name: client_id
  namespace: null
  registered_ref: {kind: spec, id: "RFC 8693 §4.3", url: "https://www.rfc-editor.org/rfc/rfc8693#section-4.3"}
  type: string
  shape: single
  description: agent-sts のトークンを求めたクライアント（assist-agent・refund-subagent・support-console）
  not_meaning: 誰の権限かではない（それは sub）。今の行為者の判断には使わない（それは最も外側の act）
  usage: authz
  decision: 採用
  answers: [q-agent]
  rationale: >-
    ツールは、act が無いトークンの client_id が support-console であること（コンソールから担当者自身が操作した）を確かめる。act があるトークンでは、
