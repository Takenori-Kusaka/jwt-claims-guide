- id: C-auth-time
  name: auth_time
  namespace: null
  registered_ref: {kind: spec, id: "OpenID Connect Core 1.0 §2", url: "https://openid.net/specs/openid-connect-core-1_0.html#IDToken"}
  type: integer
  shape: single
  description: 担当者が最後に認証した時刻（UNIX 時刻）
  not_meaning: トークンの発行の時刻ではない（それは iat）。リフレッシュで新しくならない
  usage: authz
  decision: 採用
  rationale: >-
    3 万円を超える返金では、refund-tool が auth_time から 300 秒以内であることを求める。agent-sts は subject_token の値を写すだけ。
    リフレッシュで iat は新しくなるが auth_time は変わらないので、古いログインのまま返金できない
  refs:
    - {kind: spec, id: "RFC 9470 §3", url: "https://www.rfc-editor.org/rfc/rfc9470#section-3"}
    - {kind: spec, id: "OpenID Connect Core 1.0 §3.1.2.1", url: "https://openid.net/specs/openid-connect-core-1_0.html#AuthRequest"}
  assumption: Keycloak の AT に auth_time が載る（max_age を付けたログインで確かめる。design.md の 12.）
  revisit_trigger: Keycloak の版を上げて、AT の auth_time の扱いが変わったとき
  issuers:
    - "https://sso.minato-denki.example/realms/support"
    - "https://agent-sts.minato-denki.example"
  authoritative_writer:
    - {stage: ①, writer: Keycloak, configurable_by: [platform]}
    - {stage: ③, writer: agent-sts（subject_token から写すだけ）, configurable_by: [platform]}
  issue_events: [I01, I06, I12]
  source_system: Keycloak の認証の記録
  volatility: never
  recompute_trigger: [login]
  propagation_delay: 0
  on_revoke: ログインごとの値
  carried_in: [STAFF_AT, ID_TOKEN, TOOL_AT]
  consumers: [support-console, refund-tool]
  on_missing: 既定値
  absent_semantics: {absent: 認証の時刻が分からないので、3 万円を超える返金は追加の認証を求める}
  enforced_at:
    - {service: support-console, check: 追加の認証の後の ID トークンの auth_time が要求の後か, against: [format]}
    - {service: refund-tool, check: 3 万円を超える返金で、今の時刻 − auth_time が 300 秒を超えれば 401 insufficient_user_authentication, against: [api_config]}
  max_bytes: 10
  overflow_strategy: 上限で固定（超えない値域）
  pii_category: 該当なし
  data_category: [system.authentication]
  confidential_from: []
  log_policy: 記録する
  status: active
  owner: 認証基盤チーム
  change_controller: OpenID Foundation
# ---------------------------------------------------------------- 承認
- id: C-authorization-details
  name: authorization_details
  namespace: null
  registered_ref: {kind: spec, id: "RFC 9396 §2", url: "https://www.rfc-editor.org/rfc/rfc9396#section-2"}
  type: object
  shape: array
  max_items: 1
  typical_items: 1
  value_vocabulary:
    values: ["https://minato-denki.example/rar/refund"]
    owner: サポートセンターのシステム担当
  description: >-
    返金の承認の内容。type は https://minato-denki.example/rar/refund、order_id（注文番号の文字列）、amount（10 進の文字列。例 "45000"）、currency（"JPY"）
  not_meaning: 承認の今の状態ではない（取り下げは approval-svc で確かめる）。返金を実行したことではない
  usage: authz
  decision: 採用
  answers: [q-authorized]
  rationale: >-
    3 万円を超える返金で、agent-sts は approval-svc の承認の記録から authorization_details を作り、refund-tool 宛ての TOOL_AT にだけ載せる。
    refund-tool は要求の order_id・amount・currency と完全に一致すること（金額は文字列の 10 進として比べる）を確かめ、食い違えば拒否する
  refs:
    - {kind: spec, id: "RFC 9396 §2", url: "https://www.rfc-editor.org/rfc/rfc9396#section-2"}
    - {kind: spec, id: "RFC 9396 §9.1", url: "https://www.rfc-editor.org/rfc/rfc9396#section-9.1"}
    - {kind: guide-slide, id: p10-human-approval-evidence}
  assumption: 1 つの TOOL_AT で 1 件の返金だけを承認する
  revisit_trigger: 複数の注文の返金をまとめて 1 回で承認する要望が出たとき
  issuers: ["https://agent-sts.minato-denki.example"]
  authoritative_writer:
    - {stage: ⑥, writer: agent-sts（approval-svc の承認の記録から。エージェントの申告では作らない）, configurable_by: [platform]}
  issue_events: [I06, I14]
  source_system: approval-svc の承認の記録（責任者が承認する）
  volatility: 0
  recompute_trigger: [exchange]
  propagation_delay: 0
  on_revoke: 承認の取り下げは、refund-tool が返金のたびに approval-svc で承認の状態を引いて、すぐに止める
  carried_in: [TOOL_AT]
  consumers: [refund-tool]
  on_missing: 既定値
  absent_semantics: {absent: 3 万円以下の返金（承認が要らない）。3 万円を超える返金の要求では拒否する}
  enforced_at:
    - {service: refund-tool, check: 要求の order_id・amount・currency が authorization_details と完全一致（金額は 10 進の文字列として比べる）。3 万円を超えて無ければ拒否, against: [other_claim, data_layer], with: C-approval-id}
  max_bytes: 160
  overflow_strategy: 発行を失敗させる
  pii_category: 個人情報
  data_category: [user.financial]
  confidential_from: []
  log_policy: 記録する
  status: active
  owner: サポートセンターのシステム担当
  change_controller: 認証基盤チーム（台帳の持ち主）
  note: 注文番号と金額は、案件の顧客と結びつく個人情報として扱う。ツールのトークンはブラウザに出ない
# ---------------------------------------------------------------- 組織の名前空間
- id: C-case-id
  name: case_id
  namespace: "https://minato-denki.example/claims/"
  type: string
  shape: single
  allowed_values: {pattern: "^CS-[0-9]{10}$"}
  description: エージェントが進めている案件（サポートの問い合わせ）の ID
  not_meaning: 注文番号ではない。案件に担当者が割り当てられていることの証明ではない（agent-sts が案件の管理で確かめる）
  usage: identifier
  identifier_properties: {stable: true, reassignable: false, pairwise: false, id_scheme: opaque}
  decision: 採用
  answers: [q-txn]
  rationale: >-
    agent-sts は、交換の要求の case_id が subject_token の担当者に割り当てられた案件であることを案件の管理で確かめてから載せる。
    各ツールは case_id を監査ログに残し、案件ごとの操作をたどる
  refs:
    - {kind: guide-slide, id: p06-audit-trail}
    - {kind: author-proposal, id: "案件の ID を交換で載せ、全ツールの監査ログの相関に使う", tracking: "#12"}
  assumption: 案件は 1 人の担当者に割り当てられ、エージェントは 1 つの案件の中で動く
  revisit_trigger: 複数の案件をまとめて扱うエージェントを作るとき
  issuers: ["https://agent-sts.minato-denki.example"]
  authoritative_writer:
    - {stage: ③, writer: agent-sts（案件の管理で割り当てを確かめた値）, configurable_by: [platform]}
  issue_events: [I06]
  source_system: 案件の管理（サポートセンターのシステム）
  verification_method: agent-sts が案件の管理の API で、案件の担当者が sub と一致することを確かめる
  volatility: never
  recompute_trigger: [exchange]
  propagation_delay: 0
  on_revoke: 案件の割り当ての変更は、次の交換で agent-sts が拒否する
  carried_in: [TOOL_AT, DELEG_AT]
  consumers: [agent-sts, order-tool, refund-tool, customer-tool]
  on_missing: 拒否
  enforced_at:
    - {service: agent-sts, check: 案件の管理で、案件の担当者が sub と一致するか, against: [data_layer]}
    - {service: order-tool, check: 案件の customer_ref と注文の顧客を照合するときの案件の指定に使い、監査ログに残す, against: [data_layer]}
    - {service: refund-tool, check: 承認の記録の case_id と一致するか, against: [data_layer]}
    - {service: customer-tool, check: 監査ログに残す, against: [format]}
  max_bytes: 13
  overflow_strategy: 上限で固定（超えない値域）
  pii_category: 該当なし
  data_category: [system.operations]
  confidential_from: []
  log_policy: 記録する
  status: active
  owner: サポートセンターのシステム担当
  change_controller: 認証基盤チーム（台帳の持ち主）
  prior_art_search:
    searched: [IANA JWT Claims registry, draft-ietf-oauth-transaction-tokens-11 §9.2 の txn, RFC 9396 §2]
    nearest: ["txn（Txn-Token の草案。組織の内側の 1 つの取引を指し、案件のように複数の要求をまたがない）"]
    not_used_because: Txn-Token を使わない（目録の TXN_TOKEN は却下）。案件はツールの呼び出しを何回もまたぐので、txn の意味と違う
- id: C-customer-ref
  name: customer_ref
  namespace: "https://minato-denki.example/claims/"
  type: string
  shape: single
  allowed_values: {pattern: "^cr_[A-Za-z0-9]{22}$"}
  description: 案件の顧客を指す不透明な参照。顧客の DB の顧客の行の ID とは別の値で、顧客の DB だけが引ける
  not_meaning: 顧客の連絡先ではない。担当者の ID ではない
  usage: identifier
  identifier_properties: {stable: true, reassignable: false, pairwise: false, id_scheme: opaque}
  decision: 採用
  rationale: >-
    order-tool は、要求の注文の顧客が customer_ref と一致するかを注文の DB で確かめる（案件の顧客の注文だけを読む）。customer-tool は customer_ref で
    顧客の DB から連絡先を引く。トークンに連絡先を載せない
  refs:
    - {kind: guide-slide, id: p09-do-not-carry}
    - {kind: author-proposal, id: "顧客を不透明な参照で運び、連絡先は受け手が顧客の DB から引く", tracking: "#12"}
  assumption: customer_ref は案件の管理が案件ごとに持ち、顧客の DB の主キーと別の値
  revisit_trigger: 顧客の DB を別のシステムに移すとき
  issuers: ["https://agent-sts.minato-denki.example"]
  authoritative_writer:
    - {stage: ③, writer: agent-sts（案件の管理から。要求の値は使わない）, configurable_by: [platform]}
  issue_events: [I06]
  source_system: 案件の管理（顧客の DB の参照を持つ）
  verification_method: agent-sts は case_id で案件の管理から引いた値だけを載せる
  volatility: never
  recompute_trigger: [exchange]
  propagation_delay: 0
  on_revoke: 変わらない値
  carried_in: [TOOL_AT, DELEG_AT]
  consumers: [agent-sts, order-tool, refund-tool, customer-tool]
  on_missing: 拒否
  enforced_at:
    - {service: agent-sts, check: DELEG_AT の customer_ref を、出す TOOL_AT にそのまま写す, against: [other_claim], with: C-case-id}
    - {service: order-tool, check: 注文の DB で、要求の注文の顧客が customer_ref と一致。違えば 404, against: [data_layer]}
    - {service: refund-tool, check: 返金の対象の注文の顧客が customer_ref と一致, against: [data_layer]}
    - {service: customer-tool, check: customer_ref で顧客の DB の行を引き、その顧客の配送先だけを変える, against: [data_layer]}
  max_bytes: 25
  overflow_strategy: 上限で固定（超えない値域）
  pii_category: 個人情報
  data_category: [user.unique_id]
  confidential_from: []
  integrity_until:
    - {place: log, target: 各ツールの監査ログ（ハッシュ化した値）, trust_boundary: 監査ログの基盤（閲覧は監査の担当だけ）}
  log_policy: ハッシュ化して記録
  status: active
  owner: サポートセンターのシステム担当
  change_controller: 認証基盤チーム（台帳の持ち主）
  prior_art_search:
    searched: [IANA JWT Claims registry, OpenID Connect Core 1.0 §5.1]
    nearest: ["sub（トークンの主体を指す。ここでは主体は担当者で、顧客は操作の対象）"]
    not_used_because: 操作の対象の顧客を指す登録名が無い。sub は担当者に使っている
- id: C-approval-id
  name: approval_id
  namespace: "https://minato-denki.example/claims/"
  type: string
  shape: single
  allowed_values: {pattern: "^ap_[0-9a-f]{32}$"}
  description: 3 万円を超える返金の責任者の承認の ID（approval-svc の記録）
  not_meaning: 承認が今も有効であることではない（refund-tool が approval-svc で引く）。承認の中身ではない（それは authorization_details）
  usage: identifier
  identifier_properties: {stable: true, reassignable: false, pairwise: false, id_scheme: opaque}
  decision: 採用
  answers: [q-authorized]
  rationale: >-
    refund-tool は approval_id で approval-svc の承認の状態を返金のたびに引き、取り下げ・使用済み・期限切れなら拒否する。
    承認の消費は approval-svc の条件つきの更新（未使用なら使用済みに）で 1 回だけ成功させる。監査ログで返金と承認を結ぶ
  refs:
    - {kind: guide-slide, id: p10-human-approval-evidence}
    - {kind: author-proposal, id: "承認の ID を交換で載せ、受け手が承認の記録をその都度引く", tracking: "#12"}
  assumption: approval-svc は承認の状態を引く API と、消費の条件つきの更新を持つ
  revisit_trigger: approval-svc を別の製品に替えるとき
  issuers: ["https://agent-sts.minato-denki.example"]
  authoritative_writer:
    - {stage: ⑥, writer: agent-sts（approval-svc の記録から）, configurable_by: [platform]}
  issue_events: [I06, I14]
  source_system: approval-svc の承認の記録
  volatility: never
  recompute_trigger: [exchange]
  propagation_delay: 0
  on_revoke: ID そのものは変わらない。承認の取り下げは refund-tool の approval-svc への問い合わせで反映する
  carried_in: [TOOL_AT]
  consumers: [refund-tool]
  on_missing: 既定値
  absent_semantics: {absent: 承認の要らない返金（3 万円以下）。3 万円を超える返金では拒否する}
  enforced_at:
    - {service: refund-tool, check: approval-svc で状態が承認済み・未使用で、承認の記録の order_id・amount・currency・case_id・担当者が要求と一致。approval-svc が応答しなければ拒否, against: [data_layer]}
  max_bytes: 35
  overflow_strategy: 上限で固定（超えない値域）
  pii_category: 該当なし
  data_category: [system.operations]
  confidential_from: []
  log_policy: 記録する
  status: active
  owner: サポートセンターのシステム担当
  change_controller: 認証基盤チーム（台帳の持ち主）
  prior_art_search:
    searched: [IANA JWT Claims registry, RFC 9396 §2]
    nearest: ["authorization_details の identifier（RFC 9396 §2.2。対象のリソースを指す値で、承認の記録を指す値ではない）"]
    not_used_because: 承認の記録の ID の登録名が無い。authorization_details の中に入れると、受け手ごとに読み方がずれる
