    source_system: Auth0 の Organizations（作るのははこぶねの申し込みの処理だけ）
    volatility: never
    propagation_delay: 0
    recompute_trigger: [login]
    on_revoke: テナントを止めると、TTS がテナントの台帳の状態を引いて次の発行から拒む
    carried_in: [AUTH0_AT]
    consumers: [tts]
    on_missing: 拒否
    enforced_at:
      - {service: tts, check: テナントの台帳で org_id を引き、有効なテナントのときだけ、そのテナント ID で発行する。台帳に無い org_id は拒否, against: [iss, data_layer]}
    identifier_properties: {stable: true, reassignable: false, pairwise: false, id_scheme: opaque}
    max_bytes: 32
    overflow_strategy: 上限で固定（超えない値域）
    pii_category: 該当なし
    log_policy: 記録する
    data_category: [system.operations.tenant]
    confidential_from: []
