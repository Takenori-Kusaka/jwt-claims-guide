  # ------------------------------------------------------------ TTS のトークン（Txn-Token・MSG_CTX）
  - id: C-txn
    name: txn
    namespace: null
    registered_ref: {kind: spec, id: "RFC 8417 §2.2", url: "https://www.rfc-editor.org/rfc/rfc8417#section-2.2"}
    type: string
    shape: single
    description: 取引の ID。入口の要求 1 回（またはキューに入れたラベルの作成 1 件）ごとに TTS が付ける
    not_meaning: トークンの ID ではない。荷物の ID でもない。承認（break-glass の申請）の ID でもない
    decision: 採用
    rationale: edge-gw からサービス・キュー・label-svc まで同じ ID で監査を相関させる。作り直しでも同じ値を引き継ぐ
    refs:
      - {kind: spec, id: "draft-ietf-oauth-transaction-tokens-11 §9.2", url: "https://www.ietf.org/archive/id/draft-ietf-oauth-transaction-tokens-11.txt"}
      - {kind: spec, id: "draft-ietf-oauth-transaction-tokens-11 §13.15", url: "https://www.ietf.org/archive/id/draft-ietf-oauth-transaction-tokens-11.txt"}
      - {kind: guide-slide, id: p06-audit-trail}
    assumption: TTS が UUID を作り、作り直し（MSG_CTX → TXN_TOKEN）では変えない
