      - {service: label-svc, check: ラベルを作る荷物のテナントと一致すること（shipment-svc の応答で確かめる）, against: [iss, data_layer]}
      - {service: report-svc, check: 帳票の問い合わせは共通のライブラリが SET LOCAL したテナントの行だけを読む, against: [iss, data_layer]}
      - {service: postgres, check: RLS の方針が current_setting('app.tenant_id') と行の tenant_id を比べる。設定が無ければ 0 行, against: [data_layer]}
    integrity_until:
      - {place: db_session, target: "PostgreSQL の app.tenant_id（取引ごとの SET LOCAL）", trust_boundary: 共通のデータアクセスのライブラリだけが、検証した Txn-Token から書く。アプリのコードは SET を出せない}
