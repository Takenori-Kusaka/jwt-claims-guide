# template_version: 0.3.0
# 測定の対照に使う教材。設計に使わない
# yaml-language-server: $schema=../../../../templates/registry/claims.schema.json
# 台帳（templates/registry/README.md の 3.1）。はこぶね（荷主向けの出荷管理 SaaS）の設計書
scenario: はこぶね（架空の物流 SaaS。Auth0 の組織で荷主を分け、入口の内側は Txn-Token で運ぶ）
namespaces:
  - namespace: "https://hakobune.example/claims/"
    style: flat_prefix
    owner: はこぶね 基盤チーム（ID とトークン）
    assignment: この台帳への登録（PR）でだけ名前を割り当てる。Auth0 の Actions と TTS が書く名前は、ここに行があるものだけ
data_category_vocabulary:
  name: fideslang
  version: 3.1.4
  url: https://github.com/ethyca/fideslang/blob/3.1.4/data_files/data_categories.csv
  license: CC-BY-4.0
  verified_on: '2026-11-27'
data_category_extensions:
  - {key: system.operations.tenant, parent: system.operations, description: 荷主のテナント（組織）の変わらない ID, owner: はこぶね 基盤チーム（ID とトークン）}
claims:
  # ------------------------------------------------------------ 登録名（Auth0 のトークンと TTS のトークンに共通）
  - id: C-iss
    name: iss
    namespace: null
    registered_ref: {kind: spec, id: "RFC 7519 §4.1.1", url: "https://www.rfc-editor.org/rfc/rfc7519#section-4.1.1"}
    type: string
    shape: single
    description: トークンの発行者。Auth0 のトークンでは Auth0 のカスタムドメイン、TTS のトークンでは TTS の URL
    not_meaning: テナントではない（Auth0 の発行者はすべての荷主で 1 つ）。Entra などの上流の発行者でもない
    decision: 採用
    rationale: 受け手は種別ごとに許す発行者を 1 つに決め、ほかの発行者のトークンを受けない
    refs:
      - {kind: spec, id: "RFC 7519 §4.1.1", url: "https://www.rfc-editor.org/rfc/rfc7519#section-4.1.1"}
      - {kind: guide-slide, id: p04-single-issuer}
    assumption: Auth0 のテナントは 1 つで、荷主の組織はその中の Organizations で分ける
    revisit_trigger: 地域ごとに Auth0 のテナントを分けるとき
    spec_version: [draft-ietf-oauth-transaction-tokens-11]
    usage: protocol
    issuers: ["https://login.hakobune.example/", "https://tts.hakobune.internal"]
    authoritative_writer: [{stage: "②", writer: 発行者（Auth0・TTS）, configurable_by: [platform]}]
    issue_events: [I01, I02, I05, I22]
    source_system: 発行者の設定
    volatility: never
    propagation_delay: 0
    recompute_trigger: [never]
    on_revoke: 該当なし（発行者を替えるときは受け手の許可の設定を先に足す）
    carried_in: [AUTH0_AT, PARTNER_AT, OPS_AT, ID_TOKEN, TXN_TOKEN, TXN_OPS, MSG_CTX]
    consumers: [web-bff, ops-console, edge-gw, tts, shipment-svc, warehouse-svc, billing-svc, label-svc, report-svc]
    on_missing: 拒否
    enforced_at:
      - {service: web-bff, check: ID_TOKEN の iss が Auth0 のカスタムドメインと一致すること, against: [api_config]}
      - {service: ops-console, check: ID_TOKEN の iss が Auth0 のカスタムドメインと一致すること, against: [api_config]}
      - {service: edge-gw, check: AUTH0_AT・PARTNER_AT の iss が Auth0 のカスタムドメインと一致すること, against: [api_config]}
      - {service: tts, check: 受けた subject_token・actor_token の iss が Auth0 か TTS 自身であること, against: [api_config]}
      - {service: shipment-svc, check: 共通の検証部品が TTS の iss だけを受ける, against: [api_config]}
      - {service: warehouse-svc, check: 共通の検証部品が TTS の iss だけを受ける, against: [api_config]}
      - {service: billing-svc, check: 共通の検証部品が TTS の iss だけを受ける, against: [api_config]}
      - {service: label-svc, check: 共通の検証部品が TTS の iss だけを受ける, against: [api_config]}
      - {service: report-svc, check: 共通の検証部品が TTS の iss だけを受ける, against: [api_config]}
    max_bytes: 40
    overflow_strategy: 上限で固定（超えない値域）
    pii_category: 該当なし
    log_policy: 記録する
    data_category: [system.operations]
    confidential_from: []
    status: active
    owner: はこぶね 基盤チーム（ID とトークン）
    change_controller: IETF（RFC 7519）

  - id: C-sub
    name: sub
    namespace: null
    registered_ref: {kind: spec, id: "RFC 7519 §4.1.2", url: "https://www.rfc-editor.org/rfc/rfc7519#section-4.1.2"}
    type: string
    shape: single
    description: >-
      トークンの主体。Auth0 のトークンでは Auth0 の user_id（M2M では client_id に @clients を付けた値）。
      TTS のトークンでは、TTS が決めたはこぶねの主体の ID（荷主の利用者は usr_ で始まるテナントごとの利用者 ID、運送会社は carrier_ で始まる ID、
      夜間の締めの処理はワークロードの SPIFFE ID）
    not_meaning: メールアドレス・氏名ではない。Auth0 の user_id は荷主をまたいで同じ人を表さない（荷主ごとに別の利用者 ID を TTS が割り当てる）。代理している運用者（act）でもない
    decision: 採用
    rationale: 利用者の照合・監査・持ち主の照合のキー。TTS は (iss, sub) と組織（org_id）の組から、はこぶねの利用者 ID を引く
    refs:
      - {kind: spec, id: "RFC 7519 §4.1.2", url: "https://www.rfc-editor.org/rfc/rfc7519#section-4.1.2"}
      - {kind: spec, id: "draft-ietf-oauth-transaction-tokens-11 §9.2", url: "https://www.ietf.org/archive/id/draft-ietf-oauth-transaction-tokens-11.txt"}
      - {kind: guide-slide, id: p02-user-identifier}
    assumption: Auth0 の自動のアカウントの名寄せ（同じメールの利用者を 1 つにする）を有効にしない
    revisit_trigger: Auth0 のアカウントの名寄せを使う要求が出たとき。利用者 ID の割り当て方を変えるとき
    spec_version: [draft-ietf-oauth-transaction-tokens-11]
    usage: identifier
    answers: [q-sub, q-user]
    does_not_answer: [q-actor, q-peer]
    issuers: ["https://login.hakobune.example/", "https://tts.hakobune.internal"]
    authoritative_writer:
      - {stage: "②", writer: Auth0（利用者・クライアントの登録）, configurable_by: [platform]}
      - {stage: "④", writer: TTS（はこぶねの利用者の台帳から引いた ID）, configurable_by: [platform]}
    issue_events: [I01, I02, I05, I22]
    source_system: Auth0 の利用者・クライアントの登録と、はこぶねのテナントの台帳（メンバーの表。TTS だけが書く）
    verification_method: TTS が Auth0 の AT を検証し、(iss, sub, org_id) でメンバーの表を引く。メールでは引かない
    volatility: never
    propagation_delay: 0
    recompute_trigger: [reissue]
    on_revoke: メンバーを外すと、TTS の次の発行から拒む（状態のキャッシュは 60 秒まで）
    carried_in: [AUTH0_AT, PARTNER_AT, OPS_AT, ID_TOKEN, TXN_TOKEN, TXN_OPS, MSG_CTX]
    consumers: [web-bff, ops-console, tts, shipment-svc, warehouse-svc, billing-svc, label-svc, report-svc]
    on_missing: 拒否
    enforced_at:
      - {service: web-bff, check: ID_TOKEN の sub をセッションの持ち主として記録する。セッションの間に sub が変われば拒否する, against: [other_claim], with: C-iss}
      - {service: ops-console, check: ID_TOKEN の sub が運用者の名簿にあること, against: [data_layer]}
      - {service: tts, check: "(iss, sub, org_id) の組でメンバーの表を引き、有効なメンバーのときだけ利用者 ID を出す。運送会社は client_id で運送会社の登録を引く。運用者（OPS_AT）は運用者の名簿を引く", against: [iss, data_layer]}
      - {service: shipment-svc, check: 荷物の作成者・更新者として記録し、利用者の荷物の一覧を sub とテナントで絞る, against: [data_layer]}
      - {service: warehouse-svc, check: 在庫の操作の記録に sub を残す, against: [data_layer]}
      - {service: billing-svc, check: 請求の操作の記録に sub を残す。sub がワークロードの ID のときは billing-batch の ID だけを受ける, against: [api_config, data_layer]}
      - {service: label-svc, check: ラベルの作成者として記録する, against: [data_layer]}
      - {service: report-svc, check: 帳票の出力の記録に sub を残す, against: [data_layer]}
    identifier_properties: {stable: true, reassignable: false, pairwise: false, id_scheme: opaque}
    max_bytes: 128
    overflow_strategy: 上限で固定（超えない値域）
    pii_category: 個人情報
    log_policy: ハッシュ化して記録
    data_category: [user.unique_id]
    confidential_from: []
    integrity_until:
      - {place: log, target: 各サービスの監査ログ（sub の HMAC）, trust_boundary: 監査ログの保存先（読めるのはセキュリティの担当だけ）}
    status: active
    owner: はこぶね 基盤チーム（ID とトークン）
    change_controller: IETF（RFC 7519）

  - id: C-aud
    name: aud
    namespace: null
    registered_ref: {kind: spec, id: "RFC 7519 §4.1.3", url: "https://www.rfc-editor.org/rfc/rfc7519#section-4.1.3"}
    type: string
    shape: array
    description: トークンの宛先。Auth0 の AT では API の audience（openid を求めたときは userinfo も入る）、ID_TOKEN ではクライアントの ID、TTS のトークンでは信頼ドメイン（hakobune.internal）
    not_meaning: 宛先のサービスが操作を許したという意味ではない（操作の範囲は scope と tctx）
    decision: 採用
    rationale: 利用者の AT・運送会社の AT・運用者の AT を宛先で分け、別の口に出されたトークンを受けない
    refs:
      - {kind: spec, id: "RFC 7519 §4.1.3", url: "https://www.rfc-editor.org/rfc/rfc7519#section-4.1.3"}
      - {kind: spec, id: "draft-ietf-oauth-transaction-tokens-11 §9.2", url: "https://www.ietf.org/archive/id/draft-ietf-oauth-transaction-tokens-11.txt"}
    assumption: 3 つの口（荷主の API・partner API・運用）に別の audience を Auth0 に登録する
    revisit_trigger: 口を足すとき。信頼ドメインを分けるとき
    spec_version: [draft-ietf-oauth-transaction-tokens-11]
    usage: protocol
    answers: [q-resource]
    issuers: ["https://login.hakobune.example/", "https://tts.hakobune.internal"]
    authoritative_writer: [{stage: "②", writer: 発行者（Auth0 は要求の audience、TTS は信頼ドメイン）, configurable_by: [platform]}]
    issue_events: [I01, I02, I05, I22]
    source_system: Auth0 の API の登録と TTS の設定
    volatility: never
    propagation_delay: 0
    recompute_trigger: [never]
    on_revoke: 該当なし
    carried_in: [AUTH0_AT, PARTNER_AT, OPS_AT, ID_TOKEN, TXN_TOKEN, TXN_OPS, MSG_CTX]
    consumers: [web-bff, ops-console, edge-gw, tts, shipment-svc, warehouse-svc, billing-svc, label-svc, report-svc]
    on_missing: 拒否
    enforced_at:
      - {service: web-bff, check: ID_TOKEN の aud に自分の client_id があること, against: [api_config]}
      - {service: ops-console, check: ID_TOKEN の aud に自分の client_id があること, against: [api_config]}
      - {service: edge-gw, check: 荷主の口は https://api.hakobune.example、partner の口は https://partner-api.hakobune.example だけを受ける（口ごとに 1 つ）, against: [api_config]}
      - {service: tts, check: subject_token の aud が要求の経路の口と合うこと。OPS_AT は https://ops.hakobune.example だけ, against: [api_config]}
      - {service: shipment-svc, check: aud が hakobune.internal であること, against: [api_config]}
      - {service: warehouse-svc, check: aud が hakobune.internal であること, against: [api_config]}
      - {service: billing-svc, check: aud が hakobune.internal であること, against: [api_config]}
      - {service: label-svc, check: aud が hakobune.internal であること, against: [api_config]}
      - {service: report-svc, check: aud が hakobune.internal であること, against: [api_config]}
    max_bytes: 48
    max_items: 2
    overflow_strategy: 発行を失敗させる
    pii_category: 該当なし
    log_policy: 記録する
    data_category: [system.operations]
    confidential_from: []
    note: 文字列 1 つで届いた aud は 1 要素の配列として読む（RFC 7519 §4.1.3）
    status: active
    owner: はこぶね 基盤チーム（ID とトークン）
    change_controller: IETF（RFC 7519）

  - id: C-exp
    name: exp
    namespace: null
    registered_ref: {kind: spec, id: "RFC 7519 §4.1.4", url: "https://www.rfc-editor.org/rfc/rfc7519#section-4.1.4"}
    type: integer
    shape: single
    description: トークンの期限
    not_meaning: セッション・テナントの契約の期限ではない
    decision: 採用
    rationale: 受け手は期限を過ぎたトークンを受けない。非同期の処理でも同じ（期限の切れた TXN_TOKEN は受けず、MSG_CTX から作り直す）
    refs:
      - {kind: spec, id: "RFC 7519 §4.1.4", url: "https://www.rfc-editor.org/rfc/rfc7519#section-4.1.4"}
      - {kind: spec, id: "draft-ietf-oauth-transaction-tokens-11 §13.15", url: "https://www.ietf.org/archive/id/draft-ietf-oauth-transaction-tokens-11.txt"}
    assumption: サービスの時計は NTP で 1 秒以内にそろう
    revisit_trigger: 時計のずれの監視で 30 秒を超えたとき
    spec_version: [draft-ietf-oauth-transaction-tokens-11]
    usage: protocol
    issuers: ["https://login.hakobune.example/", "https://tts.hakobune.internal"]
    authoritative_writer: [{stage: "②", writer: 発行者, configurable_by: [platform]}]
    issue_events: [I01, I02, I05, I22]
    source_system: 発行者の時計と寿命の設定
    volatility: never
    propagation_delay: 0
    recompute_trigger: [never]
    on_revoke: 該当なし
    carried_in: [AUTH0_AT, PARTNER_AT, OPS_AT, ID_TOKEN, TXN_TOKEN, TXN_OPS, MSG_CTX]
    consumers: [web-bff, ops-console, edge-gw, tts, shipment-svc, warehouse-svc, billing-svc, label-svc, report-svc]
    on_missing: 拒否
    enforced_at:
      - {service: web-bff, check: 期限とずれ 30 秒, against: [format]}
      - {service: ops-console, check: 期限とずれ 30 秒, against: [format]}
      - {service: edge-gw, check: 期限とずれ 30 秒, against: [format]}
      - {service: tts, check: 期限の切れた subject_token（AT・MSG_CTX・TXN_TOKEN）からは発行しない, against: [format]}
      - {service: shipment-svc, check: 期限とずれ 30 秒。exp − iat が 300 秒を超えるものは受けない, against: [format, other_claim], with: C-iat}
      - {service: warehouse-svc, check: 期限とずれ 30 秒。exp − iat が 300 秒を超えるものは受けない, against: [format, other_claim], with: C-iat}
      - {service: billing-svc, check: 期限とずれ 30 秒。exp − iat が 300 秒を超えるものは受けない, against: [format, other_claim], with: C-iat}
      - {service: label-svc, check: 期限とずれ 30 秒。キューから出した後も期限を見る（期限を見ない例外を作らない）, against: [format]}
      - {service: report-svc, check: 期限とずれ 30 秒, against: [format]}
    max_bytes: 10
    overflow_strategy: 上限で固定（超えない値域）
    pii_category: 該当なし
    log_policy: 記録する
    data_category: [system.operations]
    confidential_from: []
    status: active
    owner: はこぶね 基盤チーム（ID とトークン）
    change_controller: IETF（RFC 7519）

  - id: C-iat
    name: iat
    namespace: null
    registered_ref: {kind: spec, id: "RFC 7519 §4.1.6", url: "https://www.rfc-editor.org/rfc/rfc7519#section-4.1.6"}
    type: integer
    shape: single
    description: トークンの発行の時刻
    not_meaning: 利用者が認証した時刻ではない（それは auth_time）
    decision: 採用
    rationale: 未来の時刻のトークンを拒み、TTS のトークンでは exp − iat で寿命の上限を確かめる
    refs:
      - {kind: spec, id: "RFC 7519 §4.1.6", url: "https://www.rfc-editor.org/rfc/rfc7519#section-4.1.6"}
    assumption: 発行者の時計がそろう
    revisit_trigger: 時計のずれの監視で 30 秒を超えたとき
    spec_version: [draft-ietf-oauth-transaction-tokens-11]
    usage: protocol
    issuers: ["https://login.hakobune.example/", "https://tts.hakobune.internal"]
    authoritative_writer: [{stage: "②", writer: 発行者, configurable_by: [platform]}]
    issue_events: [I01, I02, I05, I22]
    source_system: 発行者の時計
    volatility: never
    propagation_delay: 0
    recompute_trigger: [never]
    on_revoke: 該当なし
    carried_in: [AUTH0_AT, PARTNER_AT, OPS_AT, ID_TOKEN, TXN_TOKEN, TXN_OPS, MSG_CTX]
    consumers: [edge-gw, tts, shipment-svc, warehouse-svc, billing-svc]
    on_missing: 拒否
    enforced_at:
      - {service: edge-gw, check: 30 秒より先の時刻なら拒否, against: [format]}
      - {service: tts, check: 30 秒より先の時刻なら拒否, against: [format]}
      - {service: shipment-svc, check: exp − iat の確かめに使う, against: [other_claim], with: C-exp}
      - {service: warehouse-svc, check: exp − iat の確かめに使う, against: [other_claim], with: C-exp}
      - {service: billing-svc, check: exp − iat の確かめに使う, against: [other_claim], with: C-exp}
    max_bytes: 10
    overflow_strategy: 上限で固定（超えない値域）
    pii_category: 該当なし
    log_policy: 記録する
    data_category: [system.operations]
    confidential_from: []
    status: active
    owner: はこぶね 基盤チーム（ID とトークン）
    change_controller: IETF（RFC 7519）

  - id: C-client-id
    name: client_id
    namespace: null
    registered_ref: {kind: spec, id: "RFC 9068 §2.2", url: "https://www.rfc-editor.org/rfc/rfc9068#section-2.2"}
    type: string
    shape: single
    description: AT を求めたクライアント（web-bff・ops-console・運送会社のサーバー）の Auth0 の client_id
    not_meaning: 利用者ではない。運送会社の ID そのものではない（運送会社の登録の表で引く）
    decision: 採用
    rationale: TTS が、運送会社の AT（PARTNER_AT）から運送会社を決める。荷主の AT では、web-bff 以外のクライアントが取った AT を受けない
    refs:
      - {kind: spec, id: "RFC 9068 §2.2", url: "https://www.rfc-editor.org/rfc/rfc9068#section-2.2"}
      - {kind: guide-slide, id: p02-delegation-client}
    assumption: Auth0 のアクセストークンのプロファイルを RFC 9068 にし、client_id を出す（12.）
    revisit_trigger: Auth0 のプロファイルを替えるとき
    usage: identifier
    answers: [q-agent]
    issuers: ["https://login.hakobune.example/"]
    authoritative_writer: [{stage: "②", writer: Auth0（クライアントの登録）, configurable_by: [platform]}]
    issue_events: [I01, I02, I05]
    source_system: Auth0 のアプリケーションの登録と、はこぶねの運送会社の登録の表（client_id と運送会社の ID の対応）
    volatility: never
    propagation_delay: 0
    recompute_trigger: [never]
    on_revoke: 運送会社の契約を止めると、TTS が運送会社の登録を引いて次の発行から拒む
    carried_in: [AUTH0_AT, PARTNER_AT, OPS_AT]
    consumers: [edge-gw, tts]
    on_missing: 拒否
    enforced_at:
      - {service: edge-gw, check: 荷主の口では web-bff の client_id だけを受ける, against: [iss, api_config]}
      - {service: tts, check: 運送会社の登録の表で client_id から運送会社を引き、有効な契約のときだけ発行する。荷主の口・運用の口では web-bff・ops-console の client_id だけ, against: [iss, data_layer]}
    identifier_properties: {stable: true, reassignable: false, pairwise: false, id_scheme: opaque}
    max_bytes: 64
    overflow_strategy: 上限で固定（超えない値域）
    pii_category: 該当なし
    log_policy: 記録する
    data_category: [system.operations]
    confidential_from: []
    status: active
    owner: はこぶね 基盤チーム（ID とトークン）
    change_controller: IETF（RFC 9068）

  - id: C-scope
    name: scope
    namespace: null
    registered_ref: {kind: spec, id: "RFC 8693 §4.2", url: "https://www.rfc-editor.org/rfc/rfc8693#section-4.2"}
    type: string
    shape: space_delimited
    description: >-
      操作の範囲。Auth0 の AT ではクライアントが求めた範囲（荷主の口・partner の口・運用の口ごとの語彙）。
      TTS のトークンでは、TTS が経路の表と荷主のロールから絞った、その取引で使ってよい範囲
    not_meaning: 荷主のロールそのものではない。どの荷物を扱ってよいか（オブジェクト単位の可否）ではない
    decision: 採用
    rationale: 各サービスは TTS のトークンの scope で操作を許すかを決める。Auth0 の AT の scope は TTS が絞るときの上限としてだけ使う
    refs:
      - {kind: spec, id: "RFC 8693 §4.2", url: "https://www.rfc-editor.org/rfc/rfc8693#section-4.2"}
      - {kind: spec, id: "draft-ietf-oauth-transaction-tokens-11 §9.2.1", url: "https://www.ietf.org/archive/id/draft-ietf-oauth-transaction-tokens-11.txt"}
      - {kind: guide-slide, id: p05-scope-vs-role}
    assumption: TTS の経路の表（口・HTTP のメソッド・パスごとの scope）が、各サービスの API と同じ版で配られる
    revisit_trigger: scope の語彙を足すとき。経路の表とサービスの版がずれたとき
    spec_version: [draft-ietf-oauth-transaction-tokens-11]
    usage: authz
    answers: [q-authorized]
    does_not_answer: [q-resource]
    issuers: ["https://login.hakobune.example/", "https://tts.hakobune.internal"]
    authoritative_writer:
      - {stage: "②", writer: Auth0（クライアントが求めた範囲。API の登録の範囲を超えない）, configurable_by: [platform]}
      - {stage: "④", writer: TTS（経路の表と荷主のロールで絞る）, configurable_by: [platform]}
    issue_events: [I01, I02, I05, I22]
    source_system: Auth0 の API の登録と、TTS の経路の表・ロールの表
    value_vocabulary:
      values: [shipments:read, shipments:write, inventory:read, inventory:write, billing:read, billing:admin, reports:read, labels:write, carrier:status, carrier:arrival, ops:break-glass, billing:close]
      owner: はこぶね 基盤チーム（ID とトークン）
      extensible: true
    volatility: 900
    propagation_delay: 630
    recompute_trigger: [refresh, reissue]
    on_revoke: ロールを外すと、TTS の次の発行から絞った範囲に入らない（AUTH0_AT の org_roles が替わるのは次の取り直し。最大 630 秒）
    carried_in: [AUTH0_AT, PARTNER_AT, OPS_AT, TXN_TOKEN, TXN_OPS, MSG_CTX]
    consumers: [edge-gw, tts, shipment-svc, warehouse-svc, billing-svc, label-svc, report-svc]
    on_missing: 拒否
    enforced_at:
      - {service: edge-gw, check: 口ごとの語彙に無い値だけの AT は TTS に送らずに拒む, against: [api_config]}
      - {service: tts, check: 経路の表が求める scope が AT の scope とロールから許される範囲にあるときだけ、その範囲に絞って出す。広げない, against: [api_config]}
      - {service: shipment-svc, check: API ごとに必要な scope がなければ 403, against: [api_config]}
      - {service: warehouse-svc, check: API ごとに必要な scope がなければ 403, against: [api_config]}
      - {service: billing-svc, check: API ごとに必要な scope がなければ 403。billing:admin は TXN_OPS（運用者の代理）か荷主の管理者のロールから絞ったものだけ, against: [api_config]}
      - {service: label-svc, check: labels:write がなければ処理しない, against: [api_config]}
      - {service: report-svc, check: reports:read がなければ 403, against: [api_config]}
    max_bytes: 200
    max_items: 12
    overflow_strategy: 発行を失敗させる
    pii_category: 該当なし
    log_policy: 記録する
    data_category: [system.operations]
    confidential_from: []
    status: active
    owner: はこぶね 基盤チーム（ID とトークン）
    change_controller: IETF（RFC 8693）

  # ------------------------------------------------------------ Auth0 の AT だけに載る（TTS だけが読む）
  - id: C-org-id
