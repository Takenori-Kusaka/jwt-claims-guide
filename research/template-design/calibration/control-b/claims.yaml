      - {service: tts, check: MSG_CTX からの作り直しでは、台帳でテナントが有効なことを確かめてから同じテナント ID で出す, against: [iss, data_layer]}
      - {service: shipment-svc, check: 荷物を ID で取り出すとき、保存データのテナントと一致すること（違えば 404）, against: [iss, data_layer]}
