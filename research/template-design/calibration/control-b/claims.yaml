      - {kind: guide-slide, id: p05-multitenancy}
    assumption: 荷主のテナント 1 つに Auth0 の組織を 1 つ作り、組織の ID をテナントの台帳に持つ
    revisit_trigger: 1 つの荷主に複数の組織を作るとき
    usage: identifier
    answers: [q-user]
    issuers: ["https://login.hakobune.example/"]
