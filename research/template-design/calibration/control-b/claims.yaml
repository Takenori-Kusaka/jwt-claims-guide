  - id: C-entra
    name: entra
    namespace: "https://hakobune.example/claims/"
    type: object
    shape: single
    description: >-
      Entra ID を連携した荷主の利用者だけに載る、上流の Entra の値の写し。tid（Entra のテナントの ID）、oid（利用者のオブジェクト ID）、
      groups（はこぶねのアプリに割り当てた Entra のグループのオブジェクト ID、20 件まで）。post-login の Action が書く
    not_meaning: はこぶねのテナント ID・利用者 ID ではない。メールアドレス・UPN ではない。groups ははこぶねのロールではない（荷主ごとの対応の表で引く）
    decision: 採用
    rationale: >-
      TTS が、連携の利用者の Entra のテナント（tid）がその荷主に登録した Entra のテナントと一致するかを確かめ、(tid, oid) でメンバーの表を引き、
      groups を荷主ごとの対応の表（グループの ID → はこぶねのロールの ID）でロールに替える。UPN・メールが変わっても同じ利用者として扱う
    refs:
      - {kind: guide-slide, id: p03-entra-oid-tid}
      - {kind: guide-slide, id: p03-absorb-idp-differences}
      - {kind: guide-slide, id: p03-entra-scp-roles-groups}
    assumption: Auth0 の Entra の接続の利用者の情報に tid・oid・グループのオブジェクト ID が入り、Action から読める（12.）。荷主の Entra の管理者が、はこぶねのアプリに割り当てるグループを 20 以下にする
    revisit_trigger: Auth0 の Entra の接続の仕様が変わったとき。割り当てるグループが 20 を超える荷主が出たとき
    usage: identifier
    issuers: ["https://login.hakobune.example/"]
    upstream_issuer:
      iss: ["https://login.microsoftonline.com/{tenant}/v2.0"]
      source_attribute: Entra の ID トークンの tid・oid と、グループのオブジェクト ID（Auth0 の利用者の情報に写ったもの）
      normalization: どれも小文字の GUID のまま写し、完全一致で比べる。グループの表示名・UPN・メールは写さない
    authoritative_writer: [{stage: "②", writer: Auth0 の post-login の Action（はこぶねの基盤チームが持つ）, configurable_by: [platform]}]
    provenance: 発行者が確かめた値
    issue_events: [I01, I02, I17]
    source_system: 荷主の Entra ID（Auth0 の Entra の接続を通る）。グループは荷主の Entra の管理者が持ち、Auth0 に届くのは Entra を通ったログインのときだけ
    verification_method: tid は荷主のテナントの台帳に登録した Entra のテナントと照合する。メールのドメインでは所属を決めない
    volatility: 28800
    propagation_delay: 28800
    recompute_trigger: [login]
    on_revoke: グループを外しても、次の Entra を通るログインまで AT に残る（最大 28800 秒）。すぐ止めるときは、荷主の管理者がはこぶねの画面でメンバーを止める（TTS が次の発行から拒む）
    carried_in: [AUTH0_AT]
    consumers: [tts]
    on_missing: 既定値
    absent_semantics: {absent: Entra を連携していない利用者（Auth0 のデータベースの接続）。Entra の連携を登録した荷主の組織で entra が無ければ拒否}
    enforced_at:
      - {service: tts, check: "tid が荷主のテナントの台帳に登録した Entra のテナントと完全一致すること（違えば拒否）。(tid, oid) でメンバーの表を引く。初回は荷主の管理者の招待の記録と組にする。メール・UPN では引かない", against: [iss, data_layer]}
      - {service: tts, check: "groups は、その荷主の対応の表（tid ごと）にある ID だけをロールに替える。ほかの荷主の表・ほかの IdP の値とは突き合わせない", against: [api_config]}
    identifier_properties: {stable: true, reassignable: false, pairwise: false, id_scheme: composite}
    max_bytes: 900
    overflow_strategy: 発行を失敗させる
    pii_category: 個人情報
    log_policy: ハッシュ化して記録
    data_category: [user.unique_id]
    confidential_from: []
    status: active
    owner: はこぶね 基盤チーム（ID とトークン）
    change_controller: はこぶね 基盤チーム（ID とトークン）

