# 2 組目の埋め込んだ誤りの一覧（正解）。#12 の再測定（#82）の採点に使う。レビュアーに渡さない
# この一覧は、設計書の誤りを説明するもので、それ自体は設計に使う教材ではない（誤りを含む設計書は seeded-c/・seeded-d/）
#
# LLM による作成。人による検証ではない。2 組目の測定より前に、別のコミットで固定する（protocol.md の「固定の記録」、commitments.sha256）。
# 測定の後には直さない。誤りが見つかったら、初回の手順（../protocol.md）の 7.「正解の訂正」として記録し、訂正の前と後の両方で採点する。
#
# 列の意味は初回の一覧（../seeded_errors.yaml の冒頭）と同じ。2 組目で足した列（protocol.md の 3.1・3.2・4.）：
#   channel_priority   channel が short_list のとき、channel_question の最初の問いの優先（1 か 2）
#   form               present（誤った文・値が書いてある）／absent（あるべきものが無い。初回の A12 の型）
#   salience_phrase    present の誤りの文を表す短い句。対照には無い。copies はこの句を含む行の数（materialize した seeded の全ファイル）
#   copies・masked_by・salience  protocol.md の 3.1 の規則で機械が決めた値（calibration_check.py の C8 が設計書から数え直して比べる）
#   hint_derived       初回の誤りのうち、#80 の手がかりが核を言い換えた型（A01・A03・A17・B02・B03・B05・B14）と同じ型なら、その ID。結果では再現率を分けて出す
#   hint_note          hint_derived の誤りで、初回とどこ（場所・列・言い回し）を変えたか
#   side_effect_note   埋め込みの副作用の確かめ（protocol.md の 8.2）で足した・直したこと
#
# 書き方の決まり（#82 のコメント）：core は 1 つの事実。also_accepted には、同じ取り違えを別の面から問う ID も入れる。
# ただし also_accepted に 1 枚の優先 1 の問いを足すと手がかり（signpost）が変わり、難しさが変わる（protocol.md の 3.：手がかりは confused_questions と
# also_accepted の問いで数える）。そのため一部の誤りでは、優先 1 の問いを also_accepted に入れていない（各件の channel_note に書いた）。
