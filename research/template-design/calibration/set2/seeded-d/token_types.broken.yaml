  purpose: ログインした社員を staff-console が確かめる
  issuer: shirogane-sso
  aud: [shirogane-staff-console]
  holder: staff-console（サーバー）
  format: jwt
  subject_type: public
  typ: JWT
  kind_discriminator:
    - {claim: aud, note: aud が staff-console の client_id（shirogane-staff-console）で、代理店の assertion と重ならない}
  alg_allowlist: [ES256]
  issuers:
    - {iss: "https://sso.shirogane-sonpo.example", jwks_uri: "https://sso.shirogane-sonpo.example/.well-known/jwks.json"}
  key_source: {from: issuer_metadata_jwks_uri, header_key_params: reject}
  required_claims: [iss, sub, aud, exp, iat, nonce, acr, auth_time]
  max_clock_skew: 30
  max_lifetime: 300
  lifetime_refs:
    - {kind: guidance, id: "NIST IR 8587 §5.3.1.1"}
  lifetime_set_by: [platform]
  refresh: 無い
  sender_constraint: none
  revocation:
    - {method: exp_only, delay_seconds: 330, note: ログインの応答を受けた時点で検証し、その後は使わない}
  long_running: 使わない
  key_rotation: {period_days: 90, publish_before_use_seconds: 600, retire_after_seconds: 630, note: EMPLOYEE_AT と同じ鍵}
  unknown_kid: {refetch_min_interval_seconds: 30, negative_cache_seconds: 30, on_fetch_failure: reject}
  jwks_cache_ttl: 300
  signing_key_scope: shared
  stored_at: bff_server
  transport: token_response_body
  visible_to: [bff, idp]
  jwe: {used: false, note: 社員の ID と認証の強さだけを載せる}
  log_policy: 記録しない
- id: SSO_SESSION
  kind: session
  decision: 採用
  rationale: shirogane-sso のログインのセッション。staff-console が prompt=none で EMPLOYEE_AT を取り直すときに使われる
  refs:
    - {kind: guide-slide, id: p08-token-types-lifetimes}
  purpose: shirogane-sso の上の社員のログインの状態
  issuer: shirogane-sso
  holder: 社員のブラウザ（shirogane-sso のドメインの Cookie）
  format: opaque
  max_lifetime: 36000
  idle_timeout: 900
  lifetime_refs:
    - {kind: guidance, id: "NIST SP 800-63B-4 §2.2.3"}
    - {kind: author-proposal, id: "1 回の勤務（最大 10 時間）の間だけ。無操作 15 分で切る", tracking: "#82"}
  lifetime_set_by: [platform]
  refresh: 無い
  revocation:
    - {method: rp_initiated_logout, delay_seconds: 0, note: staff-console のログアウトで shirogane-sso の logout の端点に送る}
    - {method: session_delete, delay_seconds: 60, note: 社員の台帳で退職・休職になると、shirogane-sso が台帳を 60 秒ごとに引いてセッションを消す}
  stored_at: idp
  transport: cookie
  visible_to: [browser, idp]
  log_policy: 記録しない
- id: STAFF_SESSION
  kind: session
  decision: 採用
  rationale: ブラウザと staff-console の間のセッション。ブラウザにはセッションの ID の Cookie だけを渡す
  refs:
    - {kind: guide-slide, id: p06-flow-browser-to-db}
  purpose: 社員のブラウザからの要求を、サーバーに置いた EMPLOYEE_AT に結びつける
  issuer: staff-console
  holder: 社員の管理端末のブラウザ（Cookie）。中身は staff-console のサーバーの保存先にある
  format: opaque
  max_lifetime: 36000
  idle_timeout: 900
  lifetime_refs:
    - {kind: guidance, id: "NIST SP 800-63B-4 §2.2.3"}
  lifetime_set_by: [platform]
  refresh: 無い（操作のたびに無操作の時計を戻す）
  revocation:
    - {method: session_delete, delay_seconds: 0, note: ログアウトと、front-gw から社員の停止の応答（403）を受けたときに消す。端末・セキュリティキーの紛失の届けでは、IT 基盤部が as-admin-api（scope は admin:staff-auth）で消し、as-admin-api が staff-console のセッションの削除の API（as-admin-api の SPIFFE ID だけを受ける）を呼ぶ}
  stored_at: bff_server
  transport: cookie
  visible_to: [browser, bff]
  log_policy: 記録しない
  note: Cookie は __Host- の接頭辞、Secure・HttpOnly・SameSite=Strict。社内の管理端末からだけ届く（社内の網）
- id: AUTH_CODE
  kind: authorization_code
  decision: 採用
  rationale: claim-portal（shirogane-as）と staff-console（shirogane-sso）のログイン（PAR と認可コード＋PKCE）
  refs:
    - {kind: spec, id: "RFC 9700 §2.1.1", url: "https://www.rfc-editor.org/rfc/rfc9700#section-2.1.1"}
  purpose: 認可応答で BFF に返し、トークンに替える
  issuer: shirogane-as・shirogane-sso
  holder: ブラウザを通って claim-portal・staff-console に届く
  format: opaque
  max_lifetime: 60
  lifetime_refs:
    - {kind: spec, id: "RFC 6749 §4.1.2", url: "https://www.rfc-editor.org/rfc/rfc6749#section-4.1.2"}
  lifetime_set_by: [platform]
  refresh: 無い
  revocation:
    - {method: one_time_use, delay_seconds: 0, note: 1 回だけ使える。shirogane-as・shirogane-sso は、確かめと使用済みにする書き込みを 1 回の条件つきの書き込み（未使用から使用済み）で行い、並行の 2 件は 1 件だけ通し、記録先が応えなければ拒む。2 回目の使用では、その認可コードから出した PH_RT を失効させる。AT は JWT なので exp まで残る（PH_AT・EMPLOYEE_AT は最大 630 秒。引き換えは PKCE と tls_client_auth で claim-portal・staff-console に限られる。すぐ止めたいときは契約者のアカウント・社員を止め、TTS が発行のたびに拒む）}
  stored_at: none
  transport: redirect_query
  visible_to: [browser, bff, idp]
  log_policy: 記録しない
- id: TXN_TOKEN
  kind: txn_token
  decision: 採用
  rationale: front-gw の内側で、契約者・代理店の担当者の請求、査定の確定から作り直した支払いの指示、夜間の支払いの実行の取引を運ぶ。act と認証の強さを持たない Txn-Token
  refs:
    - {kind: spec, id: "draft-ietf-oauth-transaction-tokens-11 §9.2", url: "https://www.ietf.org/archive/id/draft-ietf-oauth-transaction-tokens-11.txt"}
    - {kind: guide-slide, id: p06-transaction-tokens}
  assumption: TTS はしろがねの網の中だけで動き、要求するワークロードを mTLS の相手の SPIFFE ID で認証する（草案 §11.5）
  revisit_trigger: Transaction Tokens の草案の版が変わったとき（RFC になったとき）
  purpose: 取引（1 回の入口の要求、1 件の支払いの指示、1 件の支払いの実行）の主体・操作の範囲・取引の値を、サービスの連鎖の全体で同じ値で運ぶ
  issuer: TTS（しろがねが作る Transaction Token Service）
  aud: [shirogane-sonpo.internal]
  holder: front-gw・payment-worker・payment-batch が TTS から受け取り、内側のサービスが受け取ったまま渡す
  format: jwt
  typ: txntoken+jwt
  alg_allowlist: [ES256]
  issuers:
    - {iss: "https://tts.shirogane-sonpo.internal", jwks_uri: "https://tts.shirogane-sonpo.internal/.well-known/jwks.json"}
  key_source: {from: configured_jwks_uri, header_key_params: reject}
  required_claims: [iss, iat, aud, exp, txn, sub, scope, req_wl, tctx]
  max_clock_skew: 30
  max_lifetime: 300
  lifetime_refs:
    - {kind: spec, id: "draft-ietf-oauth-transaction-tokens-11 §6", url: "https://www.ietf.org/archive/id/draft-ietf-oauth-transaction-tokens-11.txt"}
    - {kind: author-proposal, id: "社員の停止（REQ-03、600 秒）から、状態のキャッシュ 60 秒・寿命 300 秒・時計のずれ 30 秒の和（390 秒）が収まる長さにした", tracking: "#82"}
  lifetime_set_by: [platform]
  refresh: 無い。作り直しもしない（下流は受け取ったまま渡す）。支払いの指示は PAY_MSG_CTX から新しく作る
  sender_constraint: none
  revocation:
    - {method: exp_only, delay_seconds: 330, note: 発行の後は exp まで有効}
    - {method: db_lookup, delay_seconds: 60, note: "TTS が発行のたびに契約者・代理店・社員の状態を引く（C-sub C-agency-code）。状態のキャッシュは 60 秒まで"}
  long_running: >-
    5 分を超える処理には持ち越さない。査定の確定から支払いの指示までは、Txn-Token をメッセージに入れず、TTS が署名したメッセージの文脈（PAY_MSG_CTX）を入れる。
    payment-worker は取り出したときに PAY_MSG_CTX を TTS に出して、新しい TXN_TOKEN を受け取る。夜間の支払いの実行は、payment-batch が支払いの 1 件ごとに自分の ID で求める
  max_delegation_depth: 0
  key_rotation:
    period_days: 30
    publish_before_use_seconds: 600
    retire_after_seconds: 330
    note: TTS の鍵は HSM の中で作り、30 日ごとに替える。次の鍵を JWKS に載せて 600 秒待ってから署名に使い、古い鍵は Txn-Token の受け入れの上限（330 秒）が過ぎてから外す
  unknown_kid: {refetch_min_interval_seconds: 30, negative_cache_seconds: 30, on_fetch_failure: reject}
  jwks_cache_ttl: 300
  signing_key_scope: shared
  stored_at: service_memory
  transport: txn_token_header
  visible_to: [gateway, api]
  jwe: {used: false, note: "主体の ID は不透明な値で、氏名・メール・傷病を載せない。網の中の mTLS の上だけを通る"}
  log_policy: 記録しない
  size:
    signing: {alg: ES256}
    header:
      params:
        - {name: alg, type: string, max_bytes: 5}
        - {name: typ, type: string, max_bytes: 12}
        - {name: kid, type: string, max_bytes: 36}
      serializer_extra_bytes: 0
      serializer_extra_basis: TTS は空白なしで書き出す（作る側で決める）
    path: [nodejs-max-http-header-size]
    other_headers_bytes: 2048
  note: >-
    各サービスは Txn-Token ヘッダーだけで受け、Authorization ヘッダーの値を Txn-Token として読まない。共通の検証部品（shirogane-txn-verifier）が typ・iss・aud・exp を確かめ、
    act のあるトークン（TXN_PROXY）は、act を許す設定のサービス（claim-svc・fraud-svc）だけが受ける
- id: TXN_STAFF
  kind: txn_token
  decision: 採用
  rationale: 社員が自分の権限で行う査定・支払いの承認・管理の操作の Txn-Token。sub は社員、EMPLOYEE_AT の acr・auth_time を写し、操作を受けるサービスが認証の強さと新しさを確かめる
  refs:
    - {kind: spec, id: "draft-ietf-oauth-transaction-tokens-11 §9.2", url: "https://www.ietf.org/archive/id/draft-ietf-oauth-transaction-tokens-11.txt"}
    - {kind: guide-slide, id: p06-step-up-approval}
  assumption: 草案 -11 は Txn-Token に acr・auth_time を載せることを定めていない。しろがねの判断で TTS だけが書く（12.）
  revisit_trigger: 草案が認証の情報の置き場所（rctx など）を定めたとき
  purpose: 査定担当者・上長・代理店管理部・お客さま窓口の上長の操作を、社員の名と認証の強さで内側のサービスに届ける
  issuer: TTS
  aud: [shirogane-sonpo.internal]
  holder: front-gw が TTS から受け取り、内側のサービスが受け取ったまま渡す
  format: jwt
  typ: txntoken+jwt
  alg_allowlist: [ES256]
  issuers:
    - {iss: "https://tts.shirogane-sonpo.internal", jwks_uri: "https://tts.shirogane-sonpo.internal/.well-known/jwks.json"}
  key_source: {from: configured_jwks_uri, header_key_params: reject}
  required_claims: [iss, iat, aud, exp, txn, sub, scope, req_wl, tctx, acr, auth_time]
  max_clock_skew: 30
  max_lifetime: 300
  lifetime_refs:
    - {kind: spec, id: "draft-ietf-oauth-transaction-tokens-11 §6", url: "https://www.ietf.org/archive/id/draft-ietf-oauth-transaction-tokens-11.txt"}
    - {kind: author-proposal, id: "TXN_TOKEN と同じ（REQ-03 の 600 秒に 390 秒で収まる）", tracking: "#82"}
  lifetime_set_by: [platform]
  refresh: 無い。操作のたびに front-gw が TTS に求め、TTS はそのたびに社員の台帳を引く
  sender_constraint: none
  revocation:
    - {method: exp_only, delay_seconds: 330, note: 発行の後は exp まで有効}
    - {method: db_lookup, delay_seconds: 60, note: "TTS が発行のたびに社員の台帳の状態と役割を引く（C-sub C-scope）。台帳のキャッシュは 60 秒まで"}
  long_running: 使わない。査定の確定の後の支払いの指示は PAY_MSG_CTX に替える
  max_delegation_depth: 0
  key_rotation: {period_days: 30, publish_before_use_seconds: 600, retire_after_seconds: 330, note: TXN_TOKEN と同じ鍵}
  unknown_kid: {refetch_min_interval_seconds: 30, negative_cache_seconds: 30, on_fetch_failure: reject}
  jwks_cache_ttl: 300
  signing_key_scope: shared
  stored_at: service_memory
  transport: txn_token_header
  visible_to: [gateway, api]
  jwe: {used: false, note: 社員の ID と認証の強さだけ。傷病の情報を載せない}
  log_policy: 記録しない
  size:
    signing: {alg: ES256}
    header:
      params:
        - {name: alg, type: string, max_bytes: 5}
        - {name: typ, type: string, max_bytes: 12}
        - {name: kid, type: string, max_bytes: 36}
      serializer_extra_bytes: 0
      serializer_extra_basis: TXN_TOKEN と同じ
    path: [nodejs-max-http-header-size]
    other_headers_bytes: 2048
- id: TXN_PROXY
  kind: txn_token
  decision: 採用
  rationale: コールセンターの社員が、電話で本人確認した契約者に代わって請求を受け付けるときの Txn-Token。sub は契約者、act は社員で、IVR の本人確認の記録があるときだけ TTS が出す
  refs:
    - {kind: spec, id: "draft-ietf-oauth-transaction-tokens-11 §9.2", url: "https://www.ietf.org/archive/id/draft-ietf-oauth-transaction-tokens-11.txt"}
    - {kind: spec, id: "RFC 8693 §4.1", url: "https://www.rfc-editor.org/rfc/rfc8693#section-4.1"}
  assumption: IVR の通話の記録（本人確認の結果・時刻・担当の社員）は IVR だけが書き、社員は書けない
  revisit_trigger: 代理受付を請求の受付以外（書類・支払い）に広げるとき。Transaction Tokens の草案の版が変わったとき
  purpose: 代理の操作を、契約者（sub）と社員（act）の両方の名で claim-svc に届ける
  issuer: TTS
  aud: [shirogane-sonpo.internal]
  holder: front-gw が TTS から受け取り、claim-svc が fraud-svc に受け取ったまま渡す
  format: jwt
  typ: txntoken+jwt
  alg_allowlist: [ES256]
  issuers:
    - {iss: "https://tts.shirogane-sonpo.internal", jwks_uri: "https://tts.shirogane-sonpo.internal/.well-known/jwks.json"}
  key_source: {from: configured_jwks_uri, header_key_params: reject}
  required_claims: [iss, iat, aud, exp, txn, sub, act, scope, req_wl, tctx]
  max_clock_skew: 30
  max_lifetime: 60
  lifetime_refs:
    - {kind: spec, id: "draft-ietf-oauth-transaction-tokens-11 §6", url: "https://www.ietf.org/archive/id/draft-ietf-oauth-transaction-tokens-11.txt"}
    - {kind: guide-slide, id: p05-system-privileges}
    - {kind: author-proposal, id: "代理受付は 1 回の要求の連鎖（claim-svc から fraud-svc）だけに使う。通話が終わった後に使える時間を短くするため 60 秒にし、exp は本人確認から 1800 秒を超えない（REQ-11）", tracking: "#82"}
  lifetime_set_by: [platform]
  refresh: 無い。操作のたびに front-gw が TTS に求め、TTS は通話の記録と社員の台帳をそのたびに確かめる
  sender_constraint: none
  revocation:
    - {method: exp_only, delay_seconds: 90, note: 発行の後は exp まで有効。TTS は exp を「発行から 60 秒」と「本人確認から 1800 秒」の早い方にする}
    - {method: db_lookup, delay_seconds: 60, note: "通話の記録は発行のたびにキャッシュせずに引く（終話の時刻がある通話、本人確認から 1800 秒を過ぎた通話では出さない）。社員の台帳のキャッシュは 60 秒まで"}
  long_running: 使わない
  max_delegation_depth: 1
  key_rotation: {period_days: 30, publish_before_use_seconds: 600, retire_after_seconds: 330, note: TXN_TOKEN と同じ鍵}
  unknown_kid: {refetch_min_interval_seconds: 30, negative_cache_seconds: 30, on_fetch_failure: reject}
  jwks_cache_ttl: 300
  signing_key_scope: shared
  stored_at: service_memory
  transport: txn_token_header
  visible_to: [gateway, api]
  jwe: {used: false, note: 契約者の ID と社員の ID は不透明な値}
  log_policy: 記録しない
  size:
    signing: {alg: ES256}
    header:
      params:
        - {name: alg, type: string, max_bytes: 5}
        - {name: typ, type: string, max_bytes: 12}
        - {name: kid, type: string, max_bytes: 36}
      serializer_extra_bytes: 0
      serializer_extra_basis: TXN_TOKEN と同じ
    path: [nodejs-max-http-header-size]
    other_headers_bytes: 2048
  note: 受け手の検証部品は、TXN_PROXY を受けてよいサービス（claim-svc・fraud-svc）の設定でだけ act を許す。ほかのサービスは act のある Txn-Token を拒む
- id: PAY_MSG_CTX
  kind: jwt
  decision: 採用
  rationale: 査定の確定から支払いの指示までブローカーで最大 60 分待つ（要求 REQ-06）。Txn-Token の寿命（5 分）より長いので、メッセージには Txn-Token を入れず、TTS が署名した取引の文脈を入れる。payment-worker はこれを TTS に出して新しい TXN_TOKEN を受け取る
  refs:
    - {kind: spec, id: "draft-ietf-oauth-transaction-tokens-11 §11.2", url: "https://www.ietf.org/archive/id/draft-ietf-oauth-transaction-tokens-11.txt"}
    - {kind: guide-slide, id: p08-async-processing}
  assumption: PAY_MSG_CTX を TTS に出してよいのは payment-worker だけ（TTS の許可リストを mTLS の相手の ID で引く）。PAY_MSG_CTX だけでは API を呼べない
  revisit_trigger: ブローカーで待つ時間の上限（3600 秒）が変わるとき。payment-worker のほかにキューの読み手を足すとき
  purpose: メッセージに入れる、TTS が署名した支払いの指示の文脈（txn・査定を確定した社員・取引の値）。TTS の作り直しの要求の subject_token にだけ使う
  issuer: TTS
  aud: [shirogane-sonpo.internal]
  holder: assessment-svc が TTS から受け取ってメッセージに入れ、payment-worker が取り出す
  format: jwt
  typ: msgctx+jwt
  alg_allowlist: [ES256]
  issuers:
    - {iss: "https://tts.shirogane-sonpo.internal", jwks_uri: "https://tts.shirogane-sonpo.internal/.well-known/jwks.json"}
  key_source: {from: configured_jwks_uri, header_key_params: reject}
  required_claims: [iss, iat, aud, exp, txn, sub, scope, tctx]
  max_clock_skew: 30
  max_lifetime: 3600
  lifetime_refs:
    - {kind: author-proposal, id: "ブローカーのメッセージの保持の上限（3600 秒。REQ-06）と同じにする。過ぎたメッセージは滞留のキューに移し、査定担当者が新しい版の確定をする（payment-svc は古い版と、未実行の指示がある間の新しい版を受けない）", tracking: "#82"}
    - {kind: guide-slide, id: p08-async-processing}
  lifetime_set_by: [platform]
  refresh: 無い
  sender_constraint: none
  revocation:
    - {method: exp_only, delay_seconds: 3630, note: PAY_MSG_CTX そのものは exp まで有効だが、使えるのは TTS への作り直しの要求だけ}
    - {method: db_lookup, delay_seconds: 60, note: "TTS が作り直しのたびに、査定を確定した社員の台帳の状態と役割を引き直す（C-sub C-scope）。役割が外れていれば作り直さない。請求の保留と版は payment-svc が受け付けの取引で確かめる"}
  long_running: ブローカーで待つ間だけ使う。payment-worker は取り出した後すぐに TTS で TXN_TOKEN に替え、期限を過ぎた PAY_MSG_CTX のメッセージは TTS に出さずに滞留のキューに移す
  key_rotation: {period_days: 30, publish_before_use_seconds: 600, retire_after_seconds: 330, note: TXN_TOKEN と同じ鍵}
  unknown_kid: {refetch_min_interval_seconds: 30, negative_cache_seconds: 30, on_fetch_failure: reject}
  jwks_cache_ttl: 300
  signing_key_scope: shared
  stored_at: none
  transport: back_channel_post
  visible_to: [broker, api]
  jwe: {used: false, note: 社員の ID・請求の ID・金額・振込先の参照 ID だけ。口座番号・傷病を載せない}
  log_policy: 記録しない
  note: TTS は typ が msgctx+jwt のトークンを、作り直しの要求の subject_token のときだけ受ける。ほかのサービスの検証部品は typ が txntoken+jwt 以外を拒む
- id: CLIENT_ASSERTION
  kind: client_assertion
  decision: 却下
  rationale: クライアント認証は mTLS（tls_client_auth）で行い、private_key_jwt の assertion を作らない。できなくなるのは、TLS を終端する部品の後ろからクライアント認証すること（しろがねのトークンの端点は TLS を自分で終端する）
  assumption: shirogane-as・shirogane-sso のトークンの端点の前に、TLS を終端する別の部品を置かない
  revisit_trigger: トークンの端点の前に CDN・ロードバランサーを置くとき
  format: jwt
- id: LOGOUT_TOKEN
  kind: logout_token
  decision: 却下
  rationale: Back-Channel Logout を受けない。契約者・社員を止めたとき、claim-portal・staff-console のセッションは残るが、そこからの要求は TTS が毎回状態を引いて拒むので、ログアウトの通知が無くても REQ-01・REQ-03 を満たす。できなくなるのは、IdP での操作をきっかけに BFF のセッションをすぐ消すこと
  assumption: claim-portal・staff-console のセッションは、それだけでは何も読めない（すべての API の呼び出しが TTS の発行を通る）
  revisit_trigger: BFF のセッションに API の応答をキャッシュするとき
  format: jwt
- id: INTERNAL_TOKEN
  kind: internal_token
  decision: 却下
  rationale: 入口の内側は Txn-Token（TXN_TOKEN・TXN_STAFF・TXN_PROXY）だけで運ぶ。組織独自の内部トークンを並べると、受け手の検証の設定が 2 つになる。できなくなるのは、Txn-Token の草案に無い形を内部で自由に決めること
  assumption: 草案 -11 の Txn-Token の形（必須のクレームと tctx・rctx）で、内側の判断に要る値が足りる
  revisit_trigger: 草案の版が変わり、必須のクレームや運び方が変わったとき
  format: jwt
- id: ID_JAG
  kind: id_jag
  decision: 却下
  rationale: しろがねの利用者の SSO 済みの認可を、別の組織の API に持ち込む経路が無い（代理店の API をしろがねが呼ばない）。できなくなるのは、代理店の仕組みを契約者の名で呼ぶこと（呼ぶ必要が無い）
  assumption: 代理店への通知は代理店の口の応答と代理店の画面で行い、しろがねから代理店の API を呼ばない
  revisit_trigger: 支払いの結果を代理店の API に送る要求が出たとき
  format: jwt
- id: DPOP_PROOF
  kind: dpop_proof
  decision: 却下
  rationale: 送信者制約は代理店の AT だけで、mTLS（RFC 8705）で行う。DPoP の proof を作らない。代理店は証明書を扱え、トークンの要求も同じ証明書で認証するので mTLS で足りる。PH_AT・EMPLOYEE_AT を DPoP で束縛する候補は、鍵が AT と同じ BFF のサーバーに置かれて守りが増えないので見送った（設計書の 3.1）。できなくなるのは、TLS の証明書を扱えないクライアントの AT を束縛すること
  refs:
    - {kind: spec, id: "RFC 9449 §1", url: "https://www.rfc-editor.org/rfc/rfc9449#section-1"}
  revisit_trigger: 証明書を扱えない代理店（ブラウザだけの小さな代理店など）を受け入れるとき
  format: jwt
- id: JAR_REQUEST_OBJECT
  kind: jar_request_object
  decision: 却下
  rationale: 認可要求は PAR でサーバーから送るので、ブラウザを通る要求の改ざんの心配が無い。署名つきの要求を作らない。できなくなるのは、要求そのものの署名の検証（PAR の mTLS の認証で代える）
  assumption: PAR の要求は tls_client_auth で認証される
  revisit_trigger: 認可要求に承認の内容（RAR）を載せるとき
  format: jwt
- id: JARM_RESPONSE
  kind: jarm_response
  decision: 却下
  rationale: 認可応答は認可コードだけで、PKCE と state と iss（RFC 9207）で守る。できなくなるのは、認可応答そのものの署名の検証
  refs:
    - {kind: spec, id: "RFC 9207 §2", url: "https://www.rfc-editor.org/rfc/rfc9207#section-2"}
  revisit_trigger: FAPI の適合を求められたとき
  format: jwt
- id: SECURITY_EVENT_TOKEN
  kind: security_event_token
  decision: 却下
  rationale: SSF・CAEP の送信も受信もしない。止める処理は TTS が発行のたびに状態を引くことで代える。代理店の IdP の側で担当者を止めても、しろがねは次の assertion まで知らないが、止める直前の assertion は 60 秒、代理店の担当者の AT は 300 秒で切れ、新しい AT には新しい assertion が要る（最悪 750 秒）。できなくなるのは、代理店の側の停止を即時に知ること
  assumption: 代理店の担当者の停止は、代理店の IdP が次の assertion を出さないことで効く（止める直前の assertion 90 秒、AGENCY_AT 330 秒、Txn-Token 330 秒で、最大 750 秒。REQ-02 の 900 秒に収まる）
  revisit_trigger: 代理店から、担当者の停止を即時に効かせる要求が出たとき
  format: jwt
- id: STATUS_LIST_TOKEN
  kind: status_list_token
  decision: 却下
  rationale: 状態リストを出さない。受け手に届くのは寿命が 5〜10 分のトークンと、TTS だけが受ける PAY_MSG_CTX なので、個別の失効を配る仕組みは要らない。できなくなるのは、発行済みの 1 枚を名指しで止めること
  assumption: 受け手が受ける JWT の寿命は 600 秒以下（PAY_MSG_CTX は TTS だけが受け、作り直しのたびに状態を引く）
  revisit_trigger: 寿命が 15 分を超える JWT を内側の受け手に渡すとき
  format: jwt
- id: INTROSPECTION_RESPONSE_JWT
  kind: introspection_response_jwt
  decision: 却下
  rationale: AT は JWT で、front-gw と TTS が手元で検証する。イントロスペクションを使わない。できなくなるのは、shirogane-as に問い合わせて AT の今の有効性を知ること（TTS が契約者・代理店の状態を直接引く）
  assumption: TTS は契約者・代理店の状態を shirogane-as の状態の参照の API で直接引ける
  revisit_trigger: TTS が状態を引けない構成にするとき
  format: jwt
