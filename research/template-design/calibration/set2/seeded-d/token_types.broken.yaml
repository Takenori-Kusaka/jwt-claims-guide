  issuer: shirogane-sso（しろがねが運用する社員の OIDC の OP。sso.shirogane-sonpo.example）
  aud: ["https://staff-api.shirogane-sonpo.example"]
  holder: staff-console（サーバー）
  format: jwt
  subject_type: public
  typ: at+jwt
  alg_allowlist: [ES256]
  issuers:
    - {iss: "https://sso.shirogane-sonpo.example", jwks_uri: "https://sso.shirogane-sonpo.example/.well-known/jwks.json"}
  key_source: {from: issuer_metadata_jwks_uri, header_key_params: reject}
  required_claims: [iss, sub, aud, exp, iat, jti, client_id, scope, acr, auth_time]
  max_clock_skew: 30
  max_lifetime: 600
  lifetime_refs:
    - {kind: guidance, id: "NIST IR 8587 §5.3.1.1"}
