# template_version: 0.3.0
# 意図的に誤りを含む教材。設計に使わない
# yaml-language-server: $schema=../../../../../templates/registry/token_types.schema.json
# トークン目録（templates/registry/README.md の 3.2）と発行方式の選択（3.3）。しろがね損保（保険金の請求と支払いの内部処理）の設計書
issuance_profile:
  client_type:
    value: confidential
    rationale: 契約者の画面（claim-portal）と社員の画面（staff-console）はサーバーで動く BFF で、トークンをブラウザに渡さない。代理店の連携は代理店のサーバーからの呼び出しで、どれも秘密鍵をサーバーに置ける
    refs:
      - {kind: guide-slide, id: p06-grant-types}
      - {kind: spec, id: "RFC 9700 §2.1", url: "https://www.rfc-editor.org/rfc/rfc9700#section-2.1"}
  client_auth:
    value: tls_client_auth
    rationale: >-
      どのクライアントも mTLS の証明書でトークンの端点に認証する（RFC 8705 §2.1）。claim-portal・staff-console は網の中の X.509-SVID、代理店のサーバーはしろがねの代理店向けの CA が出した証明書。
      共有の秘密を置かず、代理店の AT を同じ証明書に束縛できる（sender_constraint）。秘密の鍵はクライアントのサーバーの外に出ない
    refs:
      - {kind: spec, id: "RFC 8705 §2.1", url: "https://www.rfc-editor.org/rfc/rfc8705#section-2.1"}
      - {kind: guide-slide, id: p01-client-made-jwts}
  grants:
    value: [authorization_code_pkce, refresh_token, jwt_bearer, token_exchange]
    rationale: >-
      契約者と社員は認可コード＋PKCE。claim-portal だけが RT で AT を取り直す。代理店のサーバーは代理店の IdP が署名した assertion で AT を取る（RFC 7523。jwt_bearer）。
      TTS は Txn-Token の要求をトークン交換の形で受ける（shirogane-as・shirogane-sso はトークン交換を受けない）
    refs:
      - {kind: spec, id: "RFC 7523 §2.1", url: "https://www.rfc-editor.org/rfc/rfc7523#section-2.1"}
      - {kind: spec, id: "draft-ietf-oauth-transaction-tokens-11 §11.1", url: "https://www.ietf.org/archive/id/draft-ietf-oauth-transaction-tokens-11.txt"}
  sender_constraint:
    value: mtls
    rationale: >-
      代理店の AT（AGENCY_AT）は、しろがねの網の外の代理店のサーバーに置かれるので、代理店のサーバーの証明書に束縛する（RFC 8705 §3。cnf の x5t#S256）。
      契約者と社員の AT（PH_AT・EMPLOYEE_AT）は束縛しない（目録の sender_constraint: none）。この 2 つは claim-portal・staff-console のサーバーの中にだけあり、
      front-gw の契約者の口と社員の口は claim-portal・staff-console の X.509-SVID の mTLS からしか接続を受けないので、盗まれた AT を網の外から使えない。
      SVID は 1 時間ごとに替わり、mTLS で束縛すると替わった直後の AT が使えなくなる。DPoP（BFF が持つ替わらない鍵）で束縛する候補も比べたが、鍵は AT と同じ BFF のサーバーに置くので、BFF が破られたときには両方が盗まれ、
      AT だけが漏れる経路（ログなど）は front-gw の口の mTLS の相手の制限で既に閉じている。proof の作成と照合の費用に対して守りが増えないので見送った（見送りの理由と確かめ方は設計書の 3.1）
    refs:
      - {kind: spec, id: "RFC 8705 §3", url: "https://www.rfc-editor.org/rfc/rfc8705#section-3"}
      - {kind: guide-slide, id: p12-priorities-deferrals}
  tls_termination:
    value: at_entry
    rationale: 代理店の mTLS は front-gw が終端し、front-gw が証明書の拇印と AGENCY_AT の cnf を照らす。front-gw の内側は網の中の mTLS（SPIFFE）で、代理店の証明書は内側に届かない
    refs:
      - {kind: spec, id: "RFC 8705 §3", url: "https://www.rfc-editor.org/rfc/rfc8705#section-3"}
  forwarded_cert_header:
    name: Shirogane-Client-Cert-S256
    strip_inbound: true
    written_only_by: front-gw（代理店の口の TLS の終端。代理店から来た同名のヘッダーは捨てる。TTS は front-gw の SPIFFE ID からの要求でだけこのヘッダーを読む）
  at_format:
    value: jwt
    rationale: front-gw と TTS が手元で検証する。外の AT は入口の内側に入らない（内側は Txn-Token）ので、内側の受け手のための不透明な AT は要らない
    refs:
      - {kind: guide-slide, id: p01-self-contained-vs-reference}
  rt_strategy:
    value: rotation_reuse_detection
    rationale: claim-portal の RT は使うたびに替え、古い RT の再利用で系列を止める（shirogane-as が実装する）。RT はサーバーにだけ置く
    refs:
      - {kind: spec, id: "RFC 9700 §4.14.2", url: "https://www.rfc-editor.org/rfc/rfc9700#section-4.14.2"}
  request_protection:
    value: [par, resource_indicators]
    rationale: 認可要求は PAR（RFC 9126）でサーバーから送り、ブラウザの URL に要求の中身を載せない。宛先は resource（RFC 8707）で 1 つだけ求め、AT の aud を口ごとに 1 つにする
    refs:
      - {kind: spec, id: "RFC 9126 §1", url: "https://www.rfc-editor.org/rfc/rfc9126#section-1"}
      - {kind: spec, id: "RFC 8707 §2", url: "https://www.rfc-editor.org/rfc/rfc8707#section-2"}
      - {kind: guide-slide, id: p09-url-browser}
  conformance_profile:
    value: none
    rationale: 保険業の監督の指針は、FAPI などの特定のプロファイルへの適合を求めていない（しろがねの法務部の確認）。保険金の支払いは振込のファイルで銀行に渡し、API で口座を動かさない
    refs:
      - {kind: spec, id: "FAPI 2.0 Security Profile（Final）§5.3.2.1", url: "https://openid.net/specs/fapi-security-profile-2_0-final.html"}
token_types:
- id: PH_AT
  kind: access_token
  decision: 採用
  rationale: 契約者が claim-portal から front-gw の契約者の口を呼ぶための AT。front-gw が受けて、TTS が Txn-Token に作り直す。内側のサービスはこの AT を見ない
  refs:
    - {kind: spec, id: "RFC 9068 §2.2", url: "https://www.rfc-editor.org/rfc/rfc9068#section-2.2"}
    - {kind: guide-slide, id: p06-edge-exchange}
  purpose: 契約者の権限で、請求の受付・照会と書類の登録を front-gw に頼む。sub は契約者の ID（ph_）で、代理店の AT・社員の AT とは aud と iss で分ける
  issuer: shirogane-as（しろがねが運用する契約者と代理店の認可サーバー。auth.shirogane-sonpo.example）
  aud: ["https://portal-api.shirogane-sonpo.example"]
  holder: claim-portal（サーバー）
  format: jwt
  subject_type: public
  typ: at+jwt
  alg_allowlist: [ES256]
  issuers:
    - {iss: "https://auth.shirogane-sonpo.example", jwks_uri: "https://auth.shirogane-sonpo.example/.well-known/jwks.json"}
  key_source: {from: issuer_metadata_jwks_uri, header_key_params: reject}
  required_claims: [iss, sub, aud, exp, iat, jti, client_id, scope]
  max_clock_skew: 30
  max_lifetime: 600
  lifetime_refs:
    - {kind: guidance, id: "NIST IR 8587 §5.3.1.1"}
    - {kind: author-proposal, id: "盗まれた AT を使える時間を 10 分に抑える。契約者の停止（REQ-01、900 秒）は AT の寿命でなく、TTS が発行のたびに契約者の状態を引くことで効かせる", tracking: "#82"}
  lifetime_set_by: [platform]
  refresh: claim-portal が PH_RT で取り直す（I02）
  sender_constraint: none
  revocation:
    - {method: exp_only, delay_seconds: 630, note: "AT そのものは exp まで有効。止める処理は TTS が発行のたびに契約者の状態を引く（TXN_TOKEN の db_lookup）。AT だけでは内側の API を呼べない"}
    - {method: refresh_failure, delay_seconds: 630, note: 契約者のアカウントを止めると、shirogane-as は次の RT での取り直しを拒む}
    - {method: db_lookup, delay_seconds: 60, note: PH_AT を受けて働くのは TTS への要求だけで、TTS は発行のたびに契約者の状態を引き、scope を経路の表で絞り直す（C-sub C-scope。キャッシュ 60 秒）。止めた後の PH_AT からは Txn-Token が出ない}
  long_running: 長い処理には使わない。front-gw が受けた時点で Txn-Token に替え、AT は内側に渡さない
  key_rotation:
    period_days: 90
    publish_before_use_seconds: 600
    retire_after_seconds: 630
    note: shirogane-as の署名鍵は鍵の保管の仕組み（HSM）の中で作り、90 日ごとに替える。次の鍵を JWKS に載せて 600 秒（受け手の JWKS のキャッシュ 300 秒の 2 倍）待ってから署名に使い、古い鍵は最後の AT の受け入れの上限（630 秒）が過ぎてから外す
  unknown_kid: {refetch_min_interval_seconds: 30, negative_cache_seconds: 30, on_fetch_failure: reject}
  jwks_cache_ttl: 300
  signing_key_scope: shared
  stored_at: bff_server
  transport: authorization_bearer
  visible_to: [bff, gateway, idp]
  jwe: {used: false, note: "AT には氏名・メール・証券番号を載せない。届くのは claim-portal・front-gw・TTS（どれもしろがねの網の中の部品）だけ"}
  log_policy: jti だけ記録
  size:
    signing: {alg: ES256}
    header:
      params:
        - {name: alg, type: string, max_bytes: 5}
        - {name: typ, type: string, max_bytes: 6}
        - {name: kid, type: string, max_bytes: 36}
      serializer_extra_bytes: 0
      serializer_extra_basis: shirogane-as は空白なしで書き出す（作る側で決める）
    path: [nginx-large-client-header-buffers]
    other_headers_bytes: 2048
  note: front-gw の契約者の口は claim-portal の X.509-SVID の mTLS からしか接続を受けない（送信者制約の代わり。3.1）。経路の上限は front-gw の HTTP の受け口の 8192 バイト
- id: PH_ID_TOKEN
  kind: id_token
  decision: 採用
  rationale: claim-portal が契約者のログインの結果を受け取り、セッションを作る。API には送らない
  refs:
    - {kind: spec, id: "OpenID Connect Core 1.0 §3.1.3.7", url: "https://openid.net/specs/openid-connect-core-1_0.html#IDTokenValidation"}
  purpose: ログインした契約者を claim-portal が確かめる
  issuer: shirogane-as
  aud: [shirogane-claim-portal]
  holder: claim-portal（サーバー）
  format: jwt
  subject_type: public
  typ: JWT
  kind_discriminator:
    - {claim: aud, note: aud が claim-portal の client_id（shirogane-claim-portal）で、代理店の assertion（aud は shirogane-as のトークンの端点）と重ならない}
  alg_allowlist: [ES256]
  issuers:
    - {iss: "https://auth.shirogane-sonpo.example", jwks_uri: "https://auth.shirogane-sonpo.example/.well-known/jwks.json"}
  key_source: {from: issuer_metadata_jwks_uri, header_key_params: reject}
  required_claims: [iss, sub, aud, exp, iat, nonce]
  max_clock_skew: 30
  max_lifetime: 300
  lifetime_refs:
    - {kind: guidance, id: "NIST IR 8587 §5.3.1.1"}
  lifetime_set_by: [platform]
  refresh: 無い（ログインのときだけ使う）
  sender_constraint: none
  revocation:
    - {method: exp_only, delay_seconds: 330, note: ログインの応答を受けた時点で検証し、その後は使わない}
  long_running: 使わない
  key_rotation: {period_days: 90, publish_before_use_seconds: 600, retire_after_seconds: 630, note: PH_AT と同じ鍵}
  unknown_kid: {refetch_min_interval_seconds: 30, negative_cache_seconds: 30, on_fetch_failure: reject}
  jwks_cache_ttl: 300
  signing_key_scope: shared
  stored_at: bff_server
  transport: token_response_body
  visible_to: [bff, idp]
  jwe: {used: false, note: email を載せるが、トークンの応答で claim-portal のサーバーに届き、ログに出さない}
  log_policy: 記録しない
  note: 種類の区別は typ（JWT と at+jwt）と aud（クライアントの ID と API の識別子）で行う。shirogane-as は ID トークンに typ JWT を書く
- id: PH_RT
  kind: refresh_token
  decision: 採用
  rationale: claim-portal が契約者を毎回ログインさせずに、10 分の PH_AT を取り直す
  refs:
    - {kind: spec, id: "RFC 9700 §4.14.2", url: "https://www.rfc-editor.org/rfc/rfc9700#section-4.14.2"}
  purpose: claim-portal が PH_AT を取り直す
  issuer: shirogane-as
  holder: claim-portal（サーバー）
  format: opaque
  max_lifetime: 28800
  idle_timeout: 1800
  lifetime_refs:
    - {kind: guidance, id: "NIST SP 800-63B-4 §2.2.3"}
    - {kind: guide-slide, id: p08-token-types-lifetimes}
  lifetime_set_by: [platform]
  refresh: 使うたびに新しい RT に替わる
  rt_rotation: {rotation: true, reuse_detection: "yes"}
  sender_constraint: none
  revocation:
    - {method: rotation, delay_seconds: 0, note: 古い RT の再利用で系列を止める（shirogane-as の実装）}
    - {method: revocation_endpoint, delay_seconds: 0, note: ログアウトのときに claim-portal が失効させる}
    - {method: refresh_failure, delay_seconds: 0, note: 契約者のアカウントを止めると、次の取り直しが失敗する}
  stored_at: bff_server
  transport: token_response_body
  visible_to: [bff, idp]
  log_policy: 記録しない
- id: AS_SESSION
  kind: session
  decision: 採用
  rationale: shirogane-as のログインのセッション。claim-portal のセッションが切れたときの再ログインで使われる
  refs:
    - {kind: guide-slide, id: p08-token-types-lifetimes}
  purpose: shirogane-as の上の契約者のログインの状態
  issuer: shirogane-as
  holder: 契約者のブラウザ（shirogane-as のドメインの Cookie）
  format: opaque
  max_lifetime: 28800
  idle_timeout: 1800
  lifetime_refs:
    - {kind: guidance, id: "NIST SP 800-63B-4 §2.2.3"}
  lifetime_set_by: [platform]
  refresh: 無い
  revocation:
    - {method: rp_initiated_logout, delay_seconds: 0, note: claim-portal のログアウトで shirogane-as の logout の端点に送る}
    - {method: session_delete, delay_seconds: 0, note: 契約者のアカウントを止めると shirogane-as がセッションを消す}
  stored_at: idp
  transport: cookie
  visible_to: [browser, idp]
  log_policy: 記録しない
- id: PORTAL_SESSION
  kind: session
  decision: 採用
  rationale: ブラウザと claim-portal の間のセッション。ブラウザにはセッションの ID の Cookie だけを渡し、トークンを渡さない
  refs:
    - {kind: guide-slide, id: p06-flow-browser-to-db}
  purpose: 契約者のブラウザからの要求を、サーバーに置いた PH_AT に結びつける
  issuer: claim-portal
  holder: 契約者のブラウザ（Cookie）。中身は claim-portal のサーバーの保存先にある
  format: opaque
  max_lifetime: 28800
  idle_timeout: 1800
  lifetime_refs:
    - {kind: guidance, id: "NIST SP 800-63B-4 §2.2.3"}
  lifetime_set_by: [platform]
  refresh: 無い（操作のたびに無操作の時計を戻す）
  revocation:
    - {method: session_delete, delay_seconds: 0, note: ログアウトと、front-gw から契約者の停止の応答（403）を受けたときに消す}
  stored_at: bff_server
  transport: cookie
  visible_to: [browser, bff]
  log_policy: 記録しない
  note: Cookie は __Host- の接頭辞、Secure・HttpOnly・SameSite=Lax
- id: AGENCY_ASSERTION
  kind: jwt
  decision: 採用
  rationale: 代理店のサーバーが shirogane-as から AGENCY_AT を取るときに出す、代理店の IdP が署名した担当者の assertion（RFC 7523 §2.1 の grant）
  refs:
    - {kind: spec, id: "RFC 7523 §3", url: "https://www.rfc-editor.org/rfc/rfc7523#section-3"}
  assumption: 代理店の IdP は、代理店連携の仕様（しろがねが出す）のとおりに、iss・sub・aud・exp・iat・jti と担当者の社員番号（emp_no）を入れ、ES256 で署名する
  revisit_trigger: 代理店の IdP が RFC 7523 の assertion を出せないと分かったとき
  purpose: 代理店の担当者が誰かを shirogane-as に示す。shirogane-as だけが受ける
  issuer: 代理店の IdP（代理店ごとに 1 つ。代理店の登録に iss と JWKS の URL を書く）
  aud: ["https://auth.shirogane-sonpo.example/token"]
  holder: 代理店のサーバー
  format: jwt
  typ: JWT
  kind_discriminator:
    - {claim: aud, note: aud が shirogane-as のトークンの端点で、ID トークン（aud はクライアントの ID）と重ならない}
  alg_allowlist: [ES256]
  issuers:
    - {iss: "https://idp.hanamizuki-hoken.example", jwks_uri: "https://idp.hanamizuki-hoken.example/.well-known/jwks.json"}
    - {iss: "https://login.kumoi-agency.example", jwks_uri: "https://login.kumoi-agency.example/.well-known/jwks.json"}
  key_source: {from: configured_jwks_uri, header_key_params: reject}
  required_claims: [iss, sub, aud, exp, iat, jti]
  max_clock_skew: 30
  max_lifetime: 60
  lifetime_refs:
    - {kind: spec, id: "RFC 7523 §3", url: "https://www.rfc-editor.org/rfc/rfc7523#section-3"}
    - {kind: author-proposal, id: "代理店連携の仕様で exp − iat を 60 秒以下と決める。代理店の IdP で担当者を止める直前に出た assertion が使える時間（60＋ずれ 30）を、担当者の停止の最悪（750 秒。REQ-02 の 900 秒）に入れて決めた", tracking: "#82"}
  lifetime_set_by: [client]
  refresh: 無い
  sender_constraint: none
  jti_policy: {unique_scope: per_issuer, replay_check: true, max_age_seconds: 90}
  revocation:
    - {method: one_time_use, delay_seconds: 0, note: "shirogane-as が (iss, jti) の組を 90 秒覚え、2 回目を拒む。確かめと記録は一意の制約つきの 1 回の書き込みで行い（同時に 2 件届いても 1 件だけ通る）、記録先が応えなければ拒む"}
    - {method: db_lookup, delay_seconds: 0, note: 代理店の登録を止めると、shirogane-as はその代理店の assertion を受けない（登録を毎回引く）}
  key_rotation: {period_days: null, publish_before_use_seconds: 86400, retire_after_seconds: 90, note: 代理店連携の仕様で、新しい鍵を使う 24 時間前に JWKS に載せ、古い鍵は最後の assertion の上限（90 秒）の後に外すよう求める}
  unknown_kid: {refetch_min_interval_seconds: 30, negative_cache_seconds: 30, on_fetch_failure: reject}
  jwks_cache_ttl: 300
  signing_key_scope: per_client
  stored_at: none
  transport: form_post_body
  visible_to: [external_rp, idp]
  jwe: {used: false, note: 担当者の ID だけを載せる}
  log_policy: jti だけ記録
  note: >-
    トークンの要求そのものは、代理店のサーバーの証明書の mTLS（tls_client_auth）の上で送る。assertion だけを盗んでも、証明書が無ければ AT を取れない
    （assertion そのものは cnf で束縛しない。束縛は要求の mTLS の接続と、AGENCY_AT の cnf で行う）。代理店の IdP の鍵が漏れたときは、代理店管理部が代理店の登録を止め、shirogane-as は次の要求から拒む
- id: AGENCY_AT
  kind: access_token
  decision: 採用
  rationale: 代理店のサーバーが、代理店の担当者の権限で front-gw の代理店の口を呼ぶための AT。代理店のサーバーの証明書に束縛する。front-gw が受けて、TTS が Txn-Token に作り直す
  refs:
    - {kind: spec, id: "RFC 9068 §2.2", url: "https://www.rfc-editor.org/rfc/rfc9068#section-2.2"}
    - {kind: spec, id: "RFC 8705 §3", url: "https://www.rfc-editor.org/rfc/rfc8705#section-3"}
  purpose: 代理店の担当者（sub は agst_ の ID）の権限で、代理店が扱う証券の請求の受付・照会と書類の登録を頼む。契約者の AT とは aud（代理店の口）と agency_code で分ける
  issuer: shirogane-as
  aud: ["https://agency-api.shirogane-sonpo.example"]
  holder: 代理店のサーバー
  format: jwt
  subject_type: public
  typ: at+jwt
  alg_allowlist: [ES256]
  issuers:
    - {iss: "https://auth.shirogane-sonpo.example", jwks_uri: "https://auth.shirogane-sonpo.example/.well-known/jwks.json"}
  key_source: {from: issuer_metadata_jwks_uri, header_key_params: reject}
  required_claims: [iss, sub, aud, exp, iat, jti, client_id, scope, cnf]
  max_clock_skew: 30
  max_lifetime: 300
  lifetime_refs:
    - {kind: guidance, id: "NIST IR 8587 §5.3.1.1"}
    - {kind: author-proposal, id: "代理店そのものの停止（REQ-02、900 秒）は TTS が発行のたびに代理店の登録を引くことで効かせる。代理店の IdP の側での担当者の停止は、しろがねが知らないので AT の寿命で決まる。assertion 90 秒・AT 330 秒・Txn-Token 330 秒の和（750 秒）が REQ-02 の 900 秒に収まるよう 5 分にした", tracking: "#82"}
  lifetime_set_by: [platform]
  refresh: 無い（期限が切れたら、新しい assertion で取り直す）
  sender_constraint: mtls
  revocation:
    - {method: exp_only, delay_seconds: 330, note: "AT そのものは exp まで有効。代理店の IdP の側で担当者を止めたときは、ここで止まる（次の assertion が出ない）。代理店の停止は TTS が発行のたびに代理店の登録を引く（TXN_TOKEN の db_lookup）"}
    - {method: db_lookup, delay_seconds: 60, note: AGENCY_AT を受けて働くのは TTS への要求だけで、TTS は発行のたびに代理店の登録を引く（C-agency-code C-scope。キャッシュ 60 秒）}
  long_running: 使わない。1 回の呼び出しごとに front-gw が Txn-Token に替える
  key_rotation: {period_days: 90, publish_before_use_seconds: 600, retire_after_seconds: 630, note: PH_AT と同じ鍵}
  unknown_kid: {refetch_min_interval_seconds: 30, negative_cache_seconds: 30, on_fetch_failure: reject}
  jwks_cache_ttl: 300
  signing_key_scope: shared
  stored_at: rp_server
  transport: authorization_bearer
  visible_to: [external_rp, gateway, idp]
  jwe: {used: false, note: 担当者の ID・代理店コード・証明書の拇印だけを載せる}
  log_policy: jti だけ記録
  size:
    signing: {alg: ES256}
    header:
      params:
        - {name: alg, type: string, max_bytes: 5}
        - {name: typ, type: string, max_bytes: 6}
        - {name: kid, type: string, max_bytes: 36}
      serializer_extra_bytes: 0
      serializer_extra_basis: PH_AT と同じ
    path: [nginx-large-client-header-buffers]
    other_headers_bytes: 2048
  note: front-gw の代理店の口は、しろがねの代理店向けの CA が出した証明書の mTLS だけを受け、証明書の拇印と cnf を照らす
- id: EMPLOYEE_AT
  kind: access_token
  decision: 採用
  rationale: 社員（査定担当者・上長・コールセンター・代理店管理部・お客さま窓口の上長）が staff-console から front-gw の社員の口を呼ぶための AT。front-gw が受けて、TTS が Txn-Token に作り直す
