    - {method: db_lookup, delay_seconds: 60, note: EMPLOYEE_AT を受けて働くのは TTS への要求だけで、TTS は発行のたびに社員の台帳の勤務の状態（勤務中だけ。休職・退職は拒む）と役割を引き、役割から scope を絞り直す（C-sub C-scope。キャッシュ 60 秒）}
  long_running: 使わない
  key_rotation: {period_days: 90, publish_before_use_seconds: 600, retire_after_seconds: 630, note: shirogane-sso の鍵。HSM の中で作り、90 日ごとに替える}
  unknown_kid: {refetch_min_interval_seconds: 30, negative_cache_seconds: 30, on_fetch_failure: reject}
  jwks_cache_ttl: 300
  signing_key_scope: shared
  stored_at: bff_server
  transport: authorization_bearer
  visible_to: [bff, gateway, idp]
  jwe: {used: false, note: 社員の ID と認証の強さだけを載せる}
  log_policy: jti だけ記録
  size:
    signing: {alg: ES256}
    header:
      params:
        - {name: alg, type: string, max_bytes: 5}
        - {name: typ, type: string, max_bytes: 6}
        - {name: kid, type: string, max_bytes: 36}
      serializer_extra_bytes: 0
      serializer_extra_basis: shirogane-sso は空白なしで書き出す（作る側で決める）
    path: [nginx-large-client-header-buffers]
    other_headers_bytes: 2048
  note: front-gw の社員の口は staff-console の X.509-SVID の mTLS からしか接続を受けない（送信者制約の代わり。3.1）
- id: STAFF_ID_TOKEN
  kind: id_token
  decision: 採用
  rationale: staff-console が社員のログインの結果を受け取り、セッションを作る。承認の画面の前の認証し直しの結果も、これで受け取る
  refs:
