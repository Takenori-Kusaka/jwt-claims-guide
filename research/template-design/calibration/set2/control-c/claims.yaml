    下書き・連絡は最悪 390 秒（REQ-08 の 10 分の内側）。発注の確定・解錠コード・支払いはツールが呼び出しのたびに aoba-pdp で確かめる（最悪 60 秒）
  carried_in: [CONSOLE_AT, REPAIR_DELEG_AT, ORDER_TOOL_AT, CONTACT_TOOL_AT, PAYMENT_TOOL_AT, LOCK_TOOL_AT, APPROVAL_AT]
  consumers: [agent-sts, order-tool, contact-tool, payment-tool, lock-tool, approval-svc]
  on_missing: 拒否
