  issue_events: [I01, I02, I06, I12]
  source_system: aoba-as のクライアントの登録（上限）、aoba-pdp のロール（人事の台帳から導く）
  volatility: 600
  recompute_trigger: [exchange]
  propagation_delay: 390
  on_revoke: >-
