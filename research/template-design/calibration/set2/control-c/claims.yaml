- id: C-act
  name: act
  namespace: null
  registered_ref: {kind: spec, id: "RFC 8693 §4.1", url: "https://www.rfc-editor.org/rfc/rfc8693#section-4.1"}
  type: object
  shape: single
  description: >-
    担当者の代わりに今操作している行為者。最も外側の act.sub が今の行為者（repair-agent か visit-subagent のワークロードの URI。例
    https://workloads.aoba-sumai.example/repair-agent）。visit-subagent のトークンでは、その内側の act に前の行為者の repair-agent が入る
  not_meaning: 誰の権限かではない（それは sub）。入れ子の act（act.act。内側）は今の行為者ではなく、経由した行為者の記録で、許可リストと照合しない
  usage: authz
  decision: 採用
  answers: [q-actor, q-agent]
  does_not_answer: [q-sub]
  rationale: >-
    ツールは最も外側の act.sub だけで行為者を判断する（RFC 8693 §4.1）。最も外側の act.sub を mTLS の相手の証明書の URI と照合し、
    ツールの操作ごとの行為者の許可リスト（発注・支払い・解錠は repair-agent だけ、連絡は repair-agent と visit-subagent）と照合する。内側の act は監査ログに残すだけ
  refs:
    - {kind: spec, id: "RFC 8693 §4.1", url: "https://www.rfc-editor.org/rfc/rfc8693#section-4.1"}
    - {kind: guide-slide, id: p10-four-questions}
    - {kind: guide-slide, id: p10-delegation-chain-depth}
  assumption: 委任の深さは 2 まで（repair-agent → visit-subagent）。agent-sts は 3 段目の交換を拒否する
  revisit_trigger: visit-subagent がさらに別のエージェントに任せる要望が出たとき
  issuers: ["https://sts.aoba-sumai.example"]
  authoritative_writer:
    - {stage: ③, writer: agent-sts（交換を求めた mTLS の相手の証明書の URI から作る。要求の値は使わない）, configurable_by: [platform]}
  issue_events: [I06]
  source_system: agent-sts が mTLS で認証した相手の証明書（wl-ca が出す。URI の SAN にワークロードの URI）
  volatility: never
  recompute_trigger: [exchange]
  propagation_delay: 0
  on_revoke: エージェントのクライアントの登録を外すと、次の交換から拒否される（手元のツールのトークンは最悪 330 秒）。そのエージェントがした予約は、order-scheduler が実行の時点で同じクライアントの登録の表を引き、予約の記録の行為者が外れていれば実行しない（H13）
  carried_in: [REPAIR_DELEG_AT, ORDER_TOOL_AT, CONTACT_TOOL_AT, PAYMENT_TOOL_AT, LOCK_TOOL_AT]
  consumers: [agent-sts, order-tool, contact-tool, payment-tool, lock-tool]
  on_missing: 拒否
  absent_semantics: {absent: "1 段目の REPAIR_DELEG_AT（repair-console から repair-agent への委任）にだけ無い。ツールのトークン 4 種では必ずあり、無ければ拒否する（required_claims）"}
  enforced_at:
    - {service: agent-sts, check: 2 段目の REPAIR_DELEG_AT の最も外側の act.sub が repair-agent で、mTLS の相手が may_act の主体。深さ 3 になる交換は拒否, against: [other_claim], with: C-may-act}
    - {service: order-tool, check: 最も外側の act.sub が mTLS の相手の証明書の URI で、発注の行為者の許可リスト（repair-agent）にある。act の入れ子の深さが 2 を超えれば拒否, against: [api_config, other_claim], with: C-cnf}
    - {service: contact-tool, check: 最も外側の act.sub が mTLS の相手で、連絡の行為者の許可リスト（repair-agent・visit-subagent）にある。最も外側が visit-subagent なら、連絡の相手は入居者だけ（協力会社の窓口は拒否。REQ-04）。内側の act は記録だけ。act の入れ子の深さが 2 を超えれば拒否, against: [api_config, other_claim], with: C-cnf}
    - {service: payment-tool, check: 最も外側の act.sub が mTLS の相手で、支払いの行為者の許可リスト（repair-agent）にある。act の入れ子の深さが 2 を超えれば拒否, against: [api_config, other_claim], with: C-cnf}
    - {service: lock-tool, check: 最も外側の act.sub が mTLS の相手で、解錠の行為者の許可リスト（repair-agent）にある。visit-subagent は拒否。act の入れ子の深さが 2 を超えれば拒否, against: [api_config, other_claim], with: C-cnf}
  max_bytes: 160
  overflow_strategy: 発行を失敗させる
  pii_category: 該当なし
  data_category: [system.operations]
  confidential_from: []
  log_policy: 記録する
  status: active
  owner: 認証基盤チーム
  change_controller: IETF（RFC 8693）
  note: 入れ子の act の全体（連鎖）は各ツールが監査ログに残す。内側の act は「どこを経由したか」の記録で、認可の判断に使わない
- id: C-may-act
  name: may_act
  namespace: null
  registered_ref: {kind: spec, id: "RFC 8693 §4.4", url: "https://www.rfc-editor.org/rfc/rfc8693#section-4.4"}
  type: object
  shape: single
  description: REPAIR_DELEG_AT を subject_token にして交換してよい行為者（1 段目は repair-agent、2 段目は visit-subagent のワークロードの URI）
  not_meaning: すでに代理している者ではない（それは act）。その行為者が何をしてよいかではない（それは scope と行為者の許可リスト）
  usage: authz
  decision: 採用
  rationale: >-
    agent-sts は、1 段目の REPAIR_DELEG_AT の may_act に repair-agent を、2 段目に visit-subagent を、委任の表から入れる。REPAIR_DELEG_AT の交換では、
    mTLS の相手が may_act の主体と同じことを確かめる。ほかのワークロードが REPAIR_DELEG_AT を手に入れても交換できない
  refs:
    - {kind: spec, id: "RFC 8693 §4.4", url: "https://www.rfc-editor.org/rfc/rfc8693#section-4.4"}
    - {kind: guide-slide, id: p02-delegation-client}
  assumption: 任せてよい相手は agent-sts の委任の表（repair-console → repair-agent、repair-agent → visit-subagent）で決まり、エージェントの申告では決まらない
  revisit_trigger: 任せる相手のエージェントを足すとき
  issuers: ["https://sts.aoba-sumai.example"]
  authoritative_writer:
    - {stage: ③, writer: agent-sts（委任の表から）, configurable_by: [platform]}
  issue_events: [I06]
  source_system: agent-sts の委任の表（認証基盤チームが PR で持つ）
  volatility: never
  recompute_trigger: [exchange]
  propagation_delay: 0
  on_revoke: 委任の表から外すと、次の REPAIR_DELEG_AT から出なくなる。出した REPAIR_DELEG_AT は最悪 330 秒
  carried_in: [REPAIR_DELEG_AT]
