  max_bytes: 80
  overflow_strategy: 発行を失敗させる
  pii_category: 該当なし
  data_category: [system.operations]
  confidential_from: []
  log_policy: 記録する
  status: active
  owner: 認証基盤チーム
  change_controller: IETF（RFC 8693）
