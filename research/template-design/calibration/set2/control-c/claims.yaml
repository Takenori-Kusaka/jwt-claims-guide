- id: C-scope
  name: scope
  namespace: null
  registered_ref: {kind: spec, id: "RFC 8693 §4.2", url: "https://www.rfc-editor.org/rfc/rfc8693#section-4.2"}
  type: string
  shape: space_delimited
  max_items: 8
  allowed_values: {enum: ["openid", "orders:draft", "orders:place", "tenant.message:send", "tenant.message:read", "payments:request", "lock.code:issue", "approvals:decide"]}
  value_vocabulary:
    values: ["openid", "orders:draft", "orders:place", "tenant.message:send", "tenant.message:read", "payments:request", "lock.code:issue", "approvals:decide"]
    owner: 認証基盤チーム（ツールの持ち主の申請で足す）
    extensible: false
  description: クライアントに委ねた操作の範囲。ツールごとの操作（orders:place など）と、承認の操作（approvals:decide）
  not_meaning: 担当者の全権限ではない。担当者がその操作をしてよいか（ロール）は aoba-pdp が決める
  usage: authz
  decision: 採用
  answers: [q-authorized]
  rationale: >-
    CONSOLE_AT の scope は repair-console が求めた範囲の上限で、agent-sts は交換のたびに、宛先のツールの操作だけ、かつ aoba-pdp が返す担当者のロールで
    許す操作だけに絞る（上流の部分集合）。訪問の調整のサブエージェントには連絡の 2 つだけを渡す。ワイルドカードは作らない
  refs:
    - {kind: spec, id: "RFC 8693 §4.2", url: "https://www.rfc-editor.org/rfc/rfc8693#section-4.2"}
