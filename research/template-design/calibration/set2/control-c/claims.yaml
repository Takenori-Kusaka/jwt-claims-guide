  description: トークンを束縛したクライアント証明書の SHA-256 の拇印（x5t#S256）。交換を求めたエージェントか repair-console の、wl-ca の証明書
  not_meaning: 行為者の名前ではない（それは act）。証明書の有効期限は表さない
  usage: authz
  decision: 採用
  answers: [q-holder]
  rationale: >-
    ツールと approval-svc は、mTLS の相手の証明書の拇印と cnf の x5t#S256 を照合する。エージェントの実行基盤は入居者の依頼の文（外からの入力）を読むので、
    トークンが漏れる前提にし、鍵を持たない者に使わせない
  refs:
    - {kind: spec, id: "RFC 8705 §3.1", url: "https://www.rfc-editor.org/rfc/rfc8705#section-3.1"}
    - {kind: guide-slide, id: p08-rotation}
  assumption: エージェント・repair-console とツール・approval-svc の間は、組織の網の中で端から端まで mTLS を張り、途中で TLS を終端しない
  revisit_trigger: ツールの手前に TLS を終端する入口を置くとき
  issuers: ["https://sts.aoba-sumai.example"]
  authoritative_writer:
    - {stage: ③, writer: agent-sts（交換を求めた mTLS の相手の証明書から）, configurable_by: [platform]}
  issue_events: [I06, I29]
  source_system: agent-sts への交換の要求の mTLS の相手の証明書
  volatility: never
  recompute_trigger: [exchange]
  propagation_delay: 0
  on_revoke: >-
    証明書は 24 時間で、残り 8 時間で更新する。更新した証明書の接続では、新しい証明書で交換し直したトークンだけを使う（共通のクライアント部品が、証明書と
    トークンを組で管理する。design.md の付録 D の M_sender_constraint の 4.）
  carried_in: [ORDER_TOOL_AT, CONTACT_TOOL_AT, PAYMENT_TOOL_AT, LOCK_TOOL_AT, APPROVAL_AT]
  consumers: [order-tool, contact-tool, payment-tool, lock-tool, approval-svc]
  on_missing: 拒否
  enforced_at:
    - {service: order-tool, check: mTLS の相手の証明書の拇印と cnf の x5t#S256 が一致, against: [other_claim], with: C-cnf}
    - {service: contact-tool, check: mTLS の相手の証明書の拇印と cnf の x5t#S256 が一致, against: [other_claim], with: C-cnf}
    - {service: payment-tool, check: mTLS の相手の証明書の拇印と cnf の x5t#S256 が一致, against: [other_claim], with: C-cnf}
    - {service: lock-tool, check: mTLS の相手の証明書の拇印と cnf の x5t#S256 が一致, against: [other_claim], with: C-cnf}
    - {service: approval-svc, check: mTLS の相手の証明書の拇印と cnf の x5t#S256 が一致（repair-console の証明書）, against: [other_claim], with: C-cnf}
  max_bytes: 60
  overflow_strategy: 上限で固定（超えない値域）
  pii_category: 該当なし
  data_category: [system.authentication]
  confidential_from: []
  log_policy: 記録しない
  status: active
  owner: 認証基盤チーム
  change_controller: IETF（RFC 8705）
# ---------------------------------------------------------------- 認証の強さと新しさ
- id: C-acr
  name: acr
  namespace: null
  registered_ref: {kind: spec, id: "OpenID Connect Core 1.0 §2", url: "https://openid.net/specs/openid-connect-core-1_0.html#IDToken"}
  type: string
  shape: single
  allowed_values: {enum: ["pwd", "mfa"]}
  value_vocabulary:
    values: ["pwd", "mfa"]
    owner: 認証基盤チーム（aoba-as の認証の段の定義）
    extensible: false
  description: 担当者のログインの認証の強さ。pwd はパスワードだけ、mfa はパスワードと TOTP
  not_meaning: いつ認証したかではない（それは auth_time）。承認したことではない（承認は approval-svc の記録）
  usage: authz
  decision: 採用
  rationale: >-
    承認の操作（10 万円を超える発注の承認、解錠コードの承認。却下・取り下げは除く）では、approval-svc が APPROVAL_AT の acr が mfa であることを求める（RFC 9470）。
    agent-sts は CONSOLE_AT の acr を APPROVAL_AT に写すだけで値を作らない。ツールのトークンには載せない（承認の時点で確かめ、ツールは承認の記録を引く）
  refs:
    - {kind: spec, id: "RFC 9470 §3", url: "https://www.rfc-editor.org/rfc/rfc9470#section-3"}
    - {kind: guide-slide, id: p02-auth-strength-session}
  assumption: aoba-as は acr_values=mfa の要求で TOTP を求め、満たしたときだけ acr に mfa を書く（aoba-as の仕様書の 4.3）
  revisit_trigger: 担当者の認証にパスキーを入れるとき（acr の語彙を見直す）
  issuers:
    - "https://login.aoba-sumai.example"
    - "https://sts.aoba-sumai.example"
  authoritative_writer:
    - {stage: ①, writer: aoba-as（認証の段）, configurable_by: [platform]}
    - {stage: ③, writer: agent-sts（CONSOLE_AT から写すだけ）, configurable_by: [platform]}
  issue_events: [I01, I06, I12]
  source_system: aoba-as の認証の記録
  volatility: never
  recompute_trigger: [login]
  propagation_delay: 0
  on_revoke: ログインごとの値。リフレッシュでは変わらない
  carried_in: [LOGIN_ID_TOKEN, CONSOLE_AT, APPROVAL_AT]
  consumers: [repair-console, agent-sts, approval-svc]
  on_missing: 拒否
  enforced_at:
    - {service: repair-console, check: 追加の認証の後の ID トークンの acr が mfa かを確かめてから、承認の画面に戻す, against: [api_config]}
    - {service: agent-sts, check: CONSOLE_AT の acr を APPROVAL_AT に写すだけ（判断しない）, against: [format]}
    - {service: approval-svc, check: 承認の操作（承認済みにする操作）と手作業の発注の事後の確認で（却下・取り下げ・解錠の取り消しは止める操作なので求めない）、acr が mfa でなければ 401 insufficient_user_authentication（acr_values=mfa・max_age=300）, against: [api_config]}
  max_bytes: 4
  overflow_strategy: 上限で固定（超えない値域）
  pii_category: 該当なし
  data_category: [system.authentication]
  confidential_from: []
  log_policy: 記録する
  status: active
  owner: 認証基盤チーム
  change_controller: OpenID Foundation
- id: C-auth-time
  name: auth_time
  namespace: null
  registered_ref: {kind: spec, id: "OpenID Connect Core 1.0 §2", url: "https://openid.net/specs/openid-connect-core-1_0.html#IDToken"}
  type: integer
  shape: single
  description: 担当者が最後に認証した時刻（UNIX 時刻。aoba-as の時計）
  not_meaning: トークンの発行の時刻ではない（それは iat）。リフレッシュで新しくならない
  usage: authz
  decision: 採用
  rationale: >-
    承認の操作では、approval-svc が今の時刻 − auth_time が 300 秒以下であることを求める（REQ-07）。リフレッシュで iat は新しくなるが auth_time は変わらないので、
    朝のログインのまま承認できない。agent-sts は CONSOLE_AT の値を写すだけ
  refs:
    - {kind: spec, id: "RFC 9470 §3", url: "https://www.rfc-editor.org/rfc/rfc9470#section-3"}
    - {kind: spec, id: "OpenID Connect Core 1.0 §3.1.2.1", url: "https://openid.net/specs/openid-connect-core-1_0.html#AuthRequest"}
  assumption: aoba-as は CONSOLE_AT と ID トークンに auth_time を載せ、リフレッシュでは元の値のまま出す（aoba-as の仕様書の 4.3）
  revisit_trigger: aoba-as の認証の段の仕様を変えるとき
  issuers:
    - "https://login.aoba-sumai.example"
    - "https://sts.aoba-sumai.example"
  authoritative_writer:
    - {stage: ①, writer: aoba-as, configurable_by: [platform]}
    - {stage: ③, writer: agent-sts（CONSOLE_AT から写すだけ）, configurable_by: [platform]}
  issue_events: [I01, I06, I12]
  source_system: aoba-as の認証の記録
  volatility: never
  recompute_trigger: [login]
  propagation_delay: 0
  on_revoke: ログインごとの値
  carried_in: [LOGIN_ID_TOKEN, CONSOLE_AT, APPROVAL_AT]
  consumers: [repair-console, agent-sts, approval-svc]
  on_missing: 拒否
  enforced_at:
    - {service: repair-console, check: 追加の認証の後の ID トークンの auth_time が、追加の認証を求めた時刻より後か, against: [format]}
    - {service: agent-sts, check: CONSOLE_AT の auth_time を APPROVAL_AT に写すだけ（値を作らない。CONSOLE_AT に無ければ交換を拒否）, against: [format]}
    - {service: approval-svc, check: 承認の操作と手作業の発注の事後の確認で（却下・取り下げ・解錠の取り消しは除く）、approval-svc の時計で今 − auth_time が 300 秒を超えれば 401 insufficient_user_authentication, against: [api_config]}
  max_bytes: 10
  overflow_strategy: 上限で固定（超えない値域）
  pii_category: 該当なし
  data_category: [system.authentication]
  confidential_from: []
  log_policy: 記録する
  status: active
  owner: 認証基盤チーム
  change_controller: OpenID Foundation
# ---------------------------------------------------------------- 操作ごとの承認
- id: C-authorization-details
  name: authorization_details
  namespace: null
  registered_ref: {kind: spec, id: "RFC 9396 §2", url: "https://www.rfc-editor.org/rfc/rfc9396#section-2"}
  type: object
  shape: array
  max_items: 1
  typical_items: 1
  value_vocabulary:
    values: ["https://aoba-sumai.example/rar/vendor-order", "https://aoba-sumai.example/rar/lock-code"]
    owner: 管理部の修繕課のシステム担当
    extensible: false
  value_normalization: {case: as_is, unicode: NFC, trim: true, compare: exact, normalized_by: agent-sts（approval-svc の承認の記録から作るときに 1 回だけ）}
  description: >-
    承認した 1 つの操作の内容。メンバーはどれも文字列。type が https://aoba-sumai.example/rar/vendor-order のとき：locations（["https://order-tool.aoba-sumai.example/mcp"]）、
    order_id（発注 ID。^ORD-[0-9]{10}$）、repair_id（修繕依頼 ID）、vendor_id（協力会社の ID。^VD-[0-9]{6}$）、amount（税込の円の 10 進の文字列。^[1-9][0-9]{0,8}$。例 "128000"）、
    currency（"JPY"）。type が https://aoba-sumai.example/rar/lock-code のとき：locations（["https://lock-tool.aoba-sumai.example/mcp"]）、repair_id、
    unit_id（部屋の ID。^RM-[0-9]{8}$）、vendor_id、worker_id（作業員の ID。^WK-[0-9]{6}$。lock-tool が協力会社の台帳でその協力会社の作業員であることを確かめて承認の依頼に入れる）、not_before と not_after（RFC 3339 の UTC の時刻を YYYY-MM-DDTHH:MM:SSZ の 1 つの書式に固定した文字列（秒まで・小数なし・T と Z は大文字・+00:00 は使わない。^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$。agent-sts が承認の記録から作るときにこの書式で書き、受け手はこの書式でない値を拒否してから完全一致で比べる）。差は 4 時間以内）
  not_meaning: 承認の今の状態ではない（取り下げ・使用済みは approval-svc で確かめる）。その操作を実行したことではない
  usage: authz
  decision: 採用
  answers: [q-authorized]
  rationale: >-
    agent-sts は、承認済みの承認の記録からだけ authorization_details を作り、locations と同じ宛先のツールのトークンにだけ載せる（エージェントの申告の金額・部屋は使わない）。
    order-tool は発注の下書きの order_id・vendor_id・amount・repair_id と、lock-tool は修繕依頼の部屋と要求の協力会社・時間帯と、完全一致で比べ（金額は文字列の 10 進として）、
    食い違えば拒否する
  refs:
    - {kind: spec, id: "RFC 9396 §2", url: "https://www.rfc-editor.org/rfc/rfc9396#section-2"}
    - {kind: spec, id: "RFC 9396 §9.1", url: "https://www.rfc-editor.org/rfc/rfc9396#section-9.1"}
    - {kind: guide-slide, id: p10-human-approval-evidence}
  assumption: 1 つのツールのトークンで、承認した 1 つの操作だけを運ぶ（max_items 1）
  revisit_trigger: 複数の発注をまとめて 1 回で承認する要望が出たとき
  issuers: ["https://sts.aoba-sumai.example"]
  authoritative_writer:
    - {stage: ⑥, writer: agent-sts（approval-svc の承認済みの記録から。エージェントの申告では作らない）, configurable_by: [platform]}
  issue_events: [I06, I14]
  source_system: approval-svc の承認の記録（承認の依頼は order-tool・lock-tool が自分の記録から作り、上長・担当者が repair-console で承認する）
  volatility: 0
  recompute_trigger: [exchange]
  propagation_delay: 0
  on_revoke: 承認の取り下げは、order-tool・lock-tool が実行のたびに approval-svc で承認を条件つきで使用済みにする（取り下げてあれば失敗する）ことで、すぐに止める
  carried_in: [ORDER_TOOL_AT, LOCK_TOOL_AT]
  consumers: [order-tool, lock-tool]
  on_missing: 既定値
  absent_semantics: {absent: "承認の要らない操作（直近 30 日の部屋の累計が 10 万円以下の発注、下書き）。承認が要る発注の確定と、解錠コードの発行では拒否する"}
  enforced_at:
    - {service: order-tool, check: 承認が要る確定で、type が vendor-order、locations が自分、order_id・vendor_id・amount・repair_id が下書きの記録と完全一致。無ければ・違えば拒否。承認の要否の累計は、部屋の行の排他の錠を押さえたトランザクションの中で数える。確定・予約では協力会社の取引が今も有効（協力会社の台帳）, against: [other_claim, data_layer], with: C-approval-ref}
    - {service: lock-tool, check: type が lock-code、locations が自分、unit_id が修繕依頼の部屋、vendor_id・worker_id・not_before・not_after が要求と完全一致（コードは worker_id の作業員にだけ送る）し、not_after − not_before が 4 時間以内で not_before < not_after、今が not_before と not_after の間（承認の依頼の登録でも 4 時間を超える時間帯を拒否する）。発行と送り直しでは、協力会社の台帳で協力会社の取引と作業員の登録が今も有効で、作業員の番号のハッシュが承認の記録のハッシュと一致。無ければ・違えば拒否, against: [other_claim, data_layer], with: C-approval-ref}
  max_bytes: 320
  overflow_strategy: 発行を失敗させる
  pii_category: 個人情報
  data_category: [user.location.imprecise]
  confidential_from: []
  log_policy: 記録しない
  status: active
  owner: 管理部の修繕課のシステム担当
  change_controller: 認証基盤チーム（台帳の持ち主）
  note: >-
    部屋の ID・時間帯は、修繕依頼の台帳と突き合わせると入居者と在宅の時間が分かるので個人情報として扱う。ログには残さず、ログの approval_ref から approval-svc の記録を引く。
    生成の発行側のスキーマ（schemas/）はオブジェクトの中のメンバーの型を表さないので、メンバーの型は agent-sts と受け手の共通の部品の試験で確かめる（design.md の 3.1）
# ---------------------------------------------------------------- 組織の名前空間
- id: C-repair-id
  name: repair_id
  namespace: "https://aoba-sumai.example/claims/"
  type: string
  shape: single
  allowed_values: {pattern: "^RQ-[0-9]{8}$"}
  value_normalization: {case: upper, unicode: none, trim: true, compare: exact, normalized_by: 修繕依頼の台帳（採番のとき）}
  description: エージェントが進めている修繕依頼（入居者からの修繕の依頼 1 件）の ID。修繕依頼の台帳が採番する
  not_meaning: 発注 ID ではない（1 つの修繕依頼に発注は複数ありうる）。修繕依頼の担当が sub であることの証明ではない（agent-sts と重要な操作のツールが台帳で確かめる）
  usage: identifier
  identifier_properties: {stable: true, reassignable: false, pairwise: false, id_scheme: opaque}
  decision: 採用
  answers: [q-txn]
  rationale: >-
    agent-sts は、交換の要求の修繕依頼が subject_token の担当者に割り当てられ、エージェントへの委任が止められていないことを修繕依頼の台帳で確かめてから載せる。
    ツールは要求の対象（下書き・連絡の相手・支払いの発注・部屋）がこの修繕依頼のものかを確かめ、監査ログに残す。修繕依頼ごとの操作をたどる鍵にする（REQ-11）
  refs:
    - {kind: guide-slide, id: p06-audit-trail}
    - {kind: author-proposal, id: "修繕依頼の ID を交換で載せ、ツールの対象の照合と監査ログの相関に使う", tracking: "#82"}
  assumption: 修繕依頼は 1 人の担当者に割り当てられ、エージェントは 1 つの修繕依頼の中で動く
  revisit_trigger: 複数の修繕依頼をまとめて扱うエージェントを作るとき
  issuers: ["https://sts.aoba-sumai.example"]
  authoritative_writer:
    - {stage: ③, writer: agent-sts（委任とツールの交換では、修繕依頼の台帳で担当と委任を確かめた値。APPROVAL_AT では、repair-console の交換の要求の修繕依頼（画面で開いた修繕依頼）を、sub が担当か上長であることを確かめてから。承認の記録の値は写さない）, configurable_by: [platform]}
  issue_events: [I06]
  source_system: 修繕依頼の台帳（管理業務システム）。APPROVAL_AT では repair-console の交換の要求（画面で開いた修繕依頼）と修繕依頼の台帳（承認の記録の値は写さない）
  verification_method: 委任とツールの交換では、agent-sts が修繕依頼の台帳の API で、修繕依頼の担当が sub で、エージェントへの委任の欄が「有効」であることを確かめる。APPROVAL_AT の交換では、要求の修繕依頼について sub が担当か、aoba-pdp で同じ課の上長かを確かめる
  volatility: never
  recompute_trigger: [exchange]
  propagation_delay: 0
  on_revoke: 担当の付け替え・委任の停止は、次の交換で agent-sts が拒否する。発注の確定・解錠・支払いは、ツールが aoba-pdp で担当を確かめ直す（最悪 60 秒）
  carried_in: [REPAIR_DELEG_AT, ORDER_TOOL_AT, CONTACT_TOOL_AT, PAYMENT_TOOL_AT, LOCK_TOOL_AT, APPROVAL_AT]
  consumers: [agent-sts, order-tool, contact-tool, payment-tool, lock-tool, approval-svc, aoba-pdp]
  on_missing: 拒否
  enforced_at:
    - {service: agent-sts, check: 1 段目の委任の交換では、修繕依頼の台帳で修繕依頼の担当が sub で委任の欄が有効か。REPAIR_DELEG_AT の交換では REPAIR_DELEG_AT の値をそのまま写し（要求で変えさせない）、担当と委任の欄を確かめ直す。APPROVAL_AT の交換では、要求の修繕依頼について sub が担当か、aoba-pdp で同じ課の上長か, against: [data_layer]}
    - {service: order-tool, check: 下書き・確定の対象の発注の修繕依頼が repair_id と一致。違えば 404, against: [data_layer]}
    - {service: contact-tool, check: 連絡の相手を repair_id の修繕依頼の入居者と、その発注の協力会社の窓口に限る（最も外側の act.sub が visit-subagent なら入居者だけ）。要求は相手の種類だけを受け、電話番号・宛先を受けない。宛先は通知の基盤が repair_id と相手の種類から台帳で引く。返信の読み取り（tenant.message:read）は、repair_id の修繕依頼のやり取りだけを返し（visit-subagent なら入居者とのやり取りだけ）、違う ID には 404, against: [data_layer, other_claim], with: C-act}
    - {service: payment-tool, check: 支払いの対象の発注の修繕依頼が repair_id と一致し、確定済みで完了の報告がある。手作業の発注で 10 万円を超えるものは、事後の確認が「確認済み」になるまで支払いを依頼しない（不適切とされたものは支払わない）。額は発注の台帳の確定額で、要求の額を使わない, against: [data_layer]}
    - {service: lock-tool, check: 修繕依頼の部屋が authorization_details の unit_id と一致, against: [data_layer, other_claim], with: C-authorization-details}
    - {service: approval-svc, check: 一覧の参照（approval_ref の無い APPROVAL_AT）では、トークンの repair_id の修繕依頼の承認の記録だけを返し、sub がその修繕依頼の担当者か、aoba-pdp で同じ課の上長でなければ返さない（担当の履歴にある課長も、解錠の取り消しのために参照できる。承認・事後の確認の操作は担当の履歴に無い課長だけ）。APPROVAL_AT の repair_id（repair-console が画面で開いた修繕依頼）が、操作する承認の記録の repair_id と一致（出どころの違う 2 つを比べ、画面で見ている修繕依頼と違う承認を操作させない）。order-scheduler からの予約済みの使用（H14）では、予約の記録の修繕依頼と一致, against: [data_layer]}
    - {service: aoba-pdp, check: 予約の実行の問い合わせ（H13）で、修繕依頼の台帳の修繕依頼の担当が、渡された担当者（sub）であることを確かめる。呼び出し元は証明書の許可リストの order-scheduler だけ, against: [data_layer]}
  max_bytes: 11
  overflow_strategy: 上限で固定（超えない値域）
  pii_category: 個人情報
  data_category: [user.unique_id.pseudonymous]
  confidential_from: []
  integrity_until:
    - {place: log, target: agent-sts・ツール 4 つ・approval-svc・order-scheduler の監査ログ（監査の共通部品の鍵つきのハッシュ。C-sub と同じ鍵）, trust_boundary: 監査の基盤（閲覧は監査の担当と管理部の部長だけ）}
    - {place: other, target: 発注の台帳の予約の記録（order-tool が書き、order-scheduler が読んで aoba-pdp・approval-svc に渡す）, trust_boundary: 発注の台帳（予約の記録を作れるのは order-tool の DB アカウントだけ。order-scheduler の DB アカウントは状態の「予約→確定」「予約→取り消し」だけを更新できる。DB の管理者の直接の書き込みは、order-scheduler が実行の前に変更の記録の表で検出する。design.md の 3.1）}
  log_policy: ハッシュ化して記録
  status: active
  owner: 管理部の修繕課のシステム担当
  change_controller: 認証基盤チーム（台帳の持ち主）
  prior_art_search:
    searched: [IANA JWT Claims registry, draft-ietf-oauth-transaction-tokens-11 §9.2 の txn, RFC 9396 §2]
    nearest: ["txn（Txn-Token の草案。組織の内側の 1 つの呼び出しの連鎖を指し、修繕依頼のように何日もかけて多くの呼び出しをまたぐものを指さない）"]
    not_used_because: Txn-Token を使わない（目録の TXN_TOKEN は却下）。修繕依頼はツールの呼び出しを何回も、日をまたいでまたぐので、txn の意味と違う
  note: >-
    修繕依頼の台帳と突き合わせると入居者が分かるので個人情報として扱う。監査ログには C-sub と同じ鍵つきのハッシュで残し、監査の担当が修繕依頼の台帳の
    ID から同じ値を作って、全サービスのログを 1 本に結ぶ（ハッシュの前に大文字にそろえる。value_normalization）。
    consumers の aoba-pdp だけは、トークンでなく予約の記録の写し（H13 で order-scheduler が渡す値）で受ける呼ばれる側で、トークンの検証部品を使わない。
    トークンから読む受け手は、agent-sts・ツール 4 つ・approval-svc の 6 つ
- id: C-approval-ref
  name: approval_ref
  namespace: "https://aoba-sumai.example/claims/"
  type: string
  shape: single
  allowed_values: {pattern: "^apv_[0-9a-f]{32}$"}
  value_normalization: {case: lower, unicode: none, trim: true, compare: exact, normalized_by: approval-svc（採番のとき）}
  description: 1 つの操作の承認の記録の ID（approval-svc が採番）。10 万円を超える発注の上長の承認と、解錠コードの担当者本人の承認
  not_meaning: 承認が今も有効であることではない（受け手が approval-svc で使用済みにして確かめる）。承認の中身ではない（それは authorization_details）
  usage: identifier
  identifier_properties: {stable: true, reassignable: false, pairwise: false, id_scheme: opaque}
  decision: 採用
  answers: [q-authorized]
  rationale: >-
    order-tool・lock-tool は approval_ref で、approval-svc の承認を条件つきの更新（承認済み・未使用なら、その発注 ID かその承認自身に結んで使用済みに）で
    1 回だけ使う。同じ発注 ID での再試行には前の結果を返し、別の発注 ID では失敗する。APPROVAL_AT では、承認する 1 つの記録を指し、approval-svc は
    その記録にだけ操作させる。監査ログで操作と承認を結ぶ（REQ-11）
  refs:
    - {kind: guide-slide, id: p10-human-approval-evidence}
    - {kind: author-proposal, id: "承認の ID を交換で載せ、受け手が承認の記録を条件つきの更新で 1 回だけ使う", tracking: "#82"}
  assumption: approval-svc は、状態の参照と、条件つきの更新（予約・使用・取り下げ）の API を持つ（この設計で作る）
  revisit_trigger: 承認の記録を別の仕組みに移すとき
  issuers: ["https://sts.aoba-sumai.example"]
  authoritative_writer:
    - {stage: ⑥, writer: agent-sts（approval-svc の承認済みの記録から。解錠のコードの送り直しだけは、lock-tool が使用済みにした取り消していない not_after の前の解錠の承認から。記録の修繕依頼・担当者・宛先が合わなければ載せない）, configurable_by: [platform]}
  issue_events: [I06, I14]
  source_system: approval-svc の承認の記録
  volatility: never
  recompute_trigger: [exchange]
  propagation_delay: 0
  on_revoke: ID そのものは変わらない。承認の取り下げは、受け手の approval-svc への条件つきの更新が失敗することで反映する
  carried_in: [ORDER_TOOL_AT, LOCK_TOOL_AT, APPROVAL_AT]
  consumers: [order-tool, lock-tool, approval-svc]
  on_missing: 既定値
  absent_semantics: {absent: "ORDER_TOOL_AT：承認の要らない発注（下書きと、累計 10 万円以下の確定）。承認が要る確定では拒否。LOCK_TOOL_AT：承認の依頼の登録だけを許し、発行は拒否。APPROVAL_AT：承認の一覧の参照だけを許し、承認・却下・取り下げは拒否"}
  enforced_at:
    - {service: order-tool, check: approval-svc で、承認の記録の発注 ID・修繕依頼・担当者（sub）が要求と一致し、承認済み・未使用・期限内なら使用済み（発注 ID に結ぶ）にする条件つきの更新が成功するときだけ確定。approval-svc が応答しなければ拒否, against: [data_layer]}
    - {service: lock-tool, check: 発行では、approval-svc で承認の記録の修繕依頼・担当者が要求と一致し、承認済み・未使用・期限内なら使用済みにする条件つきの更新が成功するときだけ発行。発行では、承認の後に修繕依頼の台帳の担当の履歴に付け替えが無いことも確かめる（今の担当だけを見ない）。発行と送り直しのどちらでも、協力会社の台帳で協力会社の取引と作業員の登録が今も有効で、作業員の番号のハッシュが承認の記録のハッシュと一致するときだけ送る。送り直しでは、承認が lock-tool による使用済み・取り消していない・not_after の前のときだけ同じコードを送り直す。送り直しの回は承認の記録に持ち、approval-svc の条件つきの更新（回が n で n が 3 未満なら n+1）で上げてから送る（並行の 2 件は片方だけが送る）。応答しなければ拒否, against: [data_layer]}
    - {service: approval-svc, check: APPROVAL_AT の approval_ref の記録だけに承認・却下・取り下げを許す。取り下げ・却下をしてよいのは、承認した人・依頼の担当者・同じ課の上長だけ。使用済み・予約済みにするとき（order-tool・lock-tool・order-scheduler の更新）は、承認した人を aoba-pdp で確かめ直す：発注の承認は、承認した人が今も在籍し同じ課の上長のロールを持つこと、解錠の承認は、承認した人（担当者本人）が今も在籍し、修繕依頼の担当で、鍵の取り扱いのロールを持つこと（承認の後の承認者の剥奪で、まだ使っていない承認を止める。REQ-08）。承認の操作は「承認待ち」の記録にだけ許し、却下・取り下げ・失効・取り消しは終わりの状態で、承認し直せない（新しい承認は新しい依頼で）。使用済み・予約済みにする条件つきの更新では、記録の「承認済み」への変更が approval-svc のアプリの DB アカウントで書かれたこと（変更の記録の表）も条件にする（DB の管理者が直接「承認済み」にした記録は使わせない）。記録の repair_id がトークンの repair_id と一致。order-scheduler からの予約済みの使用（H14）では、承認の記録の発注 ID・修繕依頼・担当者が予約の記録と一致し、予約済みなら使用済みにする条件つきの更新。発行済みの解錠の取り消し（その修繕依頼の担当者か、同じ課の上長の APPROVAL_AT。承認者の条件の「担当の履歴に無い」は求めない）では、承認を「取り消し」にして lock-svc に失効を求める。手作業の発注の事後の確認（approval_ref の記録の種類が「手作業の事後の確認」）では、承認と同じ条件（acr が mfa・auth_time から 300 秒、確かめる課長は登録した課長でなく担当の履歴にも無い）を求める, against: [data_layer, other_claim], with: C-repair-id}
  max_bytes: 36
  overflow_strategy: 上限で固定（超えない値域）
  pii_category: 個人情報
  data_category: [user.unique_id.pseudonymous]
  confidential_from: []
  integrity_until:
    - {place: log, target: order-tool・lock-tool・approval-svc・agent-sts・order-scheduler の監査ログ（監査の共通部品の鍵つきのハッシュ。C-sub と同じ鍵）, trust_boundary: 監査の基盤（閲覧は監査の担当と管理部の部長だけ）}
    - {place: other, target: 発注の台帳の予約の記録（order-scheduler が読んで approval-svc に渡す）, trust_boundary: 発注の台帳（予約の記録を作れるのは order-tool の DB アカウントだけ。order-scheduler の DB アカウントは状態の「予約→確定」「予約→取り消し」だけを更新できる。DB の管理者の直接の書き込みは、order-scheduler が実行の前に変更の記録の表で検出する。design.md の 3.1）}
  log_policy: ハッシュ化して記録
  status: active
  owner: 管理部の修繕課のシステム担当
  change_controller: 認証基盤チーム（台帳の持ち主）
  prior_art_search:
    searched: [IANA JWT Claims registry, RFC 9396 §2]
    nearest: ["authorization_details の identifier（RFC 9396 §2.2。対象のリソースを指す値で、承認の記録を指す値ではない）"]
    not_used_because: 承認の記録の ID の登録名が無い。authorization_details の中に入れると、承認の一覧の参照だけの APPROVAL_AT（authorization_details が無い）で承認を指せない
