  type: string
  shape: array
  max_items: 10
  description: 担当者のロール（修繕担当・上長・鍵の取り扱い）
  not_meaning: scope ではない
  decision: 却下
  rejection_kind: 代替あり
  alt: [C-scope]
  rationale: >-
    ロールの剥奪を 2 分以内に重要な操作に届かせる（REQ-08）ため、ロールをトークンに載せない。agent-sts は交換のたびに、重要な操作のツールと approval-svc は
    呼び出しのたびに aoba-pdp に問い合わせる。トークンにはクライアントに委ねた範囲（scope）だけを載せる
  refs:
    - {kind: guide-slide, id: p04-carry-or-query}
    - {kind: guide-slide, id: p08-stale-claims}
  assumption: aoba-pdp は人事の台帳から導いたロールを 60 秒以内の新しさで返す
  revisit_trigger: aoba-pdp の応答が遅く、ツールの呼び出しの遅れが問題になったとき
- id: C-groups
  name: groups
  namespace: null
  registered_ref: {kind: spec, id: "RFC 9068 §7.2.1", url: "https://www.rfc-editor.org/rfc/rfc9068#section-7.2.1"}
  type: string
  shape: array
  max_items: 20
  description: 担当者の所属の組（営業所・課）の名前
  not_meaning: ロールではない
  decision: 却下
  rejection_kind: 代替あり
  alt: [C-scope]
  rationale: >-
    所属は異動で変わり、名前は組織の改編で付け替わる。権限を所属の名前で決めると、名前を変えるだけで権限が動く。所属が要る判断（上長が部下の発注を承認できるか）は、
    approval-svc が aoba-pdp に人事の台帳の所属のコードで問い合わせる
  refs:
    - {kind: guide-slide, id: p02-roles-groups-entitlements}
    - {kind: guide-slide, id: p04-split-by-writer}
  assumption: 所属の判断はすべて aoba-pdp で行う
  revisit_trigger: 所属でツールを出し分ける要望が出たとき
- id: C-amr
  name: amr
  namespace: null
  registered_ref: {kind: spec, id: "RFC 8176 §1", url: "https://www.rfc-editor.org/rfc/rfc8176#section-1"}
  type: string
  shape: array
  max_items: 4
  description: 認証に使った方法の一覧（pwd・otp など）
  not_meaning: 認証の強さの段ではない（それは acr）
  decision: 却下
  rejection_kind: 代替あり
  alt: [C-acr]
  rationale: 承認の判断に要るのは「多要素で認証したか」だけで、acr の mfa で足りる。方法の一覧を載せると、受け手ごとに読み方がずれる
  refs:
    - {kind: spec, id: "RFC 9470 §3", url: "https://www.rfc-editor.org/rfc/rfc9470#section-3"}
  assumption: 承認の判断は acr と auth_time だけで行う
  revisit_trigger: 方法ごとに扱いを変える要望（パスキーだけを認めるなど）が出たとき
- id: C-email
  name: email
  namespace: null
  registered_ref: {kind: spec, id: "OpenID Connect Core 1.0 §5.1", url: "https://openid.net/specs/openid-connect-core-1_0.html#StandardClaims"}
  type: string
  shape: single
  description: 担当者のメールアドレス
  not_meaning: 担当者を照合する値ではない
  decision: 却下
  rejection_kind: 不要
  rationale: コンソールもツールも担当者のメールを使わない。照合は sub、表示は name で足りる。載せると手元とログに個人情報が増える
  refs:
    - {kind: guide-slide, id: p09-do-not-carry}
  assumption: 担当者への通知はこの設計の外の社内の連絡の仕組みで行う
  revisit_trigger: ツールが担当者にメールを送る要望が出たとき
- id: C-tenant-phone
  name: tenant_phone
  namespace: "https://aoba-sumai.example/claims/"
  type: string
  shape: single
  description: 修繕依頼の入居者の電話番号
  not_meaning: 担当者・協力会社の連絡先ではない
  decision: 却下
  rejection_kind: 代替あり
  alt: [C-repair-id]
  rationale: >-
    入居者への連絡は、contact-tool が repair_id と相手の種類（入居者）を通知の基盤に渡し、通知の基盤が修繕依頼の台帳から宛先を引いて送る（REQ-12。contact-tool も宛先を持たない）。トークンに載せると、
    エージェントの実行基盤・全ツールの手元に入居者の電話番号が残り、エージェントが任意の番号に送る経路にもなる
  refs:
    - {kind: guide-slide, id: p09-do-not-carry}
    - {kind: guide-slide, id: p09-jws-is-readable}
  assumption: 通知の基盤は repair_id と相手の種類から、修繕依頼の台帳で宛先を引ける
  revisit_trigger: 修繕依頼の台帳を引けないツールが入居者の連絡先を必要とするとき
- id: C-unit-address
  name: unit_address
  namespace: "https://aoba-sumai.example/claims/"
  type: string
  shape: single
  description: 修繕する部屋の住所（物件の名前・部屋番号）
  not_meaning: 部屋の ID ではない
  decision: 却下
  rejection_kind: 代替あり
  alt: [C-authorization-details]
  rationale: >-
    解錠の照合に要るのは部屋の ID（authorization_details の unit_id）だけで、住所は要らない。住所と解錠の時間帯が同じトークンに並ぶと、漏れたときに
    いつどの部屋が開くかが読める
  refs:
    - {kind: guide-slide, id: p09-do-not-carry}
  assumption: lock-tool は部屋の ID で、スマートロックの管理の仕組み（lock-svc）の錠を引ける
  revisit_trigger: 住所を表示するツールを足すとき（そのときも修繕依頼の台帳から引く）
- id: C-unlock-code
  name: unlock_code
  namespace: "https://aoba-sumai.example/claims/"
  type: string
  shape: single
  description: スマートロックの一時解錠コード
  not_meaning: 承認の ID ではない
  decision: 却下
  rejection_kind: 禁止
  rationale: >-
    解錠コードは秘密の値で、協力会社の作業員にだけ届ける（REQ-06）。トークン（JWS は読める）・エージェント・担当者の画面・ログに出さない。lock-tool が lock-svc で
    作らせ、通知の基盤で作業員の登録の番号に直接送り、エージェントには発行の参照（code_ref）だけを返す
  refs:
    - {kind: guide-slide, id: p09-jws-is-readable}
    - {kind: guide-slide, id: p09-do-not-carry}
  assumption: lock-svc は、承認 ID ごとにコードを 1 つだけ作り、not_after まで暗号化して持ち、同じ承認 ID の再要求には同じコードを返す。lock-tool はコードを保存しない
  revisit_trigger: 作業員がアプリで解錠する方式（コードを使わない）に替えるとき
- id: C-staff-number
  name: staff_number
  namespace: "https://aoba-sumai.example/claims/"
  type: string
  shape: single
  description: 人事の台帳の社員番号。aoba-as の利用者の属性（hr-sync だけが書く）として持ち、aoba-pdp と hr-sync が aoba-as の利用者と人事の台帳を突き合わせる鍵に使う
  not_meaning: トークンの主体の ID ではない（それは sub）
  decision: 却下
  rejection_kind: 不要
  rationale: >-
    トークンに載せない。受け手は社員番号で判断せず、aoba-pdp が sub から aoba-as の利用者の属性で引く。突き合わせの鍵としての性質は次のとおり：人事の台帳が採番し、
    付け替え・再利用をしない（再雇用でも新しい番号。人事部に確かめた。2026-11-20）。属性が無い・人事の台帳に無い番号なら、aoba-pdp は在籍なしとして拒否する。
    属性の最後の変更が hr-sync のアプリの DB アカウントでない利用者は、aoba-as の利用者の API が返さない（design.md の 3.1）
  refs:
    - {kind: guide-slide, id: p04-immutable-identifiers}
  assumption: 人事の台帳は社員番号を付け替えない
  revisit_trigger: 人事の台帳の採番の規則が変わるとき
- id: C-order-limit
  name: order_limit
  namespace: "https://aoba-sumai.example/claims/"
  type: integer
  shape: single
  description: 担当者が承認なしで発注できる上限の金額
  not_meaning: 承認した金額ではない（それは authorization_details の amount）
  decision: 却下
  rejection_kind: 不要
  rationale: >-
    承認が要るかは担当者ごとの上限ではなく、部屋ごとの直近 30 日の累計で決める（REQ-05）。累計は発注の台帳の値で、order-tool が確定のたびに数える。
    トークンに上限を載せると、寿命の間に累計が変わっても古い値で通る
  refs:
    - {kind: guide-slide, id: p04-carry-or-query}
  assumption: 承認の要否の規則は部屋ごとの累計だけで、担当者ごとに変えない
  revisit_trigger: 担当者の職位で承認の要否を変える要望が出たとき
- id: C-txn
  name: txn
  namespace: null
  registered_ref: {kind: spec, id: "RFC 8417 §2.2", url: "https://www.rfc-editor.org/rfc/rfc8417#section-2.2"}
  type: string
  shape: single
  description: 1 つの取引の相関の ID（Txn-Token・SET の txn）
  not_meaning: 修繕依頼の ID ではない
  decision: 却下
  rejection_kind: 代替あり
  alt: [C-repair-id]
  rationale: >-
    監査で結ぶ単位は修繕依頼（何日もかけて多くの呼び出しをまたぐ）で、1 つの呼び出しの連鎖ではない。Txn-Token を使わず、修繕依頼 ID・発注 ID・承認 ID・jti で結ぶ
  refs:
    - {kind: spec, id: "draft-ietf-oauth-transaction-tokens-11 §9.2", url: "https://datatracker.ietf.org/doc/html/draft-ietf-oauth-transaction-tokens-11#section-9.2"}
  assumption: ツールの先に、トークンで文脈を伝えるサービスの連鎖が無い
  revisit_trigger: ツールの先に複数のサービスを呼ぶ処理を足すとき
