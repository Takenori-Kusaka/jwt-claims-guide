# template_version: 0.3.0
# 測定の対照に使う教材。設計に使わない
# yaml-language-server: $schema=../../../../../templates/registry/claims.schema.json
# 台帳（templates/registry/README.md の 3.1）。あおば住まいサービスの修繕の手配（管理担当者のコンソールと、修繕手配エージェント）
# 発行者は 2 つ：aoba-as（組織の認可サーバー。担当者のログイン）と agent-sts（この設計で作る交換のサービス）。どちらも組織が自分で作る
# 組織の名前空間の共有クレームは 2 つ（repair_id・approval_ref）。追加前の 25 問は claim_request_<名前>.md
scenario: aoba-repair-agent
namespaces:
  - namespace: "https://aoba-sumai.example/claims/"
    style: flat_prefix
    owner: 認証基盤チーム（台帳の持ち主。templates/registry/README.md の 11.）
    assignment: 名前空間の下の名前は、この台帳への登録（PR と追加前の 25 問）でだけ割り当てる。名前空間の名前を書くのは agent-sts だけで、aoba-as は書かない
data_category_vocabulary:
  name: fideslang
  version: 3.1.4
  url: https://github.com/ethyca/fideslang/blob/3.1.4/data_files/data_categories.csv
  license: CC-BY-4.0
  verified_on: '2026-11-27'
claims:
# ---------------------------------------------------------------- 登録名：受け入れの検証に使うもの
- id: C-iss
  name: iss
  namespace: null
  registered_ref: {kind: spec, id: "RFC 7519 §4.1.1", url: "https://www.rfc-editor.org/rfc/rfc7519#section-4.1.1"}
  type: string
  shape: single
  description: トークンの発行者。aoba-as（https://login.aoba-sumai.example）か agent-sts（https://sts.aoba-sumai.example）
  not_meaning: 担当者がどこでログインしたかではない。許可リストにある値でも、その種別を出す発行者でなければ受け入れない
  usage: protocol
  decision: 採用
  rationale: >-
    受け手ごとに受け入れる発行者を種別ごとに 1 つに固定する。ツール 4 つと approval-svc は agent-sts だけ、agent-sts は subject_token に aoba-as（CONSOLE_AT）か
    自分（REPAIR_DELEG_AT）、repair-console は aoba-as だけを受ける。ツールが aoba-as のトークンを受けないので、担当者のトークンでツールを呼ぶ経路が無い
  refs:
    - {kind: spec, id: "RFC 8725 §3.8", url: "https://www.rfc-editor.org/rfc/rfc8725#section-3.8"}
    - {kind: guide-slide, id: p00-incident-signature-valid}
  assumption: 発行者は 2 つで、受け手ごとに受け入れる発行者を設定で固定する
  revisit_trigger: 別の発行者（協力会社の認可サーバー、グループ会社の IdP）のトークンを受ける受け手が出たとき
  issuers:
    - "https://login.aoba-sumai.example"
    - "https://sts.aoba-sumai.example"
  authoritative_writer:
    - {stage: ②, writer: 各発行者（aoba-as・agent-sts）の設定, configurable_by: [platform]}
  issue_events: [I01, I02, I06, I09, I12]
  source_system: 各発行者の設定（認証基盤チームが持つ）
  volatility: never
  recompute_trigger: [never]
  propagation_delay: 0
  on_revoke: 変わらない値。発行者の切り替えは受け手の許可リストの変更で行う
  carried_in: [LOGIN_ID_TOKEN, CONSOLE_AT, CONSOLE_LOGOUT, REPAIR_DELEG_AT, ORDER_TOOL_AT, CONTACT_TOOL_AT, PAYMENT_TOOL_AT, LOCK_TOOL_AT, APPROVAL_AT]
  consumers: [repair-console, agent-sts, order-tool, contact-tool, payment-tool, lock-tool, approval-svc]
  on_missing: 拒否
  enforced_at:
    - {service: repair-console, check: ID トークン・ログアウトトークンの iss が aoba-as と完全一致, against: [api_config]}
    - {service: agent-sts, check: subject_token の iss が、CONSOLE_AT なら aoba-as、REPAIR_DELEG_AT なら自分と完全一致, against: [api_config]}
    - {service: order-tool, check: iss が agent-sts と完全一致。aoba-as のトークンは拒否, against: [api_config]}
    - {service: contact-tool, check: iss が agent-sts と完全一致。aoba-as のトークンは拒否, against: [api_config]}
    - {service: payment-tool, check: iss が agent-sts と完全一致。aoba-as のトークンは拒否, against: [api_config]}
    - {service: lock-tool, check: iss が agent-sts と完全一致。aoba-as のトークンは拒否, against: [api_config]}
    - {service: approval-svc, check: iss が agent-sts と完全一致。aoba-as のトークンは拒否, against: [api_config]}
  max_bytes: 40
  overflow_strategy: 上限で固定（超えない値域）
  pii_category: 該当なし
  data_category: [system.authentication]
  confidential_from: []
  log_policy: 記録する
  status: active
  owner: 認証基盤チーム
  change_controller: IETF（RFC 7519）
- id: C-sub
  name: sub
  namespace: null
  registered_ref: {kind: spec, id: "RFC 7519 §4.1.2", url: "https://www.rfc-editor.org/rfc/rfc7519#section-4.1.2"}
  type: string
  shape: single
  description: >-
    担当者（管理担当者・上長）の aoba-as の利用者 ID（UUID）。「誰の権限で」に答える。どの種別でも担当者を表し、ワークロード（エージェント・ツール）を sub に入れる種別は無い
  not_meaning: 今その操作をしている行為者ではない（それは act の最も外側）。社員番号・ログイン名ではない（受け手は sub で照合し、社員番号をトークンの照合に使わない。社員番号は aoba-pdp・hr-sync が aoba-as の利用者と人事の台帳を突き合わせる鍵だけに使う。C-staff-number）
  usage: identifier
  identifier_properties: {stable: true, reassignable: false, pairwise: false, id_scheme: uuid}
  decision: 採用
  answers: [q-sub, q-user]
  does_not_answer: [q-actor]
  rationale: >-
    agent-sts は交換で sub を subject_token から写すだけで、要求の値で差し替えさせない。発注の確定・解錠コードの発行・支払いの依頼のツールは、sub で aoba-pdp に
    担当者の在籍・ロール・修繕依頼の担当を問い合わせる。退職した担当者を作り直しても別の sub になり、古い sub の権限は引き継がれない
  refs:
    - {kind: spec, id: "RFC 8693 §4.1", url: "https://www.rfc-editor.org/rfc/rfc8693#section-4.1"}
    - {kind: guide-slide, id: p02-user-identifier}
  assumption: 担当者は aoba-as のローカルの利用者で、外部の IdP から取り込まない
  revisit_trigger: 協力会社の作業員やグループ会社の社員をログインさせることになったとき
  issuers:
    - "https://login.aoba-sumai.example"
    - "https://sts.aoba-sumai.example"
  authoritative_writer:
    - {stage: ①, writer: aoba-as（ローカルの利用者の ID）, configurable_by: [platform]}
    - {stage: ③, writer: agent-sts（subject_token から写すだけ）, configurable_by: [platform]}
  issue_events: [I01, I02, I06, I09]
  source_system: aoba-as の利用者（hr-sync が人事の台帳の在籍の記録から作る。ID は aoba-as が割り当てる。利用者を作り社員番号の属性を書けるのは hr-sync の証明書の API だけで、aoba-as の管理の画面では作れない）
  verification_method: hr-sync が人事の台帳の在籍の記録から利用者を作る。メールのドメインや自己登録では作らない。aoba-pdp は sub から社員番号の属性を引いて人事の台帳と突き合わせる
  volatility: never
  recompute_trigger: [never]
  propagation_delay: 0
  on_revoke: 担当者の退職・異動は、agent-sts の交換ごとの aoba-pdp の問い合わせと、発注の確定・解錠コード・支払いのツールの呼び出しごとの問い合わせで止める（9.2）
  carried_in: [LOGIN_ID_TOKEN, CONSOLE_AT, CONSOLE_LOGOUT, REPAIR_DELEG_AT, ORDER_TOOL_AT, CONTACT_TOOL_AT, PAYMENT_TOOL_AT, LOCK_TOOL_AT, APPROVAL_AT]
  consumers: [repair-console, agent-sts, order-tool, contact-tool, payment-tool, lock-tool, approval-svc]
  on_missing: 拒否
  enforced_at:
    - {service: repair-console, check: ID トークンの sub を BFF のセッションに結ぶ。ログアウトトークンの sub と sid でセッションを探す, against: [format]}
    - {service: agent-sts, check: 出すトークンの sub は subject_token の sub と同じ。aoba-pdp で在籍を確かめる。委任とツールの交換では修繕依頼の台帳で修繕依頼の担当が sub であること、APPROVAL_AT の交換では sub が修繕依頼の担当か、aoba-pdp で同じ課の上長であること（承認者の条件そのものは approval-svc が確かめる）, against: [data_layer]}
    - {service: order-tool, check: 確定（orders:place）のたびに aoba-pdp に sub を渡し、在籍・修繕担当のロール・修繕依頼の担当を問い合わせる。下書きは監査ログに残すだけ, against: [data_layer]}
    - {service: contact-tool, check: 監査ログに残す。連絡の相手の範囲（入居者と協力会社の窓口。visit-subagent なら入居者だけ）は C-repair-id の照合で決める, against: [format]}
    - {service: payment-tool, check: 支払いの依頼のたびに aoba-pdp に sub を渡し、在籍・修繕担当のロール・修繕依頼の担当を問い合わせる, against: [data_layer]}
    - {service: lock-tool, check: 解錠コードの発行のたびに aoba-pdp に sub を渡し、在籍・鍵の取り扱いのロール・修繕依頼の担当を問い合わせる, against: [data_layer]}
    - {service: approval-svc, check: aoba-pdp で承認者の在籍とロールを引き、承認の種類ごとの承認者の条件と照合する。発注の承認は、承認者の sub が承認の記録の担当者（依頼したときの sub）と違い、修繕依頼の台帳の担当の履歴（今と過去の担当）にも無いこと。解錠の承認は、承認者の sub が承認の記録の担当者で、今も修繕依頼の担当であること, against: [data_layer, other_claim], with: C-approval-ref}
  max_bytes: 36
  overflow_strategy: 上限で固定（超えない値域）
  pii_category: 個人情報
  data_category: [user.unique_id]
  confidential_from: []
  integrity_until:
    - {place: log, target: agent-sts・ツール 4 つ・approval-svc・order-scheduler の監査ログ（監査の共通部品の鍵つきのハッシュ）, trust_boundary: 監査の基盤（閲覧は監査の担当と管理部の部長だけ。design.md の付録 D の M_privacy_minimization の 8.）}
    - {place: other, target: 発注の台帳の予約の記録（order-tool が書き、order-scheduler が読む）, trust_boundary: 発注の台帳（予約の記録を作れるのは order-tool の DB アカウントだけ。order-scheduler の DB アカウントは状態の「予約→確定」「予約→取り消し」だけを更新できる。DB の管理者の直接の書き込みは、order-scheduler が実行の前に変更の記録の表で検出する。design.md の 3.1）}
  log_policy: ハッシュ化して記録
  status: active
  owner: 認証基盤チーム
  change_controller: IETF（RFC 7519）
  note: >-
    監査ログには、監査の共通部品の HMAC-SHA256（鍵は監査の担当が鍵管理の仕組みで持ち、全サービスで同じ鍵）で残す。どのサービスのログでも同じ値になるので、
    ログどうしを結べる。監査の担当は担当者の sub から同じ値を作って検索する
- id: C-aud
  name: aud
  namespace: null
  registered_ref: {kind: spec, id: "RFC 7519 §4.1.3", url: "https://www.rfc-editor.org/rfc/rfc7519#section-4.1.3"}
  type: string
  shape: single
  description: >-
    トークンの宛先 1 つ。CONSOLE_AT・REPAIR_DELEG_AT は agent-sts、ツールのトークンはそれぞれのツールの MCP の URI、APPROVAL_AT は approval-svc、
    ID トークン・ログアウトトークンは repair-console
  not_meaning: してよい操作の範囲ではない（それは scope）。トークンを持つ者ではない（それは cnf）
  usage: protocol
  decision: 採用
  answers: [q-resource]
  rationale: >-
    1 つのトークンの宛先は 1 つだけにする。agent-sts は交換の要求の resource（RFC 8707）を 1 つだけ受け、リソースの表に登録した宛先にだけ出す。
    ツールは aud が自分の MCP の URI と完全一致し、ほかの値が並ばないことを確かめる。漏れたトークンを別のツールで使わせない
  refs:
    - {kind: spec, id: "RFC 8707 §2", url: "https://www.rfc-editor.org/rfc/rfc8707#section-2"}
    - {kind: spec, id: "RFC 9068 §4", url: "https://www.rfc-editor.org/rfc/rfc9068#section-4"}
    - {kind: guide-slide, id: p06-narrow-downstream}
  assumption: ツール・approval-svc はそれぞれ 1 つの正規の URI を持つ
  revisit_trigger: 1 つのツールを複数の URI で公開するとき
  issuers:
    - "https://login.aoba-sumai.example"
    - "https://sts.aoba-sumai.example"
  authoritative_writer:
    - {stage: ②, writer: aoba-as（クライアントの登録の宛先。repair-console の CONSOLE_AT は agent-sts だけ）, configurable_by: [platform]}
    - {stage: ③, writer: agent-sts（交換の要求の resource を、リソースの表と照合してから書く）, configurable_by: [platform]}
  issue_events: [I01, I02, I06, I09, I12]
  source_system: aoba-as のクライアントの登録、agent-sts のリソースの表（認証基盤チームが持つ）
  volatility: never
  recompute_trigger: [never]
  propagation_delay: 0
  on_revoke: 変わらない値
  carried_in: [LOGIN_ID_TOKEN, CONSOLE_AT, CONSOLE_LOGOUT, REPAIR_DELEG_AT, ORDER_TOOL_AT, CONTACT_TOOL_AT, PAYMENT_TOOL_AT, LOCK_TOOL_AT, APPROVAL_AT]
  consumers: [repair-console, agent-sts, order-tool, contact-tool, payment-tool, lock-tool, approval-svc]
  on_missing: 拒否
  enforced_at:
    - {service: repair-console, check: ID トークン・ログアウトトークンの aud が repair-console だけ, against: [api_config]}
    - {service: agent-sts, check: CONSOLE_AT・REPAIR_DELEG_AT の aud が https://sts.aoba-sumai.example だけ, against: [api_config]}
    - {service: order-tool, check: aud が https://order-tool.aoba-sumai.example/mcp だけ。配列にほかの値があれば拒否, against: [api_config]}
    - {service: contact-tool, check: aud が https://contact-tool.aoba-sumai.example/mcp だけ, against: [api_config]}
    - {service: payment-tool, check: aud が https://payment-tool.aoba-sumai.example/mcp だけ, against: [api_config]}
    - {service: lock-tool, check: aud が https://lock-tool.aoba-sumai.example/mcp だけ, against: [api_config]}
    - {service: approval-svc, check: aud が https://approval.aoba-sumai.example だけ, against: [api_config]}
  max_bytes: 48
  overflow_strategy: 上限で固定（超えない値域）
  pii_category: 該当なし
  data_category: [system.authentication]
  confidential_from: []
  log_policy: 記録する
  status: active
  owner: 認証基盤チーム
  change_controller: IETF（RFC 7519）
- id: C-exp
  name: exp
  namespace: null
  registered_ref: {kind: spec, id: "RFC 7519 §4.1.4", url: "https://www.rfc-editor.org/rfc/rfc7519#section-4.1.4"}
  type: integer
  shape: single
  description: トークンの期限（UNIX 時刻）
  not_meaning: 権限が続くことの保証ではない。期限の前でも、重要な操作は aoba-pdp と approval-svc で確かめ直す
  usage: protocol
  decision: 採用
  rationale: >-
    受け手は exp を時計のずれ 30 秒まで許して確かめる。agent-sts は交換で出すトークンの exp を、自分の寿命の上限と subject_token の exp の早いほうにする
    （下流の寿命が上流を超えない）。ツールは exp − iat が種別の寿命以下であることも確かめる
  refs:
    - {kind: spec, id: "RFC 7519 §4.1.4", url: "https://www.rfc-editor.org/rfc/rfc7519#section-4.1.4"}
    - {kind: guide-slide, id: p08-choosing-lifetime}
  assumption: 発行者と受け手の時計は組織の NTP に合わせる
  revisit_trigger: 組織の網の外の受け手を足すとき
  issuers:
    - "https://login.aoba-sumai.example"
    - "https://sts.aoba-sumai.example"
  authoritative_writer:
    - {stage: ②, writer: aoba-as（クライアントごとの寿命の設定）, configurable_by: [platform]}
    - {stage: ③, writer: agent-sts（種別の寿命と subject_token の exp の早いほう）, configurable_by: [platform]}
  issue_events: [I01, I02, I06, I09, I12]
  source_system: 発行者の時計と寿命の設定
  volatility: never
  recompute_trigger: [never]
  propagation_delay: 0
  on_revoke: トークンごとの値
  carried_in: [LOGIN_ID_TOKEN, CONSOLE_AT, CONSOLE_LOGOUT, REPAIR_DELEG_AT, ORDER_TOOL_AT, CONTACT_TOOL_AT, PAYMENT_TOOL_AT, LOCK_TOOL_AT, APPROVAL_AT]
  consumers: [repair-console, agent-sts, order-tool, contact-tool, payment-tool, lock-tool, approval-svc]
  on_missing: 拒否
  enforced_at:
    - {service: repair-console, check: exp を時計のずれ 30 秒まで許して確かめる, against: [format]}
    - {service: agent-sts, check: subject_token の exp を確かめ、出すトークンの exp を subject_token の exp より後にしない, against: [other_claim], with: C-iat}
    - {service: order-tool, check: exp を確かめ、exp − iat が 300 秒以下, against: [other_claim], with: C-iat}
    - {service: contact-tool, check: exp を確かめ、exp − iat が 300 秒以下, against: [other_claim], with: C-iat}
    - {service: payment-tool, check: exp を確かめ、exp − iat が 300 秒以下, against: [other_claim], with: C-iat}
    - {service: lock-tool, check: exp を確かめ、exp − iat が 300 秒以下, against: [other_claim], with: C-iat}
    - {service: approval-svc, check: exp を確かめ、exp − iat が 120 秒以下, against: [other_claim], with: C-iat}
  max_bytes: 10
  overflow_strategy: 上限で固定（超えない値域）
  pii_category: 該当なし
  data_category: [system.operations]
  confidential_from: []
  log_policy: 記録する
  status: active
  owner: 認証基盤チーム
  change_controller: IETF（RFC 7519）
- id: C-iat
  name: iat
  namespace: null
  registered_ref: {kind: spec, id: "RFC 7519 §4.1.6", url: "https://www.rfc-editor.org/rfc/rfc7519#section-4.1.6"}
  type: integer
  shape: single
  description: トークンの発行の時刻（UNIX 時刻）
  not_meaning: 担当者が認証した時刻ではない（それは auth_time）
  usage: protocol
  decision: 採用
  rationale: 受け手は exp − iat で寿命の上限を確かめ、未来の iat（時計のずれ 30 秒を超える）を拒否する。ログアウトトークンは iat から 120 秒で受け入れを打ち切る
  refs:
    - {kind: spec, id: "RFC 7519 §4.1.6", url: "https://www.rfc-editor.org/rfc/rfc7519#section-4.1.6"}
  assumption: 発行者と受け手の時計は組織の NTP に合わせる
  revisit_trigger: 組織の網の外の受け手を足すとき
  issuers:
    - "https://login.aoba-sumai.example"
    - "https://sts.aoba-sumai.example"
  authoritative_writer:
    - {stage: ②, writer: aoba-as, configurable_by: [platform]}
    - {stage: ③, writer: agent-sts, configurable_by: [platform]}
  issue_events: [I01, I02, I06, I09, I12]
  source_system: 発行者の時計
  volatility: never
  recompute_trigger: [never]
  propagation_delay: 0
  on_revoke: トークンごとの値
  carried_in: [LOGIN_ID_TOKEN, CONSOLE_AT, CONSOLE_LOGOUT, REPAIR_DELEG_AT, ORDER_TOOL_AT, CONTACT_TOOL_AT, PAYMENT_TOOL_AT, LOCK_TOOL_AT, APPROVAL_AT]
  consumers: [repair-console, agent-sts, order-tool, contact-tool, payment-tool, lock-tool, approval-svc]
  on_missing: 拒否
  enforced_at:
