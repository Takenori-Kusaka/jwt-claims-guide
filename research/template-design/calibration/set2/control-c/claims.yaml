    - {service: contact-tool, check: 送信は tenant.message:send、返信の読み取りは tenant.message:read が要る, against: [api_config]}
    - {service: payment-tool, check: payments:request が要る, against: [api_config]}
    - {service: lock-tool, check: lock.code:issue が要る, against: [api_config]}
    - {service: approval-svc, check: approvals:decide が要る, against: [api_config]}
