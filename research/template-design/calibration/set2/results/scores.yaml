      reason: 対照の H29 は PAY_MSG_CTX の要求を assessment-svc だけから受け、assessment_ref は確定の記録の持ち主の assessment-svc が渡すので、TTS が使用済みを記録しなくても 1 回の確定から複数の指示は生じない。seeded では D01 で claim-svc なども頼めるため、呼び出し側が決めた assessment_ref
