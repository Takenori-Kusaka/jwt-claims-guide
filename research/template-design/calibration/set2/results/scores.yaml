      severity: Minor
      verdict: 真（基の設計の欠陥）
      reason: TTS が止まれば受付も止まる（3.1 の拒む側に倒す）ので、その場合は害が無い。しかし社員の台帳が止まると社員の口だけが止まり契約者・代理店の口は動き続ける一方、停止の操作は TXN_STAFF を要する as-admin-api でしか書けず、その間 REQ-01・REQ-02 の停止ができないことを 3.1・12. の可用性の検討で比べていない。control の 2.
        の as-admin-api の行と 12. の「可用性の目標」の行も同じ。
