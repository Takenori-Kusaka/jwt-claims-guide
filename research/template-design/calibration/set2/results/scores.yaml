      verdict: 誤検出
      reason: C-tctx の description は「操作ごとにどの項目があるかは経路の表が決め、表に無い項目は入れない」とし、付録 D の P5 の 2. の表では policy_number は claim.submit だけに入る。document-svc に届くのは operation が document.upload の Txn-Token（H10・H11）で、claim_id
        で照らすだけなので、policy_number・amount が届くという前提が設計と合わない。
