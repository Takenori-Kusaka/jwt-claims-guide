  - {cells: "D5-1/C13, D5-2/C13, D5-3/C13", call: "0.5 each. Core matched (contact scope not narrowed by role) but only q-freshness-mitigation / q-revocation-delivery named; both are priority-1 questions deliberately left out of also_accepted (set-2 header). Stricter: same 0.5. Looser (if a priority-1 question were accepted): 1."}
