  - {cells: "D6-3/D15", call: "0.5. a and b met (H30 max_lifetime declared 300 against 3600, 'looks like bending to pass L16'). Named q-hop-narrowing / q-no-passthrough, neither is in D15 confused_questions/also_accepted. The text itself is the lint-workaround idea, so a looser reading by substance gives 1. Stricter: still 0.5."}
  - {cells: "D6-2/D13", call: "0. In (2) q-copies-outlive the answer is Yes, but the one-line reason adds 'a copy with personal data is kept with no expiry, better to fix a retention limit'. It is a Yes answer and does not name H21 or the queue row, so (a) is weak. Looser (counting a Yes-with-caveat as a finding and accepting the 9.1 DB/broker layer as location): 0.5 or 1 (q-copies-outlive is the confused question). Stricter: 0."}
  - {cells: "D5-1/C03", call: "1. F16 plus (4) op-proof-holder both state it. F16 is Minor and says 'no place checks the direct peer is repair-console'; core matched, q-authorize-service-and-user is the confused question."}
  - {cells: "D6-2/D15", call: "1. F12 is hedged ('looks like a declaration to avoid lint') and Minor, names q-lint-workaround (confused). Stricter reading of core (does not say the L16 warn disappeared) still passes: it says the exception is not shown."}
  - {cells: "D6-1/D01-D08 style multi-claim findings", call: "none other than the above. D6-3/F1 mixes D01 (any SPIFFE ID accepted) and a second claim (caller-chosen assessment_ref makes several versions). Treated as one finding matched to D01; the second claim is listed under unmatched."}
