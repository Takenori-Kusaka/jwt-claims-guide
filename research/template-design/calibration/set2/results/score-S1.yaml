    note: "F16 is framed on approval-svc/H12, but it states that the CONSOLE_AT exchange accepts any workload and cites 4. (exchange conditions), which is a C03 location. Stricter (require the agent-sts side as the main claim) could give 0.5 or 0. I judged the core stated."
