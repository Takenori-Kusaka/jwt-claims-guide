# ---------------------------------------------------------------- 使わない種類
- id: TXN_TOKEN
  kind: txn_token
  decision: 却下
  rationale: ツールの先に、トークンで文脈を伝えるサービスの連鎖が無い。修繕依頼の相関は repair_id、行為者は act、承認は approval_ref で足りる
  assumption: ツールはそれぞれ自分の台帳と approval-svc・aoba-pdp・下流の仕組みを、自分の証明書で呼ぶだけで、ほかのサービスにトークンを渡さない
  revisit_trigger: ツールの先に複数のサービスを呼ぶ処理を足すとき
  format: jwt
- id: INTERNAL_TOKEN
  kind: internal_token
  decision: 却下
  rationale: 入口でトークンを作り直さない。ツール宛てのトークンは agent-sts が交換で直接出す
  assumption: ツールの手前に入口（ゲートウェイ）を置かない
  revisit_trigger: ツールの手前に入口を置くとき
  format: jwt
- id: ID_JAG
  kind: id_jag
  decision: 却下
  rationale: 信頼ドメインをまたいでツールを呼ばない。ツールはすべて組織の中にある
  assumption: 協力会社・社外の MCP サーバーを使わない
  revisit_trigger: 協力会社の受発注の仕組みを MCP で直接呼ぶとき
  format: jwt
- id: DPOP_PROOF
  kind: dpop_proof
  decision: 却下
  rationale: 送信者制約は mTLS にした。エージェントの実行基盤と repair-console はどれも wl-ca の証明書を持ち、DPoP の鍵を別に管理しない
  assumption: 呼び出し元はすべて組織の網の中のワークロード
  revisit_trigger: ブラウザや作業員のスマートフォンから直接ツールを呼ぶクライアントを作るとき
  format: jwt
- id: CLIENT_ASSERTION
  kind: client_assertion
  decision: 却下
  rationale: クライアント認証は mTLS（tls_client_auth）にした。鍵を 2 種類持たない
  assumption: repair-console は aoba-as と agent-sts の両方に同じ証明書で認証できる
  revisit_trigger: mTLS を張れない場所にクライアントを置くとき
  format: jwt
- id: JAR_REQUEST_OBJECT
  kind: jar_request_object
  decision: 却下
  rationale: 認可要求は PAR で repair-console のサーバーから aoba-as に直接送る。ブラウザを通る要求の改ざんは PAR で防ぐ
  assumption: aoba-as は PAR を必須にする（aoba-as の仕様書の 3.1）
  revisit_trigger: 要求の内容を第三者に証明する必要が出たとき
  format: jwt
- id: JARM_RESPONSE
  kind: jarm_response
  decision: 却下
  rationale: 認可応答は認可コードと iss だけで、PKCE と PAR で守る。応答に署名する必要がない
  assumption: 応答の改ざんは PKCE で検知できる
  revisit_trigger: FAPI に合わせる必要が出たとき
  format: jwt
- id: WL_IDENTITY_JWT
  kind: jwt
  decision: 却下
  rationale: >-
    エージェントの ID を JWT（ワークロードの ID のトークン・actor_token）で運ばない。agent-sts は交換を求めた mTLS の相手の証明書（wl-ca）から行為者を決め、
    act を作る。JWT の発行者を増やさない
  assumption: エージェントは agent-sts と直接 mTLS を張れる
  revisit_trigger: mTLS を張れない場所でエージェントを動かすとき（actor_token を使う）
  format: jwt
- id: SECURITY_EVENT_TOKEN
  kind: security_event_token
  decision: 却下
  rationale: 人事の台帳の変更は aoba-pdp が人事の台帳を直接引いて反映し、SET を使わない。セッションの終了は Back-Channel Logout で届ける
  assumption: 担当者の変更の通知を受けるのは aoba-as（hr-sync）と aoba-pdp だけ
  revisit_trigger: 人事の台帳が SSF の送信者になり、ツールに直接知らせたいとき
  format: jwt
- id: STATUS_LIST_TOKEN
  kind: status_list_token
  decision: 却下
  rationale: ツールのトークンは 300 秒で、重要な操作は aoba-pdp と approval-svc に都度問い合わせる。状態リストで個々のトークンを止める必要がない
  assumption: 長く生きるトークンを出さない
  revisit_trigger: 寿命の長いトークンを出すとき
  format: jwt
- id: INTROSPECTION_RESPONSE_JWT
  kind: introspection_response_jwt
  decision: 却下
  rationale: agent-sts は aoba-as のイントロスペクションを mTLS で直接呼び、応答を第三者に渡さないので、JSON の応答で足りる
  assumption: イントロスペクションの応答は agent-sts の中だけで使う
  revisit_trigger: 応答を別のサービスに渡す必要が出たとき
  format: jwt
