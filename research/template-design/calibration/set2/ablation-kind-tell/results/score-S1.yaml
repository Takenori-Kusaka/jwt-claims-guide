    findings:
      - "F-01 | 6. UC4 の q-actor「不要」・catalog q-actor・H22・C-act | payment-worker が作り直した TXN_TOKEN に act が無く、利用者の操作とワーカーの再実行をトークンで見分けられない | Major"
      - "F-02 | C-act の authoritative_writer・verification_method・TXN_PROXY の assumption・2.2・9.2・12. | IVR の通話の記録の書き手（運用者・DB 管理者・ベンダー）と本人確認の方式が数えられていない | Major"
      - "F-03 | H5（upstream なし）・H31 の note・3.1・9.1 | H5 に upstream を置かず L16 の比べを外しているのに、9.1 は鎖として 750 秒を数え、宣言と説明が食い違う | Minor"
      - "F-04 | 1. の warn の理由の表（L16 の aud の 6 件）・H25・H18・H19 | 信頼ドメインの aud は宛先の絞り込みにならず、warn の理由が通らない。H25 は TXN_STAFF の scope を絞らずに渡す | Minor"
      - "F-05 | C-sub の identifier_properties（reassignable: false）・note・3.1・12. | agst_ は上流の sub の付け替えで別の人を指すのに reassignable: false | Minor"
      - "F-06 | C-acr・C-auth-time の enforced_at・H25・3.1・付録 B | 保留の印を消す payment-svc（H25）は acr・auth_time を確かめず、operation で書くか消すかを決めている | Minor"
      - "F-07 | H24 の 4 つ目の check・3.1 | DB の書き込みと振込のファイルへの追加を 1 つの取引にする方式が書かれておらず、途中で止まると支払いが落ちるか二重になる | Major（要確認）"
      - "F-08 | 9.2・2.2・H17／H18 | 新しい payee_ref を追加できる人・本人確認・承認が書かれていない。100 万円未満の支払いの行は 2 人の承認だけで直せる | Minor"
      - "F-09 | 3.1・H10・H11・H19 | document-svc は書類の持ち主を自分では確かめず、前段と事後の突き合わせに任せる | Minor"
      - "F-10 | C-tctx の carried_in・consumers・H10・H11・H18・H19 | tctx の policy_number・amount・payee_ref が、claim_id しか使わない受け手にも届く | Minor"
      - "F-11 | 9.1 の末尾・REQ-03 | 懲戒になった承認者・査定者の既存の承認・指示が自動では止まらず、最悪は夜間の実行まで | Minor"
    extra_no_answers:
      - "(4)op-source-change | しろがねの側に、代理店の担当者（agst_）を 1 人だけ止める手段が見当たらない | -"
      - "(4)op-proof-holder | PH_AT・EMPLOYEE_AT の mTLS を却下した理由（SVID が 1 時間ごとに替わる）が弱い（レビュアーは指摘にしないとした） | -"
    note: "(2) の No（ap-1-7・q-step-up-path-coverage・ap-2-7・q-object-level-authz・q-derived-value）は F-02・F-06・F-01・F-09・F-10 と同じ"

