      - "F1 | 3.1 の見送り（頼る先が止まった間の取り消し・通すこと）・4. の頼る先の表・12.・LOCK_TOOL_AT・C-authorization-details | lock-svc か錠の網が止まると失効が届かず、発行済みのコードが not_after（最大 4 時間）まで使え、REQ-06 の 15 分に代わりの手順も許す時間も無い | Major"
      - "F2 | 3.1 の見送り（予約の実行で交換し直さない）・2.2・H13・ORDER_TOOL_AT の long_running・U13 | order-scheduler は aoba-as の利用者の状態を確かめ直さず、aoba-as の側だけの無効化では予約（最大 24 時間後）が止まらない | Major"
      - "F3 | 2.2 の lock-svc・aoba-as の管理の画面の行・catalog の aoba-as の trigger_list・I01 | 管理の画面にどの IdP・トークンで入り、基盤チームの 2 人にどう絞るかが書かれていない | Minor"
      - "F4 | C-cnf の enforced_at（5 行）の with | with: C-cnf が自分自身を指す。実際の比べる相手は mTLS の証明書の拇印 | Minor"
      - "F5 | design.md 2. の境界の表「組織の網」の行 | 「3.1 の見送りの行コンソールが…」と文が切れずにつながっている | Minor"
    extra_no_answers:
      - "(4)op-requirement-words | REQ-06 の「担当者」が付け替えの前の担当者を含むかがあいまい。もとの担当者は自分の承認した解錠を取り消せない（要求の書き手への確認事項） | -"
      - "(4)op-key-custody | lock-svc がコードを暗号化する鍵の持ち主が書かれていない（レビュアーは指摘にしないとした） | -"
    note: "(2) の No（q-outside-catalog・q-revocation-delivery・q-dependency-outage・q-long-running）は F1〜F3 と同じ"
  D9-3:
    design: control-c
    findings:
      - "F-1 | 3.1「課長が自分を担当にして…」・2.2・付録 B・C-approval-ref／C-sub の enforced_at（approval-svc） | 課長が自分を担当にすると解錠の依頼と承認を 1 人ででき、止めるのは週 1 回の事後の点検だけ。代わりの守りを比べていない | Major（Minor へ下げる余地あり）"
      - "F-2 | design.md 2.・3.1・9.2・C-sub の source_system | ロールの元の人事の台帳の、画面以外の書き込みの経路（DB の管理者・連携・一括の取り込み）と止める手段が無い | Major"
      - "F-3 | C-authorization-details の note・ORDER_TOOL_AT／LOCK_TOOL_AT の consumer スキーマ・3.1 | メンバーの型を確かめる共通部品の試験がまだ無く、受け手のスキーマに pattern・maxLength が無い | Minor"
      - "F-4 | 9.1（CONSOLE_SESSION・CONSOLE_RT・aoba-as のセッション）・P1 4.・CONSOLE_RT | 背景の RT の更新が aoba-as のセッションを延ばし、BFF が切れた後に認証を省いた再ログインができれば REQ-02 を満たさない（未確認） | Minor（未確認）"
      - "F-5 | 4.・P4 5.・付録 A・C-authorization-details／C-approval-ref の authoritative_writer | 承認を使用済みにした後に確定・発行が結果不明だと、300 秒が切れた後の再試行で新しいトークンを得られず、正しい 1 回が失われる | Minor"
    extra_no_answers:
      - "(4)op-proof-holder | 同じワークロードの URI を複数のインスタンスで共有する場合に、証明書を分けるかが書かれていない（確認の推奨） | -"
    note: "レビュアーは Bash を 1 回使ったと自分で書いている（ファイルの大きさを数えただけ）。(2) の No（ap-1-7・q-revocation-delivery・q-variant-comparison・op-requirement-words）は F-1・F-2・F-4 と同じ"
