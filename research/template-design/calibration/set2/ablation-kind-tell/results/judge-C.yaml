      reason: "委任の間 repair-console が CONSOLE_RT で CONSOLE_AT を取り直すので RT の無操作は延びうる一方、REQ-02 に反するかは、RT の利用で aoba-as のセッションの無操作が延びるか、BFF の無操作切れで RT・aoba-as のセッションを終えるかという aoba-as（自作の IdP）の挙動で決まる。設計書は 9.1 で「利用で idle を延ばす」とだけ書き、その製品の事実を確かめる資料が無い。"
      location: "control-c design.md 9.1（CONSOLE_SESSION・aoba-as のセッション・CONSOLE_RT の行）、付録 D の P1 の 4.、token_types.yaml CONSOLE_RT"
      borderline: true
    - finding: "F-5"
      severity: "Minor"
      verdict: "真（基の設計の欠陥）"
      reason: "4. の交換の要求の authorization_details の行は、agent-sts が承認済みの記録からだけ作り、使用済みの承認から作る例外を解錠の送り直しに限っている。付録 D の P4 の 5. と付録 A は、使用済み・未確定の後に同じ発注 ID で再試行するとしながら、ツールのトークン（300 秒）が切れた後に再試行のトークンをどう得るか（または誰がトークンなしで再試行するか）が無く、記述の間に食い違いがある。"
      location: "control-c design.md 4. の交換の要求の authorization_details の行（321 行）、付録 D の P4 の 5. の消費の競合と再送、付録 A の結果の分からない確定・発行"
