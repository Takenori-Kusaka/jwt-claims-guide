      location: "control-c design.md 2. の境界の表、3.1 の DB の管理者の行、9.2 の元のデータからの経路、claims.yaml C-sub source_system"
      borderline: true
    - finding: "F-3"
      severity: "Minor"
      verdict: "誤検出"
      reason: "受け手のスキーマでメンバーの型を表さないことは、3.1 の見送りの行「生成のスキーマで authorization_details のメンバーの型を表すこと」に理由と確かめ方（共通の部品の試験で型違いを拒否）つきで書かれ、付録 A にも共通の検証部品の採用の指標がある。受け手のスキーマに pattern が無いのは生成の受け手スキーマの性質（未知のクレームを許す緩い形）で、指摘の「部品も試験もまだ無い」は設計書に根拠が無く、書かれた理由は要求と矛盾しない。"
      location: "control-c design.md 3.1 の生成のスキーマの行、schemas/ORDER_TOOL_AT.consumer.schema.json・LOCK_TOOL_AT.consumer.schema.json、claims.yaml C-authorization-details note"
      borderline: true
    - finding: "F-4"
