  note: "Counts use my primary reading of borderline cells (see borderline_calls). Stricter and looser alternatives are listed there."

borderline_calls:
  - {cell: "D12-1/C13", primary: 0.5, stricter: 0, looser: 0.5, why: "Only the open-question note (4)op-source-change states that the two contact scopes are not narrowed by role (cross-referenced to A10 whose location includes CONTACT_TOOL_AT revocation). The note has no own location, and the fact is stated as a revocation consequence. q-revocation-delivery/op-source-change are not in also_accepted (deliberately absent), so 1 is impossible."}
  - {cell: "D12-3/C13", primary: 0, stricter: 0, looser: 0.5, why: "Only says 連絡は、ロールでは止まりません in the op-source-change note, as a consequence. It does not say agent-sts attaches the contact scope by delegation table instead of by role. Counted as not stating the core."}
  - {cell: "D10-1/D12", primary: 1, stricter: 0.5, looser: 1, why: "F15 says the sensitive document is read under assessment-svc's own authority and document-svc records only caller and claim_id (no sub). It does not literally say TXN_STAFF is not passed. q-original-principal is in confused_questions."}
  - {cell: "D10-3/D12", primary: 0.5, stricter: 0, looser: 0.5, why: "F-17 says document-svc checks only the caller and no sub is recorded; (a) H19 ok, (b) core mostly stated (no user identity at document-svc). Questions given (q-object-level-authz, q-audit-correlation) are not in confused/also_accepted, so cap 0.5."}
  - {cell: "D10-3/D13", primary: 0, stricter: 0, looser: 1, why: "Only a Yes answer in table (2) q-copies-outlive with reason 'ただし期限を決めずに残る'. Reviewer concluded no defect, no location and no finding. If counted as a finding, it states the core and the question id matches, giving 1."}
  - {cell: "D12-1/C19", primary: 0.5, stricter: 0.5, looser: 1, why: "A15 meets (a)(b) but names q-typ-distinguishes, which is not in confused_questions (q-shared-validator) or also_accepted. See key_issues K1."}
  - {cell: "D10-2/D10, D10-1/D11, D10-3/D11", primary: "as scored", stricter: "D11 would be 0 if the core required both 'ledger row missing' and 'IdP admin enters the attribute'", looser: "as scored", why: "D11 core contains two facts. All three reviewers state only that emp_no has no ledger row (identifier_properties/on_missing missing). See key_issues K3."}

