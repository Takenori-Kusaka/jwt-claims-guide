      verdict: 誤検出
      reason: "2. のトークンを運ばない呼び出しの表の as-admin-api → shirogane-as の「止まったとき」の列は、当番が直すことと「停止の目標は REQ-01・REQ-02 の 900 秒の内で、9.1 の最悪はその後から数える」を書いており、「時間の約束が無い」は当たらない。この文は control-d の 2. の同じ行にも同じ文がある（埋め込みとは関係しない）。"
      location: "seeded-d design.md 2. トークンを運ばない内部の呼び出しの表（as-admin-api → shirogane-as の行）、9.1"
      borderline: true
    - finding: F13
      severity: Minor
      verdict: 道具・教材への指摘
      reason: "sheet.md の 1. の性質の表の「操作ごとの承認がある［当たらない］」（authorization_details が無いことからの機械の読み方）を指す指摘で、設計書の欠陥ではない（S5 の例そのもの）。"
      location: "packet-extras/seeded-d/sheet.md 1."
    - finding: "(4)op-proof-holder (note 1): registration is matched by certificate subject, so no procedure revokes the old certificate after renewal"
      severity: "なし（開いた問いの気づき）"
      verdict: 誤検出
      reason: "証明書は同じサブジェクトで出し直し、古い証明書に束縛した AGENCY_AT は最大 300 秒で使えなくなる（付録 D の M_sender_constraint の 4.、C-client-id の source_system）。更新の後に古い証明書が期限まで有効なのは X.509 の通常の運用で、漏れたときは CRL で失効させる（C-cnf の on_revoke）。更新のたびの失効を求める要求も無く、control-d にも同じ記述があり、欠陥とは言えない。"
      location: "seeded-d design.md 付録 D の M_sender_constraint 4.（証明書・鍵の更新の行）、claims.yaml C-client-id・C-cnf"
      spec: "RFC 5280 §3.3（失効は危殆化などで期限の前に無効にする手段）"
      borderline: true
  D10-2:
    - finding: F13
      severity: Minor
