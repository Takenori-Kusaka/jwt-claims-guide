      reason: "agency_code は代理店の口の AGENCY_AT とそこから作る TXN_TOKEN にだけ載せ、契約者・社員の経路には載せないと絞ってある（claim_request の問 14）。fraud-svc・document-svc に届くのは Txn-Token を改変せずに渡す草案の形（H9・H11）の結果で、値は個人情報でもなく、受け手の契約にも入れていない。control-d も同じで、欠陥とは言えない。"
