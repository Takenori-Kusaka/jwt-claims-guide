  D10-3:
    - finding: F-10
      severity: Minor
      verdict: 誤検出
      reason: "H31 の note は、assertion は RFC 7523 の認可の grant で作り直しの上流のトークンではなく、AGENCY_AT の寿命・aud・agency_code は shirogane-as が代理店の登録の方針で決めるので H5 の upstream に置かない、と理由を書いている。grant の assertion より AT が長いのは RFC 7523 の通常の形で、9.1 の 750 秒は失効の遅れの和で寿命の狭め方とは別。control-d も同じ。"
      location: "seeded-d hops.yaml H5（upstream なし）・H31 の note、design.md 9.1"
      spec: "RFC 7523 §2.1・§3（assertion は grant で、発行する AT の寿命は認可サーバーが決める）"
    - finding: F-11
      severity: Minor
      verdict: 誤検出
      reason: "Txn-Token の aud は信頼ドメインを表すと草案が定めており（design.md 1. の warn の理由が §9.2 を引く）、外の AT の aud と名前が違うのは仕様どおり。宛先の絞り込みは TTS の口の照合と、受け手ごとの mTLS の相手・scope・operation で行うと書いてあり、理由は通る。control-d も同じ。"
      location: "seeded-d design.md 1. の warn の理由の表（L16・H4/H7/H15/H17/H23/H26）"
      spec: "draft-ietf-oauth-transaction-tokens-11（Txn-Token の aud は trust domain）"
    - finding: F-13
      severity: Minor
      verdict: 真（基の設計の欠陥）
      reason: "C-jti の enforced_at（shirogane-as）は (iss, jti) を「exp まで（最大 90 秒）」覚えるとし、C-exp・H31 は受け入れの上限を iat から 90 秒（exp＋ずれ 30 秒）とする。exp − iat が 60 秒なら exp から 30 秒の間、記録が消えた assertion を受け入れうる。control-d の claims.yaml C-jti・C-exp に同じ文があり、埋め込みとは関係しない。"
      location: "seeded-d claims.yaml C-jti の enforced_at（shirogane-as）・C-exp の shirogane-as の行、hops.yaml H31、token_types.yaml AGENCY_ASSERTION の jti_policy"
      spec: "RFC 7523 §3（jti による再送の防止は、受け入れる期間の間 jti を覚えることを前提にする）"
    - finding: F-15
      severity: Minor
      verdict: 道具・教材への指摘
      reason: "sheet.md の性質の表の「マルチテナント：当たらない」「操作ごとの承認：当たらない」の判定を疑う指摘で、性質の表の読み方（review_triage の性質と書き手の宣言の読み取り）への指摘（S5）。"
