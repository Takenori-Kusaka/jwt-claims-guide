  # ------------------------------------------------------------ 委任（電話の代理受付）
  - id: C-act
    name: act
    namespace: null
    registered_ref: {kind: spec, id: "RFC 8693 §4.1", url: "https://www.rfc-editor.org/rfc/rfc8693#section-4.1"}
    type: object
    shape: single
    description: 電話の代理受付で、契約者（sub）に代わって操作するコールセンターの社員。sub（stf_ の社員の ID）だけを入れ、入れ子を作らない
    not_meaning: 権限の持ち主（sub）ではない。直接の通信相手（q-peer）でも、Txn-Token を求めたワークロード（req_wl）でもない
    decision: 採用
    rationale: 代理の操作を、契約者の名と社員の名の両方で記録し、後から本人の操作と見分ける。act のあるトークンを受ける設定は claim-svc と fraud-svc だけに置く
    refs:
      - {kind: spec, id: "RFC 8693 §4.1", url: "https://www.rfc-editor.org/rfc/rfc8693#section-4.1"}
      - {kind: guide-slide, id: p05-system-privileges}
    assumption: 代理の深さは 1（社員が契約者に代わるだけ）。社員の代わりにさらに誰かが操作する経路は作らない
    revisit_trigger: 代理店の担当者や AI の受付が契約者に代わって操作する経路を足すとき。Transaction Tokens の草案の版が変わったとき
    spec_version: [draft-ietf-oauth-transaction-tokens-11]
    usage: authz
    answers: [q-actor]
    does_not_answer: [q-sub, q-peer, q-req-wl]
    issuers: ["https://tts.shirogane-sonpo.internal"]
    authoritative_writer: [{stage: "④", writer: TTS（検証した EMPLOYEE_AT の sub）, configurable_by: [platform]}]
    provenance: 発行者が確かめた値
    issue_events: [I22]
    source_system: EMPLOYEE_AT の sub と、社員の台帳の役割（コールセンター）・通話の記録の担当者
    verification_method: TTS が、EMPLOYEE_AT の sub が社員の台帳でコールセンターの役割を持ち、通話の記録の担当者と同じことを確かめる
    volatility: never
    propagation_delay: 0
    recompute_trigger: [reissue]
    on_revoke: 社員を止めると、TTS の次の発行から拒む（台帳のキャッシュ 60 秒）
    carried_in: [TXN_PROXY]
    consumers: [claim-svc, fraud-svc]
    on_missing: 拒否
    enforced_at:
      - {service: claim-svc, check: 共通の検証部品を act を許す設定で使い、act.sub が stf_ の ID で入れ子が無いこと。請求の記録に act.sub を代理受付の担当者として残す, against: [format, data_layer]}
      - {service: fraud-svc, check: act のある判定の依頼は、判定の記録に act.sub を残す（代理受付の請求として判定の入力を分ける）, against: [format, data_layer]}
    max_bytes: 120
    overflow_strategy: 発行を失敗させる
    pii_category: 個人情報
    log_policy: ハッシュ化して記録
    data_category: [user.unique_id]
    confidential_from: []
    status: active
    owner: しろがね損保 IT 基盤部（ID とトークン）
    change_controller: IETF（RFC 8693）

  # ------------------------------------------------------------ Transaction Tokens の草案の名前
  - id: C-txn
    name: txn
    namespace: null
    registered_ref: {kind: spec, id: "RFC 8417 §2.2", url: "https://www.rfc-editor.org/rfc/rfc8417#section-2.2"}
    type: string
    shape: single
    description: 取引の ID。入口の 1 回の要求、または 1 件の支払いの指示・実行ごとに TTS が付ける。PAY_MSG_CTX からの作り直しでは、元の txn を写す
    not_meaning: 請求・支払いの番号ではない（それは tctx の claim_id・payment_id）。トークンの ID（jti）ではない
    decision: 採用
    rationale: 監査ログ・トレースを、サービスと非同期の経路をまたいで 1 本につなぐ（要求 REQ-09）
    refs:
      - {kind: spec, id: "draft-ietf-oauth-transaction-tokens-11 §9.2", url: "https://www.ietf.org/archive/id/draft-ietf-oauth-transaction-tokens-11.txt"}
      - {kind: guide-slide, id: p06-audit-trail}
    assumption: TTS は 128 ビットの乱数で txn を作る
    revisit_trigger: Transaction Tokens の草案の版が変わったとき
    spec_version: [draft-ietf-oauth-transaction-tokens-11]
    usage: protocol
    answers: [q-txn]
    issuers: ["https://tts.shirogane-sonpo.internal"]
    authoritative_writer: [{stage: "④", writer: TTS, configurable_by: [platform]}]
    issue_events: [I22]
    source_system: TTS の乱数の生成（作り直しでは PAY_MSG_CTX の txn）
    volatility: never
    propagation_delay: 0
    recompute_trigger: [never]
    on_revoke: 該当なし
    carried_in: [TXN_TOKEN, TXN_STAFF, TXN_PROXY, PAY_MSG_CTX]
    consumers: [front-gw, claim-svc, fraud-svc, document-svc, assessment-svc, payment-svc, payment-worker, as-admin-api]
    on_missing: 拒否
    enforced_at:
      - {service: front-gw, check: 受けた Txn-Token の txn を、外の AT の iss・jti と同じ監査ログの行に記録する, against: [format]}
      - {service: claim-svc, check: 監査ログと請求の記録に txn を残す, against: [format]}
      - {service: fraud-svc, check: 判定の記録に txn を残す, against: [format]}
      - {service: document-svc, check: 書類の登録・閲覧の記録に txn を残す, against: [format]}
      - {service: assessment-svc, check: 査定の記録に txn を残す, against: [format]}
      - {service: payment-svc, check: "支払いの指示・承認・実行の記録に txn を残す。(txn, claim_id) の一意の制約で、同じ組の指示を 2 回記録しない（再配送への備え）", against: [format, data_layer]}
      - {service: payment-worker, check: payment-svc が指示を受け付けた後にだけ txn を処理済みにし、処理済みの txn のメッセージを TTS に出さない。送信の失敗はブローカーの再配送に任せる（重複は payment-svc が一意の制約で拒む）, against: [data_layer]}
      - {service: as-admin-api, check: 操作の記録に txn を残す, against: [format]}
    max_bytes: 36
    overflow_strategy: 上限で固定（超えない値域）
    pii_category: 該当なし
    log_policy: 記録する
    data_category: [system.operations]
    confidential_from: []
    note: txn は RFC 8417 §2.2 が登録した名前で、Transaction Tokens の草案も同じ名前を使う
    status: active
    owner: しろがね損保 IT 基盤部（ID とトークン）
    change_controller: IETF（RFC 8417、draft-ietf-oauth-transaction-tokens-11）

  - id: C-req-wl
    name: req_wl
    namespace: null
    registered_ref: {kind: spec, id: "draft-ietf-oauth-transaction-tokens-11 §9.2", url: "https://www.ietf.org/archive/id/draft-ietf-oauth-transaction-tokens-11.txt"}
    type: string
    shape: single
    description: Txn-Token を TTS に求めたワークロード。TTS が、要求の mTLS の相手の SPIFFE ID を書く（front-gw・payment-worker・payment-batch）
    not_meaning: 直接の通信相手ではない（下流の受け手にとっての直接の相手は mTLS で確かめる）。代理の社員（act）ではない
    decision: 採用
    rationale: 取引を始めてよいワークロード（front-gw・payment-worker・payment-batch）からの Txn-Token だけを受け、監査に残す
    refs:
      - {kind: spec, id: "draft-ietf-oauth-transaction-tokens-11 §9.2", url: "https://www.ietf.org/archive/id/draft-ietf-oauth-transaction-tokens-11.txt"}
    assumption: 草案 -11 は req_wl に何を書くかを細かく定めていない。しろがねは要求したワークロードの SPIFFE ID を書く（12.）
    revisit_trigger: Transaction Tokens の草案の版が変わったとき
    spec_version: [draft-ietf-oauth-transaction-tokens-11]
    usage: protocol
    answers: [q-req-wl]
    does_not_answer: [q-peer, q-actor]
    issuers: ["https://tts.shirogane-sonpo.internal"]
    authoritative_writer: [{stage: "④", writer: TTS（要求したワークロードの mTLS の相手の ID）, configurable_by: [platform]}]
    issue_events: [I22]
    source_system: TTS の mTLS の終端が確かめた X.509-SVID
    volatility: never
    propagation_delay: 0
    recompute_trigger: [never]
    on_revoke: 該当なし
    carried_in: [TXN_TOKEN, TXN_STAFF, TXN_PROXY]
    consumers: [claim-svc, fraud-svc, document-svc, assessment-svc, payment-svc, as-admin-api]
    on_missing: 拒否
    enforced_at:
      - {service: claim-svc, check: req_wl が front-gw であること。保留の読み取りの API（payment-svc から）だけは payment-batch も受ける。監査に記録する。直接の相手の照合には使わない, against: [api_config]}
      - {service: fraud-svc, check: req_wl が front-gw であること, against: [api_config]}
      - {service: document-svc, check: req_wl が front-gw であること, against: [api_config]}
      - {service: assessment-svc, check: req_wl が front-gw であること, against: [api_config]}
      - {service: payment-svc, check: "operation ごとに req_wl を決める：payment.instruct は payment-worker、payment.approve・payment.approval-cancel は front-gw、payment.execute は payment-batch。違えば 403", against: [api_config, other_claim], with: C-tctx}
      - {service: as-admin-api, check: req_wl が front-gw であること, against: [api_config]}
    max_bytes: 80
    overflow_strategy: 上限で固定（超えない値域）
    pii_category: 該当なし
    log_policy: 記録する
    data_category: [system.operations]
    confidential_from: []
    status: active
    owner: しろがね損保 IT 基盤部（ID とトークン）
    change_controller: IETF（draft-ietf-oauth-transaction-tokens-11）

  - id: C-tctx
    name: tctx
    namespace: null
    registered_ref: {kind: spec, id: "draft-ietf-oauth-transaction-tokens-11 §9.2.3", url: "https://www.ietf.org/archive/id/draft-ietf-oauth-transaction-tokens-11.txt"}
    type: object
    shape: single
    description: >-
      TTS が決めた取引の文脈。JSON のオブジェクトで、項目はすべて文字列：operation（経路の表の操作の名前。必ずある）、
      policy_number（証券番号。数字 10 桁）、claim_id（請求の ID。clm_ と 26 文字）、amount（金額。円の整数を 10 進の文字列で、先頭の 0 と符号を付けない。最大 12 桁）、
      payee_ref（振込先の参照 ID。pye_ と 26 文字。口座番号そのものではない）、payment_id（支払いの ID。pay_ と 26 文字）、
      call_id（通話の ID。TXN_PROXY だけ）、target_ref（管理の操作の対象の ID。as-admin-api だけ）。
      操作ごとにどの項目があるかは経路の表が決め、表に無い項目は入れない
    not_meaning: 要求の環境（rctx）ではない。利用者の権限（scope）ではない。支払いの承認そのもの（承認は payment-svc の承認の記録）ではない
    decision: 採用
    rationale: 取引の値を入口で 1 回だけ決め、値を使うサービスが要求の本文と照合する（途中のサービスが本文を書き換えても、入口で決めた値から外れた処理をしない）
    refs:
      - {kind: spec, id: "draft-ietf-oauth-transaction-tokens-11 §9.2.3", url: "https://www.ietf.org/archive/id/draft-ietf-oauth-transaction-tokens-11.txt"}
      - {kind: guide-slide, id: p04-split-by-writer}
      - {kind: guide-slide, id: p06-transaction-tokens}
    assumption: >-
      front-gw が要求の本文から経路の表の項目を取り出して request_details で TTS に渡し、TTS が経路の表の型と上限で確かめて書く（値は要求した者の申告で、TTS は形を確かめて固定するだけ。値が正しいかは受け手が保存データと照らす）。
      PAY_MSG_CTX からの作り直しでは、TTS は PAY_MSG_CTX の tctx の claim_id・policy_number・amount・payee_ref を変えずに写す
    revisit_trigger: Transaction Tokens の草案の版が変わったとき。tctx に項目を足すとき
    spec_version: [draft-ietf-oauth-transaction-tokens-11]
    usage: protocol
    answers: [q-txn]
    does_not_answer: [q-authorized]
    issuers: ["https://tts.shirogane-sonpo.internal"]
    authoritative_writer: [{stage: "④", writer: TTS（経路の表。値は front-gw が渡した要求の本文から、作り直しでは PAY_MSG_CTX から）, configurable_by: [platform, caller]}]
    provenance: 呼び出し側の申告
    issue_events: [I22]
    source_system: 入口の要求の本文（front-gw が取り出す）と TTS の経路の表。call_id は IVR の通話の記録
    value_vocabulary: {values: [operation, policy_number, claim_id, amount, payee_ref, payment_id, call_id, target_ref], owner: しろがね損保 IT 基盤部（ID とトークン）, extensible: false}
    value_normalization: {case: as_is, unicode: NFC, trim: true, compare: exact, normalized_by: TTS（front-gw が渡した値を、経路の表の型に合わせて 1 回だけ正規化する。amount は先頭の 0 を落とした 10 進の文字列）}
    volatility: never
    propagation_delay: 0
    recompute_trigger: [reissue]
    on_revoke: 該当なし（取引ごとの値）
    carried_in: [TXN_TOKEN, TXN_STAFF, TXN_PROXY, PAY_MSG_CTX]
    consumers: [tts, claim-svc, fraud-svc, document-svc, assessment-svc, payment-svc, as-admin-api]
    on_missing: 拒否
    enforced_at:
      - {service: tts, check: "PAY_MSG_CTX を出すのは、mTLS の相手が assessment-svc で、TXN_STAFF の operation が assessment.confirm のときだけ。作り直しでは operation が payment.instruct の PAY_MSG_CTX だけを受け、claim_id・policy_number・amount・payee_ref を変えずに写す。TXN_PROXY では call_id で通話の記録を引く", against: [api_config, data_layer]}
      - {service: claim-svc, check: "operation が、その API で受ける操作の一覧（経路の表）にあること。policy_number・amount（請求額）・claim_id が要求の本文・パスと一致すること（違えば 409 で拒否し、監査に記録する）。policy_number は契約管理の仕組みで sub の契約者・agency_code の取扱代理店の証券であること。TXN_PROXY では call_id を請求の記録に残す", against: [other_claim, api_config, data_layer]}
      - {service: fraud-svc, check: "operation が claim.submit で、policy_number・amount が判定の依頼の本文と一致すること（違えば 409）", against: [other_claim, api_config]}
      - {service: document-svc, check: "operation が document.upload（claim-svc から）か document.read（assessment-svc から）で、claim_id が要求の本文・パスの請求と一致すること（違えば 409）", against: [other_claim, api_config]}
      - {service: assessment-svc, check: "operation が、その API で受ける操作の一覧にあること。assessment.confirm では claim_id・amount・payee_ref が要求の本文と一致すること（違えば 409）", against: [other_claim, api_config]}
      - {service: payment-svc, check: "operation が、その API で受ける操作の一覧にあること。payment.instruct では claim_id・amount・payee_ref が指示の本文と一致し、payee_ref が契約管理の仕組みでその証券の振込先として登録されていること。payment.approve と payment.execute では payment_id がパスの支払いと一致し、approve では amount が支払いの記録の金額と、execute では claim_id が支払いの記録の請求と一致すること", against: [other_claim, api_config, data_layer]}
      - {service: as-admin-api, check: "operation が、その API で受ける操作の一覧にあり、target_ref が要求の本文の対象と一致すること（違えば 409）", against: [other_claim, api_config]}
    max_bytes: 320
    overflow_strategy: 発行を失敗させる
    pii_category: 個人情報
    log_policy: 記録する
    data_category: [system.operations.transaction]
    confidential_from: []
    note: >-
      証券番号・金額・振込先の参照 ID は、契約者の ID（sub）と組で個人情報になる。網の中の mTLS の上だけを通り、ブラウザ・代理店には返さない。
      生成の JSON Schema（schemas/）は tctx を object としてだけ確かめ、内側の項目は確かめない（3.1 の見送り。内側の型は TTS の発行の試験と、受け手の共通部品の tctx の型の検査で確かめる）
    status: active
    owner: しろがね損保 IT 基盤部（ID とトークン）
    change_controller: IETF（draft-ietf-oauth-transaction-tokens-11）

  - id: C-rctx
    name: rctx
    namespace: null
    registered_ref: {kind: spec, id: "draft-ietf-oauth-transaction-tokens-11 §9.2.2", url: "https://www.ietf.org/archive/id/draft-ietf-oauth-transaction-tokens-11.txt"}
    decision: 却下
    rejection_kind: 不要
    rationale: >-
      要求の環境（要求元の IP など）で判断する内側の受け手が無い。fraud-svc の不正の判定は請求の内容（tctx の値と請求の記録）で行い、
      要求元の IP の傾向は、front-gw が接続から記録したアクセスのログ（txn つき）を fraud-svc が 5 分ごとに読んで調べる。IP をトークンで運ぶと、
      読まない受け手（document-svc・assessment-svc・payment-svc）にも届く
    refs:
      - {kind: spec, id: "draft-ietf-oauth-transaction-tokens-11 §9.2.2", url: "https://www.ietf.org/archive/id/draft-ietf-oauth-transaction-tokens-11.txt"}
      - {kind: guide-slide, id: p06-access-context}
    assumption: 請求の受付の場で IP によって許可・拒否を決める要求が無い
    revisit_trigger: 請求の受付の場で、要求元の IP・端末で判定を変える要求が出たとき（そのときも、判断は front-gw か TTS で行う形から考える）

  # ------------------------------------------------------------ 組織の名前空間
  - id: C-agency-code
    name: agency_code
    namespace: "https://shirogane-sonpo.example/claims/"
    type: string
    shape: single
    description: 代理店コード。しろがねが代理店に割り当てた変わらない番号（AG と数字 6 桁）。shirogane-as が代理店の登録から AGENCY_AT に書き、TTS が登録を引き直して Txn-Token に写す
    not_meaning: 代理店の名前ではない。代理店の担当者（sub）ではない。代理店の IdP の iss でもない
    decision: 採用
    rationale: claim-svc が、代理店の担当者の請求・書類の登録を、その代理店が扱う証券だけに絞る。値は代理店の申告（assertion）からは取らず、しろがねの代理店の登録からだけ書く
    refs:
      - {kind: guide-slide, id: p04-immutable-identifiers}
      - {kind: guide-slide, id: p04-split-by-writer}
    assumption: 代理店の登録は、client_id・代理店コード・証明書のサブジェクト・代理店の IdP の iss を組で持ち、代理店管理部だけが as-admin-api で書く
    revisit_trigger: 代理店の合併・分割で代理店コードを付け替える要求が出たとき。Transaction Tokens の草案の版が変わったとき
    spec_version: [draft-ietf-oauth-transaction-tokens-11]
    usage: authz
    answers: [q-authorized]
    prior_art_search:
      searched: ["IANA JWT Claims（2026-11-27 に確認）", "RFC 9068 §2.2", "OpenID Connect Core 1.0 §5.1", "draft-ietf-oauth-transaction-tokens-11 §9.2"]
      nearest: [client_id（RFC 9068）, azp（OpenID Connect Core 1.0）]
      not_used_because: client_id はクライアントの登録の ID で、代理店が証明書を替えてクライアントを登録し直すと変わる。代理店そのものの変わらない番号を表す登録名は無い
    issuers: ["https://auth.shirogane-sonpo.example", "https://tts.shirogane-sonpo.internal"]
    authoritative_writer:
      - {stage: "②", writer: shirogane-as（代理店の登録。client_id から引く）, configurable_by: [platform]}
      - {stage: "④", writer: TTS（代理店の登録を引き直して写す）, configurable_by: [platform]}
    provenance: 管理者が設定した値
    issue_events: [I15, I22]
    source_system: shirogane-as の代理店の登録（代理店管理部が as-admin-api で書く。変更には別の社員の承認が要る）
    verification_method: 代理店の契約の書類と代理店の登録の番号を、代理店管理部が登録のときに照らす
    value_normalization: {case: upper, unicode: none, trim: true, compare: exact, normalized_by: shirogane-as（代理店の登録の値をそのまま書く）}
    allowed_values: {pattern: "^AG[0-9]{6}$"}
    volatility: 900
    propagation_delay: 390
    recompute_trigger: [reissue]
    on_revoke: 代理店の登録を止めると、shirogane-as は次の AGENCY_AT を出さず、TTS は次の発行から拒む（登録のキャッシュ 60 秒）。発行済みの Txn-Token は最大 330 秒
    carried_in: [AGENCY_AT, TXN_TOKEN]
    consumers: [tts, claim-svc]
    on_missing: 既定値
    absent_semantics: {absent: 代理店の請求ではない（契約者・社員・夜間の処理のトークン）。AGENCY_AT と、agst_ の sub の Txn-Token に無ければ、TTS・claim-svc は拒否する}
    enforced_at:
      - {service: tts, check: AGENCY_AT の agency_code が、client_id で引いた代理店の登録の代理店コードと一致し、登録が有効なこと。AGENCY_AT に agency_code が無い・一致しないときは発行しない, against: [iss, data_layer]}
      - {service: claim-svc, check: 証券の取扱代理店（契約管理の仕組みの値）が agency_code と一致する証券の請求だけを受ける。sub が agst_ なのに agency_code が無ければ拒否, against: [iss, data_layer]}
    max_bytes: 8
    overflow_strategy: 発行を失敗させる
    pii_category: 該当なし
    log_policy: 記録する
    data_category: [system.operations.agency]
    confidential_from: []
    note: configurable_by の platform は、しろがねの社内の操作を指す。値の元の代理店の登録を書けるのは代理店管理部の社員だけ（as-admin-api。変更は別の社員の承認つき、ハードウェアの鍵の認証つき）。代理店とその IdP の管理者は書けない
    status: active
    owner: しろがね損保 代理店管理部
    change_controller: しろがね損保 IT 基盤部（名前空間の持ち主）

  # ------------------------------------------------------------ 却下
  - id: C-injury
    name: injury_code
    namespace: "https://shirogane-sonpo.example/claims/"
    decision: 却下
    rejection_kind: 禁止
    rationale: 傷病・事故の内容は要配慮個人情報で、トークンに載せない（要求 REQ-08）。査定に要る受け手（assessment-svc から document-svc）が書類の保存先から読む。トークンは届く先がホップごとに広がり、ログ・キャッシュに写りやすい
    refs:
      - {kind: guide-slide, id: p09-jwe-sd-jwt}
    assumption: 査定は document-svc の書類と assessment-svc の記録だけで行い、トークンの値で傷病を判断する受け手が無い
    revisit_trigger: 傷病の区分で自動の査定をする要求が出たとき（そのときも、載せずに問い合わせる形から考える）

  - id: C-roles
    name: roles
    namespace: null
    decision: 却下
    rejection_kind: 代替あり
    alt: [C-scope]
    rationale: 社員の役割を EMPLOYEE_AT に載せると、役割を外してから AT の寿命（600 秒）と Txn-Token の寿命の分だけ古い役割が残り、要求 REQ-03（600 秒）を超える。TTS が発行のたびに社員の台帳から役割を引き、scope に替える
    refs:
      - {kind: spec, id: "RFC 7643 §4.1.2", url: "https://www.rfc-editor.org/rfc/rfc7643#section-4.1.2"}
      - {kind: guide-slide, id: p05-scope-vs-role}
    revisit_trigger: TTS が社員の台帳を引けない構成（台帳を網の外に移すなど）にするとき

  - id: C-groups
    name: groups
    namespace: null
    decision: 却下
    rejection_kind: 不要
    rationale: 部署・課のグループで認可しない。請求の担当は claim-svc の割り当ての記録で、役割は社員の台帳で決める
    assumption: 査定の担当は請求ごとの割り当てで決まり、部署では決まらない
    revisit_trigger: 部署単位で請求を見せる要求（課長が課の全請求を見るなど）が出たとき

  - id: C-amr
    name: amr
    namespace: null
    decision: 却下
    rejection_kind: 代替あり
    alt: [C-acr]
    rationale: 認証の手段の一覧（amr）を受け手ごとに解釈させず、shirogane-sso が acr の 2 つの値にまとめる。受け手は acr の値だけを比べる
    refs:
      - {kind: spec, id: "RFC 8176 §2", url: "https://www.rfc-editor.org/rfc/rfc8176#section-2"}
    revisit_trigger: 手段ごとに違う扱い（SMS の多要素を承認で拒むなど）を受け手で決める要求が出たとき

  - id: C-birthdate
    name: birthdate
    namespace: null
    decision: 却下
    rejection_kind: 不要
    rationale: 生年月日で判断する受け手が無い。年齢の確認が要る場面（未成年の契約者の請求）は、契約管理の仕組みの値で claim-svc が判断する
    refs:
      - {kind: spec, id: "OpenID Connect Core 1.0 §5.1", url: "https://openid.net/specs/openid-connect-core-1_0.html#StandardClaims"}
    revisit_trigger: ポータルで年齢によって画面を変える要求が出たとき

  - id: C-policies
    name: policy_numbers
    namespace: "https://shirogane-sonpo.example/claims/"
    decision: 却下
    rejection_kind: 代替あり
    alt: [C-tctx]
    rationale: 契約者の全証券の番号を AT に載せない。証券の数に上限が無く、解約・名義変更が寿命の間に反映されない。claim-svc が請求の 1 件ごとに、tctx の policy_number と契約管理の仕組みの値を照らす
    assumption: claim-svc は契約管理の仕組みの読み取りの API を、請求の受付のたびに呼べる
    revisit_trigger: 契約管理の仕組みの読み取りが請求の受付の遅れの主因になったとき

  - id: C-sid
    name: sid
    namespace: null
    decision: 却下
    rejection_kind: 不要
    rationale: Back-Channel Logout・Front-Channel Logout を使わない（LOGOUT_TOKEN は却下）ので、IdP のセッションの ID を受け手が読む場面が無い
    refs:
      - {kind: spec, id: "OpenID Connect Back-Channel Logout 1.0 §2.4", url: "https://openid.net/specs/openid-connect-backchannel-1_0.html#LogoutToken"}
    revisit_trigger: IdP のログアウトでポータル・社員の画面のセッションを消す要求が出たとき
