  - id: C-jti
    name: jti
    namespace: null
    registered_ref: {kind: spec, id: "RFC 7519 §4.1.7", url: "https://www.rfc-editor.org/rfc/rfc7519#section-4.1.7"}
    type: string
    shape: single
    description: トークンの一意の ID。代理店の assertion では再送の検知に、AT では front-gw の監査ログで Txn-Token の txn と結ぶのに使う
    not_meaning: 取引の ID（txn）ではない。請求の番号でもない
    decision: 採用
    rationale: >-
      代理店の assertion は 1 回だけ使わせる（RFC 7523 §3 の jti）。AT は RFC 9068 §2.2 が jti を求め、Txn-Token に作り直すと AT の jti が消えるので、
      front-gw が AT の iss・jti と Txn-Token の txn を 1 行に記録して、外の AT から内側の取引をたどれるようにする
    refs:
      - {kind: spec, id: "RFC 7523 §3", url: "https://www.rfc-editor.org/rfc/rfc7523#section-3"}
      - {kind: spec, id: "RFC 9068 §2.2", url: "https://www.rfc-editor.org/rfc/rfc9068#section-2.2"}
      - {kind: guide-slide, id: p06-audit-trail}
    assumption: shirogane-as・shirogane-sso は AT に 128 ビット以上の乱数の jti を必ず入れる。代理店の IdP は assertion ごとに別の jti を入れる（代理店連携の仕様で求める）
    revisit_trigger: 代理店の IdP が jti を出せないと分かったとき
    usage: protocol
    issuers: ["https://auth.shirogane-sonpo.example", "https://sso.shirogane-sonpo.example", "https://idp.hanamizuki-hoken.example", "https://login.kumoi-agency.example"]
    authoritative_writer: [{stage: "②", writer: 発行者（shirogane-as・shirogane-sso・代理店の IdP）, configurable_by: [platform]}]
    issue_events: [I01, I02, I15]
    source_system: 発行者の乱数の生成
    volatility: never
    propagation_delay: 0
    recompute_trigger: [reissue]
    on_revoke: 該当なし（1 枚ごとの値）
    carried_in: [PH_AT, AGENCY_ASSERTION, AGENCY_AT, EMPLOYEE_AT]
    consumers: [shirogane-as, front-gw]
    on_missing: 拒否
    enforced_at:
      - {service: shirogane-as, check: "(iss, jti) の組を exp まで（最大 90 秒）覚え、同じ組の assertion を 2 回目から拒む。確かめと記録は一意の制約つきの 1 回の書き込みで、記録先が応えなければ拒む", against: [data_layer]}
      - {service: front-gw, check: AT の iss・jti と、TTS から受けた Txn-Token の txn を監査ログの 1 行に記録する, against: [format]}
    max_bytes: 64
    overflow_strategy: 発行を失敗させる
    pii_category: 該当なし
    log_policy: 記録する
    data_category: [system.operations]
    confidential_from: []
    status: active
    owner: しろがね損保 IT 基盤部（ID とトークン）
    change_controller: IETF（RFC 7519）

  - id: C-client-id
    name: client_id
    namespace: null
    registered_ref: {kind: spec, id: "RFC 9068 §2.2", url: "https://www.rfc-editor.org/rfc/rfc9068#section-2.2"}
    type: string
    shape: single
    description: AT を求めたクライアント（claim-portal・staff-console・代理店のサーバー）の client_id
    not_meaning: 利用者ではない。代理店コードそのものではない（代理店コードは代理店の登録で引く）
    decision: 採用
    rationale: 契約者の口では claim-portal、社員の口では staff-console のクライアントが取った AT だけを受ける。代理店の口では、代理店の登録の client_id と mTLS の証明書が組であることを確かめる
    refs:
      - {kind: spec, id: "RFC 9068 §2.2", url: "https://www.rfc-editor.org/rfc/rfc9068#section-2.2"}
      - {kind: guide-slide, id: p02-delegation-client}
    assumption: shirogane-as・shirogane-sso の AT は RFC 9068 の形で、client_id を必ず入れる
    revisit_trigger: クライアントを足すとき（スマートフォンのアプリなど）
    usage: identifier
    answers: [q-agent]
    issuers: ["https://auth.shirogane-sonpo.example", "https://sso.shirogane-sonpo.example"]
    authoritative_writer: [{stage: "②", writer: shirogane-as・shirogane-sso（クライアントの登録）, configurable_by: [platform]}]
    issue_events: [I01, I02, I15]
    source_system: shirogane-as・shirogane-sso のクライアントの登録と、代理店の登録（client_id・代理店コード・証明書のサブジェクトの組。代理店管理部が as-admin-api で書く）
    volatility: never
    propagation_delay: 0
    recompute_trigger: [never]
    on_revoke: 代理店の登録を止めると、shirogane-as は次の AT を出さず、TTS は次の発行から拒む
    carried_in: [PH_AT, AGENCY_AT, EMPLOYEE_AT]
    consumers: [front-gw, tts]
    on_missing: 拒否
    enforced_at:
      - {service: front-gw, check: 契約者の口では claim-portal、社員の口では staff-console の client_id だけを受ける。代理店の口では、client_id が代理店の登録にあること, against: [iss, api_config]}
      - {service: tts, check: 代理店の登録で client_id から代理店コードを引き、登録が有効なときだけ発行する, against: [iss, data_layer]}
    identifier_properties: {stable: true, reassignable: false, pairwise: false, id_scheme: opaque}
    max_bytes: 64
    overflow_strategy: 上限で固定（超えない値域）
    pii_category: 該当なし
    log_policy: 記録する
    data_category: [system.operations]
    confidential_from: []
    status: active
    owner: しろがね損保 IT 基盤部（ID とトークン）
    change_controller: IETF（RFC 9068）

  - id: C-scope
    name: scope
    namespace: null
    registered_ref: {kind: spec, id: "RFC 8693 §4.2", url: "https://www.rfc-editor.org/rfc/rfc8693#section-4.2"}
    type: string
    shape: space_delimited
    description: >-
      操作の範囲。AT ではクライアントに委ねた範囲（口ごとの語彙）。TTS のトークンでは、TTS が経路の表と、主体の今の状態（社員なら社員の台帳の役割）から絞った、
      その取引で使ってよい範囲（AT の scope を超えない）
    not_meaning: 社員の役割そのものではない。どの請求・支払いを扱ってよいか（オブジェクト単位の可否）ではない
    decision: 採用
    rationale: 各サービスは TTS のトークンの scope で API を許すかを決める。AT の scope は、TTS が絞るときの上限としてだけ使う（役割は AT に載せず、TTS が社員の台帳から引く）
    refs:
      - {kind: spec, id: "RFC 8693 §4.2", url: "https://www.rfc-editor.org/rfc/rfc8693#section-4.2"}
      - {kind: spec, id: "draft-ietf-oauth-transaction-tokens-11 §9.2.1", url: "https://www.ietf.org/archive/id/draft-ietf-oauth-transaction-tokens-11.txt"}
      - {kind: guide-slide, id: p05-scope-vs-role}
    assumption: TTS の経路の表（口・HTTP のメソッド・パスごとの scope と、役割ごとに許す scope）が、各サービスの API と同じ版で配られる
    revisit_trigger: scope の語彙を足すとき。経路の表とサービスの版がずれたとき
    spec_version: [draft-ietf-oauth-transaction-tokens-11]
    usage: authz
    answers: [q-authorized]
    value_vocabulary:
      values: [claims:submit, claims:read, documents:upload, documents:read-sensitive, assessments:read, assessments:write, payments:instruct, payments:approve, payments:execute, admin:agency, admin:account]
      owner: しろがね損保 IT 基盤部（ID とトークン）
      extensible: false
    issuers: ["https://auth.shirogane-sonpo.example", "https://sso.shirogane-sonpo.example", "https://tts.shirogane-sonpo.internal"]
    authoritative_writer:
      - {stage: "②", writer: shirogane-as・shirogane-sso（クライアントが求めた範囲。クライアントの登録の範囲を超えない）, configurable_by: [platform]}
      - {stage: "④", writer: TTS（経路の表と、社員の台帳の役割・代理店の登録・通話の記録で絞る）, configurable_by: [platform]}
    issue_events: [I01, I02, I15, I22]
    source_system: クライアントの登録（AT）、TTS の経路の表と社員の台帳の役割（人事部が人事の仕組みで書く）（Txn-Token）
    volatility: 600
    propagation_delay: 390
    recompute_trigger: [reissue]
    on_revoke: 社員の役割を外すと、TTS の次の発行から外した範囲を出さない（台帳のキャッシュ 60 秒）。発行済みの Txn-Token は最大 330 秒で切れる
    carried_in: [PH_AT, AGENCY_AT, EMPLOYEE_AT, TXN_TOKEN, TXN_STAFF, TXN_PROXY, PAY_MSG_CTX]
    consumers: [front-gw, tts, claim-svc, fraud-svc, document-svc, assessment-svc, payment-svc, as-admin-api]
    on_missing: 拒否
    enforced_at:
      - {service: front-gw, check: 口ごとの語彙に無い値だけの AT は TTS に送らずに拒む, against: [api_config]}
      - {service: tts, check: 経路の表が求める scope が、AT の scope と主体の今の役割から許される範囲にあるときだけ、その範囲に絞って出す。広げない, against: [api_config, data_layer]}
      - {service: claim-svc, check: API ごとに必要な scope がなければ 403, against: [api_config]}
      - {service: fraud-svc, check: claims:submit があること（判定は請求の受付の中でだけ呼ばれる）, against: [api_config]}
      - {service: document-svc, check: 登録は documents:upload、要配慮の書類の閲覧は documents:read-sensitive がなければ 403, against: [api_config]}
      - {service: assessment-svc, check: API ごとに必要な scope がなければ 403, against: [api_config]}
      - {service: payment-svc, check: 指示は payments:instruct、承認は payments:approve、実行は payments:execute がなければ 403, against: [api_config]}
      - {service: as-admin-api, check: 代理店の登録の変更は admin:agency、契約者のアカウントの停止は admin:account がなければ 403, against: [api_config]}
    max_bytes: 200
    max_items: 11
    overflow_strategy: 発行を失敗させる
    pii_category: 該当なし
    log_policy: 記録する
    data_category: [system.operations]
    confidential_from: []
    note: >-
      configurable_by の platform は、しろがねの社内の部署の操作を指す。経路の表を変えられるのは IT 基盤部（変更の手続き）、
      役割（つまり TTS が出す scope）を付けられるのは人事部（人事の仕組みの入力と責任者の承認）だけで、社員本人・コールセンター・代理店・契約者は付けられない。
      代理店の担当者の scope は代理店の登録の範囲で決まり、代理店の IdP の管理者は変えられない
    status: active
    owner: しろがね損保 IT 基盤部（ID とトークン）
    change_controller: IETF（RFC 8693）

  - id: C-cnf
    name: cnf
    namespace: null
    registered_ref: {kind: spec, id: "RFC 8705 §3.1", url: "https://www.rfc-editor.org/rfc/rfc8705#section-3.1"}
    type: object
    shape: single
    description: 代理店の AT を、代理店のサーバーの mTLS の証明書に束縛する値。x5t#S256（証明書の SHA-256 の拇印）だけを入れる
    not_meaning: 代理店そのもの（代理店コード）ではない。証明書の有効性（失効）ではない
    decision: 採用
    rationale: 代理店の AT はしろがねの網の外（代理店のサーバー）に置かれるので、漏れた AT を別の者が使えないよう、証明書に束縛する（RFC 8705）
    refs:
      - {kind: spec, id: "RFC 8705 §3.1", url: "https://www.rfc-editor.org/rfc/rfc8705#section-3.1"}
      - {kind: spec, id: "RFC 7800 §3.1", url: "https://www.rfc-editor.org/rfc/rfc7800#section-3.1"}
    assumption: 代理店のサーバーの証明書は、しろがねの代理店向けの CA が出し、代理店のサーバーだけが秘密鍵を持つ
    revisit_trigger: 代理店が証明書を扱えないと分かったとき。DPoP に替える要求が出たとき
    usage: protocol
    answers: [q-holder]
    issuers: ["https://auth.shirogane-sonpo.example"]
    authoritative_writer: [{stage: "②", writer: shirogane-as（トークンの要求の mTLS の証明書の拇印）, configurable_by: [platform]}]
    issue_events: [I15, I29]
    source_system: トークンの要求の TLS の接続で示されたクライアント証明書
    volatility: never
    propagation_delay: 0
    recompute_trigger: [reissue]
    on_revoke: 証明書を失効させると、front-gw の TLS の終端が接続を拒む（CRL を 300 秒ごとに取り直す）
    carried_in: [AGENCY_AT]
    consumers: [front-gw, tts]
    on_missing: 拒否
    enforced_at:
      - {service: front-gw, check: "代理店の口の TLS で示された証明書の SHA-256 の拇印が cnf の x5t#S256 と一致すること（RFC 8705 §3）。一致しなければ 401", against: [other_claim, format]}
      - {service: tts, check: front-gw が要求に書いた証明書の拇印と cnf の x5t#S256 が一致すること（front-gw の取り違えを拾う。確かめの主は front-gw）, against: [other_claim]}
    max_bytes: 64
    overflow_strategy: 上限で固定（超えない値域）
    pii_category: 該当なし
    log_policy: 記録する
    data_category: [system.operations]
    confidential_from: []
    status: active
    owner: しろがね損保 IT 基盤部（ID とトークン）
    change_controller: IETF（RFC 8705）

  - id: C-acr
    name: acr
    namespace: null
    registered_ref: {kind: spec, id: "OpenID Connect Core 1.0 §2", url: "https://openid.net/specs/openid-connect-core-1_0.html#IDToken"}
    type: string
    shape: single
    description: 社員の認証の強さ。shirogane-sso が、ハードウェアの鍵での認証なら urn:shirogane-sonpo:acr:phr、ほかの多要素なら urn:shirogane-sonpo:acr:mfa を書く。TTS は EMPLOYEE_AT の値を TXN_STAFF に写す
    not_meaning: 社員の役割・承認の権限ではない。いつ認証したか（auth_time）ではない
    decision: 採用
    rationale: 100 万円以上の支払いの承認と、代理店の登録・契約者のアカウントの停止は、フィッシングに強い認証を求める。確かめるのは操作を受ける payment-svc と as-admin-api で、staff-console の画面ではない
    refs:
      - {kind: spec, id: "OpenID Connect Core 1.0 §2", url: "https://openid.net/specs/openid-connect-core-1_0.html#IDToken"}
      - {kind: spec, id: "RFC 9470 §3", url: "https://www.rfc-editor.org/rfc/rfc9470#section-3"}
      - {kind: guide-slide, id: p06-step-up-approval}
