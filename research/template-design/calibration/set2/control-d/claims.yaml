# template_version: 0.3.0
# 測定の対照に使う教材。設計に使わない
# yaml-language-server: $schema=../../../../../templates/registry/claims.schema.json
# 台帳（templates/registry/README.md の 3.1）。しろがね損保（保険金の請求と支払いの内部処理）の設計書
scenario: しろがね損保（架空の損害保険会社。入口で外の AT を Txn-Token に替え、保険金の請求・査定・支払いの内部のサービスに伝搬する）
namespaces:
  - namespace: "https://shirogane-sonpo.example/claims/"
    style: flat_prefix
    owner: しろがね損保 IT 基盤部（ID とトークン）
    assignment: この台帳への登録（PR）でだけ名前を割り当てる。shirogane-as と TTS が書く名前は、ここに行があるものだけ
data_category_vocabulary:
  name: fideslang
  version: 3.1.4
  url: https://github.com/ethyca/fideslang/blob/3.1.4/data_files/data_categories.csv
  license: CC-BY-4.0
  verified_on: '2026-11-27'
data_category_extensions:
  - {key: system.operations.agency, parent: system.operations, description: 提携の代理店の変わらない番号（代理店コード）, owner: しろがね損保 代理店管理部}
  - {key: system.operations.transaction, parent: system.operations, description: 1 つの取引（請求・査定・支払い）の内容, owner: しろがね損保 IT 基盤部（ID とトークン）}
claims:
  # ------------------------------------------------------------ 登録名（外の発行者のトークンと TTS のトークンに共通）
  - id: C-iss
    name: iss
    namespace: null
    registered_ref: {kind: spec, id: "RFC 7519 §4.1.1", url: "https://www.rfc-editor.org/rfc/rfc7519#section-4.1.1"}
    type: string
    shape: single
    description: >-
      トークンの発行者。契約者と代理店の AT・ID トークンでは shirogane-as、社員の AT・ID トークンでは shirogane-sso、
      Txn-Token とメッセージの文脈では TTS、代理店の assertion では代理店の IdP
    not_meaning: 契約者・代理店・社員の区別そのものではない（区別は種別と aud と sub の形）。代理店の IdP の iss は、しろがねの API の発行者ではない
    decision: 採用
    rationale: 受け手は種別ごとに許す発行者を決め、ほかの発行者のトークンを受けない。代理店の IdP の iss を受けるのは shirogane-as の assertion の検証だけ
    refs:
      - {kind: spec, id: "RFC 7519 §4.1.1", url: "https://www.rfc-editor.org/rfc/rfc7519#section-4.1.1"}
      - {kind: guide-slide, id: p04-single-issuer}
    assumption: 代理店の IdP は代理店ごとに 1 つで、代理店の登録に iss と JWKS の URL を書く
    revisit_trigger: 代理店が IdP を替えるとき。発行者を足すとき
    spec_version: [draft-ietf-oauth-transaction-tokens-11]
    usage: protocol
    issuers: ["https://auth.shirogane-sonpo.example", "https://sso.shirogane-sonpo.example", "https://tts.shirogane-sonpo.internal", "https://idp.hanamizuki-hoken.example", "https://login.kumoi-agency.example"]
    authoritative_writer: [{stage: "②", writer: 発行者（shirogane-as・shirogane-sso・TTS・代理店の IdP）, configurable_by: [platform]}]
    issue_events: [I01, I02, I15, I22]
    source_system: 発行者の設定
    volatility: never
    propagation_delay: 0
    recompute_trigger: [never]
    on_revoke: 該当なし（発行者を替えるときは、受け手の許可の設定を先に足す）
    carried_in: [PH_AT, PH_ID_TOKEN, AGENCY_ASSERTION, AGENCY_AT, EMPLOYEE_AT, STAFF_ID_TOKEN, TXN_TOKEN, TXN_STAFF, TXN_PROXY, PAY_MSG_CTX]
    consumers: [claim-portal, staff-console, shirogane-as, front-gw, tts, claim-svc, fraud-svc, document-svc, assessment-svc, payment-svc, as-admin-api]
    on_missing: 拒否
    enforced_at:
      - {service: claim-portal, check: PH_ID_TOKEN の iss が shirogane-as と完全一致すること, against: [api_config]}
      - {service: staff-console, check: STAFF_ID_TOKEN の iss が shirogane-sso と完全一致すること, against: [api_config]}
      - {service: shirogane-as, check: AGENCY_ASSERTION の iss が代理店の登録にある iss のどれかと完全一致し、その登録の JWKS の鍵で署名を確かめること, against: [api_config, data_layer]}
      - {service: front-gw, check: 口ごとに 1 つの発行者だけを受ける（契約者と代理店の口は shirogane-as、社員の口は shirogane-sso）, against: [api_config]}
      - {service: tts, check: subject_token の iss が口の発行者と一致すること。PAY_MSG_CTX は TTS 自身の iss だけ, against: [api_config]}
      - {service: claim-svc, check: 共通の検証部品が TTS の iss だけを受ける, against: [api_config]}
      - {service: fraud-svc, check: 共通の検証部品が TTS の iss だけを受ける, against: [api_config]}
      - {service: document-svc, check: 共通の検証部品が TTS の iss だけを受ける, against: [api_config]}
      - {service: assessment-svc, check: 共通の検証部品が TTS の iss だけを受ける, against: [api_config]}
      - {service: payment-svc, check: 共通の検証部品が TTS の iss だけを受ける, against: [api_config]}
      - {service: as-admin-api, check: 共通の検証部品が TTS の iss だけを受ける, against: [api_config]}
    max_bytes: 40
    overflow_strategy: 上限で固定（超えない値域）
    pii_category: 該当なし
    log_policy: 記録する
    data_category: [system.operations]
    confidential_from: []
    status: active
    owner: しろがね損保 IT 基盤部（ID とトークン）
    change_controller: IETF（RFC 7519）

  - id: C-sub
    name: sub
    namespace: null
    registered_ref: {kind: spec, id: "RFC 7519 §4.1.2", url: "https://www.rfc-editor.org/rfc/rfc7519#section-4.1.2"}
    type: string
    shape: single
    description: >-
      トークンの主体。shirogane-as の AT・ID トークンでは契約者の ID（ph_ で始まる）か代理店の担当者の ID（agst_ で始まる）、
      shirogane-sso のトークンでは社員の ID（stf_ で始まる）、代理店の assertion では代理店の IdP の担当者の ID。
      TTS のトークンでは TTS が決めた主体（契約者・代理店の担当者・社員の ID、または夜間の支払いの処理のワークロードの SPIFFE ID）。
      TXN_PROXY では、電話で本人確認した契約者
    not_meaning: メールアドレス・氏名・証券番号ではない。代理して操作する社員（act）ではない。代理店の IdP の担当者の ID は、しろがねの中では使わない（shirogane-as が agst_ の ID に替える）
    decision: 採用
    rationale: 誰の権限で動くかと、監査・持ち主の照合のキー。代理店の担当者の ID は代理店の IdP の値のまま使わず、(代理店の IdP の iss, sub) の組から shirogane-as が割り当てた ID にする（代理店をまたいで同じ文字列があっても混ざらない）
    refs:
      - {kind: spec, id: "RFC 7519 §4.1.2", url: "https://www.rfc-editor.org/rfc/rfc7519#section-4.1.2"}
      - {kind: spec, id: "RFC 7523 §3", url: "https://www.rfc-editor.org/rfc/rfc7523#section-3"}
      - {kind: guide-slide, id: p02-user-identifier}
    assumption: 契約者の ID と社員の ID は、それぞれ shirogane-as の利用者の台帳と社員の台帳の変わらない ID から作り、再利用しない
    revisit_trigger: 契約者のアカウントの統合（同じ人の 2 つのアカウントを 1 つにする）を始めるとき。代理店の担当者を代理店をまたいで同じ人として扱う要求が出たとき
    spec_version: [draft-ietf-oauth-transaction-tokens-11]
    usage: identifier
    answers: [q-sub, q-user]
    does_not_answer: [q-actor, q-peer]
    issuers: ["https://auth.shirogane-sonpo.example", "https://sso.shirogane-sonpo.example", "https://tts.shirogane-sonpo.internal", "https://idp.hanamizuki-hoken.example", "https://login.kumoi-agency.example"]
    upstream_issuer:
      iss: ["https://idp.hanamizuki-hoken.example", "https://login.kumoi-agency.example"]
      source_attribute: AGENCY_ASSERTION の sub（代理店の IdP の担当者の ID）
      normalization: shirogane-as が (assertion の iss, sub) の組で代理店の担当者の表を引き、agst_ の ID に替える。表に無い組は、その代理店の登録が有効なときだけ新しい ID を割り当てる。sub の文字列だけ・メールでは引かない。代理店が同じ sub を別の担当者に付け替えると、しろがねでは見分けられない（同じ agst_ の ID になる。設計書の 3.1 の見送り）
    authoritative_writer:
      - {stage: "①", writer: 代理店の IdP（代理店の担当者の ID。代理店が自分の担当者を管理する）, configurable_by: [client]}
      - {stage: "②", writer: shirogane-as（契約者の台帳・代理店の担当者の表）と shirogane-sso（社員の台帳）, configurable_by: [platform]}
      - {stage: "④", writer: TTS（検証したトークン・通話の記録・ワークロードの ID から決める）, configurable_by: [platform]}
    issue_events: [I01, I02, I15, I22]
    source_system: shirogane-as の契約者の台帳と代理店の担当者の表、社員の台帳（人事部。shirogane-sso が読む）、IVR の通話の記録（TXN_PROXY の契約者）
    verification_method: TTS が外の AT を検証し、契約者・代理店・社員の状態を引いてから sub を書く。TXN_PROXY では、通話の記録の本人確認の結果の契約者を書く（社員の申告を書かない）
    volatility: never
    propagation_delay: 0
    recompute_trigger: [reissue]
    on_revoke: 契約者・代理店・社員を止めると、TTS の次の発行から拒む（状態のキャッシュは 60 秒まで）
    carried_in: [PH_AT, PH_ID_TOKEN, AGENCY_ASSERTION, AGENCY_AT, EMPLOYEE_AT, STAFF_ID_TOKEN, TXN_TOKEN, TXN_STAFF, TXN_PROXY, PAY_MSG_CTX]
    consumers: [claim-portal, staff-console, shirogane-as, tts, claim-svc, fraud-svc, document-svc, assessment-svc, payment-svc, as-admin-api]
    on_missing: 拒否
    enforced_at:
      - {service: claim-portal, check: PH_ID_TOKEN の sub をセッションの持ち主として記録する。セッションの間に sub が変われば拒否する, against: [other_claim], with: C-iss}
      - {service: staff-console, check: STAFF_ID_TOKEN の sub をセッションの持ち主として記録する, against: [other_claim], with: C-iss}
      - {service: shirogane-as, check: "AGENCY_ASSERTION の (iss, sub) の組で代理店の担当者の表を引く。代理店の登録が止まっていれば拒否", against: [iss, data_layer]}
      - {service: tts, check: "PH_AT は契約者の台帳、AGENCY_AT は代理店の担当者の表、EMPLOYEE_AT は社員の台帳で sub を引き、有効なときだけ発行する。TXN_PROXY の sub は通話の記録の契約者", against: [iss, data_layer]}
      - {service: claim-svc, check: 請求の持ち主を引き、ph_ の sub はその契約者の証券の請求だけ、agst_ の sub は代理店コードの扱う証券だけを受ける。stf_ の sub は assessment-svc からの査定の経路だけ、ワークロードの sub は payment-svc からの保留の読み取りだけを受ける（TTS の保留の参照はトークンを使わず、TTS の SPIFFE ID だけで受ける）。請求の記録に sub を残す, against: [data_layer, api_config]}
      - {service: fraud-svc, check: 判定の記録に sub を残す, against: [data_layer]}
      - {service: document-svc, check: 書類の登録・閲覧の記録に sub を残す, against: [data_layer]}
      - {service: assessment-svc, check: 査定の操作は、sub が請求に割り当てた査定担当者であること（請求の割り当てを claim-svc で引く）。割り当ての変更（operation が assessment.assign）は、TTS が上長の役割のときだけ出す, against: [data_layer]}
      - {service: payment-svc, check: "支払いの指示の sub（査定担当者）と承認の sub（上長）が同じなら承認を拒む。sub がワークロードの ID のときは payment-batch の ID だけを受ける", against: [data_layer, api_config]}
      - {service: as-admin-api, check: 操作の記録に sub を残す, against: [data_layer]}
    identifier_properties: {stable: true, reassignable: false, pairwise: false, id_scheme: other}
    max_bytes: 96
    overflow_strategy: 上限で固定（超えない値域）
    pii_category: 個人情報
    log_policy: ハッシュ化して記録
    data_category: [user.unique_id]
    confidential_from: []
    integrity_until:
      - {place: log, target: 各サービスの監査ログ（sub の HMAC。鍵は監査ログの基盤だけが持つ）, trust_boundary: 監査ログの保存先（読めるのは監査部とセキュリティの担当だけ）}
    note: 人の ID は不透明な値（ph_・agst_・stf_ と 26 文字）、payment-batch の sub は SPIFFE ID（URL の形）なので、id_scheme は other。しろがねは ph_・agst_・stf_ のどれも付け替えない（reassignable を false としたのは、しろがねの割り当ての性質）。ただし agst_ は上流の (代理店の IdP の iss, sub) から引くので、代理店が上流の sub を別の担当者に付け替えると、同じ agst_ の ID が別の人を指しうる。これは上流の識別子の性質で、しろがねでは見分けられない（設計書の 3.1 の見送り。代理店連携の仕様で禁じ、四半期ごとに突き合わせる）。受け手は接頭辞と形で主体の種類を見分け、SPIFFE ID の sub は payment-svc・claim-svc の決めた経路だけで受ける
    status: active
    owner: しろがね損保 IT 基盤部（ID とトークン）
    change_controller: IETF（RFC 7519）

  - id: C-aud
    name: aud
    namespace: null
    registered_ref: {kind: spec, id: "RFC 7519 §4.1.3", url: "https://www.rfc-editor.org/rfc/rfc7519#section-4.1.3"}
    type: string
    shape: array
    description: >-
      トークンの宛先。AT では口ごとの API の識別子（契約者・代理店・社員で別）、ID トークンではクライアントの ID、
      代理店の assertion では shirogane-as のトークンの端点、TTS のトークンでは信頼ドメイン（shirogane-sonpo.internal）。どの種別でも値は 1 つ
    not_meaning: 宛先のサービスが操作を許したという意味ではない（操作の範囲は scope と tctx）
    decision: 採用
    rationale: 契約者・代理店・社員の AT を宛先で分け、別の口に出された AT を受けない。AT には userinfo を宛先に入れない（claim-portal・staff-console は UserInfo を呼ばない）ので、値は 1 つ
    refs:
      - {kind: spec, id: "RFC 7519 §4.1.3", url: "https://www.rfc-editor.org/rfc/rfc7519#section-4.1.3"}
      - {kind: spec, id: "draft-ietf-oauth-transaction-tokens-11 §9.2", url: "https://www.ietf.org/archive/id/draft-ietf-oauth-transaction-tokens-11.txt"}
    assumption: shirogane-as・shirogane-sso は、クライアントが求めた resource（RFC 8707）を 1 つだけ aud にし、登録の無い値を出さない
    revisit_trigger: 口を足すとき。1 つの AT で 2 つの口を呼ぶ要求が出たとき
    spec_version: [draft-ietf-oauth-transaction-tokens-11]
    usage: protocol
    answers: [q-resource]
    issuers: ["https://auth.shirogane-sonpo.example", "https://sso.shirogane-sonpo.example", "https://tts.shirogane-sonpo.internal", "https://idp.hanamizuki-hoken.example", "https://login.kumoi-agency.example"]
    authoritative_writer: [{stage: "②", writer: 発行者（shirogane-as・shirogane-sso は要求の resource、TTS は信頼ドメイン、代理店の IdP は shirogane-as のトークンの端点）, configurable_by: [platform]}]
    issue_events: [I01, I02, I15, I22]
    source_system: shirogane-as・shirogane-sso の API の登録と TTS の設定
    volatility: never
    propagation_delay: 0
    recompute_trigger: [never]
    on_revoke: 該当なし
    carried_in: [PH_AT, PH_ID_TOKEN, AGENCY_ASSERTION, AGENCY_AT, EMPLOYEE_AT, STAFF_ID_TOKEN, TXN_TOKEN, TXN_STAFF, TXN_PROXY, PAY_MSG_CTX]
    consumers: [claim-portal, staff-console, shirogane-as, front-gw, tts, claim-svc, fraud-svc, document-svc, assessment-svc, payment-svc, as-admin-api]
    on_missing: 拒否
    enforced_at:
      - {service: claim-portal, check: PH_ID_TOKEN の aud が自分の client_id だけであること, against: [api_config]}
      - {service: staff-console, check: STAFF_ID_TOKEN の aud が自分の client_id だけであること, against: [api_config]}
      - {service: shirogane-as, check: AGENCY_ASSERTION の aud が自分のトークンの端点であること, against: [api_config]}
      - {service: front-gw, check: 契約者の口は https://portal-api.shirogane-sonpo.example、代理店の口は https://agency-api.shirogane-sonpo.example、社員の口は https://staff-api.shirogane-sonpo.example だけを受ける（口ごとに 1 つ）, against: [api_config]}
      - {service: tts, check: subject_token の aud が、front-gw が要求に書いた口と一致すること, against: [api_config]}
      - {service: claim-svc, check: aud が shirogane-sonpo.internal だけであること, against: [api_config]}
      - {service: fraud-svc, check: aud が shirogane-sonpo.internal だけであること, against: [api_config]}
      - {service: document-svc, check: aud が shirogane-sonpo.internal だけであること, against: [api_config]}
      - {service: assessment-svc, check: aud が shirogane-sonpo.internal だけであること, against: [api_config]}
      - {service: payment-svc, check: aud が shirogane-sonpo.internal だけであること, against: [api_config]}
      - {service: as-admin-api, check: aud が shirogane-sonpo.internal だけであること, against: [api_config]}
    max_bytes: 48
    max_items: 1
    overflow_strategy: 発行を失敗させる
    pii_category: 該当なし
    log_policy: 記録する
    data_category: [system.operations]
    confidential_from: []
    note: 文字列 1 つで届いた aud は 1 要素の配列として読む（RFC 7519 §4.1.3）。2 つ以上の値の aud は、どの受け手も拒む
    status: active
    owner: しろがね損保 IT 基盤部（ID とトークン）
    change_controller: IETF（RFC 7519）

  - id: C-exp
    name: exp
    namespace: null
    registered_ref: {kind: spec, id: "RFC 7519 §4.1.4", url: "https://www.rfc-editor.org/rfc/rfc7519#section-4.1.4"}
    type: integer
    shape: single
    description: トークンの期限
    not_meaning: セッション・契約・本人確認の期限ではない（通話の本人確認の期限は通話の記録が持つ）
    decision: 採用
    rationale: 受け手は期限を過ぎたトークンを受けない。非同期の処理でも同じ（期限の切れた Txn-Token をメッセージに持ち越さず、PAY_MSG_CTX から作り直す）
    refs:
      - {kind: spec, id: "RFC 7519 §4.1.4", url: "https://www.rfc-editor.org/rfc/rfc7519#section-4.1.4"}
      - {kind: spec, id: "draft-ietf-oauth-transaction-tokens-11 §13.15", url: "https://www.ietf.org/archive/id/draft-ietf-oauth-transaction-tokens-11.txt"}
    assumption: しろがねのサーバーの時計は NTP で 1 秒以内にそろう。代理店の IdP の時計のずれは 30 秒までを許す
    revisit_trigger: 時計のずれの監視で 30 秒を超えたとき
    spec_version: [draft-ietf-oauth-transaction-tokens-11]
    usage: protocol
    issuers: ["https://auth.shirogane-sonpo.example", "https://sso.shirogane-sonpo.example", "https://tts.shirogane-sonpo.internal", "https://idp.hanamizuki-hoken.example", "https://login.kumoi-agency.example"]
    authoritative_writer: [{stage: "②", writer: 発行者, configurable_by: [platform]}]
    issue_events: [I01, I02, I15, I22]
    source_system: 発行者の時計と寿命の設定
    volatility: never
    propagation_delay: 0
    recompute_trigger: [never]
    on_revoke: 該当なし
