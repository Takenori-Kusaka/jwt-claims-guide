# template_version: 0.3.0
# 意図的に誤りを含む教材。設計に使わない
# yaml-language-server: $schema=../../../../templates/registry/hops.schema.json
# ホップごとの宣言（templates/registry/README.md の 3.4）。はこぶねの設計書
# TTS が Txn-Token を出すホップ（H6・H7・H8・H19・H20）は upstream を置かない。Txn-Token の aud は信頼ドメイン（草案 §9.2）で、外の AT の aud（API の口）と
# 集合で比べられないため。外の AT から何を受け継ぐかは、TTS の入口のホップ（H4・H5・H18）の validates と、設計書の 8. に書いた
hops:
  - id: H1
    from: ブラウザ（荷主の利用者）
    to: web-bff
    kind: browser
    token_type: BFF_SESSION
    aud: []
    scope: []
    max_lifetime: 28800
    custom_claims: []
    exchanger: null
    validates: {mode: local, checks: [セッションの Cookie（__Host-、Secure・HttpOnly・SameSite=Lax）, 無操作 1800 秒・最大 28800 秒, 書き込みの要求は CSRF のトークンも確かめる]}
  - id: H2
    from: web-bff
    to: edge-gw
    kind: entry
    upstream: H1
    token_type: AUTH0_AT
    aud: ["https://api.hakobune.example"]
    scope: [shipments:read, shipments:write, inventory:read, inventory:write, billing:read, billing:admin, reports:read]
    max_lifetime: 600
    custom_claims: [C-org-roles, C-entra]
    exchanger: null
    validates: {mode: local, checks: ["署名（RS256、Auth0 の JWKS）・typ が at+jwt・iss・aud が https://api.hakobune.example・exp", client_id が web-bff であること, 検証した AT を TTS への要求の subject_token にだけ使い、内側のサービスに渡さない]}
  - id: H3
    from: 運送会社のサーバー
    to: edge-gw
    kind: entry
    token_type: PARTNER_AT
    aud: ["https://partner-api.hakobune.example"]
    scope: [carrier:status, carrier:arrival]
    max_lifetime: 600
    custom_claims: []
    exchanger: null
    validates: {mode: local, checks: ["署名・typ が at+jwt・iss・aud が https://partner-api.hakobune.example・exp", 検証した AT を TTS への要求の subject_token にだけ使い、内側のサービスに渡さない]}
  - id: H4
    from: edge-gw
    to: tts
    kind: entry
    upstream: H2
    token_type: AUTH0_AT
    aud: ["https://api.hakobune.example"]
    scope: [shipments:read, shipments:write, inventory:read, inventory:write, billing:read, billing:admin, reports:read]
    max_lifetime: 600
    custom_claims: [C-org-roles, C-entra]
    exchanger: null
    validates:
      mode: local
      checks:
        - edge-gw を mTLS の相手の SPIFFE ID で認証する（Txn-Token を求めてよいワークロードの一覧）
        - subject_token の AT を TTS も検証する（署名・typ・iss・aud・exp）
        - org_id でテナントの台帳を引いてテナント ID を決める。(iss, sub) で利用者を引き、org_id でメンバーが有効なこと
        - Entra の連携の利用者は、entra の mail のドメインが、その荷主に登録したドメインと一致すること
        - org_roles と entra の groups のロールの名前（admin・shipper・viewer）を、はこぶねのロールに替える
  - id: H5
    from: edge-gw
    to: shipment-svc
    kind: service
    upstream: H3
    token_type: PARTNER_AT
    aud: ["https://partner-api.hakobune.example"]
    scope: [carrier:status]
    max_lifetime: 600
    custom_claims: []
    exchanger: null
    validates:
      mode: local
      checks:
        - edge-gw は検証した PARTNER_AT をそのまま shipment-svc に渡す（運送会社の呼び出しは単純で回数が多いので、TTS を通さない）
        - shipment-svc が PARTNER_AT を自分で検証する（署名・typ が at+jwt・iss・aud が https://partner-api.hakobune.example・exp）
        - client_id で運送会社の登録を引き、要求の荷物の割り当てからテナントを決める
  - id: H21
    from: edge-gw
    to: warehouse-svc
    kind: service
    upstream: H3
    token_type: PARTNER_AT
    aud: ["https://partner-api.hakobune.example"]
    scope: [carrier:arrival]
    max_lifetime: 600
    custom_claims: []
    exchanger: null
    validates:
      mode: local
      checks:
        - edge-gw は検証した PARTNER_AT をそのまま warehouse-svc に渡す
        - warehouse-svc が PARTNER_AT を自分で検証する（署名・typ・iss・aud・exp）
        - client_id で運送会社の登録を引き、入荷の連絡の荷物の割り当てからテナントを決める
  - id: H6
    from: edge-gw
    to: shipment-svc
    kind: exchange
    token_type: TXN_TOKEN
    aud: [hakobune.internal]
    scope: [shipments:read, shipments:write, billing:read, labels:write]
    max_lifetime: 300
    custom_claims: [C-tenant-id]
    exchanger: tts
    validates:
      mode: local
      checks:
        - req_wl が edge-gw か label-svc であること（受け付ける呼び出し元の一覧。メッシュの mTLS は通信を暗号化する）
        - Txn-Token ヘッダーの値だけを Txn-Token として読む（Authorization ヘッダーは読まない）
        - 共通の検証部品で typ が txntoken+jwt・iss・aud・exp・必須のクレーム
        - tctx の operation・shipment_id・quantity・declared_value を要求の本文と照合する
        - テナント ID を保存データのテナントと照合する
    note: TTS に Txn-Token を求めるのは edge-gw。TTS が落ちているときは、edge-gw が検証した AT の値を X-Tenant-Id・X-User-Id のヘッダーに書いて送る（縮退の運転）
  - id: H7
    from: edge-gw
    to: warehouse-svc
    kind: exchange
    token_type: TXN_TOKEN
    aud: [hakobune.internal]
    scope: [inventory:read, inventory:write]
    max_lifetime: 300
    custom_claims: [C-tenant-id]
    exchanger: tts
    validates:
      mode: local
      checks:
        - req_wl が edge-gw か shipment-svc であること
        - Txn-Token ヘッダーだけを読む。共通の検証部品で typ・iss・aud・exp
        - 引き当ての個数は要求の本文の quantity を使う（個数は shipment-svc が入口の値と照合している）
        - テナント ID を在庫・入荷の記録のテナントと照合する
  - id: H8
    from: edge-gw
    to: report-svc
    kind: exchange
    token_type: TXN_TOKEN
    aud: [hakobune.internal]
    scope: [reports:read]
    max_lifetime: 300
    custom_claims: [C-tenant-id]
    exchanger: tts
    validates:
      mode: local
      checks:
        - req_wl が edge-gw であること
        - Txn-Token ヘッダーだけを読む。共通の検証部品で typ・iss・aud・exp
        - テナント ID を問い合わせの引数 tenant_id に入れる
  - id: H9
    from: shipment-svc
    to: warehouse-svc
    kind: exchange
    upstream: H6
    token_type: TXN_TOKEN
    aud: [hakobune.internal]
    scope: [shipments:read, shipments:write, billing:read, labels:write]
    max_lifetime: 300
    custom_claims: [C-tenant-id]
    exchanger: tts
    validates:
      mode: local
      checks:
        - shipment-svc は受けた Txn-Token を subject_token にして TTS に作り直しを求め、req_wl が shipment-svc の Txn-Token を渡す
        - warehouse-svc は req_wl が shipment-svc であることを確かめる（直前の呼び出し元）
        - warehouse-svc は要求の本文の shipment_id・quantity で引き当てる
  - id: H10
    from: shipment-svc
    to: billing-svc
    kind: service
    token_type: SVC_AT
    aud: ["https://billing.hakobune.internal"]
    scope: [billing:write]
    max_lifetime: 600
    custom_claims: []
    exchanger: null
    validates:
      mode: local
      checks:
        - shipment-svc は自分の client credentials で取った SVC_AT（scope は billing:write。テナントを限らない）で請求を書く。利用者の Txn-Token は渡さない
        - billing-svc は SVC_AT を検証し（署名・typ・iss・aud・exp）、client_id が shipment-svc であることを確かめる
        - 請求の記録のテナントは要求の本文の tenant_id で決める
    note: 請求は出荷の処理の結果なので、利用者の scope に縛られずに shipment-svc の権限で書く
  - id: H11
    from: shipment-svc
    to: ブローカー（label-jobs のキュー）
    kind: broker_connection
    upstream: H6
    token_type: TXN_TOKEN
    aud: [hakobune.internal]
    scope: [labels:write]
    max_lifetime: 300
    custom_claims: [C-tenant-id]
    exchanger: tts
    connection_max_lifetime: 3600
    validates:
      mode: none
      checks:
        - shipment-svc は TTS で作り直した TXN_TOKEN（req_wl は shipment-svc、scope は labels:write）をメッセージに入れる
        - ブローカーへの接続は shipment-svc の X.509-SVID の mTLS。ブローカーはトークンを読まない
    note: メッセージの本文は txn・荷物の ID・テナント ID・TXN_TOKEN。利用者の氏名・メールは入れない。ラベルの作成は混む時間に後回しにするので、取り出すまで最大 6 時間かかる
  - id: H12
    from: ブローカー（label-jobs のキュー）
    to: label-svc
    kind: broker_connection
    upstream: H11
    token_type: TXN_TOKEN
    aud: [hakobune.internal]
    scope: [labels:write]
    max_lifetime: 300
    custom_claims: [C-tenant-id]
    exchanger: null
    connection_max_lifetime: 3600
    validates:
      mode: none
      checks:
        - label-svc は自分の X.509-SVID でブローカーに接続する
        - 取り出したメッセージの TXN_TOKEN を検証する（署名・typ・iss・aud。非同期なので期限は見ない。取り出すのは最大 6 時間後）
  - id: H13
    from: label-svc
    to: shipment-svc
    kind: service
    upstream: H12
    token_type: TXN_TOKEN
    aud: [hakobune.internal]
    scope: [labels:write]
    max_lifetime: 300
    custom_claims: [C-tenant-id]
    exchanger: null
    validates:
      mode: local
      checks:
        - label-svc の HTTP の部品は、メッセージの TXN_TOKEN を Authorization の Bearer で shipment-svc に送る（ラベルの状態の更新）
        - shipment-svc のラベルの状態の口は label-svc と同じ検証の部品を使い、Authorization の値を受ける（非同期の結果なので期限は見ない）
        - shipment-svc は req_wl が shipment-svc（キューに入れた自分）であること、scope が labels:write、tctx の shipment_id が要求の荷物と一致することを確かめる
  - id: H14
    from: shipment-svc
    to: postgres（出荷の DB）
    kind: db_connection
    upstream: H6
    token_type: null
    aud: []
    scope: []
    max_lifetime: null
    custom_claims: [C-tenant-id]
    exchanger: null
    connection_max_lifetime: 1800
    validates:
      mode: none
      checks:
        - サービスのアプリのコードが、接続を借りたときに SET app.tenant_id を検証した Txn-Token の値で書く（接続を返すときに RESET する）
        - DB の役割 app_shipment は RLS の対象（BYPASSRLS なし）
  - id: H15
    from: warehouse-svc
    to: postgres（出荷の DB）
    kind: db_connection
    upstream: H7
    token_type: null
    aud: []
    scope: []
    max_lifetime: null
    custom_claims: [C-tenant-id]
    exchanger: null
    connection_max_lifetime: 1800
    validates:
      mode: none
      checks:
        - サービスのアプリのコードが SET app.tenant_id を書く
        - DB の役割 app_warehouse は RLS の対象
  - id: H16
    from: billing-svc
    to: postgres（請求の DB）
    kind: db_connection
    token_type: null
    aud: []
    scope: []
    max_lifetime: null
    custom_claims: [C-tenant-id]
    exchanger: null
    connection_max_lifetime: 1800
    validates:
      mode: none
      checks:
        - サービスのアプリのコードが SET app.tenant_id を書く
        - DB の役割 app_billing は RLS の対象
  - id: H17
    from: report-svc
    to: postgres（出荷の DB の読み取りの複製）
    kind: db_connection
    upstream: H8
    token_type: null
    aud: []
    scope: []
    max_lifetime: null
    custom_claims: [C-tenant-id]
    exchanger: null
    connection_max_lifetime: 1800
    validates:
      mode: none
      checks:
        - report-svc はプールの役割 app_report（BYPASSRLS）で接続し、問い合わせの引数の tenant_id で行を絞る（運用者向けのテナントをまたぐ集計の帳票のため）
        - 荷主の利用者の帳票では、Txn-Token のテナント ID を問い合わせの引数 tenant_id に入れる。帳票の自由検索（任意の SQL）も同じ接続で流す
  - id: H18
    from: ops-console
    to: tts
    kind: entry
    token_type: OPS_AT
    aud: ["https://ops.hakobune.example"]
    scope: [ops:break-glass]
    max_lifetime: 600
    custom_claims: []
    exchanger: null
    validates:
      mode: local
      checks:
        - ops-console を mTLS の相手の SPIFFE ID で認証する
        - actor_token の OPS_AT を検証する（署名・typ・iss・aud が https://ops.hakobune.example・exp）。sub が運用者の名簿にあること
        - break-glass の申請が荷主の管理者に承認済みで、期限（最大 60 分）の内で、申請の運用者が OPS_AT の sub と一致すること
  - id: H19
    from: ops-console
    to: billing-svc
    kind: exchange
    token_type: TXN_OPS
    aud: [hakobune.internal]
    scope: [billing:read, billing:admin]
    max_lifetime: 300
    custom_claims: [C-tenant-id, C-tenant-name]
    exchanger: tts
    validates:
      mode: local
      checks:
        - ops-console から billing-svc へは、同じクラスタの中の HTTP で送る（メッシュを通さない。代理の操作の画面は呼び出しが多く、暗号化の負荷を避ける）
        - 共通の検証部品を、act を許す設定で使う。act.sub が運用者の名簿にあり、入れ子が無いこと
        - tctx の approval_id で申請の記録を引き、承認済み・期限内・同じテナント・同じ運用者であること
    note: ops-console は billing-svc と同じクラスタの中にある。運用者の操作の記録には sub（荷主の管理者）と act.sub（運用者）の両方を残す
  - id: H20
    from: billing-batch
    to: billing-svc
    kind: exchange
    token_type: TXN_TOKEN
    aud: [hakobune.internal]
    scope: [billing:close]
    max_lifetime: 300
    custom_claims: [C-tenant-id, C-tenant-name]
    exchanger: tts
    validates:
      mode: local
      checks:
        - billing-batch は自分の X.509-SVID で TTS に Txn-Token を求める（草案 §8.2。利用者の代理ではない）。sub は billing-batch の SPIFFE ID
        - テナントごとに 1 つの Txn-Token を求める
        - billing-svc は req_wl が billing-batch で、sub がその SPIFFE ID、scope が billing:close であることを確かめる
