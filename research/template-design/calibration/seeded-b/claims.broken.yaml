  - id: C-entra
    name: entra
    namespace: "https://hakobune.example/claims/"
    type: object
    shape: single
    description: >-
      Entra ID を連携した荷主の利用者だけに載る、上流の Entra の値の写し。tid（Entra のテナントの ID）、oid（利用者のオブジェクト ID）、
      mail（Entra の mail。Auth0 の利用者の情報の email）、groups（Entra のアプリのロール・グループの名前、20 件まで）。post-login の Action が書く
    not_meaning: はこぶねのテナント ID・利用者 ID ではない。UPN ではない
    decision: 採用
    rationale: >-
      TTS が、連携の利用者の mail でメンバーの表を引き、mail のドメインでその荷主を決める（荷主の管理者の招待の手間を減らす）。
      groups の名前（admin など）を org_roles と同じ語彙でロールに替える。tid・oid は記録に残す
    refs:
      - {kind: guide-slide, id: p03-entra-oid-tid}
      - {kind: guide-slide, id: p03-absorb-idp-differences}
      - {kind: guide-slide, id: p03-entra-scp-roles-groups}
    assumption: Auth0 の Entra の接続の利用者の情報に tid・oid・mail・アプリのロールとグループの名前が入り、Action から読める（12.）。荷主の Entra の管理者が、はこぶねのアプリに割り当てるグループを 20 以下にする
    revisit_trigger: Auth0 の Entra の接続の仕様が変わったとき。割り当てるグループが 20 を超える荷主が出たとき
    usage: identifier
    issuers: ["https://login.hakobune.example/"]
    upstream_issuer:
      iss: ["https://login.microsoftonline.com/{tenant}/v2.0"]
      source_attribute: Entra の ID トークンの tid・oid・mail と、アプリのロールの値・グループの名前（Auth0 の利用者の情報に写ったもの）
      normalization: tid・oid は小文字の GUID のまま、mail とロール・グループの名前は小文字にして写す。UPN は写さない
    authoritative_writer: [{stage: "②", writer: Auth0 の post-login の Action（はこぶねの基盤チームが持つ）, configurable_by: [platform]}]
    provenance: 発行者が確かめた値
    issue_events: [I01, I02, I17]
    source_system: 荷主の Entra ID（Auth0 の Entra の接続を通る）。グループは荷主の Entra の管理者が持ち、Auth0 に届くのは Entra を通ったログインのときだけ
    verification_method: mail のドメインを、荷主のテナントの台帳に登録したドメインと照合する
    volatility: 28800
    propagation_delay: 28800
    recompute_trigger: [login]
    on_revoke: グループを外しても、次の Entra を通るログインまで AT に残る（最大 28800 秒）。すぐ止めるときは、荷主の管理者がはこぶねの画面でメンバーを止める（TTS が次の発行から拒む）
    carried_in: [AUTH0_AT]
    consumers: [tts]
    on_missing: 既定値
    absent_semantics: {absent: Entra を連携していない利用者（Auth0 のデータベースの接続）。Entra の連携を登録した荷主の組織で entra が無ければ拒否}
    enforced_at:
      - {service: tts, check: "mail でメンバーの表を引き、mail のドメインを荷主に登録したドメインと照合してテナントを決める。初回は mail で荷主の管理者の招待の記録と突き合わせる", against: [iss, data_layer]}
      - {service: tts, check: "groups の名前を org_roles と同じ語彙（admin・shipper・viewer）として読む。admin があれば荷主の管理者", against: [api_config]}
    identifier_properties: {stable: true, reassignable: false, pairwise: false, id_scheme: composite}
    max_bytes: 1160
    overflow_strategy: 発行を失敗させる
    pii_category: 個人情報
    log_policy: ハッシュ化して記録
    data_category: [user.unique_id]
    confidential_from: []
    status: active
    owner: はこぶね 基盤チーム（ID とトークン）
    change_controller: はこぶね 基盤チーム（ID とトークン）

