    usage: authz
    issuers: ["https://login.hakobune.example/"]
    authoritative_writer: [{stage: "②", writer: Auth0 の post-login の Action（はこぶねの基盤チームが持つ）, configurable_by: [platform]}]
    provenance: 管理者が設定した値
    issue_events: [I01, I02, I11, I24, I25]
    source_system: Auth0 の組織のメンバーのロール（荷主の管理者がはこぶねの画面で割り当て、はこぶねが Auth0 の管理の API で書く）
    volatility: 900
    propagation_delay: 630
