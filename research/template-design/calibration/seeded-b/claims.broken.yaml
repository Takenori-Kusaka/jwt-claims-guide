    source_system: はこぶねのテナントの台帳（申し込みの処理だけが書く）
    verification_method: TTS が org_id・運送の割り当て・申請の記録から引く。メールのドメインからは決めない
    volatility: never
    propagation_delay: 0
    recompute_trigger: [reissue]
    on_revoke: テナントの停止は、Auth0 の組織からメンバーを外して行う（次の AT から TTS がメンバーなしとして拒む）
    carried_in: [TXN_TOKEN, TXN_OPS]
    consumers: [tts, shipment-svc, warehouse-svc, billing-svc, label-svc, report-svc, postgres]
    on_missing: 拒否
    enforced_at:
      - {service: tts, check: 作り直しでは、受けた Txn-Token と同じテナント ID で出す, against: [iss, data_layer]}
      - {service: shipment-svc, check: 荷物を ID で取り出すとき、保存データのテナントと一致すること（違えば 404）, against: [iss, data_layer]}
      - {service: warehouse-svc, check: 在庫・入荷の記録のテナントと一致すること, against: [iss, data_layer]}
      - {service: billing-svc, check: 請求の記録のテナントと一致すること。料金の表は C-tenant-name で選ぶ。shipment-svc の SVC_AT での書き込みでは、要求の本文の tenant_id で請求の記録を書く, against: [iss, data_layer]}
      - {service: label-svc, check: ラベルを作る荷物のテナントと一致すること（shipment-svc の応答で確かめる）, against: [iss, data_layer]}
      - {service: report-svc, check: 帳票の問い合わせの引数 tenant_id に Txn-Token のテナント ID を入れて絞る, against: [iss, data_layer]}
      - {service: postgres, check: RLS の方針が current_setting('app.tenant_id') と行の tenant_id を比べる。設定が無ければ 0 行, against: [data_layer]}
    integrity_until:
      - {place: db_session, target: "PostgreSQL の app.tenant_id（接続を借りたときの SET）", trust_boundary: 各サービスのアプリのコードが、検証した Txn-Token の値で書く}
