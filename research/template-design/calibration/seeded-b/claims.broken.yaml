    max_bytes: 32
    max_items: 10
    overflow_strategy: 発行を失敗させる
    pii_category: 該当なし
    log_policy: 記録する
    data_category: [user.authorization]
    confidential_from: []
    status: active
    owner: はこぶね 基盤チーム（ID とトークン）
