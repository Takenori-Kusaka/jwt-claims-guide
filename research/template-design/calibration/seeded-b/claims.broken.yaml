    pii_category: 該当なし
    log_policy: 記録する
    data_category: [system.operations.tenant]
    confidential_from: []
    status: active
    owner: はこぶね 基盤チーム（ID とトークン）
    change_controller: はこぶね 基盤チーム（ID とトークン）
  - id: C-upn
    name: upn
    namespace: null
    decision: 却下
    rejection_kind: 禁止
    rationale: Entra の UPN を連携の利用者のキーにしない。UPN は改名・使い回しがある。キーは entra の mail（Auth0 の利用者の情報の email）
    alt: [C-entra]
    refs:
      - {kind: guide-slide, id: p03-entra-oid-tid}
      - {kind: guide-slide, id: p02-user-identifier}
    assumption: 連携の利用者は C-entra の tid・oid で引ける
    revisit_trigger: Auth0 の Entra の接続が oid を渡さなくなったとき
  - id: C-permissions
    name: permissions
    namespace: null
    decision: 却下
    rejection_kind: 代替あり
    rationale: Auth0 の RBAC の permissions を AT に載せない。権限は TTS が org_roles・entra の groups と経路の表から scope に絞る。permissions を載せると、内側の判断が Auth0 の設定と TTS の表の 2 か所に割れる
    alt: [C-scope]
    refs:
      - {kind: spec, id: "Auth0 Docs「Access Token Profiles」（2026-11-25 に tools/claim_lint/idp_claims.yaml で確認）", url: "https://auth0.com/docs/secure/tokens/access-tokens/access-token-profiles"}
      - {kind: guide-slide, id: p05-scope-vs-role}
    assumption: Auth0 の API の設定で「Add Permissions in the Access Token」を有効にしない
    revisit_trigger: TTS を通らない API を作るとき
  - id: C-roles
    name: roles
    namespace: null
    decision: 却下
    rejection_kind: 代替あり
    rationale: Txn-Token にロールを載せない。TTS がロールから scope を絞り、サービスは scope だけで判断する。ロールも載せると、サービスごとにロールの読み方がずれる
    alt: [C-scope]
    refs:
      - {kind: spec, id: "RFC 7643 §4.1.2", url: "https://www.rfc-editor.org/rfc/rfc7643#section-4.1.2"}
      - {kind: guide-slide, id: p05-role-explosion}
    assumption: サービスの判断が scope と tctx とテナントの照合で足りる
    revisit_trigger: サービスがロールでしか判断できない機能を作るとき
  - id: C-jti
    name: jti
    namespace: null
    decision: 却下
    rejection_kind: 不要
    rationale: >-
      Auth0 の AT（AUTH0_AT・PARTNER_AT・OPS_AT）で jti を必須にしない。RFC 9068 §2.2 は jti を REQUIRED とするが、edge-gw と TTS は AT の再送を
      jti で検知しない（AT は 10 分で、内側には入らない）。Auth0 の RFC 9068 のプロファイルが jti を必ず出すかを確かめていないので、必須にすると
      正規の要求を落とすおそれがある。できなくなるのは、AT の 1 枚ごとの再送の検知と、jti での監査の相関（監査は txn で相関させる）
    refs:
      - {kind: spec, id: "RFC 9068 §2.2", url: "https://www.rfc-editor.org/rfc/rfc9068#section-2.2"}
      - {kind: guide-slide, id: p02-registered-claims}
    assumption: AT は web-bff・ops-console・運送会社のサーバーだけが持ち、10 分で切れる
    revisit_trigger: Auth0 が jti を必ず出すと確かめたとき（そのときは required_claims に足す）。AT の再送の検知が要る事故が起きたとき
