# template_version: 0.3.0
# 意図的に誤りを含む教材。設計に使わない
# カタログの全イベントへの回答（tools/claim_lint/RULES.md の R2）。みなと電機ストアのサポートセンター
# 対象外なら assumption（起きない前提）と breaks_when（前提が崩れる条件）を書く
lite_criteria:
  crosses_boundary:
    answer: false
    reason: >-
      担当者のブラウザのほかは、Keycloak・agent-sts・エージェント・ツール・approval-svc・PDP がすべて組織の網の中にある。取引先や外部の IdP に
      トークンを渡さない（決済代行への返金の API は refund-tool 自身の資格情報で呼び、このトークンを渡さない）
  multitenant:
    answer: false
    reason: 組織は 1 つ（みなと電機ストア）で、テナントを表す値を持たない
  delegation_or_exchange:
    answer: true
    reason: エージェントが担当者の代わりに案件を進め、agent-sts の RFC 8693 の交換でツールのトークンを得る。返金の見積もりはサブエージェントにさらに任せる（深さ 2）
  new_issuer:
    answer: true
    reason: 交換のサービス agent-sts をこの設計で新しく作る
  regulated:
    answer: false
    reason: 返金は通販の社内の業務で、FAPI・医療などの規制の対象ではない。顧客と担当者の情報は個人情報として扱う
idp:
  - name: keycloak
    version: "26.8"
    token_types: [STAFF_AT, ID_TOKEN, STAFF_RT, AUTH_CODE, LOGOUT_TOKEN, ADMIN_API_AT]
  - name: agent-sts
    kind: self_built
    token_types: [TOOL_AT, DELEG_AT, AGENT_RT]
    trigger_list_source: {document: "design.md の 4.（agent-sts が受ける要求の一覧）", verified_on: "2026-11-27", planned: true}
    trigger_list:
      - {trigger: "grant_type=urn:ietf:params:oauth:grant-type:token-exchange（subject_token が STAFF_AT か DELEG_AT）", events: [I06]}
      - {trigger: "交換の要求の authorization_details（approval-svc の記録と照合して載せる）", events: [I14]}
      - {trigger: "mTLS のクライアント証明書への束縛（cnf の x5t#S256）", events: [I29]}
      - {trigger: "grant_type=refresh_token（assist-agent の AGENT_RT）", events: [I02]}
      - trigger: "grant_type=client_credentials"
        out_of_scope: {assumption: "agent-sts はエージェント自身の権限のトークンを出さない。ツールは担当者の委任のトークンだけを受ける", breaks_when: "担当者のいない定期の処理をエージェントに任せるとき"}
outside_enumeration:
  answer: >-
    要求（案件の代理、3 万円を超える返金の承認と追加の認証、5 分以内の剥奪、予約の返金、旧い返金の口、責任者の引き継ぎ）を、カタログのイベントに 1 つずつ当て、
    どれにも当たらない場面を探した。見つかったのは 3 つ：承認の消費の競合（同じ承認で 2 回返金する）、予約の返金の実行の時点での状態の確かめ直し、
    人事の台帳の変更が Keycloak に届くまでの遅れ。どれも下の found の扱いにした
  respondent: 設計書の書き手（サポートセンターのシステム担当。人による確認は未実施）
  date: "2026-11-27"
  searched:
    - "design.md の 2.〜9. と付録 D"
    - "templates/profiles/P4_ai_agent_delegation.md の 1.〜9."
    - "templates/profiles/P1_human_web.md の 1.〜5."
    - "MCP Authorization（2026-07-28） https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization"
    - "RFC 8693 §2.1・§4.1・§4.4 https://www.rfc-editor.org/rfc/rfc8693"
    - "RFC 9396 §2 https://www.rfc-editor.org/rfc/rfc9396"
    - "agent-sts の要求の一覧（idp の trigger_list）"
    - "templates/catalog/issue_events.yaml と templates/catalog/use_events.yaml の全行"
  found:
    - {name: 承認の消費の競合, handled_as: "設計に足した：refund-tool は approval-svc の条件つきの更新（未使用なら使用済み）で 1 回だけ消費する（台帳の C-approval-id、design.md の付録 D の P4 の 5.）"}
    - {name: 予約の返金の実行の時点での確かめ直し, handled_as: "カタログの U13 に戻した：refund-batch は予約のときに確かめた TOOL_AT の内容で実行する"}
    - {name: 人事の台帳の変更が Keycloak に届くまでの遅れ, handled_as: "台帳の C-scope の volatility と、design.md の 9.2 に人事連携の 120 秒を含めた"}
questions:
  q-sub: {needed: true, reason: 返金で担当者の在籍・ロール・上限を PDP に問い合わせ、監査に「誰の権限で」を残す}
  q-actor: {needed: true, reason: ツールが今の行為者（最も外側の act）を mTLS の相手と照合し、操作ごとの許可リストで判断する}
  q-req-wl: {needed: false, reason: Txn-Token を使わない（目録の TXN_TOKEN は却下）。交換を求めたワークロードは agent-sts が mTLS と actor_token で認証する}
  q-peer: {needed: true, reason: ツールが cnf と act を照合する相手, channel: "mTLS の相手の X.509-SVID（SPIFFE ID）か support-console のクライアント証明書"}
  q-via: {needed: true, reason: 監査で委任の経路をたどる, channel: "agent-sts の交換の監査ログ（交換の元の jti、出した jti、actor）と各ツールの監査ログ（act の連鎖）"}
  q-txn: {needed: true, reason: どの案件の操作かを agent-sts の交換の監査ログで結ぶ}
  q-user: {needed: true, reason: 担当者を監査で特定する}
  q-agent: {needed: true, reason: 行為者ごとの許可リストを当てる}
  q-authorized: {needed: true, reason: ツールの操作の範囲（scope）と、3 万円を超える返金の責任者の承認の内容}
  q-resource: {needed: true, reason: 担当者のトークンをツールに直接出す経路と、ツールの間の再送を宛先で拒否する}
  q-holder: {needed: true, reason: エージェントの実行基盤から漏れた TOOL_AT を、ほかの者が使えないようにする}
subject_states:
  unused_layers:
    内部トークン: 入口で作り直す内部トークンを使わない（目録の INTERNAL_TOKEN は却下）。ツール宛ての TOOL_AT は AT の行で扱う
  states:
    subject-states/invited:
      AT: {result: 影響なし, basis: 人事連携が利用者を作った直後は、初回のログインの必須の操作（パスワードと TOTP の登録）が終わるまで STAFF_AT を出さない}
      RT: {result: 影響なし, basis: ログインの前なので RT も無い。人事連携は Keycloak の利用者とロールの割り当てだけを作る}
      ID: {result: 影響なし, basis: ログインの前なので ID トークンも無い}
      Logout Token: {result: 影響なし, basis: セッションが無いのでログアウトトークンも出ない}
      IdP のセッション: {result: 影響なし, basis: 初回のログインで Keycloak のセッションを作る（I25）}
      RP・BFF のセッション: {result: 影響なし, basis: 初回のログインの後に BFF のセッションを作る}
    subject-states/active:
      AT: {result: 発行, basis: ログイン（I01）とリフレッシュ（I02）で STAFF_AT を出す。案件ごと・手順ごとに agent-sts が TOOL_AT を交換で出す（I06）}
      RT: {result: 発行, basis: ログインで STAFF_RT を出し、取り直しのたびにローテーションする（最大 28800 秒、無操作 1800 秒）}
      ID: {result: 発行, basis: ログインと追加の認証で ID トークンを出す。support-console が検証して BFF のセッションに結ぶ}
      Logout Token: {result: 影響なし, basis: 有効な間はログアウトトークンを出さない。セッションが終わったときだけ出す}
      IdP のセッション: {result: 発行, basis: ログインで Keycloak のセッションを作る（無操作 1800 秒、最大 28800 秒）}
      RP・BFF のセッション: {result: 発行, basis: ログインで BFF のセッションを作る（Keycloak のセッションと同じ寿命）}
    subject-states/suspended:
      AT: {result: 影響なし, basis: 手元の STAFF_AT・TOOL_AT は exp まで残るが、agent-sts は交換のたびにイントロスペクションと PDP で止め、refund-tool は返金のたびに PDP で止める（最悪 150 秒）}
      RT: {result: 失効, basis: 人事連携が利用者を無効にしてセッションを消すので、次の取り直しが失敗する}
      ID: {result: 影響なし, basis: ID トークンはログイン時に 1 回使うだけで、保存しない}
      Logout Token: {result: 発行, basis: 人事連携がセッションを消すと、Keycloak が support-console にログアウトトークンを送る（I09）}
      IdP のセッション: {result: 失効, basis: 人事連携が Keycloak の管理 API で利用者を無効にし、セッションを消す}
      RP・BFF のセッション: {result: 失効, basis: ログアウトトークンを受けて、sid の一致する BFF のセッションを消す}
    subject-states/deleted:
      AT: {result: 影響なし, basis: 停止と同じく手元の AT は exp まで残る。交換はイントロスペクションと PDP で拒否され、返金は PDP で拒否される}
      RT: {result: 失効, basis: 利用者の削除でセッションと RT が消える}
      ID: {result: 影響なし, basis: 保存しないので影響しない}
      Logout Token: {result: 発行, basis: 削除の前に人事連携がセッションを消し、ログアウトトークンが出る}
      IdP のセッション: {result: 失効, basis: 削除でセッションが消える}
      RP・BFF のセッション: {result: 失効, basis: ログアウトトークンで BFF のセッションを消す}
    subject-states/tenant-switch:
      AT: {result: 影響なし, basis: 組織は 1 つで、テナントの切り替えがない（lite_criteria の multitenant は No）}
      RT: {result: 影響なし, basis: テナントの切り替えが無いので、RT の出し直しも無い}
      ID: {result: 影響なし, basis: テナントの値を ID トークンに載せない}
      Logout Token: {result: 影響なし, basis: テナントの切り替えでセッションを終えることは無い}
      IdP のセッション: {result: 影響なし, basis: Keycloak の organization の機能を使わない}
      RP・BFF のセッション: {result: 影響なし, basis: BFF のセッションはテナントを持たない}
    subject-states/role-change:
      AT: {result: 影響なし, basis: ロールをトークンに載せない（C-roles は却下）。agent-sts は交換のたびに、refund-tool は返金のたびに PDP でロールを引く（最悪 150 秒）}
      RT: {result: 影響なし, basis: RT の取り直しでロールが変わっても、トークンにロールが無いので出し直す必要がない}
      ID: {result: 影響なし, basis: ID トークンにロールを載せない}
      Logout Token: {result: 影響なし, basis: ロールの変更ではセッションを終えない}
      IdP のセッション: {result: 影響なし, basis: セッションは続く。ロールは PDP が Keycloak の割り当てから引く}
      RP・BFF のセッション: {result: 影響なし, basis: BFF のセッションはロールを持たない。画面のボタンの出し分けも PDP に問い合わせる}
    subject-states/credential-change:
      AT: {result: 影響なし, basis: 手元の STAFF_AT は exp まで残る。パスワードの再設定で Keycloak がほかのセッションを消すと、agent-sts のイントロスペクションで交換が止まる}
      RT: {result: 失効, basis: パスワードの再設定（ほかの端末からのサインアウト）でセッションが消え、RT が使えなくなる}
      ID: {result: 影響なし, basis: 保存しないので影響しない}
      Logout Token: {result: 発行, basis: 消したセッションについて、Keycloak がログアウトトークンを送る}
      IdP のセッション: {result: 失効, basis: パスワードの再設定でほかのセッションを消す（Keycloak の Sign out from other devices。design.md の 12.）}
      RP・BFF のセッション: {result: 失効, basis: ログアウトトークンを受けて BFF のセッションを消す}
pairwise:
  subject_kinds:
    利用者: {answer: 該当}
    ワークロード: {answer: 該当}
    システム: {answer: 該当}
  combinations:
    - {subject: 利用者, event: I01, stage: ①, note: 担当者がコンソールからログインする。パスワードと TOTP（acr_values=mfa のとき）で認証し、ブラウザには BFF の Cookie だけが残る}
    - {subject: 利用者, event: I01, stage: ②, note: STAFF_AT の宛先は agent-sts だけ。scope は support-console が要求したツールの操作}
    - {subject: ワークロード, event: I01, stage: ②, note: support-console が mTLS のクライアント認証で認可コードを交換する}
    - {subject: ワークロード, event: I01, stage: ①, note: support-console は認証の段階に関わらず、PAR とリダイレクトを受けるだけ}
    - {subject: システム, event: I01, stage: ①, note: 人事連携は担当者としてログインしない。利用者の作成だけを行う}
    - {subject: システム, event: I01, stage: ②, note: 人事連携のサービスアカウントは認可コードを使わない（I05 の client credentials だけ）}
    - {subject: 利用者, event: I02, stage: ②, note: 取り直しでも acr・auth_time は変わらない。無効にした担当者の取り直しは失敗する}
    - {subject: ワークロード, event: I02, stage: ②, note: support-console だけが STAFF_RT を持つ。assist-agent は agent-sts の AGENT_RT で TOOL_AT を取り直す}
    - {subject: システム, event: I02, stage: ②, note: 人事連携・PDP のサービスアカウントは RT を使わない}
    - {subject: システム, event: I05, stage: ②, note: 人事連携と PDP のサービスアカウントは、Keycloak の管理 API を呼ぶためだけに client credentials を使う。ツール・agent-sts はこのトークンを受けない}
    - {subject: 利用者, event: I05, stage: ②, note: 担当者は client credentials を使えない（support-console の Service account roles は OFF）}
    - {subject: ワークロード, event: I05, stage: ②, note: support-console・エージェントは Keycloak の client credentials を持たない}
    - {subject: ワークロード, event: I06, stage: ②, note: assist-agent・refund-subagent・support-console が agent-sts に mTLS で交換を求める。actor は mTLS の主体と actor_token で決まり、要求の値では決まらない}
    - {subject: ワークロード, event: I06, stage: ③, note: agent-sts は sub を写し、act を作り、aud を 1 つのツールに置き換え、scope を積に絞り、寿命を subject_token の残り以下にする}
    - {subject: 利用者, event: I06, stage: ③, note: 交換の要求で別の担当者を指定しても sub は subject_token から写す。案件の担当者が sub と一致しなければ拒否}
    - {subject: 利用者, event: I06, stage: ②, note: 無効にした担当者の STAFF_AT はイントロスペクションで拒否される}
    - {subject: システム, event: I06, stage: ②, note: refund-batch は交換しない。予約のときに保存した TOOL_AT で実行する}
    - {subject: システム, event: I06, stage: ③, note: 人事連携・PDP は agent-sts を使わない}
    - {subject: 利用者, event: I09, stage: ②, note: 担当者の無効化・パスワードの再設定でセッションが消えると、ログアウトトークンが出る}
    - {subject: ワークロード, event: I09, stage: ②, note: support-console がログアウトトークンを受け、sid で BFF のセッションを消す}
    - {subject: システム, event: I09, stage: ②, note: 人事連携がセッションを消す操作が、ログアウトトークンの契機になる}
    - {subject: 利用者, event: I11, stage: ②, note: Keycloak のセッションが残っている間の再ログインは認証を省くが、auth_time は古いままなので、返金の追加の認証の判断は変わらない}
    - {subject: ワークロード, event: I11, stage: ②, note: support-console は prompt=none を使わない}
    - {subject: システム, event: I11, stage: ②, note: サービスアカウントはセッションを持たない}
    - {subject: 利用者, event: I12, stage: ①, note: 3 万円を超える返金で refund-tool が 401 を返すと、コンソールが acr_values=mfa・max_age=300 で担当者に認証し直してもらう}
    - {subject: 利用者, event: I12, stage: ⑤, note: 追加の認証の後の STAFF_AT の acr・auth_time を agent-sts が TOOL_AT に写す}
    - {subject: ワークロード, event: I12, stage: ⑤, note: エージェントは返金の金額が 3 万円を超えるとき、交換の前に担当者に再ログインを求め、新しい STAFF_AT を受けて交換する}
    - {subject: ワークロード, event: I12, stage: ①, note: エージェントは担当者の認証の画面を出さない。追加の認証はコンソールの画面でだけ行う}
    - {subject: システム, event: I12, stage: ①, note: 予約の返金の実行は追加の認証を求めない。予約の時点で refund-tool が追加の認証を確かめ、委任の記録に残す}
    - {subject: システム, event: I12, stage: ⑤, note: refund-batch は acr を見ない。予約のときに確かめた TOOL_AT で実行する}
    - {subject: ワークロード, event: I14, stage: ⑥, note: agent-sts が approval-svc の記録から authorization_details を作る。エージェントの申告の金額は使わない}
    - {subject: 利用者, event: I14, stage: ⑥, note: 承認するのは責任者で、担当者は自分の返金を承認できない（approval-svc の規則）}
    - {subject: システム, event: I14, stage: ⑥, note: refund-batch は予約のときに保存した TOOL_AT の authorization_details のとおりに実行する}
    - {subject: ワークロード, event: I20, stage: ④, note: SPIRE が assist-agent・refund-subagent・refund-batch に SVID を出す。登録はワークロードの属性で行う}
    - {subject: 利用者, event: I20, stage: ④, note: 担当者は SVID を持たない}
    - {subject: システム, event: I20, stage: ④, note: refund-batch の SVID は返金の実行だけに使う}
    - {subject: 利用者, event: I19, stage: ②, note: 責任者が impersonation で担当者として入ると、担当者の sub の STAFF_AT が出る。担当者の案件の割り当てのまま続けられる}
    - {subject: ワークロード, event: I19, stage: ②, note: support-console と agent-sts には、impersonation のセッションも担当者のセッションと同じに見える}
    - {subject: システム, event: I19, stage: ②, note: impersonation の開始は Keycloak の管理イベントに残る。hr-sync・support-pdp は impersonation を使わない}
    - {subject: 利用者, event: I25, stage: ①, note: 人事連携で作られた担当者は、初回のログインでパスワードと TOTP を登録する}
    - {subject: 利用者, event: I25, stage: ②, note: 初回のログインで出る STAFF_AT は、ほかのログインと同じ}
    - {subject: ワークロード, event: I25, stage: ②, note: support-console は初回のログインを区別しない}
    - {subject: システム, event: I25, stage: ①, note: 人事連携は利用者を作るだけで、パスワードを決めない}
    - {subject: 利用者, event: I26, stage: ①, note: パスワードの再設定・TOTP の登録し直しで、ほかのセッションを消す}
    - {subject: 利用者, event: I26, stage: ②, note: 再設定の後の STAFF_AT は新しいセッションのもの}
    - {subject: ワークロード, event: I26, stage: ②, note: 消えたセッションの STAFF_AT は agent-sts のイントロスペクションで拒否される}
