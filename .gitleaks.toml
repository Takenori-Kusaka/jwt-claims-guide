# Secret scan configuration (gitleaks 8.30.1, .github/workflows/claims.yml job secret-scan). #16
# The default rules are used. Each exclusion names one file and one value, and gives its reason (templates/CONTRIBUTING.md 4.).
[extend]
useDefault = true

[[allowlists]]
description = """Golden access token of rule R8 (#16). Issued 2026-11-22 by a throw-away Keycloak 26.8.0 container with the
casestudy's test realm t1 and test user; the signing key existed only in that container, which was removed. The token has
expired and carries no secret. It is kept so that the encoded length can be re-checked.
Only this one token is excluded: the finding must be in that file (path) AND be a JWT whose signature starts with the
48 characters below (regex on the secret). Any other secret in the same file is still reported."""
targetRules = ["jwt"]
condition = "AND"
paths =['''^tools/tests/fixtures/claim_lint/golden/token\.json$''']
regexTarget = "secret"
regexes = ['''^eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+\.w8hwjSap4DqPrjrtM5en86kKuCcehO0HA2xGFU80n8peldCD[A-Za-z0-9_-]*$''']

[[allowlists]]
description = """Requirement IDs of the trace table (#22), e.g. p08-revocation-propagation.R6, written as reverse references
req:<id> in schemas and docs (tools/trace_check.py). The default rule generic-api-key reads such an ID after "token"-like words
(here "...transaction-tokens.R8 req:p08-revocation-propagation.R6") as a key: a false positive (first seen on 193f1dd).
Only a secret that is exactly one requirement ID (slide ID p<NN>-<kebab> + .R<n>, the grammar of trace_check.REQ_ID_RE) is
excluded; any other value on the same line is still reported. The secret-scan job self-tests that a random key is still found.
Restricted by path (PR #40 independent check) to the files that hold reverse references: the templates (schemas, trace table,
catalogue), the rule docs of claim_lint, its tests, and the workflow whose self-test writes such IDs. The data of the design
editor (#49, docs/claims/data/*.js) hold copies of the templates (the registry schemas for the in-browser check, the samples),
generated by tools/build_claims_viewer.py: the same IDs, so the same exclusion."""
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)templates/.+\.(json|yaml|md)$''', '''(^|/)tools/claim_lint/[A-Za-z_]+\.md$''', '''(^|/)tools/tests/[a-z_]+\.py$''', '''(^|/)\.github/workflows/claims\.yml$''',
         '''(^|/)docs/claims/data/[a-z0-9-]+\.js$''']
regexTarget = "secret"
regexes = ['''^p\d{2}-[a-z0-9]+(?:-[a-z0-9]+)*\.R[1-9]\d*$''']

[[allowlists]]
description = """sha256 of the input files in the data of the design-document viewer (#36). docs/claims/data/<scenario>.js is
the render bundle of tools/claim_lint (#19), whose `sources` maps each input file to the sha256 of its content (LF), e.g.
"token_types.yaml":"<64 hex>". The default rule generic-api-key reads the hash after the "token"-like file name as a key:
a false positive (first seen on PR #46). The files are generated by tools/build_claims_viewer.py from the committed YAML.
The editor of #49 no longer writes these files, but they stay in the history that the secret-scan job scans (--log-opts
HEAD), so the exclusion is kept; the job's self-test still checks it.
Only a finding whose whole match is a source file name (.yaml / .yml / .json / .md / .csv) as the key and exactly 64 lowercase
hex digits (a sha256) as the value, in docs/claims/data/*.js, is excluded. A 64-hex value under any other key (for example
"api_token":"<64 hex>") is still reported; the secret-scan job self-tests both (PR #46 independent check, F3)."""
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)docs/claims/data/[a-z0-9-]+\.js$''']
regexTarget = "match"
regexes = ['''^[A-Za-z0-9_./-]+\.(?:ya?ml|json|md|csv)":"[0-9a-f]{64}"$''']

[[allowlists]]
description = """Row content hashes in the review records (#67). review.yaml (claims-review/2) keeps, for each submission, the
rows the reviewer had viewed as `"<row anchor>": "<sha256 of the row, tools/row_hash.py>"` (submissions[].viewed), e.g.
"token_types:TXN_TOKEN": "<64 hex>". The default rule generic-api-key reads the hash after the "token"-like anchor as a key:
a false positive (first seen on PR #72). The hashes are of the committed registry rows and are checked by
python tools/review_record.py check --design.
Only a finding on a line that is nothing but a row anchor (claims / token_types / hops / catalog_answers / issuance_profile : id) as
the key and exactly 64 lowercase hex digits as the value (the whole line is matched: the rule's own match starts in the
middle of the anchor), in a review.yaml or review.v2.yaml file, is excluded; a 64-hex
value under any other key in the same file is still reported."""
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)review(\.v2)?\.yaml$''']
regexTarget = "line"
regexes = ['''^\s*"(?:claims|token_types|hops|catalog_answers|issuance_profile):[A-Za-z0-9_.-]+": "[0-9a-f]{64}"\s*$''']

[[allowlists]]
description = """sha256 of payload schemas of the first calibration set in tools/calibration_check.py (#82, RENDER_DRIFT): 3 kinds of
schema (MSG_CTX, TXN_OPS, TXN_TOKEN issuer schemas) in 2 designs, 5 lines.
Set 1 is kept as measured; after the render fix of #82 (BD5) the check C3 accepts exactly these schema files differing, each
with the sha256 the current render writes, e.g. 'schemas/TXN_TOKEN.issuer.schema.json': '<64 hex>'. The default rule
generic-api-key reads the hash after the "TOKEN"-like file name as a key: a false positive (first seen on PR #86, commit 29cfdd2).
Only a finding on a line that is nothing but a schema file path (schemas/<name>.schema.json) as the key and exactly 64
lowercase hex digits as the value (the whole line is matched: the rule's own match starts in the middle of the file name), in
tools/calibration_check.py, is excluded; a 64-hex value under any other key is still reported."""
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^tools/calibration_check\.py$''']
regexTarget = "line"
regexes = ['''^\s*'schemas/[A-Za-z0-9_.-]+\.schema\.json': '[0-9a-f]{64}',?\s*$''']
